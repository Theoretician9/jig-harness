# МАНИФЕСТ.conf — паспорт возможности. ДАННЫЕ, НЕ КОД.
#
# Формат тот же, что у harness.conf: строго KEY="value" или KEY=число, без
# подстановок $VAR, без массивов, без логики. Многострочное значение в кавычках
# законно (разделитель записей — перевод строки), как BACKUP_DBS в harness.conf.
#
# ИМЕНА КЛЮЧЕЙ — ЛАТИНИЦЕЙ, значения и комментарии — по-русски. Причина не в
# вкусе: оболочка не умеет присваивать переменные с кириллицей в имени, и
# `source` такого файла падает «command not found» на первой же строке
# (проверено живьём при сборке этого механизма — та же ловушка, что в
# UNIFIED/11 про кириллицу в однострочниках, только в имени переменной).
#
# Читает: харнес/scripts/vozmozhnost.sh (список, требования, установка).
# Проверка: bash -n МАНИФЕСТ.conf && source МАНИФЕСТ.conf && echo OK

ID="мобильная-разработка"
NAME="Мобильное приложение: React Native + Expo, Android локально, iOS в облаке"
# Наблюдаемое условие включения — то же требование, что к строкам таблицы
# расширений: без условия срабатывания возможность не ставится.
CONDITION="в задаче продукта появилось мобильное или клиентское приложение (React Native, Expo, Android, iOS) — раньше не ставить"
GIVES="эмулятор Android как постоянный ресурс сервера; петля сборка→установка→сценарий→скриншот одной командой; прогон на реальных устройствах Firebase Test Lab с жёстким таймаутом; сборка iOS без Mac через EAS; три скила и реестр действий владельца"

# ── Требования. Проверяются ВЕЩЬЮ, а не именем пакета (UNIFIED/08) ───────────
# Жёсткие: не выполнено — установка не начинается.
NEED_DISK_GB=25
NEED_MEM_TOTAL_MB=4000
NEED_SUDO="да"
# Мягкие: не выполнено — шаг пропускается С АДРЕСОМ, остальное ставится.
# KVM нет (частый случай VPS без вложенной виртуализации) — локального
# эмулятора не будет, останутся Test Lab и EAS: это меньше, но не ничто.
WANT_KVM="да"
WANT_MEM_TOTAL_MB=8000

# ── Системные пакеты (ставятся в единственное sudo-окно) ────────────────────
APT_PACKAGES="openjdk-17-jdk unzip zip curl git ffmpeg"
# qemu-kvm — отдельной строкой: нужен только при наличии /dev/kvm.
APT_PACKAGES_KVM="qemu-kvm"
# Проверка ВЕЩИ, а не пакета: имя=команда, которой доказывается, что вещь есть.
# Разделитель записей — перевод строки (как BACKUP_DBS в harness.conf).
PROBES="java=java -version
unzip=unzip -v
curl=curl --version
git=git --version
ffmpeg=ffmpeg -version"

# ── Android SDK ─────────────────────────────────────────────────────────────
# Смена версии — правка ЭТИХ строк, не скрипта.
ANDROID_HOME_REL="android"
CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
# Контрольная сумма архива. ПУСТО = не сверяется: установщик печатает
# вычисленную сумму и требует вписать её сюда (пункт ЧЕК-ЛИСТ.md).
# Пустая сумма — названная цена, а не незамеченная дыра.
CMDLINE_TOOLS_SHA256="2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258"
SDK_PLATFORM="platforms;android-35"
SDK_BUILD_TOOLS="build-tools;35.0.0"
# google_apis, НЕ google_apis_playstore: playstore-образ не даёт root через adb,
# а без root не подменить состояние приложения в тестах.
SDK_SYSTEM_IMAGE="system-images;android-35;google_apis;x86_64"
AVD_NAME="dev"
AVD_DEVICE="pixel_7"

# ── Потолки, чтобы эмулятор и сборка не съели сервер вместе с агентом ────────
# Пик эмулятора ≈ этот потолок; агенту и продукту нужно остальное.
EMULATOR_MEM_MB=2048
GRADLE_MAX_MEM="1536m"
# Жёсткий потолок прогона в Firebase Test Lab. Бесплатная квота — 60 минут в
# сутки на виртуальных устройствах и 30 на физических, дальше платно поминутно.
# Прогон без таймаута недопустим; сторож отбивает вызов без --timeout.
FTL_TIMEOUT="15m"
FTL_DEVICES="model=MediumPhone.arm,version=33
model=redfin,version=30"

# ── Что этот пакет добавляет носителям харнеса ───────────────────────────────
# Скилы: файлы skills-src/<имя>.md; собираются SBORKA-SKILOV.py ТОЛЬКО когда
# возможность установлена (пока не установлена — скилов нет, контекст чист).
SKILLS="android-env mobile-testing mobile-release"
HUMAN_DOC="ЧЕЛОВЕКУ.md"
CHECKLIST="ЧЕК-ЛИСТ.md"
# Имя сервисного лока эмулятора: долгоживущий, лежит в $LOG_DIR/locks/services/
# и НЕ виден воротам выката (решение Б-1).
SERVICE_LOCK="emulator"
