# ДАННЫЕ публичной сборки. Читает харнес/scripts/sobrat-publichnoe.py.
#
# Ни одного литерала конкретной установки: этот файл САМ едет в сборку вместе
# со сборщиком, и вписанный сюда путь или номер чата сделал бы гейт чистоты
# красным навсегда (ревью спеки 12.09.2026, находка №2). Поэтому здесь имена
# ключей паспорта, а значения сборщик берёт из /etc/harness/install.conf.

# Маски того, что наружу не идёт. Сегодня пусто, и это решение, а не недосмотр:
# харнес/STATE.md, харнес/dev-map.yaml и харнес/CLAUDE.md — ЗАГОТОВКИ первой
# установки (задачи hr.accept, hr.rotation, pr.first), а не следы разработки.
# Их исключение оставило бы новую установку без первой задачи и с битыми
# @-импортами (ревью №3).
исключить: []

# Файл едет, но своей заготовкой. Замер речи владельца — его личные данные;
# заготовка несёт машинную строку потолков, которую читает check-perepiska.py.
заменить_шаблоном:
  харнес/память/ТОН.md: харнес/шаблоны-задач/ТОН-заготовка.md

# ИМЕНА ключей паспорта. Значение каждого заменяется на ${ИМЯ} и только в
# документах (*.md): в коде замена пути меняет умолчание, а это чинится
# причиной, а не подстановкой (спека §3).
обезличить_ключи:
  - PROJECT_DIR
  - PROJECT_NAME
  - PRODUCT_DIR
  - TG_CHAT_ID
  - AGENT_USER

# Эти файлы обязаны БЫТЬ в собранном дереве. Это проверка наличия, а не белый
# список: умолчание сборки — «всё, кроме исключённого». Первые четыре — цели
# @-импортов харнес/CLAUDE.md, без них новая установка стартует с битыми
# ссылками.
оставить:
  - харнес/CLAUDE.md
  - харнес/STATE.md
  - харнес/память/УКАЗАНИЯ.md
  - харнес/память/MEMORY.md
  - харнес/память/ТОН.md
  - харнес/dev-map.yaml
  - харнес/scripts/publikaciya.sh
  - харнес/config/публичная-сборка.yaml
  - УСТАНОВИТЬ.sh
  - README.md
