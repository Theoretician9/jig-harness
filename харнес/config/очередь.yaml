# Порядок работы: чем задача важнее, тем она выше. ДАННЫЕ, а не код.
#
# Владелец 12.09.2026: «когда я тебе накидываю задачи тебе надо сначала
# положить эту задачу в беклог, потом завершить свой пайплайн процесса, потом
# проверить план и понять куда в плане поставить эту задачу. это должно
# контролироваться кодом и быть безотказным. но при этом я могу своей волей
# направить твоё внимание на любую задачу в любой момент, если ясно об этом
# говорю».
#
# Читает scripts/ochered-raboty.py (--порядок) и scripts/zadachi-iz-kanala.py
# (списки слов). Файл ЖИВОЙ: раскладка его не затирает, как и пайплайн.yaml.

# ── Веса признаков. Место задачи = сумма весов + свежесть источника ────────
веса:
  внимание_владельца: 100   # прямое слово в канале; перебивает всё
  провал_проверки: 40       # сломано то, что считалось сделанным
  wip: 30                   # начатое дороже нового
  queue: 20                 # поставлено в очередь руками
  plan: 0                   # хвост

# Сколько суток живёт прямое слово владельца. Без срока пометка через неделю
# поднимает наверх то, что он давно забыл: у пометки обязан быть срок.
внимание_суток: 3

# Хвост plan разводится ВОЗРАСТОМ ИСТОЧНИКА: задача из более свежего сообщения
# владельца стоит выше. Иначе девять задач из десяти получают 0, и «порядок
# считает код» вырождается в «порядок строк в файле» (находка ревью C-5).
# Добавка — целое от 0 до значения ниже; задача без источника получает 0.
свежесть_максимум: 9

# Сколько строк печатать, когда направление не выбрано (ACTIVE_LINE пуст):
# на свежей установке иначе печатается вся карта.
потолок_строк: 10

# ── Слова владельца ────────────────────────────────────────────────────────
# ОДИН источник для гейта задач и для прибора очереди: два списка разъезжаются
# молча, и разошедшаяся половина молчит ровно тогда, когда нужна (так разошлись
# формы команд приёмки и цикл крутился впустую пять кругов).

# Слова, которыми владелец ДАЁТ РАБОТУ. Список узкий нарочно: ложная тревога
# стоит одной команды «--не-задача», а потерянная задача — повтора от владельца.
слова_работы:
  - надо
  - нужно
  - сделай
  - добавь
  - почини
  - исправь
  - переделай
  - реализуй
  - хочу чтобы
  - не работает
  - сломал
  - должно быть
  - должен быть
  - займись
  - давай сделаем

# Слова, которыми владелец НАПРАВЛЯЕТ ВНИМАНИЕ — «если ясно об этом говорю».
# Проверены замером всего архива (971 сообщение, 12.09.2026): голое «сейчас»
# встретилось 69 раз и почти всегда означало обстоятельство времени («я сейчас
# добавил памяти»), «сначала» — 19 раз и то же самое. Их в списке НЕТ.
# Оставшиеся дают 8 срабатываний на архив, из них 2 ложных (владелец цитировал
# моё же сообщение).
слова_внимания:
  - прямо сейчас
  - первым делом
  - в первую очередь
  - в приоритете
  - займись
  - срочно
  - брось
  - отложи
  - переключись
  - бросай

# «займись» — приказ, кроме случая «после того как закончишь … займись»: это
# ровно обратное, отложенная работа. Форма проверяется отдельно.
внимание_отменяется:
  - после того как
  - как закончишь
  - как всё доделаешь
  - когда закончишь
