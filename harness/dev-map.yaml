version: 1

# Эталон объёма работы (ЕР) — рыночная средняя задача ИИ-кодинга.
# Выбран один раз и навсегда: плавающая калибровка немонотонна.
calibration: { loc_ref: 500, c_ref: 4, tokens_ref_k: 300, set_at: "market" }

# Проект начат вместе с харнесом — истории до трейлеров Dev-Map нет.
unattributed_loc: 0

milestones:
  - { id: ms.start, date: "2026-08-08", label: "Харнес развёрнут",
      summary: "На чистом сервере поставлен рабочий каркас: связь с владельцем через Telegram, сторожа опасных команд, демоны присмотра, память и карта разработки. Продукт ещё не начат." }

# «Дальше по плану» — упорядоченный список id задач.
queue: [hr.accept, hr.rotation, pr.first]

# Водораздел сверки «мимо карты» (devmap-selfheal): рабочий SHA-курсор демон
# ведёт в $LOG_DIR/devmap/audit.cursor; здесь — человекочитаемая точка отсчёта.
audit:
  cursor: "момент внедрения харнеса (веха ms.start, 2026-08-08): истории до него нет — репозиторий начат вместе с харнесом, сверять нечего"

layers:
  - { id: product,  label: "Продукт",                 color: "#2b9bd6" }
  - { id: platform, label: "Платформа · эволюция",    color: "#8b6cf0" }
  - { id: infra,    label: "Инфраструктура · харнес", color: "#5aa06a" }

# Статусы: done — проверено владельцем (100%) · test — ждёт живого теста (90%)
# · wip — дорабатывается (% по чек-листу) · plan — не начато (0%).
# Гейт И-4 (pre-commit, статусный): задача в done обязана нести
# tested_at: "ГГГГ-ММ-ДД" — дату подтверждения владельцем; исключение —
# owner_testable: false (внутренняя работа, владельцу нечего щупать —
# сразу done, норма UNIFIED/07). done без tested_at коммит не проходит.
# Карта — реестр всей работы проекта, а не трекер текущих задач.
#
# blocked: "<причина>" — работы для агента в этой задаче сейчас нет (ждём
# решения владельца, чужой поставки, наступления условия). Задача остаётся в
# queue, но silence-watchdog сторожа сессий её не считает: 12.08.2026 в очереди
# стояла одна такая, и пинки «продолжай работу» будили агента впустую до утра.
# Когда вся очередь заблокирована, сторож молчит агенту и раз в
# BLOCKED_TELL_GAP_MIN напоминает тому, от кого зависит движение. Причину
# снимает тот, кто получил ответ, — той же правкой, что начинает работу.

lines:
  - id: harness
    layer: infra
    name: "Харнес: поставить и доказать"
    short: "Харнес"
    weight: 1
    tasks:
      - id: hr.accept
        status: plan
        owner_testable: true
        title: "Принять харнес по чек-листу"
        summary: "Пройти приёмку установленного каркаса: сообщение реально доходит до владельца в Telegram, сторож отменяет опасную команду на живом больном случае, демоны оставляют свежие метки жизни, бэкап снят и из него можно восстановиться, потолки гигиены сверены с фактическим тарифом сервера."
        volume: { loc: 100, complexity: 3, tokens_k: 300, estimated: true }
      - id: hr.rotation
        status: plan
        owner_testable: true
        title: "Первая ротация сессии — принудительно"
        summary: "Не ждать, пока контекст переполнится сам: принудительно прогнать смену рабочей сессии и доказать живым переходом, что новая сессия подхватывает дела — читает состояние и передачу, называет текущую задачу и следующий шаг. Заодно откалибровать порог ротации по фактическому размеру журнала."
        volume: { loc: 50, complexity: 3, tokens_k: 200, estimated: true }

  - id: product
    layer: product
    name: "Продукт: первая задача"
    short: "Продукт"
    weight: 1
    tasks:
      - id: pr.first
        status: plan
        owner_testable: true
        title: "Первая задача продукта через весь цикл"
        summary: "Маленькая настоящая задача нового продукта (формулировку даст владелец), прогнанная через весь конвейер: спека, ревью спеки, план, контракт, тесты до кода, код, ворота, ревью, выкат одним скриптом, живой смоук, закрытие. Цель двойная: первый работающий кусочек продукта и доказательство, что конвейер ходит целиком."
        volume: { loc: 500, complexity: 4, tokens_k: 300, estimated: true }

  - id: evolution
    layer: platform
    name: "Эволюция: журналы и ревизии"
    short: "Эволюция"
    weight: 1
    tasks:
      - id: ev.signals
        status: plan
        owner_testable: false
        title: "Журналы сигналов копятся, ревизии приходят"
        summary: "Убедиться после первых недель работы, что сырьё для будущих улучшений накапливается само: журналы срабатываний гейтов и вызовов скилов пополняются, коллектор сигналов сводит их по расписанию, ежемесячная ревизия памяти приходит с готовыми предложениями, а не с вопросами."
        volume: { loc: 100, complexity: 2, tokens_k: 150, estimated: true }
