# Кто вправе говорить с владельцем мимо двери канала и кто — при держащемся
# лимите. ДАННЫЕ гейта scripts/check-owner-senders.py.
#
# ЗАЧЕМ. Владелец 17.10.2026 о сообщениях при лимите: «надо проверить чтобы все
# механизмы этому следовали принципу». Отправителей владельцу 24, и правило,
# записанное у каждого, держится вниманием: оба ревью того дня нашли по дыре —
# три демона уходили в прямой curl при отказе двери, а четвёртый (уборка диска)
# делает это до сих пор законно, потому что у него запасной путь на случай
# мёртвой двери. Поэтому список прямых путей — ХРАПОВИК: стоящие названы с
# причиной, новый краснит гейт.

# Файлы, которым разрешён ПРЯМОЙ запрос к Bot API (sendMessage/sendDocument
# мимо scripts/tg_send.sh). У каждого — причина, по которой запасной путь нужен.
pryamoj_api:
  scripts/tg_send.sh: сама дверь — единственный штатный путь к Bot API
  scripts/emergency-send.sh: аварийный канал на случай сломанного харнеса; зовётся руками
  scripts/tg-dispatcher.sh: единственный читатель getUpdates; отвечает владельцу на его же нажатия
  scripts/bot-commands.py: кнопки меню — ответ на касание владельца, не весть демона
  scripts/download_attachment.py: getFile и скачивание вложения, не отправка
  harness/demons/session-warden.sh: запасной путь только когда двери нет физически (смена сессии)
  harness/demons/server-hygiene.sh: запасной путь только когда двери нет физически (И-3)
  harness/demons/disk-cleanup.sh: запасной путь только когда двери нет физически (диск кончается)
  harness/demons/memory-revision.sh: запасной путь, когда двери нет вовсе (ежемесячная ревизия)
  scripts/check-secret-in-logs.py: ищет секреты В ТЕКСТАХ, адрес API — образец поиска
  scripts/hooks/guard_bash.py: судит команды, адрес API — образец запрета
  scripts/check-owner-senders.py: сам судья — адрес API в нём образец поиска

# Файлы, которым разрешён ключ «--несмотря-на-лимит»: их весть обязана дойти,
# пока лимит держится. Владелец разрешил ровно смену сессии («ну кроме там
# смены сессии, это ладно») и то, что говорит о самом лимите.
nesmotrya_na_limit:
  harness/demons/limit-watch.sh: весть о самом лимите и об его обновлении
  harness/demons/session-warden.sh: смена сессии, ротация и «нужны ваши руки»
  scripts/tg_send.sh: сама дверь — разбирает ключ
  harness/panel/confirmation.py: ответ на нажатие владельца — код подтверждения и исход переключения
  harness/panel/server.py: вход запасным кодом и промахи входа — о своём действии он узнаёт сразу
  scripts/test_limit_silence.sh: проба правила зовёт дверь обоими исходами
  scripts/test_limit_watch.sh: стенд пробы повторяет разбор ключей боевой дверью
  scripts/test_warden_blocked_idle.sh: стенд пробы повторяет разбор ключей боевой дверью
  scripts/check-owner-senders.py: сам судья — ключ в нём образец поиска
