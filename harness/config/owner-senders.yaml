# Кто вправе говорить с владельцем мимо двери канала и кто — при держащемся
# лимите. ДАННЫЕ гейта scripts/check-owner-senders.py.
#
# ЗАЧЕМ. Владелец 17.10.2026 о сообщениях при лимите: «надо проверить чтобы все
# механизмы этому следовали принципу». Отправителей владельцу 24, и правило,
# записанное у каждого, держится вниманием: оба ревью того дня нашли по дыре —
# три демона уходили в прямой curl при отказе двери, а четвёртый (уборка диска)
# делает это до сих пор законно, потому что у него запасной путь на случай
# мёртвой двери. Поэтому список прямых путей — ХРАПОВИК: стоящие названы с
# причиной, новый краснит гейт.

# Файлы, которым разрешён ПРЯМОЙ запрос к Bot API (sendMessage/sendDocument
# мимо scripts/tg_send.sh). У каждого — причина, по которой запасной путь нужен.
pryamoj_api:
  scripts/tg_send.sh: сама дверь — единственный штатный путь к Bot API
  scripts/emergency-send.sh: аварийный канал на случай сломанного харнеса; зовётся руками
  scripts/tg-dispatcher.sh: единственный читатель getUpdates; отвечает владельцу на его же нажатия
  scripts/bot-commands.py: кнопки меню — ответ на касание владельца, не весть демона
  scripts/download_attachment.py: getFile и скачивание вложения, не отправка
  harness/demons/session-warden.sh: запасной путь только когда двери нет физически (смена сессии)
  harness/demons/server-hygiene.sh: запасной путь только когда двери нет физически (И-3)
  harness/demons/disk-cleanup.sh: запасной путь только когда двери нет физически (диск кончается)
  harness/demons/memory-revision.sh: запасной путь, когда двери нет вовсе (ежемесячная ревизия)
  scripts/check-secret-in-logs.py: ищет секреты В ТЕКСТАХ, адрес API — образец поиска
  scripts/hooks/guard_bash.py: судит команды, адрес API — образец запрета
  scripts/check-owner-senders.py: сам судья — адрес API в нём образец поиска
  harness/demons/dispatcher-stall-watch.sh: owner-only, тревога о самом приёме канала — прямой запрос, потому что сломан именно тракт, по которому идут вести; работы для модели за ней нет, чинит сторож приёма; страж ответа владельцу шлёт через дверь tg_send.sh
  scripts/test_dispatcher_speed.sh: стенд пробы — свой HTTP-сервер на localhost (TG_API_BASE) вместо Bot API, подставной токен; владельцу не пишет
  scripts/test_process_dispatcher.py: «curl …/getUpdates» — подставная строка процесса в таблице пробы диспетчера процессов, запроса к Bot API не делает

# Файлы, которым разрешён ключ «--несмотря-на-лимит»: их весть обязана дойти,
# пока лимит держится. Владелец разрешил ровно смену сессии («ну кроме там
# смены сессии, это ладно») и то, что говорит о самом лимите.
nesmotrya_na_limit:
  harness/demons/limit-watch.sh: весть о самом лимите и об его обновлении
  harness/demons/session-warden.sh: смена сессии, ротация и «нужны ваши руки» и весть о самом лимите (ветка 6б)
  scripts/tg_send.sh: сама дверь — разбирает ключ
  harness/panel/confirmation.py: ответ на нажатие владельца — код подтверждения и исход переключения
  harness/panel/server.py: вход запасным кодом и промахи входа — о своём действии он узнаёт сразу
  harness/demons/sentinel.sh: весть о перезагрузке сервера — сообщение о самом рестарте, не обход тишины про лимит (решение оркестратора 05.11, владелец отдал вопрос ему)
  scripts/test_sentinel_after_restart.py: проба sentinel — проверяет, что весть после рестарта уходит с ключом
  scripts/test_server_restart_window.sh: проба окна рестарта — проверяет, что весть sentinel уходит с ключом при держащемся лимите
  scripts/test_limit_silence.sh: проба правила зовёт дверь обоими исходами
  scripts/test_limit_watch.sh: стенд пробы повторяет разбор ключей боевой дверью
  scripts/test_warden_blocked_idle.sh: стенд пробы повторяет разбор ключей боевой дверью
  scripts/test_pane_door_pause.sh: стенд пробы повторяет разбор ключей боевой дверью
  scripts/test_pane_lock_instant.sh: стенд пробы повторяет разбор ключей боевой дверью
  scripts/test_warden_limit_silence.sh: стенд пробы, подставная дверь принимает ключ вести о лимите (ветка 6б сторожа сессий)
  scripts/check-owner-senders.py: сам судья — ключ в нём образец поиска
  harness/demons/speed_mode.py: весть судьи скорости о лимите — ОДНО сообщение со временем обновления, дальше тишина (план сообщения не шлёт второе при том же лимите). Слово владельца 17.10.2026 — «Просто одно сообщение - упёрся в лимит подписки, лимит обновится в 15:10, после обновления продолжу»; остальные вести судьи (не про лимит) идут без ключа
  scripts/test_speed_mode.py: стенд пробы судьи скорости — проверяет, что весть о лимите уходит с ключом, а прочие без него; дверь подставная
  scripts/test_consent_buttons.py: стенд пробы дверей согласия — подставной curl, сообщение владельцу не уходит; проверяет, что страж подписи с вопросом о «да» держит и с ключом

# ── Третий вопрос: что за вестью — работа модели или только сведение ────────
# Владелец 25.10.2026: «сторож гигиены например, шлёт сообщение только мне, и
# что мне делать с этими сообщениями? нет автоматизации, которая бы создавала
# задачу для модели <…> мне то они зачем, так чисто показать. работу то должна
# модель делать». Гейт судит КЛЮЧИ в обе стороны: запись без зова в коде и зов
# без записи краснят одинаково.
#
# Вид записи:
#   card        весть заводит карточку по ключу (--task) и снимает её на зелёном
#               (--resolve); без key — карточки заводит свой писатель (own_writer);
#   kick        весть идёт рядом с пинком живой смене, работа уже будится;
#   board       весть кладёт факт на доску смены;
#   owner-only  законно без задачи: ждать нечего, или это ответ на его действие;
#   debt        работа за вестью ЕСТЬ, а задачи ещё нет; card — карточка долга.
# Ключ с «*» на конце — префикс динамического ключа. Долг только убывает:
# debt_max не поднимается выше закоммиченного (проверяет гейт по HEAD).
probe_mask: '(^|/)test_|selftest'

model_task:
  harness/demons/acceptance-watch.sh:
    - {kind: card, key: "acceptance-watch:crash", why: "аварии приёмки (упала, карта не прошла валидатор после архива) — работа модели; волна 3"}
    - {kind: owner-only, why: "итог приёмки (принято / провал) — смена статусов в карте уже сама работа"}
  harness/demons/checks-stream.sh:
    - {kind: owner-only, why: "итог потока проверок не чаще раза в сутки и только при неудаче (ключ красный и после отдыха, лимит, сбой агента, битая карта) — работа по тревогам уже лежит карточками, новой задачи весть не создаёт"}
  harness/demons/check-builder.sh:
    - {kind: card, key: "check-builder:map-damaged", why: "порча карты строителем — срочная работа модели; волна 3"}
  harness/demons/disk-cleanup.sh:
    - {kind: card, key: "disk-cleanup:full", why: "диск занят после уборки — работа модели; волна 1"}
  harness/demons/dispatcher-stall-watch.sh:
    - {kind: owner-only, why: "весть о его же сообщении без ответа — сколько ждёт и взято ли; ответить смену будят хук конца хода и толчки 6а"}
  harness/demons/extensions-watch.sh:
    - {kind: card, key: "extensions-watch:failed", why: "сбой расширения (RC != 0) — фраза «смотрю» обещает работу, которой ни у кого нет; волна 3"}
  harness/demons/heartbeat-watch.sh:
    - {kind: card, key: "heartbeat-watch:dead:*", why: "мёртвый демон поимённо — работа модели; волна 1"}
    - {kind: card, key: "heartbeat-watch:mass", why: "много мёртвых разом — одна причина, одна карточка; волна 1"}
    - {kind: owner-only, why: "зелёная суточная сводка меток — пульс для сведения"}
  harness/demons/limit-watch.sh:
    - {kind: owner-only, why: "о самом лимите подписки: ждать нечего, лечится сама (слово 17.10); при снятии лимита смену будит pane_kick"}
  harness/demons/memory-commit.sh:
    - {kind: card, key: "memory-commit:blocked", why: "правка памяти с панели не уходит в гит — работа модели; на 6-м обходе есть доска, но её читают только на старте смены; волна 1"}
  harness/demons/memory-revision.sh:
    - {kind: card, key: "memory-revision:findings", why: "находки ежемесячной ревизии памяти должны стать карточками по образцу project-revision; волна 3"}
  harness/demons/nightly-gates.sh:
    - {kind: card, key: "nightly-gates:red", why: "красный итог ночных ворот — работа модели; волна 1"}
    - {kind: card, key: "nightly-gates:broken", why: "обрыв ночного прогона — работа модели; волна 1"}
  harness/demons/nightly-mutations.sh:
    - {kind: card, key: "nightly-mutations:red", why: "дыры полного прогона мутаций — проверка не видит поломки, работа модели"}
    - {kind: card, key: "nightly-mutations:broken", why: "прогон мутаций без итога, упёрся в предел или выронил записи — поломка прибора, работа модели"}
    - {kind: owner-only, why: "жёлтое «прогнано K из N, дыр нет» — сведение, остаток добьёт следующий прогон через кэш"}
  harness/demons/product-health.sh:
    - {kind: card, key: "product-health:trouble", why: "служба продукта сообщает о беде (линия продукта); волна 3"}
  harness/demons/project-revision.sh:
    - {kind: card, own_writer: "модель по промпту ревизии добавляет карточки (источник ревизия:…), до трёх", why: "ЭТАЛОН: находки ревизии проекта становятся карточками"}
  harness/demons/sentinel.sh:
    - {kind: card, key: "sentinel:start-red", why: "красная проверка при старте — работа модели; волна 3"}
    - {kind: owner-only, why: "стартовый доклад «всё поднято» — для сведения"}
  harness/demons/server-hygiene.sh:
    - {kind: card, key: "server-hygiene:violations", why: "нарушения потолков машины — пример владельца; волна 1"}
    - {kind: card, key: "server-hygiene:check-broken", why: "проверка гигиены сломана — работа модели; волна 1"}
  scripts/restore-probe.sh:
    - {kind: card, key: "restore-probe:failed", why: "дамп не восстановился или проба не проведена — копии нельзя считать годными, разбор причины — работа модели"}
  harness/demons/resource-report.sh:
    - {kind: owner-only, why: "суточная сводка ресурсов — для сведения, работы для модели нет"}
  harness/demons/session-warden.sh:
    - {kind: kick, why: "agent_prompt рядом с вестью при живом агенте: пульс, простой, inbox, ротация"}
    - {kind: card, key: "session-warden:no-agent", why: "ветки «агента нет / поднять не удалось / ротация не закрылась / пинок не дошёл» — причину аварии новая смена иначе не узнает; волна 3"}
    - {kind: card, key: "session-warden:inbox-stuck", why: "сообщение владельца отдано сессии трижды и всё лежит во входящих — сессия его не берёт; работа модели; волна 3"}
    - {kind: card, key: "session-warden:two-agents", why: "два основных агента сразу, одно и то же устоявшееся время — две смены пишут в одно дерево; работа модели (one-shift.sh); карточка снимается, когда агент один"}
    - {kind: card, key: "session-warden:speed-unanswered", why: "несколько пинков «возьми задачи» подряд, а в работе не прибавилось — смена не берёт задачи сама; работа модели — разобраться почему; карточка заводится вестью --task"}
    - {kind: card, key: "session-warden:early-exit", why: "агент вышел вскоре после запуска — смена не держится в панели, причину по хвосту панели ищет модель; карточка снимается, когда агент снова на месте"}
  harness/demons/speed_mode.py:
    - {kind: owner-only, why: "весть о смене числа задач одновременно (режим урезан блокером или вернулся) и о лимите — сведение, режим вернётся сам; работы для модели за ней нет"}
  harness/demons/stack-watch.sh:
    - {kind: owner-only, why: "недельная сводка свежести стека — сведение; работу по ней ведёт карточка hr.stack-freshness-monitor"}
  harness/demons/update-watch.sh:
    - {kind: owner-only, why: "вопрос «поставить новую версию?»; ответ исполняет код scripts/update.py"}
  harness/panel/confirmation.py:
    - {kind: owner-only, why: "ответ на нажатие владельца в панели — код подтверждения и исход переключения"}
  harness/panel/server.py:
    - {kind: owner-only, why: "вход запасным кодом и промахи входа — ответ на его действие"}
  scripts/claude-demon.sh:
    - {kind: owner-only, why: "«демоны не получают ответ модели» — лимит, лечится сам при снятии лимита, ждать нечего"}
  scripts/emergency-send.sh:
    - {kind: owner-only, why: "аварийный канал на случай сломанного харнеса, зовётся руками"}
  scripts/hooks/pause_guard.py:
    - {kind: owner-only, why: "ответ «стою» на его же команду паузы"}
  scripts/publish.sh:
    - {kind: owner-only, why: "информирование о публикации по его слову: задача уже была словом владельца"}
  scripts/spec_approval.py:
    - {kind: owner-only, why: "вопрос «спека, жду да»; ответ исполняет код scripts/spec_approval.py"}
  scripts/tg-dispatcher.sh:
    - {kind: owner-only, why: "ответы владельцу на его команды и нажатия; сам читатель входящих"}
  scripts/tg_send.sh:
    - {kind: owner-only, why: "сама дверь канала: ключ --task зовёт писателя, но весть не от неё"}
  scripts/update.py:
    - {kind: owner-only, why: "итог обновления или откат — сведение; вопрос исполняет код этого же файла"}

# Упоминают дверь канала, но владельцу сами не пишут.
not_senders:
  scripts/acceptance.py: строка tg_send.sh в списке разрешённых команд приёмки
  scripts/check-function-before-definition.py: tg_send — имя функции в образцах самотеста
  scripts/check-owner-senders.py: сам судья — имя двери в его описании и данных
  scripts/lib/gates_check.sh: tg_send.sh в комментарии о резке строки по букве; пишет только журнал секунд
  scripts/gates.sh: упоминание двери в комментарии о правилах переписки
  scripts/hooks/channel_reply_guard.py: имя двери в подсказке отказа — сам владельцу не пишет
  scripts/install-probe.sh: tg_send в шаблоне поиска утечек стенда установки
  scripts/mutation-probe.sh: слово tg_send в комментарии о причинах ложных «дыр» прибора
  scripts/stack_freshness.py: пишет отметки после отправки; сам дверь не зовёт
  scripts/verify-mechanisms.py: проверяет механизмы, зовёт дверь только в стенде

# Долг только убывает: на включении 15 записей debt, волны 1–3 переведены в card (0 осталось).
debt_max: 0
