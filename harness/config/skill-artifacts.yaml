# Артефакт, который скил обязан оставить, — ДАННЫЕ для scripts/live-check-skill.py.
#
# Откуда взято: спека docs/specs/2026-10-15-живая-проверка-механизмов.md §3.1,
# класс E: «вызов в ЭТОЙ задаче (запись журнала с ts позже начала задачи) и
# артефакт, который скил обязан оставить». Запись журнала пишет ХУК оболочки, то
# есть не я; артефакт — файл, то есть тоже не моё слово. Поэтому доказательств
# два, и оба чужие.
#
# Поля на скил:
#   артефакт — маска glob ОТНОСИТЕЛЬНО корня репозитория; «{задача}» заменяется
#              на id задачи. Маска «-» значит «скил файла не создаёт», и тогда
#              обязательна причина: молчание о таком скиле неотличимо от забытой
#              записи
#   почему   — зачем именно этот файл считается следом работы скила
#
# Артефакт судится ПО ВРЕМЕНИ: файл старше начала задачи означает, что скил
# работал когда-то в другой задаче, а здесь его не звали.
#
# ДОЛГ. Здесь названы скилы, чьи вызовы есть в журнале ЭТОЙ задачи. Остальные
# наполняются по мере того, как их зовут: скил, который не вызывался, живьём не
# проверен, и записывать ему артефакт наперёд — обещание.

скилы:
  task-closing:
    артефакт: docs/handover/SESSION-HANDOFF-*.md
    почему: >-
      закрытие обязано обновить передачу контекста (шаг 4 скила), и это
      единственный файл, который он оставляет САМ: отчёт уходит в канал,
      статусы — в карту, уроки — в память, и у каждого свой носитель
  spec-writing:
    артефакт: docs/specs/*.md
    почему: скил пишет спеку задачи файлом, и он же уходит владельцу
  task-intake:
    артефакт: .tasks/{задача}/приём-задачи.md
    почему: >-
      приём задачи оставляет разбор её прочтений, допущений и замеров файлом в
      каталоге задачи: иначе «подумал до кода» доказывается только моим словом
  pretask-contract:
    артефакт: .tasks/{задача}/pretask.yaml
    почему: >-
      контракт задачи и ЕСТЬ файл этого шага, машиночитаемый и названный в
      шаблоне (harness/шаблоны-задач/pretask-template.yaml)
  spec-review:
    артефакт: .tasks/{задача}/review/*.md
    почему: ревью спеки оставляет разбор ролями в каталоге задачи
  plan-writing:
    артефакт: docs/plans/*.md
    почему: план реализации живёт файлом, его шаги потом закрываются по одному
  tests-before-code:
    артефакт: scripts/test_*
    почему: >-
      проба, написанная ДО кода, и есть артефакт этого шага. Маска без
      расширения: пробы харнеса бывают и питоньи, и на bash (18.10.2026 шаг
      закрывался пробой scripts/test_warden_handover_gate.sh)
  harness-code-review:
    артефакт: .tasks/*/harness-code-review.md
    почему: >
      ревью кода оставляет разбор находками файлом. Маска БЕЗ «{задача}»
      нарочно: ревью звучит в смене, а разбор кладётся в каталог той карточки,
      ЧЬЮ работу судили, — 17.10.2026 вызов был в задаче живой проверки, а файл
      лёг в каталог карточки об отмене согласия. Привязку к задаче держит запись
      журнала (task), свежесть файла — начало задачи.
  subagent-work:
    артефакт: .tasks/{задача}/журнал.md
    почему: работа помощников оставляет журнал решений в каталоге задачи
  claude-api:
    артефакт: '-'
    почему: >
      справочный скил о модели и её ценах: знание уходит в саму работу, файла он
      не создаёт. Доказательством остаётся машинная запись журнала вызовов.
