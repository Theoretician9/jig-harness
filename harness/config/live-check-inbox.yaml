# Живая проверка обработчиков входящих (класс B2) — ДАННЫЕ для
# scripts/live-check-inbox.py.
#
# Откуда взято: спека живой проверки §3.1, класс B2 — «прогнан на ЗАПИСАННОМ
# живом сообщении владельца из inbox/обработано/. Подделать входящее нельзя:
# проверяемый написал бы себе улику».
#
# Поля:
#   зов       — каким способом механизму достаётся слово владельца, ровно как в
#               жизни: «довод» (argv, так зовёт диспетчер attention-word),
#               «stdin» (так зовёт secret-intake — argv виден в ps),
#               «очередь» (механизму подаётся КАТАЛОГ входящих, так его зовёт
#               хук рубежа)
#   доводы    — что идёт в командную строку; {стенд} — каталог стенда прибора,
#               {метка} — метка сообщения, {входящее} — путь файла входящего
#   среда     — переменные окружения (значение-путь считается от корня дерева)
#   ждём      — предикат ОТВЕТА:
#               «эхо-входа»  — в ответе есть кусок слов владельца (механизм
#                              достал что-то ИЗ сообщения);
#               «не-как-вход» — ответ отличается от входа, и ни одно значение,
#                              которое судья форм нашёл во входящем, в ответ не
#                              попало (механизм ЗАМЕНИЛ что-то в сообщении)
#   признак   — подстрока, которую печатает ТОЛЬКО удачный исход. Нужна там, где
#               у механизма есть свой отказ: приёмник секретов на отказ
#               хранилища печатает пометку «секрет не принят», и она «не как
#               вход» ровно так же, как удача (прибор принял это за
#               доказательство на первом прогоне 17.10.2026)
#   чем_жив   — чем механизм занят в жизни; идёт в поле «живьём» записи
#
# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ:
#   * scripts/urgency.py и scripts/map-from-message.py — доказаны строкой в
#     журнале ЗОВУЩЕГО (диспетчера) на настоящем сообщении владельца: это тот же
#     живой вход, только прочитанный у зовущего, и повторный прогон ничего бы не
#     добавил.
#   * scripts/board.py числится классом B2, но входящих не обрабатывает вовсе:
#     её вход по замыслу — слова СМЕНЫ («я пишу факт словами, код читает»).
#     Предикат B2 к ней неисполним, и прибор её не берёт.

версия: 1

входящие:
  scripts/attention-word.py:
    зов: довод
    среда:
      QUEUE_CONF: harness/config/queue.yaml
    ждём: эхо-входа
    чем_жив: >-
      его зовёт диспетчер канала на каждое сообщение владельца и слово из ответа
      кладёт в $LOG_DIR/внимание.jsonl

  scripts/secret-intake.py:
    зов: stdin
    доводы: ["--журналы", "{стенд}", "--метка", "{метка}"]
    ждём: не-как-вход
    признак: "секрет из канала:"
    чем_жив: >-
      его зовёт диспетчер канала через stdin до записи в любой журнал: значение
      уходит в своё хранилище, дальше по циклу идёт пометка

  scripts/inbox-digest.py:
    зов: очередь
    доводы: ["--инбокс", "{стенд}/inbox", "--карта", "dev-map.yaml"]
    ждём: эхо-входа
    чем_жив: >-
      его зовёт хук рубежа (scripts/hooks/stop_reminder.sh) и печатает свод
      накопленных входящих агенту
