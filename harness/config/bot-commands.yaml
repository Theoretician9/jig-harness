# ДАННЫЕ: команды, которые владелец видит кнопками в меню бота.
#
# Владелец 13.09.2026: «надо сделать вызов панели кнопкой прям в меню бота».
# До этого меню было пустым (getMyCommands возвращал []), а команды надо было
# угадывать словом — и угадывать латиницей.
#
# Имя команды Telegram принимает только латиницей (a-z, 0-9, _), до 32 знаков;
# описание — до 256, и его владелец читает на своём языке. Ставит команды
# scripts/bot-commands.py, он же сверяет, что стоит именно это.
#
# Слова — то, чем эта же команда вызывается ОБЫЧНЫМ сообщением: владелец пишет
# в чат по-русски, и «панель» обязано работать наравне с кнопкой.

команды:
  - имя: panel
    описание: "Открыть панель управления харнесом"
    слова: ["панель", "панел", "дай панель", "открой панель",
            "ссылка на панель", "ссылку на панель"]
  - имя: status
    описание: "Что делается прямо сейчас и что в очереди"
    слова: ["статус", "что делаешь", "что сейчас", "чем занят"]
  - имя: update
    описание: "Поставить обновление харнеса из публичного гита"
    слова: ["обновить", "обнови", "обнови харнес", "обновить харнес"]
  - имя: update_reset
    описание: "Поставить обновление, а свои коммиты пакета сберечь в отдельной ветке"
    слова: ["обновить, сбросив свои", "обнови, сбросив свои"]
  - имя: panel_out
    описание: "Вывести панель наружу (имя, сертификат и nginx — сам)"
    слова: ["панель наружу", "выведи панель", "вывести панель наружу",
            "панель наружу снять", "убрать панель наружу"]
    # Команда принимает ИМЯ: «панель наружу my.example.com». Форма аргумента —
    # данные, а не ветка в боте: по ней разбор узнаёт команду со своим именем
    # и по ней же выделяет само имя. Без неё сообщение сверялось точным
    # совпадением, и названное владельцем имя не распознавалось вовсе —
    # ветка разбора имени внутри panel-expose.sh была недостижима (ревью
    # кода 13.09.2026, F-06).
    аргумент: "[a-z0-9][a-z0-9.-]*\\.[a-z]{2,}"
  - имя: pause
    описание: "Остановить работу: я встаю, присмотр молчит"
    слова: ["пауза", "стоп", "останови работу", "остановись",
            "останови", "поставь паузу", "хватит"]
  - имя: resume
    описание: "Продолжить работу после паузы"
    слова: ["продолжай", "продолжить", "сними паузу", "снять паузу",
            "работай", "поехали"]
  - имя: rotate_now
    описание: "Сменить сессию сейчас, не дожидаясь помощников"
    слова: ["ротируй сейчас", "смени сессию сейчас"]
  - имя: logout
    описание: "Выйти из панели на всех устройствах"
    слова: ["панель выйти", "выйти из панели"]
  - имя: hackathon_on
    описание: "Хакатон: включить на 72 часа"
    слова: ["хакатон включить", "включи хакатон", "включить хакатон"]
  - имя: hackathon_off
    описание: "Хакатон: выключить"
    слова: ["хакатон выключить", "выключи хакатон", "выключить хакатон"]
  - имя: hackathon
    описание: "Хакатон: статус"
    слова: ["хакатон", "хакатон статус", "статус хакатона"]
  - имя: speed
    описание: "Скорость: какой режим и что мешает"
    слова: ["скорость", "режим", "какой режим"]
  - имя: speed_slow
    описание: "Скорость: медленный, 1 задача"
    слова: ["режим медленный", "медленный режим", "скорость медленная"]
  - имя: speed_medium
    описание: "Скорость: средний, 3 задачи"
    слова: ["режим средний", "средний режим", "скорость средняя"]
  - имя: speed_fast
    описание: "Скорость: быстрый, 5 задач"
    слова: ["режим быстрый", "быстрый режим", "скорость быстрая"]
  - имя: speed_ultra
    описание: "Скорость: ультра, 10 задач"
    слова: ["режим ультра", "ультра режим", "скорость ультра"]
