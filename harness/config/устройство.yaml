      заношу: так 11.09.2026 потерялось ваше указание про автоматическую приёмку.
    проверяется: "python3 scripts/karta-iz-soobshcheniya.py --selftest (16 путей, четыре больных)"
    пишет: "карточку в dev-map.yaml под общим замком карты и строку в свой журнал"

  - файл: scripts/model-dlya.sh
    вид: хук
    имя: "Какой моделью делать эту работу"
    роль: >
      Отвечает на вопрос «какой моделью делать вот эту работу» по таблице,
      которую вы правите сами: замысел и его разбор — сильной моделью, обычную
      сверку и ночные проверки — дешёвой. Неизвестный вид работы получает
      запасной ответ и запись в журнал, а не пустоту.
    когда: "при каждом ночном вызове и на границе шага работы"
    без_него: >
      Одна и та же модель делает и разбор замысла, и механическую сверку: где-то
      дорого без пользы, где-то слабо там, где нужна сила.
    проверяется: "bash scripts/model-dlya.sh --selftest"
    пишет: "имя модели; запасные ответы — в журнал model-dlya.log"

  - файл: scripts/shagi-modeli.py
    вид: гейт
    имя: "У каждого шага работы есть своя модель"
    роль: >
      Проверяет, что в таблице названа модель для КАЖДОГО шага работы. Шаг без
      своей строки молча делался бы самой дешёвой моделью.
    когда: "на воротах"
    без_него: >
      Строку из таблицы можно удалить, и никто не заметит: шаг тихо уедет на
      дешёвую модель, а проверка останется зелёной.
    проверяется: "python3 scripts/shagi-modeli.py"
    пишет: "список шагов без своей модели"

  - файл: scripts/check-uderzhanie.py
    вид: гейт
    имя: "У каждого растущего файла есть хозяин"
    роль: >
      Проверяет, что у каждого места, куда что-то пишется, названы хозяин,
      предельный размер и срок хранения.
    когда: "на воротах"
    без_него: >
      Записи растут без предела и переполняют диск — тот самый случай, после
      которого появилась уборка.
    проверяется: "python3 scripts/check-uderzhanie.py"
    пишет: "список путей без хозяина или срока"

  - файл: scripts/check-predlozheniya.py
    вид: гейт
    имя: "Предложения ревизии не висят вечно"
    роль: >
      Следит, чтобы предложения ежемесячного разбора памяти закрывались в срок,
      а не копились годами.
    когда: "на воротах"
    без_него: >
      Разбор превращается в свалку предложений, к которым никто не возвращается.
    проверяется: "python3 scripts/check-predlozheniya.py"
    пишет: "список просроченных предложений"

  - файл: scripts/pajplajn.py
    вид: гейт
    имя: "Цена ошибки и строгость шагов"
    роль: >
      Считает, насколько дорога ошибка в этой задаче, и по ответу решает,
      сколько шагов работы обязательны — мелкой правке их не положено.
    когда: "в начале задачи и на воротах"
    без_него: >
      Либо мелкая правка идёт через все одиннадцать шагов, либо крупная —
      мимо всех: строгость становится вкусовой.
    проверяется: "python3 scripts/pajplajn.py --selftest"
    пишет: "оценку задачи и обязательные шаги"

  - файл: scripts/pokrytie-invariantov.py
    вид: гейт
    имя: "У каждого правила есть механизм"
    роль: >
      Сверяет главные правила владельца с тем, что их держит: у правила должны
      быть исполнитель, замер и живой след срабатывания.
    когда: "на полных воротах (с самотестами)"
    без_него: >
      Правило остаётся словами в документе: все уверены, что оно работает, и
      никто этого не проверял.
    проверяется: "python3 scripts/pokrytie-invariantov.py"
    пишет: "таблицу «правило — механизм — след»"

  - файл: scripts/mutacionnaya-proba.sh
    вид: гейт
    имя: "Проверка самих проверок"
    роль: >
      Нарочно портит одну строку в копии кода и смотрит, заметит ли это хоть
      одна проверка: не заметила — проверка бесполезна.
    когда: "на полных воротах"
    без_него: >
      Зелёные проверки перестают что-либо значить: они зелёные и на сломанном
      коде.
    проверяется: "bash scripts/mutacionnaya-proba.sh"
    пишет: "список порч, которые никто не поймал"

  - файл: scripts/test_late_exit_watch.sh
    вид: гейт
    имя: "Дозор позднего выхода"
    роль: >
      Живая проверка того, что смена рабочего окна доводится до конца, даже
      если предыдущая работа завершилась не сама.
    когда: "на полных воротах"
    без_него: >
      Работа может остановиться посреди смены окна: канал молчит, а причина не
      видна.
    проверяется: "bash scripts/test_late_exit_watch.sh"
    пишет: "итог живой пробы"

  - файл: scripts/test_deploy_guard_soglasie.py
    вид: гейт
    имя: "Согласие владельца на опасное"
    роль: >
      Проверяет признак согласия: без записанного «да» владельца выкат и
      необратимое не начинаются, а старое «да» не считается вечным.
    когда: "на воротах и перед каждым выкатом"
    без_него: >
      Согласие подменяется моим впечатлением, и на рабочий сервер уедет то,
      чего владелец не разрешал.
    проверяется: "python3 scripts/test_deploy_guard_soglasie.py (58 путей)"
    пишет: "разбор случая: было ли согласие и на что"

  - файл: scripts/test_zapisat_klyuch.py
    вид: гейт
    имя: "Проверка писателя настроек"
    роль: >
      Проверяет единственное место, которому позволено менять настройки: что
      оно пишет и, главное, чего не пишет ни при каких уговорах.
    когда: "на воротах и после правки писателя настроек"
    без_него: >
      Через панель можно было бы подменить значение, которое держит запрет:
      панель становится дырой вместо пульта.
    проверяется: "python3 scripts/test_zapisat_klyuch.py (15 путей)"
    пишет: "итог проб записи и отказов"

  - файл: scripts/test_zapisat_shag.py
    вид: гейт
    имя: "Проверка включателя шагов работы"
    роль: >
      Проверяет экран шагов работы: что владелец вправе выключить, а что
      выключить нельзя никогда.
    когда: "на воротах и после правки списка шагов"
    без_него: >
      Можно выключить проверку конца работы, и «сделано» снова станет словом
      без доказательства.
    проверяется: "python3 scripts/test_zapisat_shag.py"
    пишет: "итог проб переключения"

  - файл: scripts/test_zapisat_pamyat.py
    вид: гейт
    имя: "Проверка правки памяти с панели"
    роль: >
      Проверяет правку записей с экрана: что можно записать, куда нельзя
      писать и как отсекается путь за пределы разрешённого каталога.
    когда: "на воротах и после правки экрана памяти"
    без_него: >
      Через поле ввода на странице можно было бы переписать любой файл на
      сервере.
    проверяется: "python3 scripts/test_zapisat_pamyat.py"
    пишет: "итог проб записи и отказов"

  - файл: harness/panel/test_vhod.py
    вид: гейт
    имя: "Проверка входа в панель"
    роль: >
      Проверяет вход по одноразовой ссылке: что пускает владельца и чего не
      пускает никого — чужую ссылку, использованную повторно, просроченную.
    когда: "на воротах и после любой правки входа"
    без_него: >
      Дыра во входе означает, что переключателями харнеса управляет посторонний.
    проверяется: "python3 harness/panel/test_vhod.py"
    пишет: "итог проб входа"

  - файл: harness/panel/test_server.py
    вид: гейт
    имя: "Проверка службы панели"
    роль: >
      Проверяет саму страницу: какие адреса открыты, какие закрыты, и что
      запрос с чужой страницы отвергается.
    когда: "на воротах и после правки страницы"
    без_него: >
      Внутренний адрес мог бы открыться наружу, а чужая страница — нажать
      кнопку за владельца.
    проверяется: "python3 harness/panel/test_server.py"
    пишет: "итог проб по каждому адресу"

  - файл: harness/panel/test_podtverzhdenie.py
    вид: гейт
    имя: "Проверка второго рубежа"
    роль: >
      Проверяет, что опасное переключение требует одноразового кода,
      присланного в канал, и что чужой или просроченный код не подходит.
    когда: "на воротах и после правки подтверждений"
    без_него: >
      Одного нажатия на странице хватило бы, чтобы снять запрет — второй рубеж
      существует именно для этого случая.
    проверяется: "python3 harness/panel/test_podtverzhdenie.py (9 путей)"
    пишет: "итог проб подтверждения"

  - файл: harness/panel/test_sostoyanie.py
    вид: гейт
    имя: "Проверка витрины состояния"
    роль: >
      Проверяет, что отсутствие замера показывается словами «данных нет», а не
      нулём: ноль — это измеренное значение, а не пустота.
    когда: "на воротах и после правки витрины"
    без_него: >
      Молчащий помощник выглядел бы на экране как работающий с нулевым
      результатом.
    проверяется: "python3 harness/panel/test_sostoyanie.py"
    пишет: "итог проб показа состояния"

  - файл: scripts/test_obnovlenie.py
    вид: гейт
    имя: "Проверка обновления из хранилища"
    роль: >
      Проверяет сверку версий на подставном хранилище: видит ли она новое,
      не трогает ли рабочие файлы и называет ли причину, когда не дозвонилась.
    когда: "на воротах и после любой правки обновления"
    без_него: >
      Обновление может тихо перестать замечать новые версии — или, наоборот,
      предлагать откатиться назад на том, что мы сами же и написали.
    проверяется: "python3 scripts/test_obnovlenie.py (10 путей)"
    пишет: "число прошедших и упавших путей"

  - файл: scripts/test_revizia_konfig.py
    вид: гейт
    имя: "Настройки ежемесячной проверки осмысленны"
    роль: >
      Следит, чтобы у каждой области проверки были заданы папки для чтения и
      вопрос, на который она отвечает, а пороги были числами.
    когда: "на воротах"
    без_него: >
      Область читает пустоту и отчитывается «ничего не нашла», а порог-строка
      ломает счёт прямо во время ночного прогона.
    проверяется: "python3 scripts/test_revizia_konfig.py"
    пишет: "какая область без папок и какой порог не число"

  - файл: scripts/test_revizia_nahodki.py
    вид: гейт
    имя: "Разбор того, что помощник сделал со списком дел"
    роль: >
      Проверяет разбор: пропавшую задачу видно, даже если всего их стало
      больше; одна и та же находка не заводится дважды; число новых держится
      счётом, а не просьбой.
    когда: "на воротах"
    без_него: >
      Помощник удаляет пять задач и заводит двенадцать — счёт растёт, а работа
      исчезает без следа.
    проверяется: "python3 scripts/test_revizia_nahodki.py"
    пишет: "какой путь разбора разошёлся с ожиданием"

  - файл: scripts/revizia-nahodki.py
    вид: гейт
    имя: "Сверка списка дел до и после проверки"
    роль: >
      Сравнивает список дел до работы помощника и после: называет пропавшее,
      возвращает чужие правки, вычёркивает повторы и лишнее сверх меры.
    когда: "при каждом запуске месячной проверки"
    без_него: >
      Всё, что помощник сделал со списком дел, принимается на веру.
    проверяется: "python3 scripts/test_revizia_nahodki.py"
    пишет: "разбор одной строкой: сколько новых, что пропало, что вычеркнуто"

  - файл: scripts/test_revizia_porcii.py
    вид: гейт
    имя: "Проверка читает новое, а не одно и то же"
    роль: >
      Следит, что месячная проверка помнит, где остановилась, берёт сначала
      недавно правленное и не пропускает самый большой файл.
    когда: "на воротах"
    без_него: >
      Каждый месяц читается одна и та же седьмая часть кода, а самый большой
      файл не читается никогда.
    проверяется: "python3 scripts/test_revizia_porcii.py"
    пишет: "какой путь выбора разошёлся с ожиданием"

  - файл: scripts/revizia-porcii.py
    вид: гейт
    имя: "Список файлов на один проход проверки"
    роль: >
      Отвечает на вопрос «что читать сейчас»: берёт папки области, ставит
      недавно правленное первым и набирает столько, сколько влезает за раз.
    когда: "при каждом запуске месячной проверки"
    без_него: >
      Проверка либо давится всем кодом разом, либо каждый раз смотрит одно и
      то же начало.
    проверяется: "python3 scripts/test_revizia_porcii.py"
    пишет: "пути файлов по одному в строке"

  - файл: scripts/test_ustanovit_novoe.py
    вид: гейт
    имя: "Проверка доустановки нового"
    роль: >
      Проверяет, что доустановка добавляет недостающие расписания и сроки
      присмотра, не трогает чужие строки и ничего не дублирует при повторе.
    когда: "на воротах и после правки списка системных заданий"
    без_него: >
      Новая часть приезжает с обновлением и молчит: её никто не запускает, и
      её молчание никто не замечает.
    проверяется: "python3 scripts/test_ustanovit_novoe.py (10 путей)"
    пишет: "число прошедших и упавших путей"

  - файл: scripts/ustanovit-novoe.py
    вид: демон
    имя: "Доустановка нового"
    роль: >
      После обновления добавляет то, чего на машине ещё нет: запуск по
      расписанию и срок, после которого молчание части считается поломкой.
    когда: "внутри установки обновления"
    без_него: >
      Приехавшая с обновлением часть не запускается вовсе, и об этом никто не
      узнает: сторож не ждёт того, о чём не знает.
    проверяется: "python3 scripts/ustanovit-novoe.py --показать (печатает, чего не хватает)"
    пишет: "строки в расписание и сроки присмотра в паспорт установки"

  - файл: scripts/check-ustrojstvo.py
    вид: гейт
    имя: "Описание не отстаёт от устройства"
    роль: >
      Сверяет этот самый список с тем, что есть в проекте: новая часть без
      описания — красный, описание без части — тоже.
    когда: "на воротах и при каждой записи в хранилище"
    без_него: >
      Описание устройства стареет за неделю и начинает врать с видом истины —
      это хуже, чем отсутствие описания вовсе.
    проверяется: "python3 scripts/check-ustrojstvo.py"
    пишет: "список расхождений между описанием и проектом"

  - файл: scripts/test_ustrojstvo.py
    вид: гейт
    имя: "Проверка сверки устройства"
    роль: >
      Проверяет саму сверку на заведомо больных случаях: пропущенное описание,
      описание без файла, отписка вместо объяснения, непонятное слово.
    когда: "на воротах"
    без_него: >
      Сверка может тихо перестать ловить расхождения и остаться зелёной
      навсегда.
    проверяется: "python3 scripts/test_ustrojstvo.py (30 путей)"
    пишет: "число прошедших и упавших путей"

  # ─── пошаговые правила: как я работаю на каждом шаге ─────────────────────
  - файл: harness/skills/приём-задачи/SKILL.md
    вид: скил
    имя: "Приём задачи"
    роль: >
      Как принимать новую задачу от владельца: понять, проговорить допущения,
      спросить непонятное — и не начинать с написания программы.
    когда: "когда в канал пришла новая задача или сообщение с работой"
    без_него: >
      Работа начинается с кода по первому впечатлению и переделывается целиком,
      когда выясняется, о чём просили на самом деле.
    проверяется: "вызов пишется в журнал автоматически; счёт пропусков — в осмотре смены"
    пишет: "отметку о вызове в $LOG_DIR/skills.jsonl"

  - файл: harness/skills/пишу-спеку/SKILL.md
    вид: скил
    имя: "Описание замысла"
    роль: >
      Как описать задачу до кода: состояния, форматы, проверенные факты — и
      честно назвать то, что ещё не проверено.
    когда: "когда задача принята и достаточно крупна"
    без_него: >
      Крупная работа делается по догадке, и дыры вылезают на выкате, а не на
      бумаге.
    проверяется: "проверка «у крупной задачи есть описание» ищет файл замысла"
    пишет: "docs/specs/<дата>-<задача>.md, отметку о вызове"

  - файл: harness/skills/ревью-спеки/SKILL.md
    вид: скил
    имя: "Разбор замысла чужими глазами"
    роль: >
      Как искать дыры в собственном описании до согласования: нарочно
      придирчивое чтение находит то, чего не видит автор.
    когда: "когда описание написано, но ещё не согласовано"
    без_него: >
      Ошибка замысла доживает до кода и стоит вдесятеро дороже — разбор 11.09
      нашёл 33 находки, шесть опасных.
    проверяется: "проверка «у крупной задачи есть описание» требует и разбора"
    пишет: "docs/specs/<дата>-<задача>-REVIEW.md, отметку о вызове"

  - файл: harness/skills/пишу-план/SKILL.md
    вид: скил
    имя: "План работ"
    роль: >
      Как превратить согласованный замысел в план: каждая команда плана
      выполняется заранее, чтобы в плане не осталось выдуманных шагов.
    когда: "когда замысел согласован и пора планировать"
    без_него: >
      План состоит из шагов, которые не работают, и разваливается на первом же
      выполнении.
    проверяется: "отметка вызова в журнале; план лежит в docs/plans/"
    пишет: "docs/plans/<дата>-<задача>-ПЛАН.md"

  - файл: harness/skills/pretask-контракт/SKILL.md
    вид: скил
    имя: "Договор о задаче"
    роль: >
      Как перед началом работы записать, чем будет доказан результат: критерии
      командами, риски и границы.
    когда: "когда план готов, но код ещё не начат"
    без_него: >
      «Сделано» определяется на глаз, и спор о готовности возникает уже после
      работы.
    проверяется: "отметка вызова в журнале; файл pretask.yaml у задачи"
    пишет: "pretask.yaml рядом с задачей"

  - файл: harness/skills/тдд-тесты-до-кода/SKILL.md
    вид: скил
    имя: "Проверки до кода"
    роль: >
      Как писать проверки раньше самой программы и обязательно увидеть их
      красными: проверка, ни разу не падавшая, ничего не проверяет.
    когда: "когда договор о задаче есть, а код ещё не написан"
    без_него: >
      Проверки пишутся после и подгоняются под уже написанное — зелёные и
      бесполезные.
    проверяется: "проверка «новый код приходит с проверкой»"
    пишет: "файлы проверок, отметку о вызове"

  - файл: harness/skills/агенты-параллельно/SKILL.md
    вид: скил
    имя: "Несколько помощников сразу"
    роль: >
      Когда задач две и больше и они друг от друга не зависят — как запустить
      помощников одновременно, что каждому дать и как принять их работу.
    когда: "несколько независимых поломок или правок в разных местах"
    без_него: >
      Независимые задачи разбираются по очереди, и смена тратится на чтение
      того, что мог прочитать помощник.
    проверяется: "отметка вызова в журнале"
    пишет: "задания помощникам, сводку их работы в ход работы"

  - файл: harness/skills/работа-субагентами/SKILL.md
    вид: скил
    имя: "План делают помощники"
    роль: >
      Роли помощников (исполнитель, проверяющий), выбор модели под роль, круги
      правок с предохранителем на пятом, журнал принятых решений.
    когда: "план написан и его задачи делает не своя смена"
    без_него: >
      Смена выгорает на чтении файлов вместо того, чтобы вести работу, а круги
      правок идут без предела.
    проверяется: "отметка вызова в журнале"
    пишет: "журнал решений задачи (.tasks/<id>/журнал.md), отметку о вызове"

  - файл: harness/skills/ревью-кода/SKILL.md
    вид: скил
    имя: "Разбор кода перед записью"
    роль: >
      Как перечитать написанное чужими глазами: простота, отсутствие лишних
      правок, честность проверок.
    когда: "когда код написан и проверки зелёные, до записи в хранилище"
    без_него: >
      В работу попадают попутные улучшения соседнего кода, и разбор поломки
      потом занимает часы.
    проверяется: "отметка вызова в журнале"
    пишет: "замечания в ход работы, отметку о вызове"

  - файл: harness/skills/выкат-и-смоук/SKILL.md
    вид: скил
    имя: "Выкат и живая проверка"
    роль: >
      Как довести готовую работу до рабочего сервера: один сценарий, возврат
      наготове и живая проверка после — а не набор команд по памяти.
    когда: "когда работа записана в хранилище и согласие владельца получено"
    без_него: >
      Ручная последовательность команд однажды обрывается посередине, и рабочий
      сервер остаётся в половинчатом состоянии.
    проверяется: "./scripts/deploy.sh — единственный разрешённый путь; сторож команд отменяет прочие"
    пишет: "$LOG_DIR/deploy-<дата>.log, метку версии в хранилище"

  - файл: harness/skills/закрытие-задачи/SKILL.md
    вид: скил
    имя: "Закрытие задачи"
    роль: >
      Как завершить задачу честно: чем именно подтверждена работа, что осталось
      непроверенным, что записать в память и передачу смены.
    когда: "когда живая проверка после выката пройдена"
    без_него: >
      Задача считается закрытой по ощущению, а следующая смена начинается с
      выяснения, что же было сделано.
    проверяется: "проверка карты задач: «сделано» требует отметки о живой проверке"
    пишет: "состояние задачи в dev-map.yaml, запись в память, передачу смены"

  - файл: harness/skills/падение-тестов/SKILL.md
    вид: скил
    имя: "Разбор упавшей проверки"
    роль: >
      Как разбирать упавшую проверку: отдельный прогон, поиск настоящей
      причины и запрет подгонять проверку под код.
    когда: "когда упала проверка, ворота или полный прогон"
    без_него: >
      Красная проверка «чинится» ослаблением условия, и настоящая поломка
      уезжает дальше.
    проверяется: "отметка вызова в журнале; сторож команд запрещает обходить проверки"
    пишет: "разбор в ход работы и запись в память"

  - файл: harness/skills/разбор-аварии/SKILL.md
    вид: скил
    имя: "Разбор аварии"
    роль: >
      Как разбирать поломку на рабочем сервере: сначала замер, потом настоящая
      причина, в конце — механизм, который не даст повториться.
    когда: "когда рабочий сервер сломался или владелец увидел ошибку"
    без_него: >
      Поломка чинится по симптому и возвращается через неделю в другом месте.
    проверяется: "отметка вызова в журнале; таблица повторяющихся проблем"
    пишет: "разбор, новое правило и проверку под него"

  - файл: harness/skills/добыча-улик/SKILL.md
    вид: скил
    имя: "Улики до правила"
    роль: >
      Как не выдумывать правила: сперва найти в записях случай, когда это уже
      произошло, и только потом делать из него запрет.
    когда: "когда предлагается новое правило или предельное значение"
    без_него: >
      Появляются запреты от воображаемых бед: они мешают работать и ничего не
      предотвращают.
    проверяется: "отметка вызова в журнале"
    пишет: "выписку из записей с числами и датами"

  - файл: harness/skills/постройка-прибора/SKILL.md
    вид: скил
    имя: "Постройка замера"
    роль: >
      Как делать новый замер или экран: доказать его на заведомо больном
      случае и не верить показаниям на слово.
    когда: "когда нужен новый замер, проверка или экран состояния"
    без_него: >
      Замер показывает зелёное всегда, включая моменты, когда всё сломано.
    проверяется: "отметка вызова в журнале; замер обязан краснеть на больном случае"
    пишет: "новый замер и доказательство его срабатывания"

  - файл: harness/skills/установка-расширений/SKILL.md
    вид: скил
    имя: "Установка расширений"
    роль: >
      Как добавлять в работу новую крупную возможность: по процедуре, когда
      наступило названное заранее условие, а не по желанию.
    когда: "при первом появлении новой области работы (первый экран, первая внешняя библиотека)"
    без_него: >
      Возможности добавляются как попало, и половина их остаётся недоделанной.
    проверяется: "отметка вызова в журнале; таблица кандидатов"
    пишет: "установленное расширение и запись о нём"

  - файл: harness/skills/mobile-testing/SKILL.md
    вид: скил
    имя: "Проверка мобильного приложения"
    роль: >
      Как проверять правку экрана телефона: собрать, установить, пройти
      сценарий, снять изображение экрана и посмотреть на него глазами.
    когда: "когда правил экран, вёрстку или переходы мобильного приложения"
    без_него: >
      Об экране отчитываются по коду: приложение при этом может не открываться
      вовсе.
    проверяется: "отметка вызова в журнале; снимок экрана в отчёте"
    пишет: "снимки экрана и итог прохода сценариев"

  - файл: harness/skills/mobile-release/SKILL.md
    вид: скил
    имя: "Сборка мобильного релиза"
    роль: >
      Как собрать готовую версию приложения для телефона и довести её до
      границы, за которой нужен живой человек.
    когда: "когда владелец просит собрать версию для тестировщиков или магазина"
    без_него: >
      Сборка делается по памяти и разваливается на подписи или на настройках
      магазина.
    проверяется: "отметка вызова в журнале; ссылка на собранную версию"
    пишет: "собранный файл приложения и запись о сборке"

  - файл: harness/skills/android-env/SKILL.md
    вид: скил
    имя: "Окружение для телефона"
    роль: >
      Как чинить окружение, когда не поднимается подставной телефон или
      сборка падает на настройках машины, а не на коде.
    когда: "когда подставной телефон не запускается или сборка падает на окружении"
    без_него: >
      Часы уходят на перебор настроек вместо работы над самим приложением.
    проверяется: "отметка вызова в журнале; подставной телефон отвечает"
    пишет: "починенное окружение и запись о причине"
