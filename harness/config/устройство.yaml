механизмы:
- файл: harness/demons/backup.sh
  вид: демон
  тема: данные и сервер
  имя: Ночные копии данных
  роль: 'Каждую ночь снимает копию того, что нельзя восстановить переустановкой: базы
    данных, секретных ключей и настроек сервера.

    '
  когда: каждые сутки в 04:00 (расписание cron)
  без_него: 'Потерянную базу или испорченный файл настроек будет неоткуда вернуть, а правило
    «не терять данные» перестанет опираться на свежую копию.

    '
  проверяется: bash harness/demons/backup.sh --selftest; возраст копии видит heartbeat-watch
  пишет: копии в /var/backups/harness, метку свежести и строку в /var/log/harness/backup.log
  повод:
    метки:
    - имя: backup
      молчание_считать_поломкой: 1440
    источник: крон
    расписание: 0 4 * * *
- файл: harness/demons/devmap-selfheal.sh
  вид: демон
  тема: карта работы
  имя: Починка карты разработки
  роль: 'Ищет работу, которая была сделана, но не отмечена в карте задач, и дописывает
    пропущенную отметку сам.

    '
  когда: каждые сутки в 04:15
  без_него: 'Карта задач начнёт врать: работа сделана, а в списке её нет — и владелец
    видит состояние хуже настоящего.

    '
  проверяется: bash harness/demons/devmap-selfheal.sh --selftest
  пишет: правки в dev-map.yaml, водораздел в $LOG_DIR/devmap/audit.cursor
  повод:
    метки:
    - имя: devmap-selfheal
      молчание_считать_поломкой: 1440
    источник: крон
    расписание: 15 4 * * *
- файл: harness/demons/disk-cleanup.sh
  вид: демон
  тема: данные и сервер
  имя: Уборка диска
  роль: 'Убирает старые журналы, временные файлы и образы, пока свободное место не кончилось.

    '
  когда: каждые сутки в 03:00
  без_него: 'Диск заполняется незаметно, и сервер встаёт целиком: не пишутся ни записи
    работы, ни копии данных.

    '
  проверяется: bash harness/demons/disk-cleanup.sh --selftest; df -h /
  пишет: $LOG_DIR/disk-cleanup.log и метку свежести
  повод:
    метки:
    - имя: disk-cleanup
      молчание_считать_поломкой: 1440
    источник: крон
    расписание: 0 3 * * *
- файл: harness/demons/evo-collector.sh
  вид: демон
  тема: память и смены
  имя: Сбор сигналов развития
  роль: 'Собирает следы моей работы в один журнал: где я спотыкался, какие правила срабатывали,
    что приходилось чинить руками.

    '
  когда: каждый час, на пятой минуте
  без_него: 'Разбор «почему это повторяется» придётся делать по памяти, а память между
    сменами не живёт.

    '
  проверяется: bash harness/demons/evo-collector.sh --selftest
  пишет: $LOG_DIR/evolution/*.jsonl
  повод:
    метки:
    - имя: evo-collector
      молчание_считать_поломкой: 60
    источник: крон
    расписание: 5 * * * *
- файл: harness/demons/heartbeat-watch.sh
  вид: демон
  тема: данные и сервер
  имя: Сторож сторожей
  роль: 'Проверяет, что каждый работающий сам по себе помощник отметился вовремя, и называет
    по имени того, кто замолчал.

    '
  когда: каждые сутки в 08:00
  без_него: 'Молчащий помощник выглядит как работающий: копии данных не снимаются неделю,
    и об этом никто не узнает.

    '
  проверяется: bash harness/demons/heartbeat-watch.sh --selftest
  пишет: сообщение владельцу при просрочке, $LOG_DIR/heartbeat-watch.log
  повод:
    метки:
    - имя: heartbeat-watch
      молчание_считать_поломкой: 1440
    источник: крон
    расписание: 0 8 * * *
- файл: harness/demons/memory-revision.sh
  вид: демон
  тема: память и смены
  имя: Ежемесячная ревизия памяти
  роль: 'Раз в месяц перебирает накопленные записи и правила и предлагает убрать то, что
    больше ни разу не срабатывало.

    '
  когда: первого числа каждого месяца в 09:00 и ежедневно, если какой-то постоянный файл
    заполнен на 90 % и выше
  без_него: 'Записи копятся без предела, полезное тонет в устаревшем, и каждая смена начинается
    с чтения лишнего.

    '
  проверяется: bash harness/demons/memory-revision.sh --selftest (4 пути)
  пишет: предложения в $LOG_DIR/предложения.jsonl; просроченные красят ворота
  повод:
    метки:
    - имя: memory-revision
      молчание_считать_поломкой: 44640
    источник: крон
    расписание: 0 9 1 * *; 30 9 * * *
- файл: harness/demons/revizia-proekta.sh
  вид: демон
  тема: карта работы
  имя: Ежемесячная проверка проекта
  роль: 'Раз в месяц читает часть кода пятью взглядами — устройство, безопасность, краткость,
    расход, честность проверок — и кладёт находки карточками в список дел. Кода не правит:
    только предлагает.

    '
  когда: первого числа каждого месяца в 09:00; по кнопке на панели — в ближайшую проверку
    сторожа смены
  без_него: 'Взгляд сверху на проект зовётся только руками и зависит от того, вспомнит
    ли о нём агент; найденное не попадает в список дел и теряется.

    '
  проверяется: bash harness/demons/revizia-proekta.sh --selftest
  пишет: карточки в список дел, разбор в docs/ревизии/<дата>.md, одно сообщение владельцу
  повод:
    метки:
    - имя: revizia-proekta
      молчание_считать_поломкой: 44640
    источник: крон
    расписание: 0 9 1 * *
- файл: harness/demons/pamyat-kommit.sh
  вид: демон
  тема: память и смены
  имя: Сохранение правок памяти
  роль: 'Правку записи, сделанную владельцем в браузере, кладёт в хранилище кода, чтобы
    она пережила переустановку.

    '
  когда: каждые десять минут
  без_него: 'Правка живёт только на одном сервере: переустановка или откат вернут прежний
    текст, и владелец не поймёт, куда делось написанное.

    '
  проверяется: bash harness/demons/pamyat-kommit.sh --selftest
  пишет: отдельные записи в хранилище кода, $LOG_DIR/pamyat-kommit.log
  повод:
    метки:
    - имя: pamyat-kommit
      молчание_считать_поломкой: 10
    источник: крон
    расписание: '*/10 * * * *'
- файл: harness/demons/sentinel.sh
  вид: демон
  тема: данные и сервер
  имя: Подъём после падения
  роль: 'Проверяет, что службы живы и расписание идёт, и поднимает упавшее само — в том
    числе после перезагрузки сервера.

    '
  когда: каждые пять минут (таймер systemd) и один раз после загрузки
  без_него: 'После падения или перезагрузки работа просто не возобновится: канал молчит,
    и владелец узнаёт об этом сам, когда напишет.

    '
  проверяется: bash harness/demons/sentinel.sh --selftest; systemctl status harness-sentinel.timer
  пишет: $LOG_DIR/sentinel.log, метку свежести, сообщение владельцу при подъёме; досылает
    то, что панель не смогла сказать при мёртвом канале
  повод:
    метки:
    - имя: sentinel
      молчание_считать_поломкой: 5
    источник: таймер
    расписание: harness-sentinel.timer
- файл: harness/demons/server-hygiene.sh
  вид: демон
  тема: данные и сервер
  имя: Ежедневный осмотр сервера
  роль: 'Запускает проверку потолков машины по расписанию — это оболочка над самим осмотром,
    чтобы у него было одно место запуска.

    '
  когда: каждые сутки в 03:30
  без_него: 'Осмотр машины не запустится вовсе, и переполненный диск или упавшая служба
    останутся незамеченными.

    '
  проверяется: bash harness/demons/server-hygiene.sh --selftest
  пишет: $LOG_DIR/server-hygiene.log и метку свежести
  повод:
    метки:
    - имя: server-hygiene
      молчание_считать_поломкой: 1440
    источник: крон
    расписание: 30 3 * * *
- файл: harness/demons/server_hygiene_check.py
  вид: демон
  тема: данные и сервер
  имя: 'Осмотр машины: потолки и службы'
  роль: 'Сам осмотр: место на диске, запас памяти, живы ли службы и контейнеры, не просрочены
    ли сертификаты сайта.

    '
  когда: каждые сутки в 03:30, из ежедневного осмотра
  без_него: 'Правила здоровья машины останутся словами в документе: их никто не проверит
    до первой аварии.

    '
  проверяется: python3 harness/demons/server_hygiene_check.py --selftest
  пишет: отчёт в $LOG_DIR/server-hygiene.log, сообщение владельцу при выходе за потолок
  повод:
    источник: вручную
    расписание: вызовом из server-hygiene.sh
    метки: []
- файл: harness/demons/session-warden.sh
  вид: демон
  тема: память и смены
  имя: Надзиратель рабочих окон
  роль: 'Следит за заполнением рабочего окна и за тишиной в работе: вовремя меняет рабочее
    окно на новое и пинает меня, если отчёта нет слишком долго.

    '
  когда: каждые десять минут
  без_него: 'Рабочее окно переполнится и оборвёт работу на середине, потеряв всё незаписанное;
    тишина в канале станет нормой.

    '
  проверяется: bash harness/demons/session-warden.sh --selftest
  пишет: $LOG_DIR/session-warden.log, метки свежести, пинки в рабочее окно,
    снимки экрана $LOG_DIR/snimki/*.txt при нештатном (диалог выхода не поддался,
    агент не поднялся, выпал в оболочку) — последние 200
  повод:
    метки:
    - имя: session-warden
      молчание_считать_поломкой: 10
    - имя: session-warden.запуск
      молчание_считать_поломкой: 10
    источник: крон
    расписание: '*/10 * * * *'
- файл: harness/demons/limit-watch.sh
  вид: демон
  тема: память и смены
  имя: Сторож лимита подписки
  роль: 'Раз в минуту смотрит, не упёрлась ли работа в лимит подписки, и говорит владельцу
    сразу — как о начале простоя, так и о его конце. Делает ровно одно: остальные ветки
    присмотра остаются у надзирателя рабочих окон.

    '
  когда: каждую минуту
  без_него: 'Владелец узнаёт об остановке на ближайшем десятиминутном обходе — до тринадцати
    минут молчания, а о возобновлении работы может не узнать вовсе. 13.09.2026 смена простояла
    3,5 часа, и всё это время ему сообщали, что она «работает, но не отчитывается».

    '
  проверяется: bash scripts/test_limit_watch.sh
  пишет: $LOG_DIR/limit-watch.log, метка лимит-подписки.состояние (общая с надзирателем)
  повод:
    метки:
    - имя: limit-watch
      молчание_считать_поломкой: 5
    источник: крон
    расписание: '* * * * *'
- файл: scripts/limit-v-zhurnale.py
  вид: гейт
  тема: память и смены
  имя: Отказ 429 в журнале сессии
  роль: 'Отвечает на один вопрос: сколько минут назад работа упёрлась в лимит. Единственный
    источник этого факта для обоих сторожей.

    '
  когда: при вызове
  без_него: 'Каждый сторож искал бы отказ сам, и две копии признака разошлись бы молча
    — а разошедшаяся половина молчит ровно тогда, когда нужна.

    '
  проверяется: python3 scripts/limit-v-zhurnale.py --selftest
  пишет: 'ничего: только печатает минуты'
- файл: scripts/test_limit_watch.sh
  вид: гейт
  тема: память и смены
  имя: Проба сторожа лимита
  роль: 'Проверяет сторожа лимита на подставном стенде: свой журнал, свой канал, свой
    транскрипт с отказом 429. Больной случай первым — свежий отказ при молчащей смене
    обязан дать сообщение с первого же обхода.

    '
  когда: в воротах
  без_него: 'Сторож лимита проверялся бы боевой остановкой работы, то есть уже случившимся
    простоем владельца.

    '
  проверяется: bash scripts/test_limit_watch.sh
  пишет: 'ничего: работает во временном каталоге'
- файл: harness/demons/task-closer.sh
  вид: демон
  тема: карта работы
  имя: Закрытие брошенных задач
  роль: 'Находит задачи, которые висят «в работе» неделями без движения, и возвращает
    им честное состояние.

    '
  когда: каждый час
  без_него: 'Список дел перестаёт отражать правду: половина строк «в работе», и по нему
    нельзя понять, чем я занят сейчас.

    '
  проверяется: bash harness/demons/task-closer.sh --selftest
  пишет: правки в dev-map.yaml, $LOG_DIR/task-closer.log
  повод:
    метки:
    - имя: task-closer
      молчание_считать_поломкой: 60
    источник: крон
    расписание: 0 * * * *
- файл: harness/demons/tokens-collector.sh
  вид: демон
  тема: память и смены
  имя: Учёт расхода
  роль: 'Считает, сколько работы израсходовано за сутки, по записям самой оболочки — чтобы
    расход был виден заранее, а не по счёту в конце месяца.

    '
  когда: каждый час, на десятой минуте
  без_него: 'Расход виден только постфактум: упереться в предел можно посреди выката,
    и работа встанет в худший момент.

    '
  проверяется: bash harness/demons/tokens-collector.sh --selftest
  пишет: $LOG_DIR/tokens-YYYY-MM.jsonl (события), tokens-daily.summary (строка
    осмотра), tokens-daily.report (отчёт человеку), tokens-daily.json (те же
    числа машине — из него панель берёт карточку расхода)
  повод:
    метки:
    - имя: tokens-collector
      молчание_считать_поломкой: 60
    источник: крон
    расписание: 10 * * * *
- файл: harness/panel/nastrojki.py
  вид: гейт
  тема: связь с владельцем
  имя: 'Настройки панели: один разбор на всех'
  роль: 'Единственное место, где панель читает файлы настроек сервера и решает, куда писать.
    Раньше таких мест было три, и каждое читало по-своему: копия расходится с оригиналом
    молча, и панель показывает одно, а служба делает другое. Отдельно умеет сказать «панель
    не знает» — тогда ручка на экране серая, с причиной, а не врёт умолчанием.

    '
  когда: при каждом обращении панели к настройкам
  без_него: 'Настройки читаются по-разному в разных углах панели, и расхождение находится
    только глазами владельца.

    '
  проверяется: python3 harness/panel/test_nastrojki.py (12 путей)
  пишет: ничего не пишет — только читает
- файл: harness/panel/test_nastrojki.py
  вид: гейт
  тема: связь с владельцем
  имя: Проверка настроек панели
  роль: 'Требует, чтобы пути к файлам читались в момент обращения, а не при запуске: иначе
    проверка, выставившая свои пути, судила бы боевые файлы. Отдельно — что «панель не
    знает» отличается от «ключа нет» и от «значение пустое».

    '
  когда: на воротах и после правки настроек панели
  без_него: 'Проверки панели молча ушли бы работать с боевыми файлами сервера.

    '
  проверяется: python3 harness/panel/test_nastrojki.py (12 путей)
  пишет: число прошедших и упавших путей
- файл: harness/panel/server.py
  вид: демон
  тема: связь с владельцем
  имя: Панель управления
  роль: 'Веб-страница, на которой владелец сам переключает то, что раньше менялось только
    через меня, и видит состояние работы без единой команды.

    '
  когда: работает постоянно, слушает только саму машину; наружу выводит nginx
  без_него: 'Любое изменение поведения приходится просить у меня словами, а состояние
    видно только с моих слов.

    '
  проверяется: python3 harness/panel/test_server.py; systemctl status harness-panel
  пишет: журнал действий в $LOG_DIR/панель.jsonl, настройки — через единственного писателя
  повод:
    источник: служба
    расписание: harness-panel.service
    метки: []
- файл: harness/demons/obnovlenie-watch.sh
  вид: демон
  тема: выкат и версии
  имя: Проверка новых версий харнеса
  роль: 'Раз в сутки спрашивает хранилище, вышла ли новая версия самой обвязки, и поступает
    так, как выбрано на экране: сказать, спросить или поставить.

    '
  когда: каждые сутки в 04:45
  без_него: 'Установка живёт тем, что скопировали при первой настройке: починенное в одном
    месте до других машин не доходит вовсе.

    '
  проверяется: bash harness/demons/obnovlenie-watch.sh --selftest (5 путей)
  пишет: $LOG_DIR/obnovlenie-watch.log, метку свежести, сообщение владельцу при новой
    версии
  повод:
    метки:
    - имя: obnovlenie-watch
      молчание_считать_поломкой: 1440
    источник: крон
    расписание: 45 4 * * *
- файл: scripts/obnovlenie.py
  вид: демон
  тема: выкат и версии
  имя: Установщик новой версии
  роль: 'Ставит новую версию: снимает копию, переводит набор файлов вперёд, раскладывает,
    проверяет себя и возвращает всё назад, если проверка не прошла.

    '
  когда: по решению суточной проверки или по слову владельца
  без_него: 'Обновление пришлось бы ставить руками, а неудачное — разбирать по частям
    без возврата к прежнему состоянию.

    '
  проверяется: python3 scripts/test_obnovlenie.py (27 путей, среди них откат)
