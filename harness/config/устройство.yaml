# Реестр устройства: из чего состоит харнес и что делает каждая часть.
#
# Владелец 11.09.2026: «Нужно прописать как работает всё в харнесе, отдельно
# детально что делает каждый демон хук и тд».
#
# Это ДАННЫЕ и ОДИН источник на два носителя: документ
# docs/УСТРОЙСТВО-ХАРНЕСА.md (собирается scripts/sobrat-ustrojstvo.py) и
# пояснения на экране панели. Второй носитель, который правят руками, через
# месяц расходится с первым.
#
# Поля:
#   файл         — путь от корня проекта; он же ключ записи
#   вид          — демон | хук | гейт | скил
#   имя          — подпись на экране
#   роль         — что делает, одной фразой ДЛЯ ЧЕЛОВЕКА БЕЗ ПОДГОТОВКИ:
#                  термин допускается только с расшифровкой в той же фразе
#   когда        — в какой момент срабатывает
#   без_него     — что случится, если его выключить
#   проверяется  — команда, которой доказывается, что он жив
#   пишет        — след, который он оставляет
#
# Гейт scripts/check-ustrojstvo.py сверяет реестр с репозиторием в обе стороны:
# механизм без описания — красный, описание без механизма — тоже.

механизмы:

  # ─── демоны: работают по расписанию, без моего участия ───────────────────
  - файл: harness/demons/backup.sh
    вид: демон
    имя: "Ночные копии данных"
    роль: >
      Каждую ночь снимает копию того, что нельзя восстановить переустановкой:
      базы данных, секретных ключей и настроек сервера.
    когда: "каждые сутки в 04:00 (расписание cron)"
    без_него: >
      Потерянную базу или испорченный файл настроек будет неоткуда вернуть, а
      правило «не терять данные» перестанет опираться на свежую копию.
    проверяется: "bash harness/demons/backup.sh --selftest; возраст копии видит heartbeat-watch"
    пишет: "копии в /var/backups/harness, метку свежести и строку в /var/log/harness/backup.log"

  - файл: harness/demons/devmap-selfheal.sh
    вид: демон
    имя: "Починка карты разработки"
    роль: >
      Ищет работу, которая была сделана, но не отмечена в карте задач, и
      дописывает пропущенную отметку сам.
    когда: "каждые сутки в 04:15"
    без_него: >
      Карта задач начнёт врать: работа сделана, а в списке её нет — и владелец
      видит состояние хуже настоящего.
    проверяется: "bash harness/demons/devmap-selfheal.sh --selftest"
    пишет: "правки в dev-map.yaml, водораздел в $LOG_DIR/devmap/audit.cursor"

  - файл: harness/demons/disk-cleanup.sh
    вид: демон
    имя: "Уборка диска"
    роль: >
      Убирает старые журналы, временные файлы и образы, пока свободное место не
      кончилось.
    когда: "каждые сутки в 03:00"
    без_него: >
      Диск заполняется незаметно, и сервер встаёт целиком: не пишутся ни записи
      работы, ни копии данных.
    проверяется: "bash harness/demons/disk-cleanup.sh --selftest; df -h /"
    пишет: "$LOG_DIR/disk-cleanup.log и метку свежести"

  - файл: harness/demons/evo-collector.sh
    вид: демон
    имя: "Сбор сигналов развития"
    роль: >
      Собирает следы моей работы в один журнал: где я спотыкался, какие правила
      срабатывали, что приходилось чинить руками.
    когда: "каждый час, на пятой минуте"
    без_него: >
      Разбор «почему это повторяется» придётся делать по памяти, а память между
      сменами не живёт.
    проверяется: "bash harness/demons/evo-collector.sh --selftest"
    пишет: "$LOG_DIR/evolution/*.jsonl"

  - файл: harness/demons/heartbeat-watch.sh
    вид: демон
    имя: "Сторож сторожей"
    роль: >
      Проверяет, что каждый работающий сам по себе помощник отметился вовремя, и
      называет по имени того, кто замолчал.
    когда: "каждые сутки в 08:00"
    без_него: >
      Молчащий помощник выглядит как работающий: копии данных не снимаются
      неделю, и об этом никто не узнает.
    проверяется: "bash harness/demons/heartbeat-watch.sh --selftest"
    пишет: "сообщение владельцу при просрочке, $LOG_DIR/heartbeat-watch.log"

  - файл: harness/demons/memory-revision.sh
    вид: демон
    имя: "Ежемесячная ревизия памяти"
    роль: >
      Раз в месяц перебирает накопленные записи и правила и предлагает убрать
      то, что больше ни разу не срабатывало.
    когда: "первого числа каждого месяца в 09:00 и ежедневно, если какой-то постоянный файл заполнен на 90 % и выше"
    без_него: >
      Записи копятся без предела, полезное тонет в устаревшем, и каждая смена
      начинается с чтения лишнего.
    проверяется: "bash harness/demons/memory-revision.sh --selftest (4 пути)"
    пишет: "предложения в $LOG_DIR/предложения.jsonl; просроченные красят ворота"

  - файл: harness/demons/revizia-proekta.sh
    вид: демон
    имя: "Ежемесячная проверка проекта"
    роль: >
      Раз в месяц читает часть кода пятью взглядами — устройство, безопасность,
      краткость, расход, честность проверок — и кладёт находки карточками в
      список дел. Кода не правит: только предлагает.
    когда: "первого числа каждого месяца в 09:00; по кнопке на панели — в ближайшую проверку сторожа смены"
    без_него: >
      Взгляд сверху на проект зовётся только руками и зависит от того, вспомнит
      ли о нём агент; найденное не попадает в список дел и теряется.
    проверяется: "bash harness/demons/revizia-proekta.sh --selftest"
    пишет: "карточки в список дел, разбор в docs/ревизии/<дата>.md, одно сообщение владельцу"

  - файл: harness/demons/pamyat-kommit.sh
    вид: демон
    имя: "Сохранение правок памяти"
    роль: >
      Правку записи, сделанную владельцем в браузере, кладёт в хранилище кода,
      чтобы она пережила переустановку.
    когда: "каждые десять минут"
    без_него: >
      Правка живёт только на одном сервере: переустановка или откат вернут
      прежний текст, и владелец не поймёт, куда делось написанное.
    проверяется: "bash harness/demons/pamyat-kommit.sh --selftest"
    пишет: "отдельные записи в хранилище кода, $LOG_DIR/pamyat-kommit.log"

  - файл: harness/demons/sentinel.sh
    вид: демон
    имя: "Подъём после падения"
    роль: >
      Проверяет, что службы живы и расписание идёт, и поднимает упавшее само —
      в том числе после перезагрузки сервера.
    когда: "каждые пять минут (таймер systemd) и один раз после загрузки"
    без_него: >
      После падения или перезагрузки работа просто не возобновится: канал молчит,
      и владелец узнаёт об этом сам, когда напишет.
    проверяется: "bash harness/demons/sentinel.sh --selftest; systemctl status harness-sentinel.timer"
    пишет: "$LOG_DIR/sentinel.log, метку свежести, сообщение владельцу при подъёме; досылает то, что панель не смогла сказать при мёртвом канале"

  - файл: harness/demons/server-hygiene.sh
    вид: демон
    имя: "Ежедневный осмотр сервера"
    роль: >
      Запускает проверку потолков машины по расписанию — это оболочка над самим
      осмотром, чтобы у него было одно место запуска.
    когда: "каждые сутки в 03:30"
    без_него: >
      Осмотр машины не запустится вовсе, и переполненный диск или упавшая
      служба останутся незамеченными.
    проверяется: "bash harness/demons/server-hygiene.sh --selftest"
    пишет: "$LOG_DIR/server-hygiene.log и метку свежести"

  - файл: harness/demons/server_hygiene_check.py
    вид: демон
    имя: "Осмотр машины: потолки и службы"
    роль: >
      Сам осмотр: место на диске, запас памяти, живы ли службы и контейнеры,
      не просрочены ли сертификаты сайта.
    когда: "каждые сутки в 03:30, из ежедневного осмотра"
    без_него: >
      Правила здоровья машины останутся словами в документе: их никто не
      проверит до первой аварии.
    проверяется: "python3 harness/demons/server_hygiene_check.py --selftest"
    пишет: "отчёт в $LOG_DIR/server-hygiene.log, сообщение владельцу при выходе за потолок"

  - файл: harness/demons/session-warden.sh
    вид: демон
    имя: "Надзиратель рабочих окон"
    роль: >
      Следит за заполнением рабочего окна и за тишиной в работе: вовремя меняет
      рабочее окно на новое и пинает меня, если отчёта нет слишком долго.
    когда: "каждые десять минут"
    без_него: >
      Рабочее окно переполнится и оборвёт работу на середине, потеряв всё
      незаписанное; тишина в канале станет нормой.
    проверяется: "bash harness/demons/session-warden.sh --selftest"
    пишет: "$LOG_DIR/session-warden.log, метки свежести, пинки в рабочее окно"

  - файл: harness/demons/task-closer.sh
    вид: демон
    имя: "Закрытие брошенных задач"
    роль: >
      Находит задачи, которые висят «в работе» неделями без движения, и
      возвращает им честное состояние.
    когда: "каждый час"
    без_него: >
      Список дел перестаёт отражать правду: половина строк «в работе», и по
      нему нельзя понять, чем я занят сейчас.
    проверяется: "bash harness/demons/task-closer.sh --selftest"
    пишет: "правки в dev-map.yaml, $LOG_DIR/task-closer.log"

  - файл: harness/demons/tokens-collector.sh
    вид: демон
    имя: "Учёт расхода"
    роль: >
      Считает, сколько работы израсходовано за сутки, по записям самой оболочки —
      чтобы расход был виден заранее, а не по счёту в конце месяца.
    когда: "каждый час, на десятой минуте"
    без_него: >
      Расход виден только постфактум: упереться в предел можно посреди выката,
      и работа встанет в худший момент.
    проверяется: "bash harness/demons/tokens-collector.sh --selftest"
    пишет: "$LOG_DIR/tokens/*.json, строку расхода в осмотре смены"

  - файл: harness/panel/server.py
    вид: демон
    имя: "Панель управления"
    роль: >
      Веб-страница, на которой владелец сам переключает то, что раньше менялось
      только через меня, и видит состояние работы без единой команды.
    когда: "работает постоянно, слушает только саму машину; наружу выводит nginx"
    без_него: >
      Любое изменение поведения приходится просить у меня словами, а состояние
      видно только с моих слов.
    проверяется: "python3 harness/panel/test_server.py; systemctl status harness-panel"
    пишет: "журнал действий в $LOG_DIR/панель.jsonl, настройки — через единственного писателя"

  - файл: harness/demons/obnovlenie-watch.sh
    вид: демон
    имя: "Проверка новых версий харнеса"
    роль: >
      Раз в сутки спрашивает хранилище, вышла ли новая версия самой обвязки, и
      поступает так, как выбрано на экране: сказать, спросить или поставить.
    когда: "каждые сутки в 04:45"
    без_него: >
      Установка живёт тем, что скопировали при первой настройке: починенное в
      одном месте до других машин не доходит вовсе.
    проверяется: "bash harness/demons/obnovlenie-watch.sh --selftest (5 путей)"
    пишет: "$LOG_DIR/obnovlenie-watch.log, метку свежести, сообщение владельцу при новой версии"

  - файл: scripts/obnovlenie.py
    вид: демон
    имя: "Установщик новой версии"
    роль: >
      Ставит новую версию: снимает копию, переводит набор файлов вперёд,
      раскладывает, проверяет себя и возвращает всё назад, если проверка не прошла.
    когда: "по решению суточной проверки или по слову владельца"
    без_него: >
      Обновление пришлось бы ставить руками, а неудачное — разбирать по частям
      без возврата к прежнему состоянию.
    проверяется: "python3 scripts/test_obnovlenie.py (27 путей, среди них откат)"
    пишет: "копию в /var/backups/harness, версию в /var/lib/harness, сообщение владельцу"

  - файл: scripts/arhiv-karty.py
    вид: гейт
    имя: "Архив карты"
    роль: >
      Убирает из карты разработки задачи, которые уже закрыты, складывая их в
      архив: карта едет в каждую сессию и обязана нести живую работу, а не
      историю.
    когда: "когда карта подходит к потолку; вручную или из уборки"
    без_него: >
      Карта росла бы без предела: замер 11.09.2026 — 77 % её объёма занимали
      уже закрытые задачи, а чистило её только внимание модели.
    проверяется: "python3 scripts/arhiv-karty.py --selftest"
    пишет: "dev-map.yaml и docs/dev-map-archive.yaml — только вместе (И-1)"

  - файл: scripts/proverka-zamka-agenta.py
    вид: гейт
    имя: "Замок ночного агента"
    роль: >
      Следит, чтобы у фонового агента, который работает ночью без присмотра,
      действительно не было доступа к командам сервера.
    когда: "в воротах"
    без_него: >
      Замок был бы бутафорским: полтора месяца ночной агент чинки карты имел
      полный доступ к серверу, хотя в коде было написано обратное.
    проверяется: "python3 scripts/proverka-zamka-agenta.py --selftest (5 путей); живьём — --проба"
    пишет: "ничего — только судит"

  - файл: harness/demons/stroitel-proverok.sh
    вид: демон
    имя: "Строитель проверок"
    роль: >
      Берёт задачи, которые машине доказать нечем, и пишет для них способ
      проверки: команду и то, что обязано быть в её выводе. Нечем — говорит
      об этом прямо, вместо выдуманной проверки.
    когда: "cron 05:45, после проверщика; порция задач за прогон"
    без_него: >
      Список «доказать нечем» не уменьшался бы никогда, и владельцу осталась
      бы вся приёмка целиком.
    проверяется: "bash harness/demons/stroitel-proverok.sh --selftest (4 пути, первым больной)"
    пишет: "поле проверки в карточки dev-map.yaml — и больше ничего"

  - файл: harness/demons/priyomka-watch.sh
    вид: демон
    имя: "Проверщик задач"
    роль: >
      Раз в сутки прогоняет проверки всех задач, ждущих приёмки: доказанное
      закрывает сам, о недоказанном пишет отчёт и шлёт владельцу числа.
      Ничего не чинит и кода не пишет.
    когда: "cron 04:45"
    без_него: >
      Список «проверь меня» рос бы бесконечно, и владельцу приходилось бы
      щупать руками даже то, что машина доказывает за секунду.
    проверяется: "bash harness/demons/priyomka-watch.sh --selftest (4 пути, первым больной)"
    пишет: "статусы задач в карте, отчёт в docs/приёмка/, сообщение владельцу"

  - файл: scripts/test_publichnaya_sborka.py
    вид: гейт
    имя: "Проверка данных публичной сборки"
    роль: >
      Судит файл данных сборки: объявлены ли все разделы, известен ли паспорту
      каждый обезличиваемый ключ, существует ли в пакете каждый файл из списка
      обязательных (с учётом того, что часть каталогов сборка переносит).
    когда: "в воротах"
    без_него: >
      Сборщик верит данным без разбора: путь, которого нет, — отказ на каждой
      публикации, а ключ, которого нет в паспорте, — молчаливая пустая замена.
    проверяется: "python3 scripts/test_publichnaya_sborka.py (25 путей)"
    пишет: "список находок в вывод ворот"

  - файл: scripts/unit-paneli.sh
    вид: гейт
    имя: "Сборщик юнита панели"
    роль: >
      Собирает системный юнит панели из шаблона, подставляя путь установки из
      паспорта; самотест требует ПРИЧИНУ отказа словом, а не код возврата.
    когда: "при установке и правке юнита панели; самотест — в воротах"
    без_него: >
      Юнит с пустым путём systemd принимает молча и падает на старте, а панель
      владельца не поднимается.
    проверяется: "bash scripts/unit-paneli.sh --selftest (5 путей, три больных)"
    пишет: "файл юнита панели"

  - файл: scripts/check-prava-paneli.py
    вид: гейт
    имя: "Панель читает то, что показывает"
    роль: >
      Собирает витрину панели ОТ ИМЕНИ её службы и требует, чтобы ни один
      раздел не упирался в запрет доступа. Проверяет не список файлов, а живой
      путь: завтрашний файл он поймает так же.
    когда: "в воротах"
    без_него: >
      Владелец видит в панели «нет данных» при живом и свежем файле, а причина
      молчит: у службы свой пользователь, а файл создан для агента.
    проверяется: "python3 scripts/check-prava-paneli.py --selftest (3 пути, среди них ложное срабатывание); живой больной случай — права 600 на отчёте расхода"
    пишет: "список разделов с отказом прав в вывод ворот"

  - файл: scripts/check-komandy-v-dokumentah.py
    вид: гейт
    имя: "Команда из документа ведёт к существующему файлу"
    роль: >
      Проверяет действующие документы — правила, инструкцию владельцу, задание
      агенту, навыки: каждая напечатанная команда должна звать файл, который
      есть. Архив передач и старые спеки не судятся: там команды своего времени.
    когда: "в воротах"
    без_него: >
      После переименования файла человек на чистой машине набирает команду,
      которой больше нет, и упирается в «нет такого файла» без объяснения.
    проверяется: "python3 scripts/check-komandy-v-dokumentah.py --selftest (3 пути, среди них ложное срабатывание на архиве); живой прогон установки в чистом контейнере нашёл 7 таких команд"
    пишет: "список находок в вывод ворот"

  - файл: scripts/sprosit-model.py
    вид: гейт
    имя: "Вопрос к модели из кода"
    роль: >
      Единственный способ спросить у модели то, чего код не может узнать сам.
      Ответ приходит ДАННЫМИ по заранее названной схеме, а не рассуждением;
      поля вроде «решение» или «рекомендация» схема запрещает — решение
      принимает вызвавший код. Каждый вызов идёт в журнал с ценой и временем,
      на каждый повод есть суточный потолок.
    когда: "когда демону, хуку или скрипту нужна оценка текста или данных"
    без_него: >
      Каждый зовёт модель по-своему: ответ разбирается на глаз, прозу вместо
      данных никто не замечает, а сколько это стоило — не видно нигде.
    проверяется: "python3 scripts/sprosit-model.py --selftest (9 путей, среди них запрет спрашивать выводы); живой вызов 12.09.2026: данные по схеме за 7 с, 1 ход, 0,03 $"
    пишет: "журнал вызовов $LOG_DIR/модель-вызовы.jsonl"

  - файл: scripts/check-rasshirenija.py
    вид: гейт
    имя: "Сторож живого способа ставить расширения"
    роль: >
      Не даёт вернуть способ, которым может воспользоваться только человек у
      терминала: в правилах и описаниях не должно быть команд вида «/plugin …»,
      а список расширений обязан быть целым — набор непуст, у каждого кандидата
      названо наблюдаемое условие, у каждого запрета причина.
    когда: "в воротах и перед записью работы"
    без_него: >
      Способ, которым пользуется только человек, выглядит рабочим и молчит
      месяцами: за прошлый месяц не поставилось ни одного расширения.
    проверяется: "python3 scripts/check-rasshirenija.py --selftest (4 пути, среди них ложное срабатывание на объяснении)"
    пишет: "список находок в вывод ворот"

  - файл: scripts/sobrat-claude-md.py
    вид: гейт
    имя: "Сборщик правил для нового проекта"
    роль: >
      Собирает файл правил, который получает каждый, кто ставит систему себе:
      неизменные принципы из заготовки плюс живые данные — чем держится каждое
      нерушимое правило и сколько в системе работающих частей. Он же проверяет,
      что файл не расходится с данными.
    когда: "в воротах; и после правки заготовки или данных"
    без_него: >
      Файл правил, который читается в начале каждой смены, устаревает молча:
      называет сторожей, которых уже нет.
    проверяется: "python3 scripts/sobrat-claude-md.py --проверить (красный на правке руками — проверено)"
    пишет: "harness/CLAUDE.md"

  - файл: scripts/rasshirenija.py
    вид: гейт
    имя: "Установщик расширений"
    роль: >
      Единственная точка установки и снятия плагинов и MCP. Список — данные
      (harness/config/расширения.yaml): базовый набор, кандидаты по условию,
      вердикты «не ставить». Команда «свести» доводит факт до данных.
    когда: "шаг 8 установки машины; демон раз в сутки; вручную по наступившему условию"
    без_него: >
      Список расширений жил текстом скила со слэш-формами, которые вводит
      человек в терминале — а владелец терминала не видит. Замер 12.09.2026:
      установлено 0, следов установки за месяц 0.
    проверяется: "python3 scripts/rasshirenija.py --selftest (9 проб, из них больной случай снятия несуществующего)"
    пишет: "плагины в ~/.claude/plugins"

  - файл: harness/demons/rasshirenija-watch.sh
    вид: демон
    имя: "Сторож набора расширений"
    роль: >
      Раз в сутки сводит установленное с данными: ставит недостающее из
      базового набора, снимает запрещённое вердиктом. В канал пишет только
      при изменении.
    когда: "cron 05:35"
    без_него: >
      Владелец 12.09.2026 велел, чтобы установку и снятие расширений делал код
      по расписанию, а не человек руками. Без этого набор держался бы на памяти
      сессии, то есть ни на чём.
    проверяется: "bash harness/demons/rasshirenija-watch.sh --selftest (механизм зелёный, отказ без claude назван словом)"
    пишет: "метку присмотра rasshirenija-watch, доклад в канал при изменении"

  - файл: harness/demons/ton-watch.sh
    вид: демон
    имя: "Писатель тона"
    роль: >
      Раз в сутки смотрит, появились ли новые слова владельца, и если да —
      поручает отдельному агенту переписать документ «как с ним говорить»
      по замеру его живой речи. Первые десять раз ежедневно, дальше раз в месяц.
    когда: "cron 05:15; прогон без новых сообщений не считается"
    без_него: >
      Тон общения остался бы набором чисел в коде, а он обязан идти за речью
      владельца и меняться вместе с ней.
    проверяется: "bash harness/demons/ton-watch.sh --selftest (8 путей, первым больной)"
    пишет: "память/ТОН.md, состояние прогонов и метку присмотра"

  - файл: scripts/zamer-tona.py
    вид: гейт
    имя: "Замер речи владельца"
    роль: >
      Превращает архив канала в горсть чисел и образцов: какой длины его
      сообщения, какими словами он говорит, о чём спрашивает.
    когда: "перед каждым прогоном писателя тона"
    без_него: >
      Агенту тона пришлось бы читать весь архив — дорого, и в документ попали
      бы выдумки вместо замера.
    проверяется: "python3 scripts/zamer-tona.py --selftest (5 путей, первым больной)"
    пишет: "ничего — только печатает замер"

  - файл: scripts/priyomka.py
    вид: гейт
    имя: "Приёмка задач"
    роль: >
      Судит, что из сделанного доказано машиной, а что остаётся владельцу:
      прогоняет команду проверки, записанную в карточке задачи, и сверяет её
      вывод с ожидаемым. Ничего не чинит и кода не пишет — только проверяет.
    когда: "по таймеру и вручную, сухим прогоном или с записью исходов"
    без_него: >
      Список «проверь меня» рос бы бесконечно: 89 задач ждут владельца, а
      проверена им одна — статус перестал что-либо значить.
    проверяется: "python3 scripts/priyomka.py --selftest (5 путей, первым больной)"
    пишет: "исходы проверки в карточки задач и отчёт приёмки"

  - файл: scripts/zadachi-iz-kanala.py
    вид: гейт
    имя: "Задачи из канала"
    роль: >
      Следит, чтобы работа, которую владелец назвал в сообщении, дошла до карты
      разработки: у каждого такого сообщения обязан быть исход — карточка
      задачи со ссылкой на сообщение либо честная пометка «работы здесь нет».
    когда: "в воротах и перед каждым коммитом"
    без_него: >
      Задача, сказанная посреди другой работы, жила бы только в памяти сессии
      и терялась вместе с ней — владельцу приходилось бы повторять.
    проверяется: "python3 scripts/zadachi-iz-kanala.py --selftest (5 путей, первым больной) в воротах"
    пишет: "память/.задачи-разобрано и метку разбора в журнале"

  - файл: scripts/versiya.py
    вид: гейт
    имя: "Номер версии релиза"
    роль: >
      Считает, каким номером выйдет следующая публичная версия харнеса, и
      пишет к ней журнал изменений. Номер по мировому правилу
      «мажор-минор-патч»: появился новый механизм — минор, только починки —
      патч, а мажор (он означает «сломается у тех, кто уже поставил») ставится
      лишь по слову владельца. Заметки к версии берутся из заголовков
      сохранённых изменений (коммитов), а не пишутся руками.
    когда: "внутри публикации, перед коммитом сборки"
    без_него: >
      У человека на публичном гите нет ни номера версии, ни списка изменений:
      он не знает, стоит ли обновляться и на что откатиться.
    проверяется: "python3 scripts/versiya.py --selftest (14 путей)"
    пишет: "VERSION и CHANGELOG.md в дереве публичной сборки"

  - файл: scripts/test_versiya.py
    вид: гейт
    имя: "Проверка счёта версии"
    роль: >
      Прогоняет счёт версии на подставных хранилищах кода (репозиториях):
      первый релиз, новый
      механизм, обычная правка, переименование каталога, ручная подделка файла
      версии. Отдельный путь — про то, что срезанные заметки названы числом,
      а не выброшены молча.
    когда: "на воротах и после любой правки счёта версии"
    без_него: >
      Номер версии мог бы молча поехать: переименование каталога выглядело бы
      новой возможностью, а подделанный файл версии сбивал бы счёт.
    проверяется: "python3 scripts/test_versiya.py (14 путей)"
    пишет: "число прошедших и упавших путей"

  - файл: scripts/publikaciya.sh
    вид: гейт
    имя: "Замки публикации"
    роль: >
      Выкладывает харнес туда, откуда его берут другие люди, и держит на этом
      пути шесть замков: ворота зелёные, согласие владельца именно на
      публикацию, каждая уезжающая задача им проверена, дерево собрано из
      учтённого состояния пакета, в нём нет ключей и паролей, нет следов этой
      установки. Наружу уходит собранное дерево, а не наш рабочий каталог.
    когда: "по слову владельца о публикации"
    без_него: >
      В общий доступ уехало бы непроверенное, выданное за проверенное, —
      и люди обновлялись бы из него.
    проверяется: "bash scripts/publikaciya.sh --selftest (14 путей, восемь больных) в воротах"
    пишет: "дерево сборки в PUBLIC_BUILD_DIR и публичную ветку удалённого PUBLIC_REMOTE"

  - файл: scripts/sobrat-publichnoe.py
    вид: гейт
    имя: "Сборка публичного харнеса"
    роль: >
      Собирает из учтённого состояния пакета отдельное дерево для общего
      доступа — туда, откуда харнес скачивают другие люди: снимает по списку
      данных то, что наружу не идёт, подменяет
      замер речи владельца заготовкой, а путь установки и имя проекта в
      документах заменяет именем настройки. Каталог сборки узнаёт по своей
      метке и чужое дерево не трогает.
    когда: "внутри публикации (publikaciya.sh); самотест — в воротах"
    без_него: >
      Наружу уезжала бы наша мастерская целиком — путь установки, имя продукта,
      разбор речи владельца — вместо инструмента.
    проверяется: "python3 scripts/sobrat-publichnoe.py --selftest (16 путей, первым — больной случай) в воротах"
    пишет: "дерево в каталоге PUBLIC_BUILD_DIR, строку чисел о сборке"

  - файл: scripts/check-publichnoe-chisto.py
    вид: гейт
    имя: "Чистота публичной сборки"
    роль: >
      Перед отправкой наружу ищет в собранном дереве и в его истории следы этой
      установки: путь и имя проекта, номер чата владельца, имя продукта,
      домашний каталог агента, адреса хранилищ, почты авторов, имя сервера.
      Образцы берёт из паспорта установки, а не из списка сборщика — иначе
      сборщик проверял бы сам себя.
    когда: "внутри публикации; самотест — в воротах"
    без_него: >
      След, которого нет в списке сборщика, уезжал бы наружу молча — а именно
      так туда уже попал номер чата владельца.
    проверяется: "python3 scripts/check-publichnoe-chisto.py --selftest (10 путей, семь больных)"
    пишет: "строки находок с именем образца, без самого значения"

  - файл: scripts/check-quotepath.py
    вид: гейт
    имя: "Git не слепнет на русских именах"
    роль: >
      Следит, чтобы каждый запуск git, из вывода которого код читает пути,
      просил у него читаемые имена. Без этой просьбы git отдаёт русское имя
      файла набором чисел, и всё, что судит по именам, перестаёт находить
      нужное — молча.
    когда: "в воротах, на каждом прогоне"
    без_него: >
      Замер «файлов с русскими именами ноль» выглядел бы правдой при том, что
      владелец видит их своими глазами — так и случилось 12.09.2026.
    проверяется: "python3 scripts/check-quotepath.py --selftest (8 путей, из них три больных)"
    пишет: "строки находок: файл, строка, причина"

  # ─── хуки: срабатывают внутри моей работы ────────────────────────────────
  - файл: scripts/hooks/guard_bash.py
    вид: хук
    имя: "Сторож команд"
    роль: >
      Перехватывает каждую команду до её запуска и отменяет опасную: снос базы,
      подмену файлов в работающей программе, запуск проверок внутри рабочего окна.
    когда: "перед КАЖДЫМ запуском команды в оболочке"
    без_него: >
      Одна неверная команда сносит рабочие данные или подменяет работающую
      программу мимо всех проверок — а именно это запрещено владельцем навсегда.
    проверяется: "python3 scripts/hooks/test_guard_bash.py (221 пара «красный/зелёный»)"
    пишет: "отказ с причиной в ответ оболочке, $LOG_DIR/guard.log"

  - файл: scripts/hooks/session_state.sh
    вид: хук
    имя: "Осмотр при начале смены"
    роль: >
      В начале каждой рабочей смены показывает одним экраном: входящие
      сообщения, текущую задачу, расход, живы ли помощники.
    когда: "при старте, очистке и восстановлении рабочего окна"
    без_него: >
      Новая смена начинается вслепую: непрочитанное сообщение владельца можно
      не заметить часами.
    проверяется: "bash scripts/hooks/session_state.sh"
    пишет: "экран осмотра в начало рабочего окна"

  - файл: scripts/hooks/stop_reminder.sh
    вид: хук
    имя: "Напоминание в конце хода"
    роль: >
      Когда я заканчиваю ход, проверяет: анонс без продолжения, устаревшая
      передача смены, непрочитанные сообщения — и возвращает меня к работе.
    когда: "в момент завершения каждого моего хода"
    без_него: >
      Фраза «сейчас посмотрю» станет концом работы: владелец ждёт, а ход уже
      закончился.
    проверяется: "bash scripts/hooks/stop_reminder.sh --selftest"
    пишет: "напоминание мне, $LOG_DIR/stop-reminder.log"

  - файл: scripts/hooks/pre_compact.sh
    вид: хук
    имя: "Запись перед сжатием памяти"
    роль: >
      Перед тем как оболочка сожмёт рабочее окно, записывает событие и
      напоминает дописать передачу смены.
    когда: "перед сжатием рабочего окна"
    без_него: >
      Сжатие проходит молча, и часть незаписанного контекста пропадает без
      следа — преемник не узнает, на чём всё остановилось.
    проверяется: "bash scripts/hooks/pre_compact.sh --selftest"
    пишет: "$LOG_DIR/rotations.jsonl"

  - файл: scripts/hooks/skill_log.sh
    вид: хук
    имя: "Журнал вызовов правил"
    роль: >
      Сам записывает, какое пошаговое правило я вызвал и когда: отметку ставит
      оболочка, а не я — руками журнал не ведётся.
    когда: "сразу после каждого вызова пошагового правила"
    без_него: >
      Проверки «шаг работы пройден» стали бы проверкой моего слова: пропуск шага
      не отличить от выполненного.
    проверяется: "bash scripts/hooks/skill_log.sh --selftest"
    пишет: "$LOG_DIR/skills.jsonl с признаком «источник: хук»"

  # ─── проверки: ворота перед записью в хранилище и перед выкатом ──────────
  - файл: scripts/vorota.sh
    вид: гейт
    имя: "Ворота: все проверки одним вызовом"
    роль: >
      Запускает все проверки харнеса подряд и показывает итог одной таблицей —
      чтобы не гонять их поодиночке и не платить за каждую отдельно.
    когда: "перед записью работы в хранилище и обязательно перед выкатом"
    без_него: >
      Проверки пришлось бы помнить наизусть и звать по одной; забытая проверка
      означает, что сломанное уезжает дальше.
    проверяется: "bash scripts/vorota.sh --selftest"
    пишет: "итог каждой проверки в $LOG_DIR/ворота-итог.jsonl — его читает панель"

  - файл: scripts/pre-commit-hook.sh
    вид: гейт
    имя: "Проверки в момент записи"
    роль: >
      Единственное место, которое решает, что проверяется перед записью работы в
      хранилище: секреты, имена файлов, разметка, карта задач.
    когда: "автоматически при каждой попытке записать работу в хранилище"
    без_него: >
      Проверки обходились бы молча: сломанная разметка или ключ доступа попали
      бы в хранилище без единого следа.
    проверяется: "bash scripts/pre-commit-hook.sh --selftest-devmap"
    пишет: "причину отказа в вывод и $LOG_DIR/pre-commit.log"

  - файл: scripts/check-secrets.sh
    вид: гейт
    имя: "Ключи и пароли не уезжают наружу"
    роль: >
      Ищет пароли, ключи доступа и прочие тайные строки среди того, что
      собирается уехать в хранилище кода, и останавливает запись.
    когда: "при каждой записи в хранилище и внутри выката"
    без_него: >
