# Ежемесячная ревизия проекта — ДАННЫЕ, а не код.
#
# Владелец 12.09.2026: «Ежемесячное автоматическое ревью проекта <…> которое
# дает рекомендации хеликоптер вью, по архитектуре, безопасности, лаконичности
# и эффективности кода, и так далее». «И так далее» означает, что список
# областей будет расти — поэтому он здесь, а не в коде демона.
#
# Читают: scripts/revizia-porcii.py (какие файлы отдать области),
# harness/demons/revizia-proekta.sh (пороги прогона).
#
# Файл ЖИВОЙ: раскладка харнеса его не затирает (LIVE_SETTINGS в
# razlozhit-harnes.sh), потому что области и пороги правит владелец.

пороги:
  # Одна порция на область за прогон. Замер 12.09.2026: код харнеса —
  # 2 062 845 знаков (find scripts харнес -name '*.py' -o -name '*.sh' | wc -c),
  # то есть за раз целиком его не прочитать: 300 000 знаков ≈ 85 000 токенов.
  знаков_на_порцию: 300000
  # На ВЕСЬ прогон, не на порцию: пять порций по 25 минут упёрлись бы в ночные
  # демоны (ревью спеки, I-10).
  потолок_минут: 90
  # Новых карточек за прогон; считается арифметикой по id, а не просьбой в
  # промпте (ревью спеки, I-14).
  максимум_находок: 12
  # Карточка длиннее — вычёркивается: карта едет в контекст каждой сессии.
  максимум_знаков_карточки: 1500
  # Находка старше — переносится в архив с причиной «срок истёк».
  срок_находки_суток: 90

# У каждой области СВОИ файлы. Правило было записано («пять взглядов на один
# и тот же код — это пять чтений одного и того же»), но маски его нарушали:
# замер 12.09.2026 дал сумму областей 2,99 млн знаков против 1,57 млн
# уникальных — 47 % лишних, около 400k токенов за круг. Маски разведены так,
# чтобы файл принадлежал одной области по СМЫСЛУ вопроса; редкие пересечения
# снимает разбиение в revizia-porcii.py (файл достаётся области, идущей раньше
# в порядке круга, а сдвиг начала круга пересдаёт его следующему вопросу).
области:
  - имя: архитектура
    пути: ["harness/config/*.yaml", "harness/demons/*.sh"]
    вопрос: "где механизмы делают одно и то же; где правило держится вниманием, а не кодом"

  - имя: безопасность
    пути: ["scripts/hooks/*", "harness/panel/*.py"]
    вопрос: "где секрет может утечь; где опасное возможно без сторожа"

  - имя: лаконичность
    пути: ["scripts/*.sh", "scripts/lib/*"]
    вопрос: "где кода больше, чем нужно; частные случаи вместо структуры данных"

  - имя: честность проверок
    пути: ["scripts/check-*.py", "scripts/test_*.py"]
    вопрос: "где проверка совпадает с реализацией и не поймает ничего"

  - имя: эффективность
    пути: ["scripts/*.py"]
    вопрос: "где тратится контекст и время впустую"
