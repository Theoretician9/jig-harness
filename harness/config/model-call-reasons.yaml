# ПОВОДЫ вызова модели из кода — ДАННЫЕ для scripts/ask-the-model.py.
#
# Вопрос владельца 12.09.2026: «Зачем для чего могут запускаться сессии и в
# какой момент. Например узнать что с другой сессией. Или сделать быстро чтото
# независимо».
#
# Разделение, из которого всё следует:
#   • МОДЕЛЬ ПОНИМАЕТ ТЕКСТ — то, что не берётся регуляркой: смысл сообщения,
#     суть отказа в логе, чем занята другая смена. Отдаёт ДАННЫЕ по схеме.
#   • КОД РЕШАЕТ — пороги, история, последствия у него, а не у модели.
#   • РАБОТУ (правку кода) сессия-прибор не делает: для работы есть фоновый
#     агент с замком прав, и его результат проходит те же ворота.
#
# Поля повода: кто зовёт · когда (наблюдаемое условие) · вопрос (о чём) ·
# схема (поля ответа и типы) · что делает код с ответом · вид работы (модель) ·
# потолок в сутки.

поводы:
  - id: состояние-другой-смены
    кто: harness/demons/session-warden.sh
    когда: "вторая сессия молчит дольше порога, а её транскрипт пишется"
    вопрос: "по хвосту транскрипта: на каком шаге смена, что делала последним, есть ли признак затыка"
    схема:
      шаг: строка
      последнее_действие: строка
      минут_без_продвижения: число
      затык_виден: правда-ложь
    делает_код: "будить, ждать или звать владельца — по своим порогам, не по совету модели"
    вид: дежурный
    потолок: 24

  - id: суть-отказа-в-журнале
    кто: никем не вызывается (демон падений модель не зовёт; повод ждёт подключения)
    когда: "демон упал, и в его журнале больше 50 строк без явного признака"
    вопрос: "что именно отказало: какая команда, какой ресурс, повторяется ли"
    схема:
      команда: строка
      ресурс: строка
      повторов: число
      первая_строка_отказа: строка
    делает_код: "поднимает по своей таблице починок; неизвестный отказ — в карту задачей"
    вид: дежурный
    потолок: 12

  - id: о-чём-сообщение-владельца
    кто: scripts/map-from-message.py
    когда: "сообщение владельца длиннее 300 знаков и не содержит слов-маркеров"
    вопрос: "перечислить, какие ЗАДАЧИ названы в сообщении, какие УКАЗАНИЯ (правила) и какие ОТВЕТЫ на вопросы агента; для каждой задачи — короткое АНГЛИЙСКОЕ имя (имена) и слой harness/product (слои)"
    схема:
      задачи: перечень
      имена: перечень
      слои: перечень
      указания: перечень
      вопросы: перечень
      ответы: перечень
    делает_код: "заводит карточки и строки указаний; ничего не закрывает и не отменяет"
    вид: дежурный
    потолок: 30

  - id: числа-из-чужого-отчёта
    кто: harness/demons/project-revision.sh
    когда: "нужен разбор длинного отчёта стороннего инструмента"
    вопрос: "вытащить числа: сколько найдено, сколько критично, какие файлы"
    схема:
      всего: число
      критичных: число
      файлы: перечень
    делает_код: "сверяет с порогами и решает, заводить ли задачу"
    вид: дежурный
    потолок: 12

  - id: проба-личности
    кто: scripts/self-prompt-live.sh
    когда: "сменился ключ события: версия Claude Code, версия харнеса или носители личности (сверяет сторож сессий, не чаще 4 раз в сутки)"
    вопрос: "назвать метку сборки из своего системного промпта дословно или ответить НЕТ"
    схема:
      метка: строка
    делает_код: "сверяет метку с той, что даёт сборщик; не названа — сигнал self-prompt-live:failed, ключ события не записывается"
    вид: дежурный
    потолок: 4

# КОГДА НЕ ЗВАТЬ. Каждая строка — не вкус, а причина.
не_звать:
  - повод: "ответ есть в данных или считается кодом"
    причина: "немота смены, возраст метки, число задач — это арифметика; вызов модели тут дороже и менее точен"
  - повод: "нужно РЕШЕНИЕ (выкатывать ли, закрывать ли задачу, будить ли владельца)"
    причина: "владелец 12.09.2026: ответ модели — аналитика данных, а не выводы; решение принимает код"
  - повод: "необратимое действие по ответу модели"
    причина: "И-1 и И-2: удаление, выкат и смена секретов идут через сторожей и согласие владельца"
  - повод: "нужна РАБОТА, а не понимание (правка кода, прогон тестов)"
    причина: "для работы есть фоновый агент с замком прав, и его результат проходит ворота; прибор данных работу не делает"
  - повод: "вопрос без схемы ответа"
    причина: "ответ прозой нечем проверить: он выглядит осмысленным всегда"
