# Реестр стека харнеса: ДАННЫЕ для scripts/stack_freshness.py. Код ветвей «если часть такая-то» не имеет.
# Ключ части — «имя», его не переименовывать (замер, журнал вопросов и ответ «стек нет N» держат его).
#
# чьё: харнес — ставит установщик пакета, часть получает номер в сводке;
#      машина — общее на машине: в сводку строкой «вне номеров» и только при высокой критичности;
#      чужое — не судится никогда.
# свежая.источник: apt | apt-ждущие | npm | nodejs-dist | pypi | перезагрузка.
# текущая.команда — СПИСОК argv (исполняется без shell); $STATE_DIR раскрывается кодом.
# есть_если: {пакет|файл|ключ} — часть может отсутствовать у клиента: тогда «не стоит», а не поломка.
# задевает: общие слова или $STACK_NEIGHBOURS (ключ harness.conf — чьё на этой машине задевает перезапуск).
# установка: до Ф3 читается, но не исполняется; дверь «нет» — только рекомендация.
# перезапуск: что гасит установка — ничего | служба:<имя> | сессия | машина; по нему разбор обновлений
#      (scripts/update_impact.py) выбирает класс рекомендации. Части без поля разбор откладывает с причиной.
части:
  - имя: claude-code
    чьё: харнес
    критичность: высокая
    пакет_установщика: "@anthropic-ai/claude-code"
    текущая: { команда: ["claude", "--version"], образец: "^([0-9]+(\\.[0-9]+){1,3})" }
    свежая: { источник: npm, пакет: "@anthropic-ai/claude-code" }
    изменения: { вид: github-releases, адрес: "https://api.github.com/repos/anthropics/claude-code/releases?per_page=20&page={страница}" }
    безопасность: нет
    задевает: []
    использование: { вид: флаги, команда: claude, хуки: .claude/settings.json }
    риск: "новая версия CLI; ставится в окно ротации сессии"
    перезапуск: "сессия"
    установка:
      дверь: npm
      argv: ["npm", "install", "-g", "@anthropic-ai/claude-code@{версия}"]
      закрепление: { файл: install.conf, ключ: CC_VERSION }
      после: ["claude", "--version"]

  - имя: node
    чьё: харнес
    критичность: высокая
    пакет_установщика: nodejs
    текущая: { команда: ["node", "-v"], образец: "^v?([0-9]+(\\.[0-9]+){1,3})$" }
    свежая: { источник: nodejs-dist, ветка: "22" }
    изменения: { вид: nodejs-index, адрес: "https://api.github.com/repos/nodejs/node/releases/tags/v{версия}" }
    безопасность: nodejs-dist
    задевает: []
    использование: { вид: среда, для: [claude-code] }
    риск: "та же ветка 22; перезапуск сессий и демонов на node"
    перезапуск: "сессия"
    установка:
      дверь: нет
      причина: "ставится вне харнеса — ждёт решения владельца"

  - имя: перезагрузка
    чьё: машина
    критичность: высокая
    текущая: { команда: ["uname", "-r"], образец: "^([0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+)" }
    свежая: { источник: перезагрузка }
    безопасность: перезагрузка
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "гасит всё, что работает на машине"
    перезапуск: "машина"
    установка: { дверь: окно-ротации, ключ: AUTO_REBOOT_IN_ROTATION, причина: "сама при смене сессии без помощников (слово владельца 02.11, подтверждение 10558)" }

  - имя: пакеты-ubuntu
    чьё: машина
    критичность: обычная
    свежая: { источник: apt-ждущие, карман: "-(updates|security)$" }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    риск: "обычные обновления ОС; ночные заплатки безопасности ставит unattended-upgrades"
    перезапуск: "ничего"
    установка: { дверь: нет, причина: "общая строка ОС, без номера" }

  - имя: tmux
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "tmux"] }
    свежая: { источник: apt, пакет: tmux }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    использование: { вид: флаги, команда: tmux }
    риск: "перезапуск tmux рвёт живую сессию агента"
    перезапуск: "сессия"
    установка: { дверь: нет, причина: "ставится вручную: перезапуск tmux рвёт сессию агента" }

  - имя: git
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "git"] }
    свежая: { источник: apt, пакет: git }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    использование: { вид: флаги, команда: git }
    риск: "обычный пакет Ubuntu"
    перезапуск: "ничего"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: jq
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "jq"] }
    свежая: { источник: apt, пакет: jq }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    использование: { вид: флаги, команда: jq }
    риск: "обычный пакет Ubuntu"
    перезапуск: "ничего"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: curl
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "curl"] }
    свежая: { источник: apt, пакет: curl }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    использование: { вид: флаги, команда: curl }
    риск: "обычный пакет Ubuntu"
    перезапуск: "ничего"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: python3
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "python3.{минор}"] }
    свежая: { источник: apt, пакет: "python3.{минор}" }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    использование: { вид: модули }
    риск: "на нём работают все скрипты харнеса"
    перезапуск: "сессия"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: python3-yaml
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "python3-yaml"] }
    свежая: { источник: apt, пакет: python3-yaml }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    использование: { вид: модули, модуль: yaml }
    риск: "обычный пакет Ubuntu"
    перезапуск: "ничего"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: python3-cryptography
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "python3-cryptography"] }
    свежая: { источник: apt, пакет: python3-cryptography }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    задевает: []
    использование: { вид: модули, модуль: cryptography }
    риск: "проверка подписи входа Telegram на странице живой карты"
    перезапуск: "ничего"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: containerd
    чьё: машина
    критичность: обычная
    текущая: { команда: ["containerd", "--version"], образец: "^containerd\\s+\\S+\\s+v?([0-9]+(\\.[0-9]+){1,3})" }
    свежая: { источник: apt, пакет: containerd, стоит_как: [containerd.io] }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    есть_если: { пакет: [containerd.io, containerd] }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск dockerd роняет контейнеры на машине"
    перезапуск: "служба:docker"
    установка: { дверь: нет, причина: "общая часть машины" }

  - имя: runc
    чьё: машина
    критичность: обычная
    текущая: { команда: ["runc", "--version"], образец: "^runc version ([0-9]+(\\.[0-9]+){1,3})" }
    свежая: { источник: apt, пакет: runc }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    есть_если: { пакет: [containerd.io, runc] }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск dockerd роняет контейнеры на машине"
    перезапуск: "служба:docker"
    установка: { дверь: нет, причина: "общая часть машины" }

  - имя: docker.io
    чьё: машина
    критичность: обычная
    пакет_установщика: docker.io
    текущая: { команда: ["docker", "version", "--format", "{{.Server.Version}}"], образец: "^(?:Docker version )?([0-9]+(\\.[0-9]+){1,3})" }
    свежая: { источник: apt, пакет: docker.io, стоит_как: [docker-ce] }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    есть_если: { пакет: [docker-ce, docker.io] }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск dockerd роняет контейнеры на машине"
    перезапуск: "служба:docker"
    установка: { дверь: нет, причина: "общая часть машины" }

  - имя: nginx
    чьё: машина
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "nginx"] }
    свежая: { источник: apt, пакет: nginx }
    изменения: { вид: apt-changelog, адрес: "apt-get changelog {пакет}" }
    безопасность: apt
    есть_если: { пакет: nginx }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск nginx рвёт соединения сайтов и панели"
    перезапуск: "служба:nginx"
    установка: { дверь: нет, причина: "общая часть машины; ветка mainline nginx.org" }

  - имя: faster-whisper
    чьё: харнес
    критичность: обычная
    пакет_установщика: faster-whisper
    текущая:
      команда: ["$STATE_DIR/voice/venv/bin/python", "-c", "import importlib.metadata as m; print(m.version('faster-whisper'))"]
    свежая: { источник: pypi, пакет: faster-whisper }
    изменения: { вид: github-releases, адрес: "https://api.github.com/repos/SYSTRAN/faster-whisper/releases?per_page=20&page={страница}" }
    безопасность: нет
    есть_если: { файл: "$STATE_DIR/voice/venv/bin/python" }
    задевает: []
    использование: { вид: модули, модуль: faster_whisper }
    риск: "голосовые сообщения; только если голос включён"
    перезапуск: "ничего"
    установка: { дверь: нет, причина: "ставится в venv голоса, после согласия владельца" }

# Пакеты установщика, судимые одной общей строкой «обычные обновления ОС».
в_общей_строке_ОС: [python3, python3-pip, python3-venv, shellcheck, ripgrep, unzip, logrotate, iproute2, tzdata, docker-compose-v2]

# Строки установщика, у которых нет части, и почему.
не_судим:
  "npx -y playwright install-deps chromium": "тянет десятки библиотек ОС; их судит общая строка ОС"
