# Реестр стека харнеса: ДАННЫЕ для scripts/stack_freshness.py. Код ветвей «если часть такая-то» не имеет.
# Ключ части — «имя», его не переименовывать (замер, журнал вопросов и ответ «стек нет N» держат его).
#
# чьё: харнес — ставит установщик пакета, часть получает номер в сводке;
#      машина — общее на машине: в сводку строкой «вне номеров» и только при высокой критичности;
#      чужое — не судится никогда.
# свежая.источник: apt | apt-ждущие | npm | nodejs-dist | pypi | перезагрузка.
# текущая.команда — СПИСОК argv (исполняется без shell); $STATE_DIR раскрывается кодом.
# есть_если: {пакет|файл|ключ} — часть может отсутствовать у клиента: тогда «не стоит», а не поломка.
# задевает: общие слова или $STACK_NEIGHBOURS (ключ harness.conf — чьё на этой машине задевает перезапуск).
# установка: до Ф3 читается, но не исполняется; дверь «нет» — только рекомендация.
части:
  - имя: claude-code
    чьё: харнес
    критичность: высокая
    пакет_установщика: "@anthropic-ai/claude-code"
    текущая: { команда: ["claude", "--version"], образец: "^([0-9]+(\\.[0-9]+){1,3})" }
    свежая: { источник: npm, пакет: "@anthropic-ai/claude-code" }
    безопасность: нет
    задевает: []
    риск: "новая версия CLI; ставится в окно ротации сессии"
    установка:
      дверь: npm
      argv: ["npm", "install", "-g", "@anthropic-ai/claude-code@{версия}"]
      закрепление: { файл: install.conf, ключ: CC_VERSION }
      после: ["claude", "--version"]

  - имя: node
    чьё: харнес
    критичность: высокая
    пакет_установщика: nodejs
    текущая: { команда: ["node", "-v"], образец: "^v?([0-9]+(\\.[0-9]+){1,3})$" }
    свежая: { источник: nodejs-dist, ветка: "22" }
    безопасность: nodejs-dist
    задевает: []
    риск: "та же ветка 22; перезапуск сессий и демонов на node"
    установка:
      дверь: нет
      причина: "ставится вне харнеса — ждёт решения владельца"

  - имя: перезагрузка
    чьё: машина
    критичность: высокая
    текущая: { команда: ["uname", "-r"], образец: "^([0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+)" }
    свежая: { источник: перезагрузка }
    безопасность: перезагрузка
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "гасит всё, что работает на машине"
    установка: { дверь: нет, причина: "только в окно, названное владельцем" }

  - имя: пакеты-ubuntu
    чьё: машина
    критичность: обычная
    свежая: { источник: apt-ждущие, карман: "-(updates|security)$" }
    безопасность: apt
    задевает: []
    риск: "обычные обновления ОС; ночные заплатки безопасности ставит unattended-upgrades"
    установка: { дверь: нет, причина: "общая строка ОС, без номера" }

  - имя: tmux
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "tmux"] }
    свежая: { источник: apt, пакет: tmux }
    безопасность: apt
    задевает: []
    риск: "перезапуск tmux рвёт живую сессию агента"
    установка: { дверь: нет, причина: "ставится в окно ротации" }

  - имя: git
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "git"] }
    свежая: { источник: apt, пакет: git }
    безопасность: apt
    задевает: []
    риск: "обычный пакет Ubuntu"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: jq
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "jq"] }
    свежая: { источник: apt, пакет: jq }
    безопасность: apt
    задевает: []
    риск: "обычный пакет Ubuntu"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: curl
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "curl"] }
    свежая: { источник: apt, пакет: curl }
    безопасность: apt
    задевает: []
    риск: "обычный пакет Ubuntu"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: python3
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "python3"] }
    свежая: { источник: apt, пакет: python3 }
    безопасность: apt
    задевает: []
    риск: "на нём работают все скрипты харнеса"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: python3-yaml
    чьё: харнес
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "python3-yaml"] }
    свежая: { источник: apt, пакет: python3-yaml }
    безопасность: apt
    задевает: []
    риск: "обычный пакет Ubuntu"
    установка: { дверь: нет, причина: "обычный пакет Ubuntu, ставит unattended-upgrades" }

  - имя: containerd
    чьё: машина
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "containerd"] }
    свежая: { источник: apt, пакет: containerd }
    безопасность: apt
    есть_если: { пакет: containerd }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск dockerd роняет контейнеры на машине"
    установка: { дверь: нет, причина: "общая часть машины" }

  - имя: runc
    чьё: машина
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "runc"] }
    свежая: { источник: apt, пакет: runc }
    безопасность: apt
    есть_если: { пакет: runc }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск dockerd роняет контейнеры на машине"
    установка: { дверь: нет, причина: "общая часть машины" }

  - имя: docker.io
    чьё: машина
    критичность: обычная
    пакет_установщика: docker.io
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "docker.io"] }
    свежая: { источник: apt, пакет: docker.io }
    безопасность: apt
    есть_если: { пакет: docker.io }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск dockerd роняет контейнеры на машине"
    установка: { дверь: нет, причина: "общая часть машины" }

  - имя: nginx
    чьё: машина
    критичность: обычная
    текущая: { команда: ["dpkg-query", "-W", "-f=${Version}", "nginx"] }
    свежая: { источник: apt, пакет: nginx }
    безопасность: apt
    есть_если: { пакет: nginx }
    задевает: ["$STACK_NEIGHBOURS"]
    риск: "перезапуск nginx рвёт соединения сайтов и панели"
    установка: { дверь: нет, причина: "общая часть машины; ветка mainline nginx.org" }

  - имя: faster-whisper
    чьё: харнес
    критичность: обычная
    пакет_установщика: faster-whisper
    текущая:
      команда: ["$STATE_DIR/voice/venv/bin/python", "-c", "import importlib.metadata as m; print(m.version('faster-whisper'))"]
    свежая: { источник: pypi, пакет: faster-whisper }
    безопасность: нет
    есть_если: { файл: "$STATE_DIR/voice/venv/bin/python" }
    задевает: []
    риск: "голосовые сообщения; только если голос включён"
    установка: { дверь: нет, причина: "ставится в venv голоса, после согласия владельца" }

# Пакеты установщика, судимые одной общей строкой «обычные обновления ОС».
в_общей_строке_ОС: [python3-pip, python3-venv, shellcheck, ripgrep, unzip, logrotate, tzdata, docker-compose-v2]

# Строки установщика, у которых нет части, и почему.
не_судим:
  "npx -y playwright install-deps chromium": "тянет десятки библиотек ОС; их судит общая строка ОС"
