# Цитаты владельца ЭТОЙ установки → обезличенный текст для публичной сборки.
#
# Зачем файл. Владелец 28.09.2026 увидел публикацию и спросил: «Почему это
# идет в публичную ветку?» Замер того дня: его дословных фраз в пакете — 9,
# мест — 13. Его решение из трёх предложенных: «2» — обезличить.
#
# Почему обезличиваем В СБОРКЕ, а не в коде. Цитата объясняет, ПОЧЕМУ код
# такой, и в нашем дереве она ценнее пересказа: правило со словами владельца
# и датой имеет вес в споре (14-СБОРКА, этап 1.2.1). Наружу уходит смысл без
# личной речи.
#
# Правило списка: пара обязательна для КАЖДОЙ цитаты, попавшей в код. Цитата
# без пары роняет сборку (build-public.py, остатки_цитат) — иначе новая
# цитата уехала бы в публичный гит молча, ровно так, как уехали эти девять.
#
# Публичный текст пишется ТАК, ЧТОБЫ ВСТАТЬ НА МЕСТО ЦИТАТЫ: он попадает
# внутрь кавычек в строке вида «Владелец 11.09: «…»», поэтому начинать его
# словом «владелец» нельзя — выйдет «Владелец: «владелец просил…»».

пары:
  - цитата: "оставлять ему только то, чего машина проверить не может"
    публично: "оставлять ему только то, чего машина проверить не может"

  - цитата: "присылать спеку описанием, а не голым файлом"
    публично: "присылать спеку описанием, а не голым файлом"

  - цитата: "отчёт текстом, файлом — только документ"
    публично: "отчёт текстом, файлом — только документ"

  - цитата: "доводить текущую задачу прежде спеки"
    публично: "доводить текущую задачу прежде спеки"

  - цитата: "пользоваться уже существующими командами"
    публично: "пользоваться уже существующими командами"

  - цитата: "каждое сообщение с работой попадает в карту"
    публично: "каждое сообщение с работой попадает в карту"

  - цитата: "пауза была нажата, а работа продолжилась"
    публично: "пауза была нажата, а работа продолжилась"

  - цитата: "потолок решений в сутки назначен владельцем"
    публично: "потолок решений в сутки назначен владельцем"

  - цитата: "статус по ходу работы, а не только в конце"
    публично: "статус по ходу работы, а не только в конце"

# Обороты, попадающие под форму цитаты, но НЕ личной речью являющиеся: они
# живут внутри наших же формулировок. Объявляются по одному и с причиной —
# шаблон здесь недопустим ровно по той же причине, что и в формах приёмки:
# «любое короткое в кавычках» однажды пропустит настоящую фразу.
не_цитаты:
  - оборот: "проверь меня"
    причина: >
      Живёт внутри нашей формулировки «проверяет механизм, а не список
      "проверь меня"» — это название антипаттерна, а не слова владельца.
