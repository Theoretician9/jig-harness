# Цитаты владельца ЭТОЙ установки → обезличенный текст для публичной сборки.
#
# Заготовка: у новой установки цитат ещё нет. Живой файл этой установки —
# harness/config/owner-quotes.yaml, и наружу он НЕ едет: его пары состоят из
# дословной речи владельца, то есть ровно того, от чего обезличивание и
# поставлено (он сам спросил 28.09.2026, почему его слова уходят в публичную
# ветку). Подмена заготовкой — в harness/config/public-build.yaml.
#
# Правило списка: пара обязательна для КАЖДОЙ цитаты, попавшей в код харнеса.
# Цитата без пары роняет сборку (build-public.py, остатки_цитат) — иначе новая
# цитата уедет в публичный гит молча.
#
# Публичный текст пишется ТАК, ЧТОБЫ ВСТАТЬ НА МЕСТО ЦИТАТЫ: он попадает
# внутрь кавычек в строке вида «Владелец 11.09: «…»», поэтому начинать его
# словом «владелец» нельзя — выйдет «Владелец: «владелец просил…»».
#
#   пары:
#     - цитата: "дословные слова владельца, как они стоят в коде"
#       публично: "их смысл без личной речи"

пары: []

# Обороты, попадающие под форму цитаты, но НЕ личной речью являющиеся: они
# живут внутри наших же формулировок. Объявляются по одному и с причиной —
# шаблон здесь недопустим: «любое короткое в кавычках» однажды пропустит
# настоящую фразу.
не_цитаты: []
