    тип: словарь
    тип_в_архиве: [строка]
    обязательно: "при статусе принято (проверка.команда, держит код)"
    пишет: [scripts/alert-task.py, scripts/evolution-net.py, harness/demons/check-builder.sh, сессия]
    читает: [scripts/acceptance.py]
    карточек: { карта: 88, архив: 493 }
    поля:
      команда: { тип: строка }
      ждём: { тип: [строка, список] }
