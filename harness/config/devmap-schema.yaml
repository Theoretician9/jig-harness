    карточек: { карта: 8, архив: 6 }
  пачка:
    смысл: "явное имя пачки работ: перебивает выведенное очередью"
    тип: строка
    обязательно: нет
    пишет: [сессия, разбор]
    читает: [scripts/work-queue.py]
    карточек: { карта: 22, архив: 3 }
  зависит_от:
