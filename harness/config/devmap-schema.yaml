# Схема карточки карты разработки — ДАННЫЕ (шаг 1 задачи «схема карты»).
#
# Слово владельца 07.11.2026: «карту задач надо классифицировать, описать
# свойства, результаты, состояния, процессы». До этого файла поля карточки
# не были описаны нигде: замер 16.11 — 347 карточек, 44 разных поля, у 11 из
# них одна-три карточки, и ни у одного нет записи «что это и кто пишет».
#
# Откуда взято. РАЗБОР живой карты (dev-map.yaml, 347 карточек), архива
# (docs/dev-map-archive.yaml, 1248) и кода писателей (grep записи поля по
# scripts/ и harness/) 16.11.2026, а не память. Числа «карточек» — тот замер.
#
# Кто читает. Валидатор карты в scripts/pre-commit-gate.sh (DEVMAP_VALIDATOR,
# режимы --devmap-only и --selftest-devmap; архив — с ключом --архив). Он судит
# по этому файлу: поле вне «поля» и «устаревшие» — красный; тип не из «тип» —
# красный; подполе словаря вне «поля» и поле пункта списка вне «элемент» —
# красный; статус вне «статусы» для этого файла («где») — красный;
# устаревшее поле на большем числе карточек живой карты, чем «карточек.карта», —
# красный (новых не заводить, старые убывают). Эти два правила (поле вне схемы
# и устаревшее сверх числа) красные только при DEVMAP_SCHEMA_STRICT=1 в
# harness.conf; в пакете 0 — предупреждение с карточкой и полем, коммит идёт:
# карты копий схема не разбирала. Переход статуса судится по
# ТЕКУЩЕМУ состоянию: статус архива (снято, слито) в живой карте — красный.
# История правок не читается.
#
# Правила, которые держит КОД валидатора, а не этот файл (И-4, со своими
# самотестами --selftest-devmap): id/status/title/summary обязательны; done
# без tested_at при owner_testable не false — красный; «принято» без
# проверка.команда или принято_когда — красный; глубина.уровень, характер
# (список — harness/config/pipeline.yaml), кем, когда; пункт checklist done без
# done_at/summary. Здесь они описаны словами в «смысл», чтобы схема была
# полной, но судья у них один — код.
#
# Типы: строка, число, логическое, дата (YAML читает 2026-10-27 без кавычек
# датой), словарь, список, пусто (null). Список типов — любой из них.
# «тип_в_архиве» — что дополнительно терпится только в архиве (старые формы).
#
# Писатели: «сессия» — агент правит карту руками по ходу работы; остальное —
# код (путь от корня проекта). Шаг 2 задачи сводит заполнение по умолчанию в
# один код по этой схеме, шаг 3 — процесс «ведение карты».

версия: 1

# ── Классы задач ────────────────────────────────────────────────────────────
# Класс — по приставке id (чья работа) и по глубине (цена ошибки и чем работа
# является). Приставка валидатором не судится: копии на проектах заводят свои.
классы:
  по_приставке:
    hr: { смысл: "работа над самим харнесом", карточек: { карта: 344, архив: 830 } }
    pr: { смысл: "работа продукта проекта", карточек: { карта: 0, архив: 381 } }
    pb: { смысл: "заказ стороннего проекта владельца (лендинг, аналитика)", карточек: { карта: 3, архив: 2 } }
    ev: { смысл: "событие харнеса: разбор, передача смены (архивная форма до 09.2026)", карточек: { карта: 0, архив: 35 } }
  по_уровню:
    смысл: "глубина.уровень — цена ошибки; набор шагов — harness/config/pipeline.yaml «уровни»"
    значения: { мелкая: 98, обычная: 229, крупная: 12, хакатон: 0 }
  по_характеру:
    смысл: "глубина.характер — чем работа является; список и шаги — harness/config/pipeline.yaml «характеры»"
    значения: { разработка: 167, починка: 139, исследование: 30, механическая: 3 }

# ── Результат ───────────────────────────────────────────────────────────────
# Что считается результатом работы: чем её проверить или чем она уже
# подтверждена. Гейт наличие результата у test НЕ судит: test без проверки —
# законный вход строителя проверок (harness/demons/check-builder.sh), а он
# сам останавливается на карте, которую валидатор красит. Ставить результат
# при переходе в test — работа заполнителя шага 2.
результат:
  поля: [как_проверить, проверка, проверить_владельцу, проверено_чем, чем_подтверждено, tested_at, итог]

# ── Статусы и переходы ──────────────────────────────────────────────────────
# «где» — в каком файле статус допустим: карта (dev-map.yaml) или архив.
# «из» — откуда в него входят и кто переводит; это описание для писателей
# (шаг 2 сделает переходы кодом). Судится текущее состояние: статус из списка
# для файла.
статусы:
  plan:
    смысл: "не начато"
    где: [карта, архив]
    из: "заведение карточки (map-from-message.py, alert-task.py, evolution-net.py, project-revision.sh, import-product-trace.py, сессия); wip → plan — harness/demons/task-closer.sh (брошенная wip, пишет closed_reason); беклог → plan — только словом владельца"
    карточек: { карта: 173, архив: 372 }
  wip:
    смысл: "в работе"
    где: [карта, архив]
    из: "plan → wip — сессия при взятии; test → wip — сессия при возврате (провал_проверки)"
    карточек: { карта: 4, архив: 1 }
  test:
    смысл: "работа закончена, ждёт живой проверки (по умолчанию для законченной работы, И-4)"
    где: [карта, архив]
    из: "wip → test — сессия; результат (см. «результат») называет она или строитель проверок"
    карточек: { карта: 91, архив: 259 }
  принято:
    смысл: "доказано машиной: команда из проверка.команда дала ожидаемое (владелец 11.09.2026)"
    где: [карта, архив]
    из: "test → принято — scripts/acceptance.py (пишет принято_когда); требования держит код валидатора"
    карточек: { карта: 1, архив: 414 }
  done:
    смысл: "проверено владельцем (tested_at — дата его подтверждения) либо внутреннее (owner_testable: false)"
    где: [карта, архив]
    из: "test → done — сессия по слову владельца; требование tested_at держит код валидатора (И-4)"
    карточек: { карта: 0, архив: 153 }
  беклог:
    смысл: "отложено владельцем: не трогать без его слова (28.09.2026); вывод из беклога стережёт гейт пайплайна"
    где: [карта, архив]
    из: "любой → беклог — сессия по слову владельца"
    карточек: { карта: 78, архив: 14 }
  снято:
    смысл: "снято без исполнения: умерло с продуктом, слито, срок находки истёк"
    где: [архив]
    из: "scripts/archive-map.py (пишет closed_reason, снято_когда) и сессия при переносе в архив"
    карточек: { карта: 0, архив: 32 }
  слито:
    смысл: "слито в другую карточку (архивная форма; живая — дубль_из/слито_из)"
    где: [архив]
    из: "сессия при переносе в архив"
    карточек: { карта: 0, архив: 3 }

# ── Поля карточки ───────────────────────────────────────────────────────────
# «обязательно»: всегда | при статусе … (такие правила держит код валидатора) | нет.
# «карточек»: замер 16.11 {карта, архив}.
поля:
  id:
    смысл: "имя карточки: <приставка>.<латиница через дефис>; уникально в карте и архиве"
    тип: строка
    обязательно: всегда
    пишет: [scripts/map-from-message.py, scripts/alert-task.py, scripts/evolution-net.py, harness/demons/project-revision.sh, scripts/import-product-trace.py, сессия]
    карточек: { карта: 347, архив: 1248 }
  status:
    смысл: "состояние карточки — один из «статусы»"
    тип: строка
    обязательно: всегда
    пишет: [заводящие писатели (plan), сессия, scripts/acceptance.py (принято), harness/demons/task-closer.sh (wip → plan), scripts/archive-map.py (снято)]
    карточек: { карта: 347, архив: 1248 }
  title:
    смысл: "что сделать, одной строкой по-русски"
    тип: строка
    обязательно: всегда
    пишет: [заводящие писатели, сессия]
    карточек: { карта: 347, архив: 1248 }
  summary:
    смысл: "суть и состояние для читателя карты, до 500 знаков; хвост длиннее уносит scripts/weed-the-map.py в docs/dev-map-подробности.yaml"
    тип: строка
    обязательно: всегда
    пишет: [заводящие писатели, сессия, scripts/weed-the-map.py]
    карточек: { карта: 347, архив: 1248 }
  owner_testable:
    смысл: "true — результат щупает владелец; false — внутреннее, done без tested_at законен"
    тип: логическое
    обязательно: нет
    пишет: [scripts/map-from-message.py (true), scripts/alert-task.py, scripts/evolution-net.py, harness/demons/project-revision.sh (false), сессия]
    карточек: { карта: 347, архив: 1239 }
  заведено:
    смысл: "дата заведения карточки"
    тип: строка
    обязательно: нет
    пишет: [заводящие писатели]
    карточек: { карта: 347, архив: 964 }
  завёл:
    смысл: "кто завёл: путь скрипта или «смена»"
    тип: строка
    обязательно: нет
    пишет: [scripts/map-from-message.py, scripts/alert-task.py, scripts/evolution-net.py, сессия]
    карточек: { карта: 306, архив: 858 }
  источник:
    смысл: "откуда задача: inbox:<id сообщения>, тревога:<ключ>, ревизия:<…>, след старого сервера"
    тип: строка
    обязательно: нет
    пишет: [scripts/map-from-message.py, scripts/alert-task.py, scripts/evolution-net.py, harness/demons/project-revision.sh, scripts/import-product-trace.py, сессия]
    карточек: { карта: 312, архив: 904 }
  глава:
    смысл: "место задачи в плане: <план>/<подглава>; шаг «план» check-pipeline.py берёт docs/plans/<план>.md раньше .tasks/<id>/план.md"
    тип: строка
    обязательно: нет
    пишет: [сессия]
    карточек: { карта: 0, архив: 0 }
  глубина:
    смысл: "цена ошибки и чем работа является; ставится при заведении оценкой, при взятии — сессией; судит код валидатора"
    тип: словарь
    обязательно: нет
    пишет: [scripts/lib/cards.py (глубина_строкой — для заводящих писателей), сессия]
    карточек: { карта: 339, архив: 919 }
    поля:
      уровень: { смысл: "мелкая/обычная/крупная/хакатон", тип: строка }
      характер: { смысл: "из harness/config/pipeline.yaml «характеры»", тип: строка }
      кем: { смысл: "кто назначил", тип: строка }
      когда: { смысл: "дата назначения", тип: [дата, строка] }
      основание: { смысл: "почему такая глубина, если не очевидно", тип: строка }
  volume:
    смысл: "объём: оценка (estimated: true) или факт (estimated: false)"
    тип: словарь
    обязательно: нет
    пишет: [заводящие писатели (оценка-константа), сессия]
    карточек: { карта: 329, архив: 1219 }
    поля: &volume
      loc: { смысл: "строк кода", тип: число }
      complexity: { смысл: "сложность 1–5", тип: число }
      tokens_k: { смысл: "тысяч токенов", тип: число }
      estimated: { смысл: "true — оценка, false — замер", тип: логическое }
  when:
    смысл: "даты жизни: начата, сделана, проверена; estimated: false — по факту"
    тип: словарь
    обязательно: нет
    пишет: [заводящие писатели (пустые даты), сессия]
    карточек: { карта: 328, архив: 1005 }
    поля:
      started: { тип: [строка, дата, пусто] }
      done: { тип: [строка, дата, пусто] }
