      часов: { смысл: "окно долгой проверки (архивная форма, 1 карточка)", тип: число }
  проверить_владельцу:
    смысл: "результат: что может проверить только владелец и почему"
    тип: строка
    обязательно: нет
    пишет: [harness/demons/check-builder.sh, сессия]
    читает: [scripts/acceptance.py, harness/demons/acceptance-watch.sh]
    карточек: { карта: 49, архив: 60 }
  проверено_чем:
    смысл: "результат: чем работа уже проверена (замер, коммит, журнал)"
    тип: строка
    обязательно: нет
    пишет: [сессия]
    карточек: { карта: 9, архив: 81 }
  чем_подтверждено:
    смысл: "результат: чем подтверждено (замер, снимок)"
    тип: строка
    обязательно: нет
    пишет: [сессия]
    читает: [scripts/work-queue.py, scripts/build-board.py]
    карточек: { карта: 1, архив: 123 }
  итог:
    смысл: "результат: итог работы одной строкой"
    тип: строка
    обязательно: нет
    пишет: [сессия]
    карточек: { карта: 4, архив: 2 }
  tested_at:
    смысл: "результат: дата подтверждения владельцем (И-4, done)"
    тип: [строка, пусто]
