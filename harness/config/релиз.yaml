# ДАННЫЕ релиза: как считается номер версии публичного харнеса.
#
# Владелец 12.09.2026: «Какие есть стандарты для релизов в гит <…> стандарты
# индустрии». Отсюда SemVer (мажор.минор.патч), тег vX.Y.Z на каждый релиз и
# CHANGELOG, который собирает КОД, а не человек.
#
# Читает scripts/versiya.py. Здесь нет ни одного литерала этой установки:
# файл едет в публичную сборку вместе со всем остальным.

# С чего начинается счёт, когда тегов ещё нет.
# 0.x — честное «публичный договор ещё может поменяться»: семь белых пятен из
# docs/ЧТО-ПРОВЕРИТЬ-ПЕРЕД-ОТДАЧЕЙ.md открыты. 1.0.0 ставится, когда они
# закрыты, — и ставится доводом владельца, а не кодом.
начальная_версия: "0.1.0"

# Минор — когда у харнеса появилась ВОЗМОЖНОСТЬ, а не починка. Признак:
# в пакете появился НОВЫЙ файл-механизм (демон, хук, гейт, скил).
# Пути от корня пакета, шаблоны fnmatch. Переименование сюда не попадает:
# git diff зовётся с -M, и переименованный файл приходит как R, а не A
# (улика 12.09.2026: реестр механизмов на прошлом релизе лежал по пути
# «харнес/config/…» — сравнение содержимого между ревизиями слепнет).
# Расширение НЕ указано нарочно: механизмы бывают и питоновские
# (harness/hooks/guard_bash.py, harness/demons/server_hygiene_check.py), и
# шаблон «*.sh» посчитал бы новый питоновский демон обычной починкой
# (ревью кода 12.09.2026, R-5).
минор_если_добавлен:
  - "harness/demons/*"
  - "harness/hooks/*"
  - "harness/scripts/check-*.py"
  - "harness/skills/*"

# Мажор кодом не ставится никогда: «ломает существующую установку» — суждение о
# людях, которые уже поставили харнес, и принимает его владелец словом.
# Довод: python3 scripts/versiya.py --следующая --мажор
мажор: "только доводом --мажор"

# Сколько заметок уезжает в CHANGELOG одной секцией. Первый релиз несёт всю
# историю пакета (216 коммитов на 12.09.2026) — это журнал разработки, а не
# список изменений для человека. Лишнее не пропадает молча: код дописывает
# строку «и ещё N изменений» (правило «снятое кодом называется вслух»).
потолок_заметок: 40
