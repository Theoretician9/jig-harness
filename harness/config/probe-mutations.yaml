    - 'битый blob читается с заменой — «\ufffd…» попадает в историю (H16)'
  scripts/test_layout_lock.py:
    механизм: scripts/lib/layout_lock.py
    доказательство: python3 scripts/test_layout_lock.py
    подмена: из-копии
    # Замки раскладки (hr.layout-manifest-removes-stale, Ф-в): по одной мутации на правило L1, L3, L5–L7, L9, L10.
    мутация:
    - 's/^        if pid in family:$/        if True:/'
    - 's/^        if pid in family:$/        if False:/'
    - 's/^    if not holders:$/    if not holders:\n        return 0, ""/'
    - 's/        if fields\[5\] == key and fields\[4\].isdigit():/        if key in fields[5] and fields[4].isdigit():/'
    - 's/        fd = os.open(lock_path, os.O_RDONLY)/        fd = os.open(lock_path, os.O_RDWR | os.O_CREAT)/'
    - 's/    return "%02x:%02x:%d" % (os.major(info.st_dev), os.minor(info.st_dev), info.st_ino)/    return "%x:%d" % (info.st_dev, info.st_ino)/'
    - 's/^    pids, hidden = _scan_fds(path)$/    pids, hidden = holder_pids(_read_locks(), lock_key(path)), 0/'
    мутация_случай:
    - 'держатель update.lock не судится — раскладка рядом с обновлением проходит (L6)'
    - 'отказ любому держателю — раскладка, которую зовёт update.py, не идёт (L5)'
    - '«держатель не найден» читается как «свободно» — раскладка идёт мимо занятого замка (L7)'
    - 'ключ замка сравнивается подстрокой — чужой inode с общим началом читается держателем (L1)'
    - 'update.lock открывается с O_CREAT — проверка создаёт файл замка (пятое место записи, L3)'
    - 'ключ из сырого st_dev — на ФС с другим устройством держатель не находится и каждое обновление отказывает (L9)'
    - 'держатель layout.lock берётся из /proc/locks — зависший генератор после убитого раскладчика не назван (L10)'
    # Не мутируется: L2 (обрыв цикла в ancestors — `parent in seen`). Мутация делает
    # `while True` бесконечным на стенде «7 ↔ 8»: проба виснет, а не краснеет, и
    # прибор без предела времени висит вместе с ней.
