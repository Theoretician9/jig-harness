    - 's@  - имя: hackathon_off@  - имя: hackathon_offf@'
    мутация_случай:
    - '«выключи хакатон» → /hackathon_off'
    - 'описание hackathon_off'
  scripts/test_agent_processes.py:
    # agent_processes.py: кто из claude основной агент и где сервер его панели.
