    - 's@            / f"agent-{помощник}.jsonl")@            / max((смена.parent / str(payload.get("session_id") or "") / "subagents").glob("agent-*.jsonl"), key=lambda п: п.stat().st_mtime).name)@'
    - 's@    return not payload.get("agent_id")@    return not payload.get("agent_type")@'
