    - 's@по_задачам.setdefault(з.get("задача", "-"), \[\])@по_задачам.setdefault(str(len(по_задачам)), [])@'
    - 's@^    return модуль.ГЛУБОКИЕ.sub(заменить, текст)@    return текст@'
    - 's@    "$PROJECT_DIR/scripts/tg_send.sh" "$SUMMARY" && return 0@    "$PROJECT_DIR/scripts/tg_send.sh" "$SUMMARY" \&\& return 0; curl -s -m 20 https://api.telegram.org/sendMessage >/dev/null; return 0@'
    - 's@    say "текстом не прошло — шлю вложением $doc"@    return 1@'
    - 's@        --caption "Утренняя сводка: МЁРТВЫХ $DEAD_N — список во вложении"@        --caption "Утренняя сводка: МЁРТВЫХ $DEAD_N — список во вложении" || true@'
    - 's@МЁРТВЫХ $DEAD_N — список во вложении@список во вложении@'
    - 's@ "$SUMMARY" > "$doc"@ "список во вложении" > "$doc"@'
    - 's@say "КАНАЛ НЕ НАСТРОЕН: двери $PROJECT_DIR/scripts/tg_send.sh нет — сводке некуда идти"@return 0@'
    мутация_случай:
    - служебная строка <synthetic> уходит владельцу в разбивке по моделям
    - вложение уходит без расширения .md, и телеграм отдаёт файл без типа
    - в строке задачи стоит не то число обходов
    - обходов больше трёх задач — сводка растёт без потолка
    - причина обрезана посреди слова, а не по границе слова
    - обходы одной задачи не сливаются в одну строку
    - в причине обхода остаётся слово, которого уровень «простой» не допускает
    - отказ двери — сводка уходит прямым curl мимо сторожа канала
    - после отказа текстом вложение через дверь не пробуется, и сводка пропадает
    - дверь отказала и вложению, а прогон считается успешным и ставит метку
    - подпись вложения не называет число мёртвых
    - во вложении нет перечня мёртвых — владелец получает пустой файл
    - двери нет, а прогон успешен — сводка потеряна молча
