    # Ф-д, модуль истории раскладки (hr.layout-manifest-removes-stale, Task 12): по мутации
    # на случаи H1–H3, H5–H12 и на каждое ключевое правило. H4 судит ДАННЫЕ (таблицу
    # перевода против публичной сборки): его мутация — в таблице, доказана вручную
    # (journal.md). Снятый core.quotepath при -z мёртв — не мутация (К18).
    мутация:
    - 's/"--raw", "--no-abbrev", "-z", "--format=%x01%H")/"--raw", "--no-abbrev", "--format=%x01%H")/'
    - 's/"--no-abbrev", "-z"/"--abbrev", "-z"/'
    - 's/"log", "--branches", "--tags",/"log", "--all",/'
    - 's/"--branches", "--tags",/"--branches",/'
    - 's/^    if blob == EMPTY_BLOB:$/    if False:/'
    - 's/^    return blob in known$/    return True/'
    - 's/and (best is None or len(key) > len(best\[0\])):/and best is None:/'
    - 's/    return Rules(dict(data.get("перевод") or {}), /    return Rules({k: v for k, v in (data.get("перевод") or {}).items() if v is not None}, /'
    - 's|    return pkg_path.startswith(key) if key.endswith("/") else pkg_path == key|    return pkg_path.startswith(key)|'
    - 's/^            dirnames\[:\] = \[d for d in dirnames if d != "__pycache__"\]$/            pass/'
    - 's/                if rel in known or layout_manifest.forbidden_tier(rel) != 0:/                if rel in known:/'
    - 's/^                if layout_manifest.absent_dest(rel, absent):$/                if False:/'
    - 's/^        if not layout_manifest.is_plain_file(project, real, rel):$/        if False:/'
    - 's/^        if verdict == EMPTY:$/        if False:/'
    - 's/^        if layout_manifest.project_blob(project, real, rel) in blobs:$/        if layout_manifest.project_blob(project, real, rel) is not None:/'
    - 's/^        if not (_WORD_YES.search(text) and _WORD_REMOVE.search(text)):$/        if not _WORD_YES.search(text):/'
    - 's/^_WORD_YES = re.compile(.*)$/_WORD_YES = re.compile(r"да")/'
    - 's/^        if not row.get("message_id"):$/        if False:/'
    - 's/^        if not question.ts < row\["_ts"\] <= last:$/        if not row["_ts"] <= last:/'
    - 's/if not question.ts < row/if not question.ts <= row/'
    - 's/ < row\["_ts"\] <= last:$/ < row["_ts"]:/'
    - 's/row\["_ts"\] <= last:$/row["_ts"] < last:/'
    - 's/^CONSENT_MAX_AGE_DAYS = 7$/CONSENT_MAX_AGE_DAYS = 8/'
    - 's/^        raise ValueError(f"время без пояса: {value}")$/        pass/'
    - 's/^            return Unreadable(f"{path.name}:{number}: {error}")$/            continue/'
    - 's/^            return Unreadable(f"{path.name}:{number}: {error}")$/            return []/'
    - 's/^    row = max(rows, key=lambda r: r\["_ts"\])$/    row = rows[-1]/'
    - 's/^    return _question(asked), asked$/    return _question(paths), asked/'
    - 's/^        if len(_question(asked + \[path\])) > ceiling:$/        if False:/'
    - 's/^    if str(package_root) == "-":$/    if False:/'
    - 's/^        return NoHistory(error.strerror or str(error))$/        raise/'
    - 's/^    if proc.returncode != 0:$/    if False:/'
    - 's/^    history.shallow = shallow.stdout.strip() == b"true"$/    history.shallow = True/'
    - 's/            target.setdefault(dest, set()).add(blob)/            target[dest] = {blob}/'
    # Мусор на входе (H13–H16, вечер 24.10.2026). H13: экранирование при записи и
    # split по \n при чтении — два носителя одного правила; каждый поодиночке
    # снятый проба НЕ видит (замер: обе одиночные мутации зелёные), поэтому
    # мутация снимает оба. Снятая проверка str у элементов «пути» тоже зелёная:
    # случая «список не-строк» нет.
    - 's/^    for number, line in enumerate(text.split("\\n"), 1):$/    for number, line in enumerate(text.splitlines(), 1):/;s/^    for sep in ("\\u2028", "\\u2029", "\\x85"):$/    for sep in ():/'
    - 's/^    if not isinstance(paths, list) or not all(isinstance(p, str) for p in paths):$/    if False:/'
    - 's/^        except (ValueError, KeyError, TypeError, RecursionError) as error:$/        except (ValueError, KeyError, TypeError) as error:/'
    - 's/RecursionError, layout_journal.JournalBroken) as error:$/layout_journal.JournalBroken) as error:/'
    - 's/^                continue    # чужой вывод: пара с нечитаемым blob не доказательство, годные пары остаются$/                raise/'
    - 's/parts\[3\].decode("ascii")/parts[3].decode("utf-8", "replace")/'
    мутация_случай:
    - 'снят -z из LOG_ARGS — путь с пробелом и «ё» приходит не дословно, пары «мета, путь» рвутся (H1)'
    - '--abbrev вместо --no-abbrev — blob истории короткий, сверка с 40-знаковым blob диска не сходится (H1)'
    - '--all вместо --branches --tags — blob из refs/remotes и stash читается «нашим» (H1 пара)'
    - '--tags снят — blob коммита только под тегом не найден (H1)'
    - 'правило пустого blob снято — пустой файл с пустым blob в истории читается «нашим» (H2)'
    - '«наш» по известному пути без сверки blob — правка владельца в 1 байт снимается (H5, И-1)'
    - 'первый совпавший ключ вместо самого длинного — project-settings.json и harness/scripts/ уходят по «harness/» (H3)'
    - 'строки null таблицы не судятся — harness/память/ переводится коротким «harness/» (H3)'
    - 'ключ без «/» судится как префикс — a/b/c.txtx уходит по точному a/b/c.txt (H3)'
    - '__pycache__ не отсечён — .pyc называется неизвестным файлом (H6)'
    - 'ярус 1/2 не судится — models.yaml, .установлено, skills называются неизвестными (H6)'
    - 'назначения группы без источника не отсечены — главы UNIFIED/ называются неизвестными (H6)'
    - 'ссылка и путь через ссылку не отсечены — файл за пределами проекта в «снял бы» (H7)'
    - 'пустой файл не отделён — EMPTY читается «нашим» и уходит в «снял бы» (H7)'
    - 'файл вне корней считается без сверки blob — правленый харнес/ДРУГОЕ.md в счёте (H7)'
    - 'согласие без слова «убрать» — любое «да» снимает файлы (H8)'
    - 'граница слова «да» снята — «когда убрать?» читается согласием (H8)'
    - 'message_id не обязателен — запись, сделанная рукой, а не из канала, читается согласием (H8)'
    - 'время согласия не сверяется с вопросом — «да, убрать» ДО вопроса снимает (H8)'
    - 'согласие в ту же секунду, что вопрос, засчитано — граница «строго позже» снята (H8)'
    - 'окна 7 суток от вопроса нет — согласие любой давности снимает (H8)'
    - 'граница окна «≤ 7 суток после вопроса» стала «<» — согласие ровно через 7 суток не засчитано (H8)'
    - 'срок согласия 8 суток вместо 7 — согласие через 8 суток после вопроса снимает (H8)'
    - 'ts без пояса не отказ — сравнение моментов падает TypeError вместо Unreadable (H8, H9)'
    - 'битая строка согласий пропускается — годное «да, убрать» рядом с ней снимает (H9)'
    - 'битая строка согласий читается пустым журналом — «не прочитали» стало «нет» (H9)'
