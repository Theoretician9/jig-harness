    - 's/        fd = os.open(lock_path, os.O_RDONLY)/        fd = os.open(lock_path, os.O_RDWR | os.O_CREAT)/'
    - 's/    return "%02x:%02x:%d" % (os.major(info.st_dev), os.minor(info.st_dev), info.st_ino)/    return "%x:%d" % (info.st_dev, info.st_ino)/'
