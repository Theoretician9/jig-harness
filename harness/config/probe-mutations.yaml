# Связь «проба → механизм» для класса D живой проверки — ДАННЫЕ.
#
# Откуда взято. Спека docs/specs/2026-10-15-живая-проверка-механизмов.md §3.1
# (класс D) и ревью спеки, находки CRITICAL 8 и 9: связи в данных НЕ БЫЛО
# вовсе. Поле «доказательство» стояло у 9 механизмов из 253, а файлов проб в
# реестре 56 — то есть у пробы не было названо НИ механизма, который она
# охраняет, НИ поломки, на которой она обязана покраснеть.
#
# Почему свой носитель, а не invariants.yaml. У инвариантов пять читателей
# (покрытие, ворота, пайплайн, приёмка, сам прогон мутаций), и каждая новая
# графа там меняет смысл для всех пяти. Класс D — про пробы, а не про
# инварианты, и живёт отдельно.
#
# Что значит живая проверка механизма класса D: его мутацию ставят в МЕХАНИЗМ,
# который проба охраняет, и проба обязана покраснеть ИМЕННО своим случаем.
# Зелёная мутация — находка о ПРОБЕ, а не допуск.
#
# Формат. Ключ — файл пробы. Поля:
#   механизм      — файл, в который ставится мутация
#   мутация       — выражение sed (строка или список)
#   мутация_случай — чей случай обязан покраснеть (парно с «мутация»)
#   доказательство — команда пробы
#   подмена       — чем испорченная копия доезжает до пробы. Три ответа:
#                   имя переменной среды (проба читает путь механизма из неё),
#                   «-» (путь механизма стоит в самой команде пробы) и
#                   «из-копии» (двери нет вовсе: проба находит механизм РЯДОМ С
#                   СОБОЙ, поэтому из копии дерева зовётся сама проба — её путь
#                   обязан стоять в «доказательстве»). Третий ответ добавлен
#                   17.10.2026: без него 43 пробы класса D судили БОЕВОЙ файл и
#                   были зелены на любой мутации
#                   ([[probe-loads-the-live-mechanism]]).
#
# Текст «до» каждой мутации обязан встречаться в механизме РОВНО ОДИН РАЗ:
# судит `bash scripts/mutation-probe.sh --сверить-тексты`. Отставший текст не
# краснеет и не жалуется — после круга правок 13.10.2026 так отстали десять
# мутаций из 78.
#
# ДОЛГ. Здесь названа ОДНА проба из 56 файлов класса D — та, чьи мутации
# прогнаны живьём этой сменой. Остальные 55 наполняются живой проверкой класса
# D, а не записью наперёд: мутация, которую никто не прогонял, — обещание.

пробы:
  scripts/test_live_check_classes.py:
    механизм: scripts/build-live-check-list.py
    доказательство: python3 scripts/test_live_check_classes.py
    подмена: HARNESS_LIVE_CHECK_TOOL
    мутация:
      - 's/elif исход == "ждёт":/elif исход == "НЕТ-ТАКОГО-ИСХОДА":/'
      - 's/беды.append(f"не трогал: {файл}")/pass/'
      - 's/беды\[:10\]/беды[:99]/'
      - 's/беды.append(f"не-проверяемо по причине вне списка: {файл}")/pass/'
      - 's/беды.append(f"не-проверяемо, а списка причин в данных нет: {файл}")/pass/'
      - 's/счёт закрыт: все/счёт неясен: все/'
      - 's/счёт: всего/счёт: мехов/'
      # R1-gen-06: текст «до» подгоняет автор кода (строки ещё нет в приборе).
      - 's/ДОКУМЕНТ.parent.mkdir(parents=True, exist_ok=True)/pass/'
    мутация_случай:
      - '«ждёт» снова считается проверкой — счёт закрывается чужим словом'
      - 'нетронутый механизм не назван поимённо'
      - 'потолок десяти имён снят — вывод в воротах нечитаем'
      - 'причина «не-проверяемо» вне списка проходит'
      - 'пустой список причин в данных проходит'
      - 'приговор о закрытом счёте не печатается'
      - 'числа счёта не печатаются'
      - 'каталога документа нет — прибор падает FileNotFoundError, обновление теряет документ (R1-gen-06)'
  scripts/test_live_check_daemon.py:
    механизм: scripts/live-check-daemon.py
    доказательство: python3 scripts/test_live_check_daemon.py
    подмена: HARNESS_LIVE_CHECK_DAEMON_TOOL
    мутация:
    - s/возраст <= потолок/возраст >= 0/
    - s/if нужно_содержимое and not файл.read_text(errors="replace").strip():/if False:/
    - s/ЗАПАС_ПЕРИОДОВ = 3/ЗАПАС_ПЕРИОДОВ = 100000/
    - s/в расписании его нет и юнита в данных ему/строки не нашлось и юнита в данных ему/
    - 's@    if если_активна != "active":@    if False:@'
    - 's@             if с.strip() and not с.strip().startswith("-- ")\]@             if с.strip()]@'
    - 's@    if сказал:@    if False:@'
    - 's@    if стало <= было:@    if False:@'
    - 's@    if not законно:@    if False:@'
    мутация_случай:
    - журнал старше своего расписания больше не отказ — мёртвый сторож зачтён живым
    - пустой журнал проходит за доказательство прогона
    - потолок молчания снят — мёртвый сторож и метка-старуха зачтены
    - неприменимость предиката A1 больше не называется своими словами
    - неработающий юнит systemd зачтён за живую службу — класс A2 доказывался бы ничем
    - служебная строка journalctl («-- No entries --») идёт за слова самой службы
    - молчун, который ЗАГОВОРИЛ, зачтён молчащим — находка о нём стала доказательством
    - молчун, не обновивший метку, зачтён бегавшим: молчание доказывало бы само себя
    - условие молчания в конфиге не судится — ветвь стала отмазкой любому онемевшему демону
  scripts/test_live_check_sick.py:
    механизм: scripts/live-check-sick.py
    доказательство: python3 scripts/test_live_check_sick.py
    подмена: HARNESS_LIVE_CHECK_SICK_TOOL
    мутация:
    - s/if код_гейта == 0:/if False:/
    - s/ЗЕЛЁН на больном доводе/зелен себе/
    - s/if чем_ломать and больной_довод:/if False:/
    мутация_случай:
    - гейт, зелёный на сломанном дереве, проходит за доказанную больную половину
    - зелёный на больном доводе не называется своими словами
    - оба способа сразу проходят — прибор выбирает за данные
  scripts/test_live_check_sh.sh:
    механизм: scripts/live-check.sh
    доказательство: bash scripts/test_live_check_sh.sh
    подмена: HARNESS_LIVE_CHECK_WRAPPER
    мутация:
    - 's/нечего звать: после разделителя «--» пусто/нечего делать/'
    - 's/ОБОРВАНО ОБЁРТКОЙ: механизм не кончился за предел/прервано:/'
    - s/exit "$code"/exit 0/
    мутация_случай:
    - пустой вызов больше не отказывает своим словом
    - оборванный пределом механизм не называет предел в следе
    - код механизма проглочен — поломка выглядит проверкой
  scripts/test_registry.py:
    механизм: scripts/check-registry.py
    доказательство: python3 scripts/test_registry.py
    подмена: HARNESS_REGISTRY_GATE
    мутация:
    - s/МИНИМУМ_РОЛИ = 25/МИНИМУМ_РОЛИ = 0/
    - s/описание есть, а файла нет/описание на месте/
    - s/найдено = ГЛУБОКИЕ.search(фраза)/найдено = None/
    мутация_случай:
    - роль-отписка проходит — паспорт механизма снова можно не писать
    - запись на удалённый файл больше не красная
    - термин без расшифровки проходит — владелец читает жаргон

