    - 's@list(по_задачам.items())\[:3\]@list(по_задачам.items())@'
    - 's@\.rsplit(" ", 1)\[0\]@@'
    - 's@по_задачам.setdefault(з.get("задача", "-"), \[\])@по_задачам.setdefault(str(len(по_задачам)), [])@'
    - 's@^    return модуль.ГЛУБОКИЕ.sub(заменить, текст)@    return текст@'
