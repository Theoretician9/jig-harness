    - сторож пропускает ЛЮБУЮ модель — важный шаг снова делается чем попало
    - дверь открывается пустой причиной, то есть обходится молча
    - модель сессии не читается вовсе, и сторож всегда «не смог спросить»
    - признак помощника во входе не читается, и каждого помощника принимают за смену
    - модель помощника читается из транскрипта смены, и opus-помощнику при смене на sonnet отказ
    - модель берётся из самого свежего транскрипта соседа-помощника, а не из своего по agent_id
    - смена, поднятая с --agent (agent_type без agent_id), пишет шаги трубы как помощник
    - сторож берёт маски из устаревшего раздела models.yaml, а не из файла артефактов
    - запись журнала без времени — model-guard.jsonl снова не положить на ось (417 строк 27.10)
    - время без пояса — наивная строка, на оси сдвиг на пять часов
    - время постоянное, а не момент записи — ось есть, событий на ней нет
  harness/demons/heartbeat-watch.sh:
    механизм: harness/demons/heartbeat-watch.sh
    доказательство: bash harness/demons/heartbeat-watch.sh --selftest
    подмена: '-'
    мутация:
    - 's@            if (name != "<synthetic>" && st != "")@            if (st != "")@'
    - 's@    TOKENS_FILE="${LOG_DIR}/расход-за-сутки.md"@    TOKENS_FILE="$TOKENS_REPORT"@'
