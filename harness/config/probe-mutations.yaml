    - 's@HOST_INDEPENDENCE_CHECK:-0}" = "1"@HOST_INDEPENDENCE_CHECK:-1}" = "1"@'
    - 's@^    if \[ "\${HOST_INDEPENDENCE_CHECK:-0}" = "1" \]; then$@    if false; then@'
    - 's@^        проверка "хозяин машины"  python3 scripts/check-host-independence.py$@        проверка "хозяин машины"  true@'
    мутация_случай:
    - 'copy_off_key_zero: ключ 0 — проверка всё равно идёт'
    - 'copy_off_key_missing: без ключа — проверка идёт'
    - 'host_on_key_one: ключ 1 — прибор не запущен'
    - 'host_on_key_one: строка ворот не зовёт прибор'
  harness/../scripts/./test_host_independence_scope.py:
