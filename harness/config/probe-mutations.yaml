# Связь «проба → механизм» для класса D живой проверки — ДАННЫЕ.
#
# Откуда взято. Спека docs/specs/2026-10-15-живая-проверка-механизмов.md §3.1
# (класс D) и ревью спеки, находки CRITICAL 8 и 9: связи в данных НЕ БЫЛО
# вовсе. Поле «доказательство» стояло у 9 механизмов из 253, а файлов проб в
# реестре 56 — то есть у пробы не было названо НИ механизма, который она
# охраняет, НИ поломки, на которой она обязана покраснеть.
#
# Почему свой носитель, а не invariants.yaml. У инвариантов пять читателей
# (покрытие, ворота, пайплайн, приёмка, сам прогон мутаций), и каждая новая
# графа там меняет смысл для всех пяти. Класс D — про пробы, а не про
# инварианты, и живёт отдельно.
#
# Что значит живая проверка механизма класса D: его мутацию ставят в МЕХАНИЗМ,
# который проба охраняет, и проба обязана покраснеть ИМЕННО своим случаем.
# Зелёная мутация — находка о ПРОБЕ, а не допуск.
#
# Формат. Ключ — файл пробы. Поля:
#   механизм      — файл, в который ставится мутация
#   мутация       — выражение sed (строка или список)
#   мутация_случай — чей случай обязан покраснеть (парно с «мутация»)
#   доказательство — команда пробы
#   подмена       — чем испорченная копия доезжает до пробы. Три ответа:
#                   имя переменной среды (проба читает путь механизма из неё),
#                   «-» (путь механизма стоит в самой команде пробы) и
#                   «из-копии» (двери нет вовсе: проба находит механизм РЯДОМ С
#                   СОБОЙ, поэтому из копии дерева зовётся сама проба — её путь
#                   обязан стоять в «доказательстве»). Третий ответ добавлен
#                   17.10.2026: без него 43 пробы класса D судили БОЕВОЙ файл и
#                   были зелены на любой мутации
#                   ([[probe-loads-the-live-mechanism]]).
#
# Текст «до» каждой мутации обязан встречаться в механизме РОВНО ОДИН РАЗ:
# судит `bash scripts/mutation-probe.sh --сверить-тексты`. Отставший текст не
# краснеет и не жалуется — после круга правок 13.10.2026 так отстали десять
# мутаций из 78.
#
# ДОЛГ. Здесь названа ОДНА проба из 56 файлов класса D — та, чьи мутации
# прогнаны живьём этой сменой. Остальные 55 наполняются живой проверкой класса
# D, а не записью наперёд: мутация, которую никто не прогонял, — обещание.

пробы:
  # check-host-independence.py: выбор круга, метка, срок (hr.host-independence-only-changed).
  scripts/test_host_independence_scope.py:
    механизм: scripts/check-host-independence.py
    доказательство: python3 scripts/test_host_independence_scope.py
    подмена: HOST_INDEPENDENCE_BIN
    мутация:
    - 's@^        return ПОЛНЫЙ, все, "метки чистого полного круга нет или она негодна"$@        return ИЗМЕНЁННЫЕ, [], "метки чистого полного круга нет или она негодна"@'
    - 's@^    if сейчас - ts >= срок_суток \* СУТКИ:$@    if False:@'
    - 's@^    if сейчас - ts >= срок_суток \* СУТКИ:$@    if сейчас - ts > 2 * срок_суток * СУТКИ:@'
    # сбой git ловят два места (дифф и ворота на метке): мутация бьёт в общий _git
    - 's@ if итог.returncode == 0 else None$@ if итог.returncode == 0 else ""@'
    - 's@^    if ПРИБОР & правлено:$@    if False:@'
    - 's@^        if ((имя, tuple(слова)) not in были$@        if (False@'
    - 's@or _замыкание(начало, корень, по_имени) @or начало @'
    - 's@^            очередь.append(файл)$@            pass@'
    - 's@^                or any(файл in от_механизмов for файл in начало)):$@                or False):@'
    - 's@(правлено + новые).split@правлено.split@'
    - 's@json.dumps({"sha": sha.strip(), "ts": сейчас})@json.dumps({"sha": sha.strip(), "ts": 0})@'
    - 's@json.dumps({"sha": sha.strip(), "ts": сейчас})@json.dumps({"sha": "0000000", "ts": сейчас})@'
    - 's@^        if режим == ПОЛНЫЙ and путь_метки is not None:$@        if путь_метки is not None:@'
    - 's@^    for б in беды:$@    if путь_метки is not None: write_mark(путь_метки, КОРЕНЬ, time.time())\n    for б in беды:@'
    - 's@^    return срок if срок > 0 else СРОК_ПО_УМОЛЧАНИЮ$@    return СРОК_ПО_УМОЛЧАНИЮ@'
    - 's@Path(os.environ.get("HOST_INDEPENDENCE_MARK")@Path(None@'
    - 's@^    return отчёт(ВОРОТА, ДАННЫЕ, путь_метки_по_умолчанию())$@    return отчёт(ВОРОТА, ДАННЫЕ)@'
    мутация_случай:
    - 'no_mark_full: базы нет — круг целиком'
    - 'week_passed_full: метке неделя — круг целиком'
    - 'week_passed_full: срок удвоен — неделя ещё «изменённые»'
    - 'git_failure_full: сбой git молча стал «ничего не изменилось»'
    - 'instrument_changed_full: изменился прибор — круг целиком'
    - 'new_gates_line_enters: новая строка gates.sh не попала'
    - 'closure_file_enters: файл замыкания не ведёт пробу в круг'
    - 'closure_file_enters: замыкание не идёт дальше первого шага'
    - 'mechanism_changed_enters: механизм реестра не ведёт пробу в круг'
    - 'changed_probe_enters: новый неотслеживаемый файл не в круге'
    - 'write_mark_shape: метка пишет не текущее время'
    - 'write_mark_shape: метка пишет не HEAD'
    - 'partial_keeps_mark: частичный круг двигает базу'
    - 'red_full_keeps_no_mark: красный круг двигает базу'
    - 'full_days_key: срок не берётся из HOST_INDEPENDENCE_FULL_DAYS'
    - 'default_mark_in_log_dir: HOST_INDEPENDENCE_MARK не слушается'
    - 'clean_full_writes_mark: главный вход не пишет метку'
  scripts/./test_host_independence_scope.py:
    # gates.sh: условие HOST_INDEPENDENCE_CHECK у строки «хозяин машины».
    механизм: scripts/gates.sh
    доказательство: python3 scripts/./test_host_independence_scope.py
    подмена: HOST_SCOPE_GATES_SH
