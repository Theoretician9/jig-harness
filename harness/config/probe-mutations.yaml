    - 's#key=lambda s: s not in agents_servers#key=lambda s: s in agents_servers#'
    мутация_случай:
    - 'L7: только claude -p под init, has-session=1 — absent;2'
    - 'claude под сервером -L — не основной (основных 1)'
    - 'claude --version вне tmux — absent;2, не orphan'
    - 'сервер агента без агента, has-session=1 — absent;2'
    - 'L4: два сервера по умолчанию — tmux-server тот, где агент'
  scripts/test_one_shift.py:
    # one-shift.sh: ждёт выхода лишнего агента и без MainPID не угадывает.
