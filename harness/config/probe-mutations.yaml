    # записи, строка fh.write(...) остаётся как есть — иначе три мутации «не встало».
    - 's@fh.write(json.dumps(запись, ensure_ascii=False)@fh.write(json.dumps({к: з for к, з in запись.items() if к != "ts"}, ensure_ascii=False)@'
    - 's@fh.write(json.dumps(запись, ensure_ascii=False)@fh.write(json.dumps({**запись, "ts": str(запись.get("ts"))[:19]}, ensure_ascii=False)@'
