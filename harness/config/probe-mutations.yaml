  # (у ключа с «#» файла нет, и кэш молча выключается).
  scripts/lib/../test_alert_task.py:
    # alert-task.py: тревоги снятого сторожа гаснут на --drain (R1-R9).
    механизм: scripts/alert-task.py
    доказательство: python3 scripts/lib/../test_alert_task.py --section retired
    подмена: HARNESS_ALERT_TASK
    мутация:
    # M1 обход выключен
    - 's@^    gone = {key: who for key, who in found.items() if who in retired}$@    gone = {}@'
    # M2 гаснет всё подряд
    - 's@ for key, who in found.items() if who in retired}$@ for key, who in found.items()}@'
    # M3 снята проверка «открыта»: строка «if» повторена в command_open, поэтому
    # из-под неё выносится тело
    - 's@^            found\[key\] = watcher_of(key, item\["birth"\].get("сторож"))$@            pass\n        found[key] = watcher_of(key, item["birth"].get("сторож"))@'
    # M4 очередь не обходится
    - 's@^    for row in queue_rows(paths):$@    for row in []:@'
    # M5 снят фильтр живого .sh
    - 's@^            and not (paths.project / "harness" / "demons" / f"{name}.sh").exists()$@            and True@'
    # M6 снят фильтр живого .py
    - 's@^            and not (paths.project / "scripts" / f"{name}.py").exists()}$@            and True}@'
    # M7 только префикс ключа
    - 's@found\[key\] = watcher_of(key, item\["birth"\].get("сторож"))@found[key] = watcher_of(key)@'
    # M8 порядок: донос раньше гашения (второй drain уже пуст)
    - 's@^    retired_count = retire_alerts(paths)$@    stats = drain(paths)\n    retired_count = retire_alerts(paths)@'
    # M9 причина потеряна
    - 's@why="сторож снят"@why=""@'
    # M10 не-UTF-8 снова роняет
    - 's@^    except (OSError, ValueError, yaml.YAMLError):$@    except (OSError, yaml.YAMLError):@'
    # M11 не-строка в списке снова роняет
    - 's@^    return {name for name in listed if isinstance(name, str)$@    return {name for name in listed if True@'
    # M12 не-список снова роняет
    - 's@^    if not isinstance(listed, list):$@    if listed is None:@'
    # M13 строка очереди с «зелёное» позже снова рождает второе
    - 's@^        if not green_after(lines, row\["key"\], str(row.get("ts"))):$@        if True:@'
    # M14 хвост строки доноса
    - 's@^    retired_tail = f", сторож снят {retired_count}" if retired_count else ""$@    retired_tail = ""@'
    # M15 не-словарь снова роняет
    - 's@ if isinstance(data, dict) else None$@@'
    # M16 битый YAML снова роняет
    - 's@^    except (OSError, ValueError, yaml.YAMLError):$@    except (OSError, ValueError):@'
    # M17 нет файла снова роняет
    - 's@^    except (OSError, ValueError, yaml.YAMLError):$@    except (ValueError, yaml.YAMLError):@'
    мутация_случай:
    - 'R1 журнал: одна строка «зелёное» по gone-watcher:red'
    - 'R2 контроль: строки «зелёное» по alive-watcher нет'
    - 'R3 повторный --drain: код 0, вторая «зелёное» не пишется'
    - 'R5 отложенное намерение снятого сторожа не рождает карточку'
    - 'R7 живой сторож в списке не гасится: listed-alive:red КРАСНОЕ'
    - 'R7 живой сторож в списке не гасится: listed-py:red КРАСНОЕ'
    - 'R6 тревога с чужим префиксом, но полем «сторож» из списка → «ЗЕЛЁНОЕ»'
    - 'R5 отложенное намерение снятого сторожа не рождает карточку'
    - 'R1 «почему» строки «зелёное» содержит «сторож снят»'
    - 'R8 кривой список (не UTF-8): --drain код 0 без трассировки'
    - 'R8 кривой список (словарь в списке): --drain код 0 без трассировки'
    - 'R8 кривой список (число): --drain код 0 без трассировки'
    - 'R10 снятая строка очереди не гасится второй раз: одна «зелёное», не «сторож снят»'
    - 'R1 строка доноса называет погашенное: «сторож снят 1»'
    - 'R8 кривой список (не словарь): --drain код 0 без трассировки'
    - 'R8 кривой список (битый YAML): --drain код 0 без трассировки'
    - 'R4 без файла: --drain код 0 без трассировки'
