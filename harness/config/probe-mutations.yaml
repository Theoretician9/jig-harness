    мутация:
    - 's@^    value="$(konf_iz_fajla BACKGROUND_PROCESSES)"$@    value=on@'
    - 's@^    state=off; value="?"; why=@    state=on; value="?"; why=@'
    - 's@^exit "$rc"$@exit 0@'
    - 's@process.skip skipped --json \(.*\)$@process.skip skipped --json \1; exit 1@'
    - 's@^HARNESS_TASK=- \(.*\) process.end @[ "$rc" -ne 0 ] || HARNESS_TASK=- \1 process.end @'
    - 's@^    \[ "$rc_again" -eq 127 \] || rc=$rc_again$@    :@'
    - 's#^"$@" </dev/null &$#"$@" </dev/null; fg_rc=$?; (exit $fg_rc) \&#'
    - 's@ || outcome=error$@ || outcome=killed@'
    мутация_случай:
    - '1 БОЛЬНОЙ СЛУЧАЙ: off — следа команды нет (обёртка не читает ключ)'
    - '4 БОЛЬНОЙ СЛУЧАЙ: файла конфига нет — выключено, выход 0 (нет файла → on)'
    - '2 rc команды (3) проходит насквозь (rc теряется, exit 0)'
    - '1 off — выход 0, а не rc команды (skip выходит 1)'
    - '2 одно process.start и одно process.end (process.end не пишется при rc≠0)'
    - '5 TERM: process.end — rc ребёнка 7, сигнал TERM, исход error (без повторного wait — rc 143)'
    - '5 TERM: обёртка дождалась ребёнка и ушла (ребёнок на переднем плане — TERM не доходит)'
