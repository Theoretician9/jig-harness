    - 'держатель update.lock не судится — раскладка рядом с обновлением проходит (L6)'
    - 'отказ любому держателю — раскладка, которую зовёт update.py, не идёт (L5)'
    - '«держатель не найден» читается как «свободно» — раскладка идёт мимо занятого замка (L7)'
    - 'ключ замка сравнивается подстрокой — чужой inode с общим началом читается держателем (L1)'
    - 'update.lock открывается с O_CREAT — проверка создаёт файл замка (пятое место записи, L3)'
