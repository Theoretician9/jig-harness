# Проверки самопроверки, предмет которых у каждой копии свой: судят не пакет
# харнеса, а машину или данные проекта копии. Наша машина их не видит, поэтому
# их судит замок 6г (scripts/check-typical-copy.py) на стенде с данными,
# похожими на живую копию.
#
# предмет: машина — живой crontab, юниты, tmux копии. Новая красная после
#   обновления значит, что харнес на копии встал криво: откат.
# предмет: данные — учтённые файлы и очередь сообщений проекта копии. Новая
#   красная — находка нового судьи в данных копии или долг, набежавший за часы
#   обновления; откат её не снимает. Обновление встаёт, копии названо, что
#   поправить у себя (scripts/update.py). Находка копии сети 15.11.2026: «секреты» и
#   «указания» откатили 0.13.0.
проверки:
  - имя: библиотека процессов
    предмет: машина
    почему: сверяет библиотеку с живым crontab и юнитами копии
  - имя: изоляция tmux
    предмет: машина
    почему: судит свои .sh копии и её сессии tmux
  - имя: секреты
    предмет: данные
    почему: судит все учтённые файлы проекта копии, её код продукта тоже
  - имя: указания
    предмет: данные
    почему: судит очередь сообщений владельца копии и её память/ORDERS.md
