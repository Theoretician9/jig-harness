# ДАННЫЕ публичной сборки. Читает harness/scripts/build-public.py.
#
# Ни одного литерала конкретной установки: этот файл САМ едет в сборку вместе
# со сборщиком, и вписанный сюда путь или номер чата сделал бы гейт чистоты
# красным навсегда (ревью спеки 12.09.2026, находка №2). Поэтому здесь имена
# ключей паспорта, а значения сборщик берёт из /etc/harness/install.conf.

# Маски того, что наружу не идёт. Сегодня пусто, и это решение, а не недосмотр:
# harness/STATE.md, harness/dev-map.yaml и harness/CLAUDE.md — ЗАГОТОВКИ первой
# установки (задачи hr.accept, hr.rotation, pr.first), а не следы разработки.
# Их исключение оставило бы новую установку без первой задачи и с битыми
# @-импортами (ревью №3).
исключить: []

# Что уезжает вглубь, чтобы не быть первым экраном человека. Владелец
# 12.09.2026: «Папки UNIFIED и Разработка они для чего? В публичном гите, какую
# выполняют роль, зачем нужны пользователю?». Роль есть: UNIFIED — исходники
# правил, из которых код собирает скилы агента. Но 1,1 МБ глав в корне читаются
# как груз. Решение владельца (вариант 1): оставить и объяснить — здесь перенос,
# в README объяснение каждого верхнего каталога.
#
# Кто ищет UNIFIED после переноса: раскладчик (razlozhit-harnes.sh) и генератор
# скилов (BUILD-SKILLS.py) — оба знают обе раскладки, старую и новую.
перенести:
  UNIFIED: sluzhebnoe/UNIFIED

# Файл едет, но своей заготовкой. Замер речи владельца — его личные данные;
# заготовка несёт машинную строку потолков, которую читает check-channel-messages.py.
заменить_шаблоном:
  harness/память/TONE.md: harness/шаблоны-задач/ТОН-заготовка.md
  # Список пар САМ состоит из дословной речи владельца: обезличив код, сборка
  # уносила бы наружу все цитаты одним файлом (замер 13.10.2026 — 13 пар).
  # Пары читаются сборщиком ИЗ ПРОЕКТА, поэтому подмена в сборке ничего не
  # ломает, а новой установке заготовка даёт формат.
  harness/config/owner-quotes.yaml: harness/шаблоны-задач/owner-quotes-заготовка.yaml
  # Состояние живой проверки — записи ЭТОЙ установки (что трогали руками, что
  # увидели, куда заведён косяк). Наружу едет заготовка с пустым разделом
  # «проверено»: иначе новая машина получает чужие пути в записях и зелёную
  # приёмку без единой живой проверки.
  harness/config/live-check-state.yaml: harness/шаблоны-задач/live-check-state-заготовка.yaml

# ИМЕНА ключей паспорта. Значение каждого заменяется на ${ИМЯ} и только в
# документах (*.md): в коде замена пути меняет умолчание, а это чинится
# причиной, а не подстановкой (спека §3).
# Дословные цитаты владельца в КОДЕ: их смысл наружу уходит, личная речь —
# нет (его решение 28.09.2026 из трёх предложенных путей). Пары лежат
# отдельным файлом рядом; цитата без пары роняет сборку.
цитаты_файл: owner-quotes.yaml

обезличить_ключи:
  - PROJECT_DIR
  - PROJECT_NAME
  - PRODUCT_DIR
  - TG_CHAT_ID
  - AGENT_USER

# Эти файлы обязаны БЫТЬ в собранном дереве. Это проверка наличия, а не белый
# список: умолчание сборки — «всё, кроме исключённого». Первые четыре — цели
# @-импортов harness/CLAUDE.md, без них новая установка стартует с битыми
# ссылками.
оставить:
  - sluzhebnoe/UNIFIED/01-ПРИНЦИПЫ-И-ПРАВИЛА.md
  - harness/CLAUDE.md
  - harness/STATE.md
  - harness/память/ORDERS.md
  - harness/память/MEMORY.md
  - harness/память/TONE.md
  - harness/dev-map.yaml
  - harness/scripts/publish.sh
  - harness/config/public-build.yaml
  - USTANOVIT.sh
  - README.md
