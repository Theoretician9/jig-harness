  scripts/check-map-writers.py:
    команда: python3 scripts/check-map-writers.py
    чем_ломать: printf 'import pathlib\nКОРЕНЬ = pathlib.Path(".")\nKARTA = КОРЕНЬ / "dev-map.yaml"\nKARTA.write_text("x")\n'
