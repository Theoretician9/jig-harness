# Больные случаи гейтов-судей: чем сломать КОПИЮ дерева, чтобы гейт покраснел.
#
# Откуда взято: спека живой проверки §3.1, класс C1 — «одного зелёного мало».
# Прогон: scripts/live-check-sick.py (чем доказан — scripts/test_live_check_sick.py).
#
# Поля:
#   команда       — как гейт зовёт жизнь (строка берётся из scripts/gates.sh)
#   чем_ломать    — команда, нарушающая ИМЕННО то правило, которое гейт охраняет
#                   (род первый: предмет гейта лежит в ДЕРЕВЕ)
#   больной_довод — вместо «чем_ломать» у гейтов, чей предмет приходит ДОВОДОМ:
#                   текст сообщения, команда на stdin, путь журнала. Поломкой
#                   дерева такой гейт не покрасить вовсе — его зовут больным
#                   доводом. Замер 17.10.2026: из 63 непроверенных гейтов-судей
#                   таких 24. Способ ровно один на случай: оба поля сразу —
#                   отказ прибора, за данные он не выбирает
#   ждём_в_отказе — подстрока, которую может напечатать ТОЛЬКО это правило:
#                   один код возврата служит целому классу бед, и «красный»
#                   без своего слова доказывает лишь, что что-то сломалось
#
# Имена файлов поломки — ЛАТИНИЦЕЙ (кроме случая, который судит как раз имя):
# каталог кода судит гейт имён, и поломка не должна краснить соседа.

больные_случаи:
  scripts/check-cyrillic-in-names.py:
    команда: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 python3 scripts/check-cyrillic-in-names.py
    чем_ломать: printf 'ИМЯ_ПЕРЕМЕННОЙ=1\necho "$ИМЯ_ПЕРЕМЕННОЙ"\n' > scripts/sick_case_cyrillic.sh
    ждём_в_отказе: имя переменной кириллицей
  scripts/write-memory.py:
    команда: printf 'факт смены\n' | python3 scripts/write-memory.py zdorovyj-sluchaj.md
    больной_довод: printf 'текст\n' | python3 scripts/write-memory.py ../ugon.md
    ждём_в_отказе: не годится
  scripts/check-owner-senders.py:
    команда: python3 scripts/check-owner-senders.py
    чем_ломать: printf 'curl "https://api.telegram.org/bot$T/sendMessage" -d chat_id=1\n' > scripts/sick_case_sender.sh && git add scripts/sick_case_sender.sh
    ждём_в_отказе: говорит с Bot API НАПРЯМУЮ
  # Имя продукта в этих данных хранить НЕЛЬЗЯ: его и запрещает судимый гейт —
  # первая редакция положила «/var/www/<имя>» прямо сюда, и гейт честно
  # покраснел на моей же записи (2 вхождения в 2 файлах). Поломка берёт имя из
  # данных в момент прогона, а здесь остаётся только имя КЛЮЧА.
  scripts/check-harness-clean.py:
    команда: python3 scripts/check-harness-clean.py
    чем_ломать: printf 'PUT = "/var/www/%s/app"\n' "$(python3 -c 'import sys;sys.path.insert(0,"scripts/lib");import config;print(config.конфиг(config.путь_harness_conf())["PRODUCT_DIR"])')" > scripts/sick_case_product.py
    ждём_в_отказе: ИМЯ ПРОДУКТА В ХАРНЕСЕ
  scripts/check-panel-boundary.py:
    команда: python3 scripts/check-panel-boundary.py
    больной_довод: host=$(python3 -c 'import sys;sys.path.insert(0,"scripts/lib");import config;from urllib.parse import urlparse;print(urlparse(config.конфиг(config.путь_harness_conf())["PANEL_URL"]).hostname)') && port=$(grep -o -- "--порт [0-9]*" /etc/systemd/system/harness-panel.service | head -1 | awk '{print $2}') && printf '#!/bin/sh\nprintf "# configuration file /etc/nginx/sites-enabled/panel.conf:\\nserver {\\n listen 443 ssl default_server;\\n server_name %s;\\n location / { proxy_pass http://127.0.0.1:%s; }\\n location /vnutr/ { return 404; }\\n}\\n"\n' "$host" "$port" > scripts/sick_nginx.sh && chmod +x scripts/sick_nginx.sh && NGINX_BIN=./scripts/sick_nginx.sh python3 scripts/check-panel-boundary.py
    ждём_в_отказе: объявлен default_server
  scripts/capability.sh:
    команда: bash scripts/capability.sh список
    больной_довод: bash scripts/capability.sh требования net-takoj-vozmozhnosti
    ждём_в_отказе: нет возможности
  scripts/panel-unit.sh:
    команда: PANEL_UNIT_DIR=$(mktemp -d) bash scripts/panel-unit.sh
    больной_довод: T=$(mktemp -d) && mkdir -p "$T/pusto" && printf 'PROJECT_DIR="%s/pusto"\n' "$T" > "$T/install.conf" && HARNESS_INSTALL_CONF="$T/install.conf" PANEL_UNIT_DIR="$T" bash scripts/panel-unit.sh
    ждём_в_отказе: нет шаблона юнита
  scripts/firewall-docker-ports.sh:
    команда: bash scripts/firewall-docker-ports.sh --проверить
    больной_довод: DOCKER_PORTS_ALLOWED="9999" bash scripts/firewall-docker-ports.sh --проверить
    ждём_в_отказе: правила не совпадают с намеченными
  harness/panel/panel-expose-root.sh:
    команда: bash harness/panel/panel-expose-root.sh --снять
    больной_довод: S=$(mktemp -d) && mkdir -p "$S/sites-available" "$S/sites-enabled" && NGINX_DIR="$S" bash harness/panel/panel-expose-root.sh 'ne-host!!'
    ждём_в_отказе: не похоже на имя хоста
  scripts/check-imports.py:
    команда: python3 scripts/check-imports.py
    чем_ломать: printf 'import scripts.net_takogo_modulya\n' > scripts/sick_case_import.py
    ждём_в_отказе: scripts.net_takogo_modulya
  scripts/check-function-before-definition.py:
    команда: python3 scripts/check-function-before-definition.py
    чем_ломать: printf '#!/usr/bin/env bash\nmoya_funkciya\nmoya_funkciya() { echo tut; }\n' > scripts/sick_case_order.sh
    ждём_в_отказе: sick_case_order.sh
  scripts/check-file-names.py:
    команда: git -c core.quotepath=false diff --cached --name-only --diff-filter=AR | python3 scripts/check-file-names.py
    чем_ломать: printf 'x = 1\n' > scripts/кириллическое-имя.py
    ждём_в_отказе: кириллическое-имя.py
  scripts/check-quotepath-flag.py:
    команда: python3 scripts/check-quotepath-flag.py
    чем_ломать: printf 'import subprocess\nsubprocess.run(["git", "ls-files"])\n' > scripts/sick_case_quotepath.py
    ждём_в_отказе: sick_case_quotepath.py
  scripts/check-failure-under-set-e.py:
    команда: python3 scripts/check-failure-under-set-e.py
    чем_ломать: printf '#!/usr/bin/env bash\nset -euo pipefail\nNAJDENO=$(cat /etc/hostname | grep -c
      x)\necho "$NAJDENO"\n' > scripts/sick_case_set_e.sh
