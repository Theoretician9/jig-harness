    чем_ломать: printf 'SOOBSHCHENIE = "упёрлись в лимит подписки"\n' > scripts/sick_case_signal.py
    ждём_в_отказе: sick_case_signal.py
  scripts/check-extensions.py:
    команда: python3 scripts/check-extensions.py
    чем_ломать: 'printf ''Поставить так: `/plugin marketplace add primer/rasshirenie`\n'' > docs/sick-case-rasshirenie.md'
    ждём_в_отказе: слэш-форма
  scripts/check-switches.py:
