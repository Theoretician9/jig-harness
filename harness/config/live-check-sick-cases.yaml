    чем_ломать: 'python3 -c "import io,yaml; p=''harness/config/system-jobs.yaml''; d=yaml.safe_load(io.open(p,encoding=''utf-8''));
      м=d[''метки'']; (м.append(''sick-case-metka'') if isinstance(м,list)  else м.update({''sick-case-metka'':
      {}})); io.open(p,''w'',encoding=''utf-8'').write(yaml.dump(d,allow_unicode=True,sort_keys=False))"'
    ждём_в_отказе: sick-case-metka
  scripts/check-unified-seekers.py:
