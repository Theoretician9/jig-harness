    чем_ломать: 'python3 -c "import io,yaml,copy; p=''harness/config/switches.yaml''; d=yaml.safe_load(io.open(p,encoding=''utf-8''));
      к=[x for x in d if isinstance(d[x],(list,dict))][0]; л=d[к]; (л.append(copy.deepcopy(л[0])) if isinstance(л,list)
      else  л.update({list(л)[0]+''_sick'': copy.deepcopy(л[list(л)[0]])})); io.open(p,''w'',encoding=''utf-8'').write(yaml.dump(d,allow_unicode=True,sort_keys=False))"'
    ждём_в_отказе: описан дважды
  scripts/check-own-text-probes.py:
    команда: python3 scripts/check-own-text-probes.py
    чем_ломать: printf 'import pathlib\nТЕКСТ = pathlib.Path(__file__).read_text()\nprint(len(ТЕКСТ))\n'
      > scripts/sick_case_own_text.py
    ждём_в_отказе: sick_case_own_text.py
