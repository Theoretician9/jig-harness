    чем_ломать: 'python3 -c "import io,yaml; p=''harness/config/mechanisms.yaml''; d=yaml.safe_load(io.open(p,encoding=''utf-8''));
      m=d if isinstance(d,list) else d[''механизмы'']; m.append({''файл'':''scripts/sick_case_nobody_calls.py'',''вид'':''гейт'',''тема'':''честность
      проверок'',''имя'':''Проверка, которую никто не зовёт'',''роль'':''Больной случай живой проверки:
      механизм объявлен, а вызова нет.'',''когда'':''в прогоне ворот'',''без_него'':''Ничего — это больной
      случай.'',''доказательство'':''scripts/sick_case_nobody_calls.py'',''проверяется'':''python3 scripts/sick_case_nobody_calls.py'',''пишет'':''ничего'',''заведён'':''2026-10-17''});
      io.open(p,''w'',encoding=''utf-8'').write(yaml.dump(d,allow_unicode=True,sort_keys=False)); io.open(''scripts/sick_case_nobody_calls.py'',''w'',encoding=''utf-8'').write(''x
      = 1\n'')"'
