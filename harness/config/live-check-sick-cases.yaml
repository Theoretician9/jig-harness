    чем_ломать: 'python3 -c "import pathlib,re; p=pathlib.Path(''dev-map.yaml''); t=p.read_text(); m=re.search(r''^(\s*)summary:
      \"(.*)\"\s*$'', t, re.M); p.write_text(t[:m.start(2)] + m.group(2) + '' длинная подробность''*40
      + t[m.end(2):])"'
