# Данные разбора обновлений сервера (scripts/update_impact.py). Код ветвей «если слово такое-то» не имеет.
#
# слова: класс → список образцов (регулярные выражения Python, ищутся по строкам записи об изменениях).
#   Класс «безопасность» ставится и без слов: карман `-security`, `security: true` в индексе node.
#   «новое» у пакетов Ubuntu в `-updates`/`-security` ставится ТОЛЬКО по этим словам: политика SRU запрещает там
#   новые возможности. «ломающее» — по словам ИЛИ при смене старшего номера автора пакета (без эпохи и без
#   ревизии дистрибутива): настоящее SRU его не меняет, меняют исключения из SRU (спека §3.2).
#   «исправление» — всё прочее, слов не имеет.
# cve: образец номера уязвимости; номера берутся только из записей вырезки.
слова:
  безопасность:
    - 'SECURITY UPDATE'
    - 'CVE-\d{4}-\d+'
    - '(?i)security release'
  ломающее:
    - 'BREAKING'
    - 'Removed'
    - 'removed support'
    - 'no longer'
    - '(?i)deprecated.*removed'
  новое:
    - '(?m)^\W*(Added|New)\b'
cve: 'CVE-\d{4}-\d+'
# имена: где искать наши имена в дереве (git ls-files / git grep). Что не наш код — не источник имён.
#   не_наш_код — пути git (исключения pathspec): документы, карточки задач, память не пользуются частью, а рассказывают о ней.
#   файлов_на_имя — сколько путей «файл:строка» кладётся в задетое имя (остальное — счётом «ещё_файлов»).
имена:
  не_наш_код: ['*.md', '.tasks', 'docs', 'память']
  файлов_на_имя: 20
# модель: вызов через scripts/ask-the-model.py (повод описан в model-call-reasons.yaml).
#   вход_знаков — потолок знаков одного вызова (вопрос целиком); запись, не влезшая одна, — «не_вместилось».
#   таймаут_с — предел ожидания процесса вызова (чуть больше таймаута самой модели, 300 с).
#   что_меняется — допустимые значения поля ответа; чужое значение отбрасывается сверкой.
модель:
  повод: разбор-обновления
  вход_знаков: 40000
  таймаут_с: 330
  что_меняется: [удалено, переименовано, поведение, новое, безопасность]
# Карточка правки кода (§3.6): линия карты (id), куда разбор заводит карточку; карточка в plan дольше
# стольких суток — строка отчёта «ждёт правки кода N суток», не чаще раза в тот же срок (§6).
карточка:
  линия: harness
  напоминать_суток: 7
