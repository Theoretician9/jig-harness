# Какой артефакт выдаёт шаг: путь → (вид работы, кто делает). ДАННЫЕ.
#
# Почему файл отдельный: маски — устройство харнеса, раскладка кладёт его
# каждый раз; выбор моделей владельца — в models.yaml, он живой и не затирается.
#
# Читает scripts/hooks/model_guard.py (сторож модели) — только отсюда.
# ПОРЯДОК ВАЖЕН: первая подошедшая маска побеждает, частное стоит выше общего.
# «помощник» значит: писать этот файл из самой смены сторож не даёт, сессия
# остаётся оркестратором. Состояние, карта, память и передача — работа СМЕНЫ,
# их здесь нет, и они идут свободно.
артефакты:
  # Бумага шага «безопасность»: сторож не даёт писать её смене, хук artifact_seal.py
  # ставит печать (кто, какой моделью, хеш файла) — гейт закрытия судит печать.
  ".tasks/*/безопасность.yaml": { вид: безопасность, кто: помощник, печать: true }
  "docs/specs/*-CODE-REVIEW.md": { вид: ревью_кода, кто: помощник }
  "docs/specs/*-REVIEW.md": { вид: ревью_спеки, кто: помощник }
  "docs/specs/*": { вид: спека, кто: помощник }
  "docs/plans/*": { вид: план, кто: помощник }
  ".tasks/*/pretask.yaml": { вид: контракт, кто: помощник }
  ".tasks/*/review/*": { вид: ревью_кода, кто: помощник }
  "scripts/test_*": { вид: тесты, кто: помощник }
  "scripts/hooks/test_*": { вид: тесты, кто: помощник }
  "harness/demons/test_*": { вид: тесты, кто: помощник }
  "harness/panel/test_*": { вид: тесты, кто: помощник }
  # Код харнеса — тоже шаг трубы, его пишет помощник.
  "scripts/*.py": { вид: код, кто: помощник }
  "scripts/*.sh": { вид: код, кто: помощник }
  "scripts/hooks/*": { вид: код, кто: помощник }
  "scripts/lib/*": { вид: код, кто: помощник }
  "harness/demons/*": { вид: код, кто: помощник }
  "harness/panel/*": { вид: код, кто: помощник }
