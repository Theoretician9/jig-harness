# ДАННЫЕ: у каждого наблюдаемого факта ОДИН источник истины.
#
# Владелец 12.09.2026 (ночь): «Реши системно все эти проблемы» — о череде
# отказов, у которых один корень. За ночь их было три:
#   • сторож сессий писал владельцу «с лимитом подписки это не связано», а его
#     же ветка в ту же минуту видела отказ 429 в журнале;
#   • напоминание конца хода требовало согласия владельца на отправку в гит,
#     а сторож выката отвечал «ручка PUSH_NEEDS_OWNER отпущена, не спрашивать»;
#   • автомат карточек заводил задачу из вопроса владельца, а прибор срочности
#     в тот же миг говорил «это не работа».
#
# Класс один: два механизма судят об одном факте, и каждый считает его САМ.
# Копия суждения расходится с оригиналом молча — и владелец получает два
# противоречащих сигнала.
#
# Читает scripts/check-signals.py. Правило гейта: файл, который судит о факте
# (в нём есть слово-маркер), обязан звать источник — или стоять в «знают_сами»
# с причиной.

признаки:
  - факт: "лимит подписки"
    источник: "limit-in-log.py"
    где: scripts/limit-in-log.py
    маркеры: ["лимитом подписки", "лимит подписки"]
    почему: >
      Признак машинный: запись rate_limit / 429 в журнале сессии. Экранный
      текст — догадка, я и сам печатаю слово «лимит» в отчётах.
      С 13.09.2026 разбор вынесен в отдельный прибор: тот же факт спрашивают
      ДВА сторожа — десятиминутный session-warden и ежеминутный limit-watch, —
      и копия разбора внутри одного из них разошлась бы с другой молча.
    знают_сами:
      - файл: scripts/check-signals.py
        причина: "сам реестр и его гейт — они о факте не судят, а следят за судьями"
      - файл: scripts/test_limit_watch.sh
        причина: "проба сторожа: она проверяет судью, а не судит сама"
      - файл: scripts/test_claude_demon.sh
        причина: "проба обёртки демонов: проверяет судью на подставном выводе"
      - файл: harness/demons/devmap-selfheal.sh
        причина: "пересказывает решение обёртки: сам судит только по коду возврата 77"
      - файл: scripts/check-login-expiry.py
        причина: "пересказывает решение обёртки: судит по её коду возврата 77, а судью о лимите зовёт сама обёртка"
      - файл: scripts/alert-task.py
        причина: "пересказывает чужое решение двери tg_send: сам о лимите не судит, судья вызывается там"
      - файл: harness/demons/check-builder.sh
        причина: "то же: слово в логе, решение принято обёрткой claude-demon.sh"
      - файл: harness/demons/ton-watch.sh
        причина: "то же: слово в логе, решение принято обёрткой claude-demon.sh"
      - файл: scripts/tg_send.sh
        причина: "дверь канала о лимите не судит: спрашивает судью МЕТКИ остановки (limit_mark.py --лимит-держится), который и есть единственный держатель этого факта"
      - файл: scripts/limit_mark.py
        причина: "судья метки остановки: час сброса ему кладут ЧИСЛОМ те, кто позвал судью лимита; сам он журнал сессии не читает"
      - файл: scripts/test_limit_silence.sh
        причина: "проба правила тишины: проверяет дверь и судью метки, а не судит сама"
      - файл: scripts/check-owner-senders.py
        причина: "храповик прав отправителей: судит списки файлов, а не наличие лимита"
      - файл: harness/config/owner-senders.yaml
        причина: "данные храповика: называют право говорить при лимите, факта не судят"
      - файл: scripts/test_warden_limit_one_number.sh
        причина: "проба вести сторожа о лимите: гоняет session-warden.sh на подставном журнале и сверяет его текст, сама о лимите не судит"
      - файл: harness/demons/speed_mode.py
        причина: "пересказывает решение судьи метки остановки: потолок «лимит» берёт из limit_mark.лимит_держится(), журнал сессии сам не читает"
      - файл: harness/demons/checks-stream.sh
        причина: "пересказывает решение обёртки: о лимите судит только по коду её возврата 77, журнал сессии не читает; слова «лимит подписки» стоят в тексте вести и в комментарии"
      - файл: scripts/test_heartbeat_held_line.py
        причина: "проба сторожа меток: слова «лимит подписки» стоят в подставной записи придержанной вести (формат двери канала), о лимите проба не судит"

  - факт: "файл принадлежит харнесу"
    источник: "compare-with-package.py"
    где: scripts/compare-with-package.py
    маркеры: ["принадлежит харнесу", "файл харнеса", "файлов харнеса"]
    почему: >
      Что относится к харнесу, а что к живым данным сервера, знает таблица
      СООТВЕТСТВИЯ (проектный путь в путь пакета) и список ЖИВЫЕ. Свой обход
      дерева внутри другого механизма — второй судья того же факта: он
      разойдётся с раскладкой молча, и файл либо потребует паспорта, не
      принадлежа харнесу, либо пропадёт из домена, принадлежа ему.
      Гейт устройства с 13.09.2026 держит ССЫЛКУ на модуль-судью, а не копию
      таблицы: копия неотличима от своего списка.
    знают_сами:
      - файл: scripts/check-signals.py
        причина: "сам гейт реестра"
      - файл: scripts/test_hackathon.py
        причина: "проба режима хакатон: слово стоит только в названии случая, сверка идёт по списку путей hackathon-forbidden.yaml, а принадлежность харнесу она не судит"

  - факт: "согласие владельца на действие"
    источник: "deploy_guard.py"
    где: scripts/deploy_guard.py
    маркеры: ["согласия владельца", "согласие владельца"]
    почему: >
      Согласие — это ручки PUSH_NEEDS_OWNER / ROTATE_NEEDS_OWNER плюс запись в
      confirmations.jsonl со сроком годности. Своё суждение мимо сторожа
      выката либо просит лишнего, либо пропускает опасное.
    знают_сами:
      - файл: harness/demons/session-warden.sh
        причина: "пересказывает владельцу решение сторожа, своего суждения не выносит"
      - файл: scripts/publish.sh
        причина: "зовёт deploy_guard.py напрямую как замок 2"
      - файл: scripts/check-signals.py
        причина: "сам гейт реестра"

  - факт: "какая задача идёт сейчас"
    источник: "work-queue.py"
    где: scripts/work-queue.py
    маркеры: ["задач в работе", "текущая задача", "задача идёт сейчас"]
    почему: >
      Порядок работы считает один прибор: веса признаков, свежесть источника и
      активное направление живут там. Улика 13.09.2026: панель считала работой
      только статус «wip» и показала владельцу «задач в работе нет», пока шла
      работа, — он прочёл это на экране и написал в канал.
    знают_сами:
      - файл: scripts/check-signals.py
        причина: "сам гейт реестра"
      - файл: scripts/launch-plan.py
        причина: "«задач в работе» там — число задач под заявками живых помощников (launch_plan_lib.live_state), мера загрузки, а не порядок очереди; при включённом режиме скорости число задач в работе берётся из speed_mode.in_work"
      - файл: scripts/test_launch_plan.py
        причина: "проба плана запуска: сверяет строку ёмкости launch-plan.py, сама о задаче не судит"
      - файл: scripts/test_speed_mode.py
        причина: "проба судьи скорости: слова «задач в работе» стоят в описаниях случаев и в проверяемых текстах; число задач в работе судит сам speed_mode, порядок очереди проба не судит"
      - файл: scripts/test_warden_speed.sh
        причина: "проба сторожа: сверяет текст совета «Лишних задач в работе: N», который ставит сторож по ответу судьи скорости; о задаче сама не судит"

  - факт: "сообщение владельца несёт работу"
    источник: "рабочее"
    где: scripts/tasks-from-channel.py
    маркеры: ["несёт работу", "признак работы"]
    почему: >
      Один список слов на всех: гейт исходов, автомат карточек и прибор
      срочности обязаны судить одинаково, иначе задача заводится там, где её
      нет, и не заводится там, где есть.
    знают_сами:
      - файл: scripts/check-signals.py
        причина: "сам гейт реестра"
      - файл: scripts/lib/events.py
        причина: "слово «признак работы» там о работе СЕССИИ (строка расхода tokens-*.jsonl для суждения о тишине журнала), а не о сообщении владельца; сообщения владельца библиотека не судит"
      - файл: scripts/test_queue_importance.py
        причина: "слово стоит в тексте подставной карточки стенда, сообщений владельца проба не судит"
