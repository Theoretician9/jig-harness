# Покрытие инвариантов механизмами — ДАННЫЕ для scripts/invariant-coverage.py.
#
# Заведено 10.09.2026 по замечанию владельца М-1 к ревизии харнеса: ревизия шла
# снизу вверх (осматривала то, что есть), и непокрытый инвариант в такую ревизию
# не попадает по построению — осматривать нечего. Здесь обратный ход: строка на
# инвариант, и для каждого — чем держится, где код, чем доказан и по какому
# журналу видно, что механизм ЖИВОЙ, а не просто существует.
#
# Поля: правило (что обязано соблюдаться) · механизм · файл (наличие
# проверяется) · доказательство (команда, краснеющая при нарушении; пустая =
# «прибора нет», строка попадает в отдельный список) · журнал и признак (след
# срабатывания) · срок_дней (0 = след не обязателен: срабатывает редко).
# Английские названия инвариантов для собираемого CLAUDE.md публичной сборки
# (scripts/build-claude-md.py). Лежат здесь, а не в генераторе: перевод рядом
# с оригиналом — одно место, иначе разъедется при первой правке формулировки.
названия_en:
  И-1: "Never lose data. Irreversible work on a DB or files only with a fresh backup; destructive commands on production only through the guard."
  И-2: "Never deploy around the gates. Deployment is `deploy.sh` only (gates, tag, auto-rollback); a hand-typed sequence is forbidden."
  И-3: "Secrets stay out of the repo and the web root. Keys and tokens never reach git or a public directory."
  И-4: "Honest reporting. \"Done\" only after a live check; a green test is not a working feature."

# Механизмы, которые несут инвариант, но мутации иметь НЕ МОГУТ — с причиной.
# Читает scripts/invariant-coverage.py: без этого списка он краснел бы на
# законном случае, а краснеющий без причины гейт отключают.
без_мутации:
  - файл: scripts/emergency-send.sh
    причина: >
      Аварийная связь нарочно без самотеста: она зависит только от самых простых
      команд системы и работает, когда лёг сам харнес. Мутировать нечего — нет
      пробы, которая обязана покраснеть.

инварианты:
  - id: И-1-бэкап
    правило: "Не терять данные: необратимое — только при свежем бэкапе"
    механизм: "ежесуточный дамп, дочитанность дампа и bundle verify"
    файл: harness/demons/backup.sh
    доказательство: "bash harness/demons/backup.sh --selftest"
    журнал: backup.log
    признак: "дамп завершён"
    срок_дней: 2
    мутация:
      - "s/tail -c 4096 \"$1\" 2>\\/dev\\/null | grep -q 'PostgreSQL database dump complete'/true/"
      - "s#^    \\[ \"$ne_smog\" = 0 \\]$#    return 0#"
      - "s#^if \\[ \"${ROT_OTKAZ:-0}\" != 0 \\]; then$#if false; then#"
      - "s#^    \\[ -n \"$stroka\" \\] && say \"$stroka\"$#    :#"
    мутация_случай:
      - "проверка дочитанности дампа всегда отвечает «да»"
      - "ротация всегда возвращает 0 — число неудалённых не доедет до вызывающего"
      - "вызывающий не прибавляет неудачи ротации к отказам прогона: метка встанет"
      - "строки ротации не доходят до журнала — отказ снова виден только в stderr"
  - id: И-1-удаление
    правило: "Деструктивные команды по проду — только через сторожа"
    механизм: "guard_bash: drop database, rm по защищённым путям, prune -a"
    файл: scripts/hooks/guard_bash.py
    доказательство: "python3 scripts/hooks/test_guard_bash.py"
    # Проба живёт в ОТДЕЛЬНОМ файле: без подмены пути мутационный прогон гонял бы
    # боевой тест против боевого сторожа и всегда получал зелёное (замер
    # 28.09.2026 — три мутации этой строки «не поймались»).
    мутация_подмена: GUARD_UNDER_TEST
    журнал: guard.jsonl
    признак: '"verdict": "deny"'
    срок_дней: 0
    мутация: "s/^PRUNE_ALL = re.compile($/PRUNE_ALL = re.compile(r'(?!x)x'); _старое = re.compile(/"
    мутация_случай: "правило про prune -a обезврежено"
    мутация_подмена: "GUARD_UNDER_TEST"
  - id: И-1-проба-восстановления
    правило: "Бэкап, из которого не вставали, — не бэкап"
    механизм: "проба: дамп прода поднимается в отдельную базу стенда"
    файл: scripts/restore-probe.sh
    доказательство: "bash scripts/restore-probe.sh"
    тяжёлый: да        # поднимает базу на 278 МБ, идёт минутами
    журнал: проба-восстановления.log
    признак: "ПРОБА ЗАВЕРШЕНА"
    срок_дней: 30
    мутация:
      - "s/^    grep -m3 -n -E \"\\^\\\\\\\\\\\\\\\\(connect|c)/    grep -m3 -n -E \"^zzz-нет-такого(/"
      - "s#^    \\[ \"${2:-}\" = \"true\" \\] && return 1$#    :#"
      - "s#^    \\[ \"${1:-0}\" = 1 \\]$#    true#"
      - "s#tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24#date +%s%N | head -c 24#"
      - "s#^    printf '%s' \"${1:-}\" | grep -q \"ready for start up\"$#    return 0#"
      - "s#^        docker volume rm -f \"$staryj\" >/dev/null 2>&1 && ubrano_tom=$((ubrano_tom + 1))#        :#"
    мутация_случай:
      - "признак чужой базы в дампе обезврежен"
      - "свой контейнер поднимается ВСЕГДА, в том числе рядом с работающей базой продукта"
      - "замок снят: роли из дампа создавались бы в БОЕВОЙ СУБД продукта"
      - "пароль одноразовой базы взят из метки времени — предсказуем"
      - "маркер готовности объявлен полученным всегда: гонка с временным сервером вернулась"
      - "жнец не убирает тома прошлых прогонов — утечка 1,1 ГБ за ночь возвращается"
    мутация_доказательство: "bash scripts/restore-probe.sh --selftest"
  - id: И-2-выкат
    правило: "Выкат только deploy.sh: гейты, тег, авто-откат"
    механизм: "guard_bash запрещает ручные последовательности, deploy_guard — ворота"
    файл: scripts/deploy_guard.py
    доказательство: "python3 scripts/test_deploy_guard_consent.py"
    журнал: deploy.log
    признак: "deploy ok"
    # Ноль — «след не обязателен»: выкатов нет с 21.09.2026, продукт погашен
    # владельцем, и требовать свежий след выката значит красить ворота за
    # ЕГО решение. Механизм при этом доказан своим тестом и мутацией; вернуть
    # срок 14 надо тем же коммитом, каким продукт снова включат.
    срок_дней: 0
    # Сигнатуру ловим по имени: третий параметр появился при правке согласия
    # 11.09.2026, и мутация перестала применяться молча.
    мутация: 's/^def _согласие\(.*\) -> bool:$/def _согласие\1 -> bool:\n    return True/'
    мутация_случай: "любая запись журнала считается согласием на выкат"
    мутация_подмена: "DEPLOY_GUARD_UNDER_TEST"
  - id: И-2-согласие
    правило: "Выкат и необратимое — только по слову владельца (полуавтомат)"
    механизм: "deploy_guard читает confirmations.jsonl; согласие только словом"
    файл: scripts/deploy_guard.py
    доказательство: "python3 scripts/test_deploy_guard_consent.py"
    журнал: confirmations.jsonl
    признак: '"text"'
    срок_дней: 14
    мутация: "s/^CONFIRM_MAX_AGE_MIN = int(МЕХАНИКА.get(\"CONFIRM_MAX_AGE_MIN\") or 60)$/CONFIRM_MAX_AGE_MIN = 99999999/"
    мутация_случай: "согласие владельца больше не протухает никогда"
    мутация_подмена: "DEPLOY_GUARD_UNDER_TEST"
  - id: И-2-одна-форма-один-судья
    правило: "Один факт судит одна форма — копий формы не бывает"
    механизм: "общий судья форм и гейт, не дающий копии вернуться"
    файл: scripts/check-one-judge.py
    доказательство: "python3 scripts/check-one-judge.py --selftest"
    журнал: ""
    признак: ""
    срок_дней: 0
    мутация:
      - "s#^            if литерал and литерал in текст:$#            if False:#"
    мутация_случай:
      - "гейт перестал искать копии — вторая реализация формы возвращается молча"
  - id: И-3-секреты
    правило: "Секреты вне репозитория и вебрута"
    механизм: "check-secrets в pre-commit и внутри deploy.sh"
    файл: scripts/check-secrets.sh
    доказательство: "bash scripts/check-secrets.sh --selftest"
    журнал: gates.jsonl
    # Своего следа у гейта нет: pre-commit пишет ОДНУ строку на коммит, общую
    # для всех гейтов внутри. Живость доказывает прибор (--приборы), а не журнал —
    # иначе один коммит объявлял бы живыми шесть механизмов сразу (ревью 10.09).
    признак: '"gate":"pre-commit"'
    срок_дней: 0
    # Цель — набор образцов, а не строка вызова: вызов переписан при ускорении
    # гейта (11.09.2026, 10,6 с → 0,3 с), и мутация перестала применяться молча.
    мутация: 's/"\${PATTERNS\[@\]}"/-e ZZZ-ТАКОГО-НЕТ/'
    мутация_случай: "поиск секретов ищет заведомо отсутствующую строку"
  - id: И-3-секреты-в-логах
    правило: "Секрет продукта или харнеса не должен попадать в логи харнеса"
    механизм: "девятый гейт сверяет значения из .env, SECRETS_DIR и паспорта с логами"
    файл: scripts/check-secret-in-logs.py
    доказательство: "python3 scripts/check-secret-in-logs.py"
    журнал: gates.jsonl
    # Своего следа у гейта нет: pre-commit пишет ОДНУ строку на коммит, общую
    # для всех гейтов внутри. Живость доказывает прибор (--приборы), а не журнал —
    # иначе один коммит объявлял бы живыми шесть механизмов сразу (ревью 10.09).
    признак: '"gate":"pre-commit"'
    срок_дней: 0
    мутация: "s/^МИН_ДЛИНА = 8$/МИН_ДЛИНА = 100000/"
    мутация_случай: "порог длины пароля поднят — в логах не ищется ничего"
    мутация_доказательство: "python3 scripts/check-secret-in-logs.py --selftest"
  - id: И-3-внешняя-поверхность
    правило: "Наружу смотрит только объявленное, и Host разбирается явно"
    механизм: "прибор внешней поверхности — слушатели, proxy_pass, default_server по порту"
    файл: scripts/check-external-surface.py
    доказательство: "python3 scripts/check-external-surface.py --selftest"
    журнал: ""
    признак: ""
    срок_дней: 0
    мутация:
      - "s#^    return запись\\[\"адрес\"\\] not in МЕСТНЫЕ$#    return True#"
      - "s#or \"default_server\" in строка$#or True#"
    мутация_случай:
      - "местный слушатель объявлен видимым снаружи — мера теряет смысл"
      - "разбор Host объявлен на всех портах сразу: отсутствие default_server не видно"
  - id: И-4-честность
    правило: "«Сделано» — только после живой проверки"
    механизм: "статусный гейт карты: done требует tested_at"
    файл: scripts/pre-commit-gate.sh
    доказательство: "bash scripts/pre-commit-gate.sh --selftest-devmap"
    журнал: gates.jsonl
    признак: '"verdict":'
    срок_дней: 3
    мутация: "s/if st == \"done\" and not t.get(\"tested_at\")/if False and not t.get(\"tested_at\")/"
    мутация_случай: "требование tested_at у done снято — И-4 без сторожа"
  - id: И-4-скил-зовёт-код
    правило: "Скил, которого не зовёт никто, мёртв — его зовёт код или он не нужен"
    механизм: "мера успешных вызовов скилов и хук, требующий скил перед помощником"
    файл: scripts/check-skill-usage.py
    доказательство: "python3 scripts/check-skill-usage.py --selftest"
    журнал: skills.jsonl
    признак: "\"источник\": \"хук\""
    срок_дней: 14
    мутация:
      - "s#^        if запись.get(\"успех\") not in (True, \"да\", 1):$#        if False:#"
      - "s#^        значение = конф.конфиг(конф.путь_harness_conf()).get(\"SKILL_SILENT_MAX\")$#        значение = 99#"
    мутация_случай:
      - "неудачный запуск считается успехом — молчащий скил выглядит живым"
      - "потолок молчащих взят из кода, а не из данных: гейт перестаёт замечать рост"
  - id: И-4-проба-судит-поведение
    правило: "Проба судит ПОВЕДЕНИЕ, а не текст своего файла; исключение объявлено с причиной"
    механизм: "гейт «свой текст» плюс данные законных случаев"
    файл: scripts/check-own-text-probes.py
    доказательство: "python3 scripts/check-own-text-probes.py --selftest"
    журнал: gates.jsonl
    признак: '"verdict":'
    срок_дней: 3
    мутация:
      - 's/r"\\b(grep|sed|awk/r"\\b(sed|awk/'
      - "s/            if (РОЛЬ_ПУТЬ.search(слева) or РОЛЬ_ИСПОЛНЕНИЕ.search(слева)/            if (False/"
      - "s/            if РОЛЬ_ПЕРЕНАПРАВЛЕНИЕ.search(слева):/            if False:/"
      - "s/    if not псевдонимы:/    if True:/"
      - 's/    return not re.search(r"\\.(parent|parents/    return True or re.search(r"\\.(parent|parents/'
      - 's/    первая = текст.split/    первая = "" and текст.split/'
      - 's/"--others", "--exclude-standard"/"ls-files"/'
      - "s/^    if плохие:/    if False:/"
      - 's/if з\["файл"\] == отн and з\["образец"\] in строка/if True/'
      - "s/^    if not опись:/    if False:/"
    мутация_случай:
      - "греп по своему исходнику перестал считаться чтением — класс невидим"
      - "роль ссылки не разбирается: dirname и bash с ним станут ложными находками, гейт отключат"
      - "чтение перенаправлением (mapfile, подстановка) перестало считаться чтением"
      - "псевдоним своего пути в переменной не отслеживается — обход класса в одну строку"
      - "в питоне путь к файлу-соседу считается своим файлом: ложные находки на каждом sys.path"
      - "вид файла без расширения не определяется — семь механизмов уходят из присмотра"
      - "опись только по индексу git: новый файл невидим до коммита"
      - "запись без причины принимается — список законного превращается в глушилку"
      - "образец записи не сверяется со строкой: одна запись накрывает весь файл"
      - "пустая опись считается чистотой — неверный корень зеленит ворота"
  - id: И-2-формы-значений
    правило: "Формы, по которым судят согласие и отказ владельца, живут одним набором данных"
    механизм: "общий судья форм: наборы слов и границы слова"
    файл: scripts/lib/patterns.py
    доказательство: "python3 scripts/lib/patterns.py --selftest"
    журнал: gates.jsonl
    признак: '"verdict":'
    срок_дней: 3
    мутация:
      - 's/^СОГЛАСИЕ_БАЗОВОЕ = ("да", "ок", "окей", "подтверждаю")/СОГЛАСИЕ_БАЗОВОЕ = ("ок", "окей", "подтверждаю")/'
      - 's/^ГРАНИЦА_СЛЕВА = r.*$/ГРАНИЦА_СЛЕВА = r""/'
      - 's/^СОГЛАСИЕ_СПЕКА_ДОП = .*/СОГЛАСИЕ_СПЕКА_ДОП = ("да",)/'
    мутация_случай:
      - "главное слово согласия «да» выпало из базового набора — сторож выката его не узнает"
      - "граница слова обнулена: «когда готово» сойдёт за согласие"
      - "набор спеки сведён к базовому — свободные формы одобрения перестанут работать"
  - id: И-4-скил-перед-помощником
    правило: "Помощник не запускается, пока правила работы с агентами не прочитаны в этой смене"
    механизм: "хук PreToolUse на Agent: отказ с названием нужного скила"
    файл: scripts/hooks/agent_skill_guard.py
    доказательство: "python3 scripts/hooks/agent_skill_guard.py --selftest"
    журнал: skills.jsonl
    признак: '"источник": "хук"'
    срок_дней: 14
    мутация:
      - "s/^    return 2, (/    return 0, (/"
    мутация_случай:
      - "хук всегда разрешает запуск — скил снова держится вниманием смены"
  - id: И-4-покрытие-мутациями
    правило: "Механизм, объявивший инвариант, обязан иметь мутацию СВОЕГО файла"
    механизм: "покрытие инвариантов: обратный ход от реестра к мутациям"
    файл: scripts/invariant-coverage.py
    доказательство: "python3 scripts/invariant-coverage.py --selftest"
    журнал: gates.jsonl
    признак: '"verdict":'
    срок_дней: 3
    мутация:
      - "s/        if файл in с_мутацией:/        if True:/"
      - "s/        if прощены.get(файл):/        if файл in прощены:/"
      - 's/    с_мутацией = {и\["файл"\] for и in строки if и.get("мутация")}/    с_мутацией = {и["файл"] for и in строки}/'
    мутация_случай:
      - "мера всегда молчит: механизм без мутации перестаёт быть находкой"
      - "исключение без причины прощает — список превращается в глушилку"
      - "строка инварианта без мутаций считается покрытием: пустое поле сходит за пробу"
  - id: И-4-проба-не-судит-машину
    правило: "Исход проверки решает поведение механизма, а не окружение хозяина"
    механизм: "прогон каждой проверки под подменённым хозяином и из пустого окружения"
    файл: scripts/check-host-independence.py
    доказательство: "python3 scripts/check-host-independence.py --selftest"
    журнал: gates.jsonl
    признак: '"verdict":'
    срок_дней: 3
    мутация:
      - "s/        if имя in судят:/        if True:/"
      - "s/        if имя in тяжёлые:/        if False:/"
      - "s/    if без_причины:/    if False:/"
      - "s/            if код != как_обычно\\]/            if False]/"
    мутация_случай:
      - "любое расхождение считается законным — класс становится невидимым"
      - "тяжёлые перестают пропускаться: прибор виснет и его отключат"
      - "запись без причины принимается — список законного превращается в глушилку"
      - "расхождение кодов не замечается вовсе: прибор всегда зелёный"
  - id: И-2-публикация-через-дверь
    правило: "Публичный харнес обновляется только через publish.sh — ручной push отменяется"
    механизм: "правило сторожа команд: push в публичный удалённый или из каталога сборки"
    файл: scripts/hooks/guard_bash.py
    доказательство: "python3 scripts/hooks/test_guard_bash.py"
    # Проба живёт в ОТДЕЛЬНОМ файле: без подмены пути мутационный прогон гонял бы
    # боевой тест против боевого сторожа и всегда получал зелёное (замер
    # 28.09.2026 — три мутации этой строки «не поймались»).
    мутация_подмена: GUARD_UNDER_TEST
    журнал: guard.jsonl
    признак: '"verdict": "deny"'
    срок_дней: 0
    мутация:
      - "s/    if not GIT_PUSH.search(cmd):/    if True:/"
      - "s/    elif сборка and сборка in cmd:/    elif False:/"
      - "s/^    if not попал:/    if False:/"
    мутация_случай:
      - "правило не смотрит, push ли это — сторож начнёт отменять любую команду со словом"
      - "путь через каталог публичной сборки перестаёт закрываться"
      - "правило всегда молчит: ручная публикация снова возможна"
  - id: И-4-установка-с-нуля
    правило: "«Установка проходит» доказывается прогоном в чистом контейнере, а не памятью"
    механизм: "живая проба установки: одноразовый контейнер, установщик из пакета, восемь следов"
    файл: scripts/install-probe.sh
    доказательство: "bash scripts/install-probe.sh --selftest"
    журнал: проба-установки.log
    признак: "проба установки:"
    срок_дней: 8
    мутация:
      - 's/^PROJECT_NAME="proba"$/#PROJECT_NAME убран/'
      - 's/    NUZHNY="PROJECT_NAME PROJECT_DIR SECRETS_DIR TG_CHAT_ID"/    NUZHNY=""/'
      - 's/head -c 24 \/dev\/urandom | base64 | tr -dc .A-Za-z0-9. | head -c 30/echo FIXED/'
    мутация_случай:
      - "паспорт стенда неполон — установщик задаёт вопрос, проба виснет до потолка"
      - "список нужных ключей пуст: полнота паспорта не проверяется вовсе"
      - "подставной секрет стал постоянным — стенд перестаёт генерировать значение"
  - id: И-1-удаление-по-слову
    правило: "Удаление в секретах и копиях возможно только по свежему слову владельца, с копией и следом"
    механизм: "законная дверь удаления: слово владельца, копия, порог возраста, журнал"
    файл: scripts/protected-delete.py
    доказательство: "python3 scripts/protected-delete.py --selftest"
    журнал: удаления-секретов.jsonl
    признак: '"слово":'
    срок_дней: 0
    мутация:
      - "s/^    if ОТКАЗ.search/    if False and ОТКАЗ.search/"
      - "s/    return bool(ГЛАГОЛ.search(строка) and ПРЕДМЕТ.search(строка))/    return True/"
      - "s/        if возраст_дней < МИН_ВОЗРАСТ_ДНЕЙ:/        if False:/"
      - "s/        if путь.parent.resolve() != (копии.resolve() if копии else None):/        if False:/"
    мутация_случай:
      - "отказ в сообщении больше не отменяет разрешение — «не удаляй» сойдёт за «удаляй»"
      - "разрешением становится любое сообщение владельца, включая голое «да»"
      - "порог возраста снят: свежая копия, единственная годная для восстановления, удалится"
      - "дверь открывается внутрь ежесуточных каталогов копий — рабочие копии под удар"
  - id: канал-ack
    правило: "Ack ≤30 секунд на входящее сообщение владельца"
    механизм: "tg-dispatcher кладёт входящие в inbox, session-warden пинает сессию"
    файл: scripts/tg-dispatcher.sh
    доказательство: "bash scripts/tg-dispatcher.sh --selftest"
    журнал: tg-dispatcher.log
    признак: "в очередь:"
    срок_дней: 3
    мутация:
      - "s#--слова-отказа#--zzz-нет-такой-формы#"
      - "s#^    if \\[ -z \"$otkaz_re\" \\]; then$#    if false; then#"
    мутация_случай:
      - "форма отказа запрашивается несуществующим ключом — список отрицаний пуст"
      - "пустая форма отказа больше не отказывает: grep по пустой строке совпадёт со всем"
  - id: канал-доставка
    правило: "«Отправлено» — только при ok:true и message_id"
    механизм: "tg_send: отказ громкий, след в tg_failures.log"
    файл: scripts/tg_send.sh
    доказательство: "bash scripts/tg_send.sh --selftest"
    журнал: tg-dispatcher.log
    признак: "в очередь:"
    срок_дней: 3
    мутация: "s/.ok == true and (.result.message_id != null)/.ok != null/"
    мутация_случай: "успехом считается любой ответ Bot API, а не ok+message_id"
  - id: указания-в-память
    правило: "Указание владельца заносится в память/УКАЗАНИЯ.md дословно"
    механизм: "гейт указаний ловит незанесённое сообщение с маркером"
    файл: scripts/orders.py
    доказательство: "python3 scripts/orders.py --selftest"
    журнал: gates.jsonl
    # Своего следа у гейта нет: pre-commit пишет ОДНУ строку на коммит, общую
    # для всех гейтов внутри. Живость доказывает прибор (--приборы), а не журнал —
    # иначе один коммит объявлял бы живыми шесть механизмов сразу (ревью 10.09).
    признак: '"gate":"pre-commit"'
    срок_дней: 0
    мутация: "s/^МАРКЕРЫ = (.*/МАРКЕРЫ = (/"
    мутация_случай: "список слов-маркеров опустошён"
  - id: ротация-бесшовна
    правило: "Ротация сессии идёт сама и не теряет контекст"
    механизм: "session-warden: замер окна, регламент, подъём преемника"
    файл: harness/demons/session-warden.sh
    доказательство: "bash harness/demons/session-warden.sh --selftest"
    журнал: rotation.jsonl
    признак: 'agent_restarted'
    срок_дней: 3
    мутация: "s/1|2) printf 'Enter\\\\n' ;;/1|2) printf 'Escape\\\\n' ;;/"
    мутация_случай: "первая попытка отвечает Escape вместо Enter"
  - id: cron-жив
    правило: "Демоны присмотра запускаются; молчание — не признак здоровья"
    механизм: "sentinel: метка запуска (cron) и метка успеха (прогон дошёл)"
    файл: harness/demons/sentinel.sh
    доказательство: "bash harness/demons/sentinel.sh --selftest"
    # След жизни — МЕТКА, а не строка журнала: в журнал sentinel пишет только
    # когда что-то поднимает, и двое суток тишины (здоровое состояние!) делали
    # инвариант «непокрытым» (живой прогон механизмов 12.09.2026).
    журнал: "heartbeat:sentinel"
    признак: "метка обновлена прогоном"
    срок_дней: 1
    мутация: "s/^WARDEN_STUCK_MIN=.*/WARDEN_STUCK_MIN=999999/"
    мутация_случай: "порог зависшего прогона поднят до бесконечности"
  - id: демоны-живы
    правило: "Мёртвый демон обязан быть виден владельцу"
    механизм: "heartbeat-watch: утренняя сводка по меткам, порог период×2"
    файл: harness/demons/heartbeat-watch.sh
    доказательство: "bash harness/demons/heartbeat-watch.sh --selftest"
    журнал: heartbeat-watch.log
    признак: "сводка доставлена"
    срок_дней: 2
    мутация: "s/-gt \\$((period_min \\* 2))/-gt $((period_min * 100000))/"
    мутация_случай: "мёртвый демон никогда не признаётся мёртвым"
  - id: прогон-фоном
    правило: "Прогон набора тестов внутри сессии запрещён"
    механизм: "guard_bash отменяет прогон в сессии"
    файл: scripts/hooks/guard_bash.py
    доказательство: "python3 scripts/hooks/test_guard_bash.py"
    журнал: guard.jsonl
    признак: "прогон набора тестов"
    срок_дней: 0
    мутация: "s/^PYTEST_CALL = re.compile($/PYTEST_CALL = re.compile(r'(?!x)x'); _прежнее = re.compile(/"
    мутация_случай: "запрет прогона внутри сессии обезврежен"
    мутация_подмена: "GUARD_UNDER_TEST"
  - id: карта-не-теряет
    правило: "Задача не исчезает из карты молча"
    механизм: "гейт сверяет карту с архивом при каждом коммите"
    файл: scripts/check-map-keeps-tasks.py
    доказательство: "python3 scripts/check-map-keeps-tasks.py --selftest"
    журнал: gates.jsonl
    # Своего следа у гейта нет: pre-commit пишет ОДНУ строку на коммит, общую
    # для всех гейтов внутри. Живость доказывает прибор (--приборы), а не журнал —
    # иначе один коммит объявлял бы живыми шесть механизмов сразу (ревью 10.09).
    признак: '"gate":"pre-commit"'
    срок_дней: 0
    # Мутация переписана 12.09.2026: код гейта разделился на перечень() и
    # множество(), и прежняя строка перестала совпадать — проба честно
    # сказала «мутация не изменила файл». Проверка, отставшая от
    # реализации, не ловит ничего и молчит об этом.
    мутация: "s/    return ЗАДАЧА.findall(текст)/    return []/"
    мутация_случай: "задачи в карте не видны — пропажа неотличима от пустоты"
  - id: пакет-источник
    правило: "Правка файла харнеса идёт и в стартовый пакет"
    механизм: "гейт сверки с пакетом в pre-commit"
    файл: scripts/compare-with-package.py
    доказательство: "python3 scripts/compare-with-package.py --selftest"
    журнал: gates.jsonl
    # Своего следа у гейта нет: pre-commit пишет ОДНУ строку на коммит, общую
    # для всех гейтов внутри. Живость доказывает прибор (--приборы), а не журнал —
    # иначе один коммит объявлял бы живыми шесть механизмов сразу (ревью 10.09).
    признак: '"gate":"pre-commit"'
    срок_дней: 0
    мутация: "s/elif цель.read_bytes() != содержимое:/elif False:/"
    мутация_случай: "расхождение файла с пакетом больше не замечается"
  - id: контекст-в-потолке
    правило: "STATE.md ≤10k, УКАЗАНИЯ ≤8k, карта в потолке гигиены"
    механизм: "check-context-hygiene в pre-commit и воротах"
    файл: scripts/check-context-hygiene.py
    доказательство: "python3 scripts/check-context-hygiene.py"
    журнал: gates.jsonl
    признак: '"failed":"context_hygiene"'
    срок_дней: 30
    мутация: "s/    if size > STATE_MAX:/    if False:/"
    мутация_случай: "потолок STATE.md перестал быть потолком"
    мутация_доказательство: "python3 scripts/check-context-hygiene.py --selftest"
  - id: проверки-ловят
    правило: "Самотест обязан краснеть на испорченном коде"
    механизм: "мутационная проба: порча копии механизма требует красного"
    файл: scripts/mutation-probe.sh
    доказательство: "bash scripts/mutation-probe.sh"
    журнал: мутации.log
    признак: "покраснели как надо"
    срок_дней: 14
    мутация: "s/BAD=$((BAD+1))/OK=$((OK+1))/g"
    мутация_случай: "дыра в чужом самотесте засчитывается пробой как успех"
    мутация_доказательство: "bash scripts/mutation-probe.sh --selftest"
  - id: передача-смены
    правило: "На каждом рубеже обновляется handover"
    механизм: "handover-check и пинок session-warden по возрасту передачи"
    файл: scripts/handover-check.sh
    доказательство: "bash scripts/handover-check.sh --selftest"
    журнал: session-warden.log
    признак: "handover"
    срок_дней: 2
    мутация: "s/if \\[ \"\\$commits_today\" -eq 0 \\]/if true/"
    мутация_случай: "любой день считается «работы не было» — передача не протухает никогда"
