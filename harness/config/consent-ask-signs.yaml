# Признаки вопроса владельцу о его «да» ТЕКСТОМ. Читает check-channel-messages.py.
# Текст режется на фрагменты по переводу строки и [.!;]; фрагмент, где есть «просьба»
# И признак вида (без учёта регистра), судится по полю «отказ» этого вида:
#   да  — отказ канала: на этот вид есть кнопки (ask-consent.py);
#   нет — замечание: кнопки на этот вид ещё нет, сообщение уходит.
# Ключи с «отказ: да» входят в owner_word.ВИДЫ_СОГЛАСИЯ, и каждый вид оттуда есть здесь
# (держит проба 18); «образец» — фраза, которую обязан поймать собственный признак вида
# (проба 19); «подсказка» (если есть) заменяет в сообщении канала команду по шаблону
# `ask-consent.py --вид <вид> --предмет …`.
просьба:
  - '\b(?:ответь|скажи|напиши|дай|подтверди)\w* (?:словом |слово )?«да»'
  - 'нужн\w* (?:тво\w+ )?(?:слово )?«да»'
  - '\bжд\w* (?:только )?тво\w+ «да»'
виды:
  удаление:   {отказ: да,  образец: 'удалить файл', признаки: ['\bудал\w*\b(?!\s+баз)']}
  пуш:        {отказ: да,  образец: 'пуш 3 коммитов', признаки: ['\bпуш', '\bв гитхаб', '\bна github',
               '\bкоммит\w* (?:в|на) (?:origin|гитхаб|github)']}
  выкат:      {отказ: да,  образец: 'выкат', признаки: ['\bвыкат', '\bdeploy\b', '\bдеплой'],
               подсказка: 'python3 scripts/ask-consent.py --вид выкат --почему …'}
  публикация: {отказ: да,  образец: 'публикация', признаки: ['\bпубликац', '\bопубликов'],
               подсказка: 'python3 scripts/ask-consent.py --вид публикация --почему …'}
  # Перепись публичной истории кнопок не имеет: «Да» на публикацию её не открывает.
  перепись:   {отказ: нет, образец: 'перепись истории', признаки: ['\bперепис\w* истори']}
  # Кнопка на спеку есть (spec_approval.py), но канал её не требует: harness/demons/speed_mode.py:675
  # шлёт «N спеки ждут твоего «да», новых не начинаю» — тот же фрагмент (просьба + «спек»), и отказ
  # молча резал бы письмо демона. Переводится в «отказ: да» строкой данных, когда хозяин
  # speed_mode.py перепишет фразу.
  спека:      {отказ: нет, образец: 'спеку', признаки: ['\bспек'],
               подсказка: 'python3 scripts/spec_approval.py --отправить <id>  (текстом уйдёт раздел «## Для человека» спеки)'}
  ключи:      {отказ: нет, образец: 'смена ключа', признаки: ['\bсмен\w* ключ', '\bротац\w* ключ', '\bнов\w* токен']}
  снос-базы:  {отказ: нет, образец: 'снос базы', признаки: ['\bсно[сш]\w* баз', '\bснести баз', '\bудал\w* баз']}
