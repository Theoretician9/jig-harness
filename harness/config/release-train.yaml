# Поезд выпусков — данные ворот выпуска (спека поезда выпусков, §4.4).
#
# Ворота выпуска судят РАЗНИЦУ с прошлым выпуском, а не всё дерево: старое красное вне
# диапазона не должно останавливать выпуск, а новое — ехать. Здесь только то, что меняется
# без кода: стоп-список ядра, потолок выбора и окно поиска предыдущего зелёного среза.

# Стоп-список: красный любой строки — срез не едет. Команды берут подстановки поезда:
# {прошлый} — коммит проекта, из которого собран прошлый выпуск; {срез} — проверяемый коммит.
ядро:
  # Секреты — только по добавленным строкам диапазона: скан всего дерева стоил бы минуты
  # на каждый срез и ловил бы старое, чего выпуск не вносил.
  - имя: секреты по диапазону
    команда: "bash scripts/check-secrets.sh --range {прошлый}..{срез}"
  # Сборка публичного дерева — единственное, что видят чужие копии; её самотест не зависит
  # от диапазона, поэтому гоняется всегда.
  - имя: сборка публичная
    команда: "python3 scripts/build-public.py --selftest"
# Дольше потолка строка ядра считается «не дошла»: повисший скан или самотест иначе вешал бы поезд.
ядро_потолок_мин: 10

# Дольше потолка выбор считается «не дошёл», а не «зелёный»: молчание ворот нельзя читать как успех.
выбор: { потолок_мин: 120 }   # 21.11: при нагрузке 8/8 ядер ≈34 с на проверку, широкий выбор (165) не влезал в 30

# Срез, на который просили кнопку, годен для согласия, пока у него есть ход поезда с зелёными
# воротами не старше срока: дольше — код и окружение ушли, ворота надо гнать заново.
согласие: { срок_среза_ч: 24 }

# Сколько коммитов назад искать предыдущий зелёный срез, если последний красный: без окна поиск
# уходил бы в историю и вёз бы устаревшее.
окно_срезов: 20

# Общие узлы: через них граф «кто зовёт» не раскрывается (звавших слишком много, выбор
# раздуло бы), а проверки, которые их зовут, выбирает обычное правило (select-checks.py).
всегда_всё:
  - scripts/lib/gates_check.sh
  - scripts/gates.sh
  - scripts/lib/config.sh
  - scripts/lib/config.py

# Глубина графа «кто зовёт» в выборе: через хабы вроде tg_send.sh глубина 2 брала ветке из
# 12 файлов 67 проверок, глубина 1 — 34. Промахи глубины 1 ловят ночь и поезд.
выбор_глубина_вызовов: 1

# Входы самих правил выбора и запуска проверок (merge-queue.py, узкий повтор после сдвига
# master): сдвиг, задевший любой из них, судится полным кругом — новая проверка в gates.sh, новый
# вход механизма или новый судья меняют выбор, и узкий выбор по старым правилам его бы не увидел.
# Читается из master и прошлой вершины цепочки; ключа нет или не список — всегда полный круг.
# Шаблоны — fnmatch по путям от корня.
выбор_входы:
  - scripts/gates.sh
  - scripts/lib/gates_check.sh
  - scripts/lib/config.sh
  - scripts/lib/events.sh
  - scripts/lib/stand_sweep.sh
  - scripts/heavy-slot.sh
  - scripts/select-checks.py
  - scripts/check-who-calls.py
  - scripts/gates_cache.py
  - scripts/lib/config.py
  - harness/config/mechanisms.yaml
  - harness/config/release-train.yaml

# Проверки, чей вход — всё scripts/**: такой вход не различает ветки, любая правка брала бы их
# (~30 мин медиан на двоих). Выбор их не берёт по входам механизма; судит ночь и поезд.
вне_выбора:
  - scripts/check-who-calls.py
  - scripts/test_update.py

# Проверки, которые очередь слияния выбирает только своими файлами (select-checks.py --очередь):
# правило «входы механизма» их не берёт. Их входы — весь scripts/** (кэш ворот прав: им нужна вся
# раскладка), и выбор брал их на каждую подачу — 950–2100 с каждая, дважды на красной (21.11).
# Без своих файлов в диапазоне их судит nightly-gates (gates.sh --всё, 06:00).
очередь_без_входов: [обновление, население кода]

# Пробы, которые судят узел, но не видят его ни файлом, ни входами механизма: правка двери
# согласия иначе выбирала бы только «кто зовёт» (select-checks.py, правило 2). Не во `входы:`
# mechanisms.yaml: по ним кэш ворот пропускает пробу при тех же входах, а пробы зависят и от
# другого. Тяжёлую пробу отсюда выбор берёт и в поезде.
входы_проб:
  scripts/test_deploy_guard_consent.py: [scripts/deploy_guard.py, scripts/lib/door_subjects.py]
  scripts/test_deploy_guard.py: [scripts/deploy_guard.py]
  scripts/test_consent_doors.py: [scripts/deploy_guard.py, scripts/lib/door_subjects.py, scripts/ask-consent.py]
  scripts/test_owner_word_carrier.py: [scripts/deploy_guard.py, scripts/lib/door_subjects.py, scripts/ask-consent.py]
