# Колонки доски канбана в панели владельца — читает scripts/build-board.py.
#
# Порядок — пайплайн CLAUDE.md: spec → spec review → plan → contract → tests
# before code → code → gates → review → deploy → live smoke → closing; мутации
# стоят за ревью кода (pipeline.yaml: мутация проверяет уже прочитанные пробы).
# Отдельным файлом, а не ключом pipeline.yaml: пульт владельца раскладка не
# перезаписывает, и новая колонка не доехала бы до сервера.
#
# Откуда доска знает стадию:
#   шаги с бумагой (спека … мутации) — отметка гейта check-pipeline.py;
#   тесты — гейтом файлом не судятся, карточку не держат;
#   код — есть коммиты «Dev-Map: <id>» в git проекта. Ворот это не доказывает
#     (git commit --no-verify обходит pre-commit), поэтому колонки «ворота» нет;
#   живая_проверка — статус test; закрытие — done (владелец) или принято (машина);
#   очередь — plan, беклог и статус вне списка.
# Колонки «выкат» нет: deploy.sh не пишет, какую задачу выкатил, — признака нет.
колонки:
  - очередь
  - спека
  - ревью_спеки
  - план
  - контракт
  - тесты
  - код
  - ревью_кода
  - мутации
  - живая_проверка
  - закрытие

# Статус карточки → колонка. wip ставится по шагам, а не отсюда.
по_статусу:
  plan: очередь
  беклог: очередь
  test: живая_проверка
  принято: закрытие
  done: закрытие
