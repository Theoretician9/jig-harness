# Механизмы, которых зовёт не крон, а systemd (класс A2) — ДАННЫЕ для
# scripts/live-check-daemon.py.
#
# Откуда взято: спека живой проверки §3.1. Предикат класса A1 («журнал
# последнего кронового прогона») к ним неприменим — в расписании их нет вовсе.
# Доказательств два, и оба чужие: systemd говорит, что служба активна и с
# какого часа, а её журнал даёт строку, которую написала она сама.
#
# Имя юнита лежит ЗДЕСЬ, а не выводится из имени файла: служба бывает поднята
# юнитом с другим именем, и догадка молчала бы вместо отказа.

юниты:
  scripts/tg-dispatcher.sh: harness-dispatcher.service
  # Панель пишет не в журнал юнита, а в свой файл, и файл ОБЩИЙ: туда же
  # пишут писатели памяти, ключей и шагов. Признак отделяет её собственные
  # строки — у них есть ключ «событие» (вход, чужой Origin, негодная ссылка).
  harness/panel/server.py:
    юнит: harness-panel.service
    журнал: панель.jsonl
    признак: '"событие"'
  # Разовая служба по таймеру (каждые 5 минут): «активна сейчас» о ней ничего
  # не говорит — она отработала и вышла. Потолок назван ЗДЕСЬ: три периода.
  harness/demons/sentinel.sh:
    юнит: harness-sentinel.service
    потолок_минут: 15
  # Таймерные демоны: systemd, не крон. Потолок — три периода таймера
  # (checks-stream: каждые 20 минут) либо период и сутки запаса (nightly-mutations:
  # по вторникам 09:00, период 10080).
  harness/demons/checks-stream.sh:
    юнит: harness-checks-stream.service
    потолок_минут: 60
  harness/demons/nightly-mutations.sh:
    юнит: harness-nightly-mutations.service
    потолок_минут: 11520

# Механизмы, которых зовёт не расписание и не systemd, а ДРУГОЙ живой механизм:
# помощник под обёрткой. Доказательство — ЕГО собственные строки в журнале
# зовущего (признак) и свежесть этого журнала.
  harness/demons/server_hygiene_check.py:
    зовёт: harness/demons/server-hygiene.sh (крон, 03:30 ежедневно)
    журнал: server-hygiene.log
    признак: 'гигиена сервера:'
    потолок_минут: 4320
  # Обёртка вызова модели: её зовут демоны присмотра, и пишет она в СВОЙ
  # журнал — признак не нужен, чужих строк там нет. Потолок суточный: демоны
  # зовут модель не каждый час.
  scripts/claude-demon.sh:
    зовёт: демоны присмотра (check-builder, acceptance, проверка входа)
    журнал: claude-demon.log
    потолок_минут: 1440
  scripts/stall-in-log.py:
    зовёт: harness/demons/limit-watch.sh (крон, ежеминутно)
    журнал: limit-watch.log
    признак: "смена мол"
    потолок_минут: 1440
  # Судья слов работы: диспетчер его больше не зовёт, зовёт автомат карточек
  # (фоном, на каждое сообщение владельца) и пишет в СВОЙ журнал. Признак —
  # «<id>: это <причина судьи>»: причину в этой строке печатает только судья
  # (map-from-message.py, одна строка вывода); хвост «— карточки нет» печатает
  # и ветка вложений, он ничего не различает; такие
  # сообщения (вопрос, реакция) идут не каждые сутки, потому потолок — неделя.
  scripts/urgency.py:
    зовёт: scripts/map-from-message.py (фоном из диспетчера, на каждое сообщение владельца)
    журнал: map-from-message.log
    признак: ': это '
    потолок_минут: 10080
  # Автомат карточек: его зовёт диспетчер на каждое сообщение владельца и
  # перенаправляет вывод в ЕГО собственный журнал — признак не нужен.
  # Обработчик голосовых: его поднимает диспетчер на голосовое владельца (один
  # на машину, без расписания), пишет он в СВОЙ журнал. Признак — строка
  # итога расшифровки; голосовые идут не каждые сутки, потолок — неделя.
  scripts/voice-worker.sh:
    зовёт: scripts/tg-dispatcher.sh на голосовое владельца
    журнал: voice-worker.log
    признак: 'расшифровано,'
    потолок_минут: 10080
  scripts/map-from-message.py:
    зовёт: scripts/tg-dispatcher.sh на каждое сообщение владельца
    журнал: map-from-message.log
    потолок_минут: 1440

# ДЕМОНЫ, КОТОРЫМ МОЛЧАТЬ ЗАКОННО. Улика 18.10.2026: panel-tunnel при панели,
# выведенной через nginx, не печатает НИЧЕГО — ни в кроновый журнал, ни в свой,
# — и предикат A1 отказывал ему словами «цитировать нечего». Его работа видна
# в МЕТКЕ, которую он ставит каждый прогон, и мерит её ПРИБОР (mtime до и после
# зова), а не проверяемый.
#
# Молчание законно не «потому что так вышло», а по ЗНАЧЕНИЮ ключа конфига:
# поле «условие» называет ключ harness.conf и то, чего его значение НЕ содержит.
# Без этого ветвь стала бы отмазкой для любого онемевшего демона.
#   почему   — что именно делает молчание законным (идёт в запись)
#   условие  — { ключ: <KEY в harness.conf>, не_содержит: <подстрока> }
молчат_нарочно:
  harness/demons/panel-tunnel.sh:
    почему: >-
      панель выведена наружу через nginx (PANEL_URL — свой домен), поводу
      поднимать туннель cloudflared на этой машине нет, и демон по своему
      описанию только ставит метку
    условие: { ключ: PANEL_URL, не_содержит: trycloudflare.com }

# КАК ДЕМОН ПО РАСПИСАНИЮ ПИШЕТ ЖУРНАЛ — данные для предиката A1. Улика
# 11.11.2026: прибор угадывал по журналу («кроновый непуст → пишет на каждом
# прогоне») и отказал живым speed_mode и process-dispatcher — оба молчат при
# успехе, а журнал непуст от старых ошибок. Значение взято по коду демона и
# его журналу (замер 11.11.2026: даты записей против метки):
#   каждый-прогон     — журнал (кроновый, а пуст он — свой <имя>.log) пишется
#                       каждым прогоном; старше трёх периодов — прогонов не было
#   по-событию        — свой журнал пишется только по событию; жизнь доказывает
#                       метка, вердикт называет дату последнего события
#   молчит-при-успехе — в журнал попадает только неуспех; жизнь доказывает
#                       метка, вердикт называет дату последней записи
# Демона нет здесь — прибор отказывает, а не угадывает. Молчуны (выше) и
# механизмы из «юниты» судятся своим предикатом и здесь не нужны.
как_пишет_журнал:
  harness/demons/backup.sh: каждый-прогон
  harness/demons/devmap-selfheal.sh: каждый-прогон
  harness/demons/disk-cleanup.sh: каждый-прогон
  # пишет (say) только тревогу о квитанциях и отказ прибора; в журнале с 06.11
  # лишь слова обёртки, метка ежеминутная
  harness/demons/dispatcher-stall-watch.sh: по-событию
  harness/demons/evolution-collector.sh: каждый-прогон
  harness/demons/extensions-watch.sh: каждый-прогон
  harness/demons/heartbeat-watch.sh: каждый-прогон
  # say → limit-watch.log только на смену лимита и работы; кроновый журнал —
  # старые ошибки
  harness/demons/limit-watch.sh: по-событию
  harness/demons/memory-commit.sh: каждый-прогон
  harness/demons/memory-revision.sh: каждый-прогон
  harness/demons/project-revision.sh: каждый-прогон
  # отчёт раз в сутки (SENT_FILE); прочие прогоны — метка и exit 0 без слов
  harness/demons/resource-report.sh: по-событию
  harness/demons/server-hygiene.sh: каждый-прогон
  harness/demons/session-warden.sh: каждый-прогон
  # печатает только «проход упал» в stderr; журнал с 06.11 — «Permission
  # denied» и слова обёртки, метка обновляется каждые 2 минуты
  harness/demons/speed_mode.py: молчит-при-успехе
  harness/demons/stack-watch.sh: каждый-прогон
  harness/demons/task-closer.sh: каждый-прогон
  harness/demons/tokens-collector.sh: каждый-прогон
  harness/demons/ton-watch.sh: каждый-прогон
  harness/demons/update-watch.sh: каждый-прогон
  scripts/build-board.py: каждый-прогон
  # --замер печатает только «замок занят», «нет прошлого прохода» и сбой
  # писателя тревог; журнал — трасса IndexError 07.11 (закрыт 0ceff188)
  scripts/process-dispatcher.py: молчит-при-успехе
