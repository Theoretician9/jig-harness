# Три слоя памяти: кто что пишет (спека личности и политики §5.1–§5.2).
# Слой 1 («неизменяемое») меняется только выпуском харнеса; слой 2 («человека») пишет
# только scripts/self-set.py по кнопке «Да»; слой 3 (память/*.md, STATE.md) модель
# пишет сама и в этом файле не перечисляется: у такого списка не было бы читателя.
# Читатели: «неизменяемое» — хук записи и сверка с эталоном; «человека» — хук записи
# и self-set.py; «без_потерь» — гейт прополки; «обязательные_поля_человека» — вопрос
# о пробелах при старте смены. Шаблоны — fnmatch от корня проекта.
неизменяемое:
  - harness/self/core.json
  - harness/self/standards.md
  - "harness/self/roles/*.md"
  - harness/config/launch-policy.yaml
  - harness/config/memory-layers.yaml
человека:
  - harness/self/instance.yaml
без_потерь:
  - память/ORDERS.md
  - "память/owner-orders-*-verbatim.md"
архив_прополки: память/archive/
обязательные_поля_человека: [копия, роль, цель, человек, проект.описание]
