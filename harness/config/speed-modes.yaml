# Режимы скорости: сколько ЗАДАЧ карты вести одновременно. Читает судья
# harness/demons/speed_mode.py; числа калибруются данными, код их не дублирует.
режимы:
  slow:   {задач: 1,  имя: "медленный", живых_потолок: 3}
  medium: {задач: 3,  имя: "средний",   живых_потолок: 5}
  fast:   {задач: 5,  имя: "быстрый",   живых_потолок: 8}
  ultra:  {задач: 10, имя: "ультра",    живых_потолок: 12}
живых_при_аварии: 2                 # потолок живых, пока действует блокер «авария»
по_умолчанию: medium
ступени: [1, 3, 5, 10]
открытый_запуск_макс_мин: 240       # страховка поверх признака жизни запуска
старт_ждать_с: 120                  # запуск без meta-файла моложе этого — ещё стартует
спек_ждут_владельца_максимум: 3     # ограничитель потока неодобренных спек

# Блокер: замер -> потолок. держится_мин — сколько признак обязан держаться, чтобы
# сработать; отпускает_мин — сколько его не должно быть, чтобы снять. Поле «говорить»
# обязательно у каждого блокера (нет поля — ошибка данных, код 1): «нет» — у блокера
# своё сообщение владельцу, второго не шлём.
блокеры:
  пауза:        {потолок: 0,        держится_мин: 0,  отпускает_мин: 0,  говорить: нет}
  лимит:        {потолок: 0,        держится_мин: 0,  отпускает_мин: 0,  говорить: нет}   # факт 429 (limit_mark)
  лимит_расход:                     # прогноз по расходу лимита подписки; при «отказ» источника не действует
    потолок: вычисляемый
    держится_мин: 0                 # снижение сразу; подъём — ключами лимит_подписки.*
    отпускает_мин: 0
    говорить: да
  выкат:        {потолок: заморозка, держится_мин: 0, отпускает_мин: 0,  говорить: нет}
  ротация:      {потолок: заморозка, держится_мин: 0, отпускает_мин: 0,  говорить: нет}
  мощность:
    потолок: ступень_вниз
    # порог срабатывания — ключ LOAD_MAX_PER_CPU harness.conf (тот же, что у гигиены);
    # числом здесь не дублируется
    нагрузка_на_ядро_ниже: 1.25     # отпускает только ниже этого; выше — добор по одной
    кража_выше_pct: 15              # steal за интервал замера
    держится_мин: 10
    отпускает_мин: 20
    говорить: да
  авария:                           # сразу в 1, мимо ступеней; ставит потолок мощности 1
    потолок: 1
    нагрузка_на_ядро_выше: 4.0
    # память и своп — ключи MEM_MIN_FREE_PCT и SWAP_MAX_PCT harness.conf
    диска_выше_pct: 90
    держится_мин: 4
    отпускает_мин: 20
    говорить: да
  мало_задач:   {потолок: в_работе_плюс_готовые, держится_мин: 0, отпускает_мин: 0, говорить: да}
  файлы:        {потолок: ступень_вниз, предупреждений_за_30_мин: 3, держится_мин: 0, отпускает_мин: 30, говорить: да}

сторож:
  пинок_не_чаще_мин: 20             # не меньше запаздывания load5
  после_подъёма_ждать_мин: 20       # только после шага ВВЕРХ мощности / снятия аварии
  в_зоне_добирать_по: 1             # load5 между нагрузка_на_ядро_ниже и LOAD_MAX_PER_CPU
  лишнее_не_чаще_мин: 60
  эскалация_после_пинков: 3
  эскалация_не_чаще_мин: 720
сообщения:
  не_чаще_мин: 30

# Лимит подписки. Числа стартовые, НЕ откалиброваны: правятся данными.
лимит_подписки:
  адаптер: claude                   # claude | api (в v1 api — заглушка «отказ»)
  файл_claude: /var/lib/harness/panel-state/лимиты-подписки.json   # пишет скрипт строки состояния (Ч9)
  устарел_мин: 15                   # файл старше — «отказ»
  порог_прогноза_pct: 95            # прогноз использования к моменту сброса не выше
  стоп_pct: 98                      # использовано не меньше — потолок 0 до сброса
  окно_расхода_мин: {пять_часов: 60, неделя: 360}
  мин_задача_часов: {пять_часов: 0.5, неделя: 3}
  скорость_без_данных_pct_ч_на_задачу: {пять_часов: 8, неделя: 0.5}
  подъём_не_чаще_мин: 20            # гистерезис: потолок растёт не чаще
  запас_подъёма_pct: 3              # подъём считается от порога минус запас
  сброс_падение_pct: 10             # процент упал на столько пунктов — лимит сброшен
