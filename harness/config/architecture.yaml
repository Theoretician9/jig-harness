# Реестр архитектуры харнеса: восемь частей, у каждого механизма и каждой
# карточки — ровно одно место (элемент одной из частей).
#
# Это ДАННЫЕ и единственное место, где перечислены части и элементы: читают его
# только через scripts/lib/architecture.py, второго списка нет ни в коде, ни в
# схеме карты. Правила формы и контрактов судит scripts/check-architecture.py.
# Файл едет в пакет и в публичную сборку, поэтому имён копий и продуктов здесь нет.
#
# Контракт между частями записан с двух сторон: выход одной части (кому) обязан
# иметь парный вход (от) у другой; «*» — все части, «внешний:<кто>» — вне харнеса.
версия: 1
части:

  - id: channel
    имя: Канал
    обязанность: "Разговор с владельцем: приём сообщений, перехват и разбор, отправка, согласие кнопками, отчёты."
    не_её:
      - "что делать с задачей после разбора — map"
      - "кто её делает — executors"
      - "содержание отчёта о качестве — quality отдаёт числа, канал их несёт"
    политика:
      шаги_добавить: []
      проверки: ["переписка", "зов модели"]
      решает: оркестратор
    входы:
      - {от: "*", что: "весть владельцу (текст, важность)"}
      - {от: map, что: "список задач для отчёта"}
      - {от: "внешний:владелец", что: "сообщения"}
    выходы:
      - {кому: map, что: "разбор сообщения"}
      - {кому: release, что: "согласие (кнопка, id сообщения)"}
      - {кому: executors, что: "толчок смене"}
    элементы:
      - {id: channel.intake, имя: Приём, что: "диспетчер, входящие, квитанция «принял», голос"}
      - {id: channel.intercept, имя: Перехват, что: "разбор сообщения на задачи, указания, вопросы, уточнения"}
      - {id: channel.send, имя: Отправка и тон, что: "tg_send.sh, тон, правила переписки, срочная весть"}
      - {id: channel.consent, имя: Согласие кнопками, что: "кнопки согласия и двери согласия"}
      - {id: channel.reports, имя: Отчёты и виджет, что: "статус, виджет, отчёты владельцу"}
      - {id: channel.panel, имя: Страница управления, что: "панель управления"}

  - id: map
    имя: Карта
    обязанность: "Задачи и проекты: заведение карточки, её место, статусы, дубли, очередь работы, приёмка, реестры устройства."
    не_её:
      - "разбор смысла сообщения — channel"
      - "стадии работы над задачей — pipeline"
      - "правда о «проверено» — quality даёт доказательство, карта его хранит"
    политика:
      шаги_добавить: []
      проверки: ["карта", "схема карты", "потеря задач", "писатели карты", "архитектура"]
      решает: оркестратор
    входы:
      - {от: channel, что: "разбор сообщения"}
      - {от: network, что: "находка"}
      - {от: quality, что: "тревога о красном"}
      - {от: executors, что: "статус работы"}
    выходы:
      - {кому: pipeline, что: "карточка с элементом и глубиной, политика части её элемента"}
      - {кому: channel, что: "задачи для отчёта"}
    элементы:
      - {id: map.cards, имя: Карточки, что: "писатели и схема карточек"}
      - {id: map.keeper, имя: Ведение карты, что: "умолчания, факт when, привязка, сведение"}
      - {id: map.queue, имя: Очередь и приёмка, что: "очередь работы и приёмка"}
      - {id: map.board, имя: Экран и направления, что: "экран карты и карта направлений"}
      - {id: map.architecture, имя: Реестры архитектуры и механизмов, что: "что где лежит: реестр частей и реестр механизмов"}

  - id: pipeline
    имя: Пайплайн
    обязанность: "Как задача проходит стадии: набор шагов по уровню и характеру, бумаги шагов, режимы, скилы."
    не_её:
      - "сами проверки — quality"
      - "кто исполняет шаг — executors"
      - "статус в карте — map"
    политика:
      шаги_добавить: []
      проверки: ["пайплайн", "пайплайн-гейт"]
      решает: оркестратор
    входы:
      - {от: map, что: "карточка и политика части её элемента"}
    выходы:
      - {кому: executors, что: "шаг с моделью шага"}
      - {кому: quality, что: "перечень обязательных проверок задачи"}
    элементы:
      - {id: pipeline.stages, имя: Уровни и шаги, что: "уровни, шаги, гейт пайплайна"}
      - {id: pipeline.spec, имя: Спека и ревью, что: "спека, ревью спеки, согласование, стандарты"}
      - {id: pipeline.skills, имя: Скилы шагов, что: "скилы шагов"}
      - {id: pipeline.modes, имя: Режимы, что: "хакатон, выключатели, скорость"}

  - id: quality
    имя: Качество
    обязанность: "Проверки, ворота, мутации, живая проверка, планка кода, сторожа команд и секретов, журналы событий."
    не_её:
      - "решение «выкатывать» — release"
      - "набор шагов задачи — pipeline"
    политика:
      шаги_добавить: []
      проверки: ["устройство", "карантин ворот", "архитектура"]
      решает: оркестратор
    входы:
      - {от: executors, что: "правка в дереве"}
      - {от: pipeline, что: "перечень проверок"}
    выходы:
      - {кому: release, что: "вердикт ворот (зелёный или красный, причины)"}
      - {кому: map, что: "тревога о красном"}
      - {кому: channel, что: "числа для вести"}
    элементы:
      - {id: quality.gates, имя: Ворота, что: "gates.sh, кэш, карантин, ночной прогон"}
      - {id: quality.mutations, имя: Мутации, что: "мутационная проба и записи мутаций"}
      - {id: quality.live-check, имя: Живая проверка, что: "живая проверка механизмов"}
      - {id: quality.code-bar, имя: Планка кода, что: "имена, импорты, чистота харнеса"}
      - {id: quality.guards, имя: Сторожа, что: "сторожа команд, секреты, безопасность"}
      - {id: quality.events, имя: Журналы событий, что: "журналы событий"}

  - id: executors
    имя: Исполнители
    обязанность: "Кто делает работу: смены и надзиратель, помощники, модели, аккаунты и лимиты, память и личность."
    не_её:
      - "что делать — map и pipeline"
      - "сервер, на котором работают — machine"
    политика:
      шаги_добавить: []
      проверки: ["зов модели", "модели под шаги"]
      решает: оркестратор
    входы:
      - {от: pipeline, что: "шаг"}
      - {от: machine, что: "ресурс (память, слоты)"}
      - {от: channel, что: "толчок смене"}
    выходы:
      - {кому: quality, что: "правка"}
      - {кому: map, что: "статус работы"}
      - {кому: channel, что: "пульс смены"}
    элементы:
      - {id: executors.shift, имя: Смена, что: "смена, надзиратель, ротация, передача"}
      - {id: executors.helpers, имя: Помощники, что: "план запуска, роли, бюджет, заявки на файлы, коммит под замком"}
      - {id: executors.models, имя: Модели, что: "выбор модели шага, зов модели"}
      - {id: executors.accounts, имя: Аккаунты и лимиты, что: "аккаунты и лимиты"}
      - {id: executors.memory, имя: Память и личность, что: "память и личность агента"}

  - id: release
    имя: Выпуск
    обязанность: "От слияния до копий: очередь слияния, выкат и откат, публичная сборка, поезд выпуска, версии, шаблоны стека."
    не_её:
      - "вердикт ворот — quality"
      - "раздача версии по сети — network несёт её"
    политика:
      уровень_не_ниже: обычная
      шаги_добавить: []
      проверки: []
      решает: оркестратор
    входы:
      - {от: quality, что: "вердикт ворот"}
      - {от: channel, что: "согласие"}
    выходы:
      - {кому: network, что: "версия"}
      - {кому: machine, что: "команда обновления своей установки"}
    элементы:
      - {id: release.merge, имя: Слияние, что: "очередь слияния"}
      - {id: release.deploy, имя: Выкат, что: "выкат и откат, сторож выката"}
      - {id: release.publish, имя: Публикация, что: "публичная сборка и публикация, версии и заметки"}
      - {id: release.stack, имя: Шаблоны стека, что: "шаблоны стека"}

  - id: machine
    имя: Машина
    обязанность: "Сервер, данные, установка: резервные копии, установщик, ресурсы, процессы и метки жизни, порты и наружная поверхность."
    не_её:
      - "что публикуется — release"
      - "кто работает на машине — executors"
    политика:
      уровень_не_ниже: обычная
      шаги_добавить: []
      проверки: ["дампы баз и права копий", "харнес чист"]
      решает: оркестратор
    входы:
      - {от: "*", что: "регистрация процесса, запрос ресурса"}
      - {от: release, что: "команда обновления"}
    выходы:
      - {кому: "*", что: "процесс, ресурс, копия данных"}
      - {кому: channel, что: "весть о беде сервера"}
    элементы:
      - {id: machine.data, имя: Данные, что: "резервные копии и удаление данных"}
      - {id: machine.install, имя: Установка, что: "установщик, раскладка, обновление установки, возможности"}
      - {id: machine.resources, имя: Ресурсы, что: "диск, tmp, docker, нагрузка, срезы"}
      - {id: machine.processes, имя: Процессы, что: "диспетчер и библиотека процессов, метки жизни"}
      - {id: machine.surface, имя: Наружная поверхность, что: "порты, наружная поверхность, секреты на диске"}

  - id: network
    имя: Сеть копий
    обязанность: "Обмен между установками: находки и письма, ключи обмена, моментальные сообщения, журнал вклада, доставка версии."
    не_её:
      - "предмет находки — карточка находки относится к элементу предмета, сеть только транспорт"
      - "сборка версии — release"
    политика:
      шаги_добавить: []
      проверки: []
      решает: оркестратор
    входы:
      - {от: release, что: "версия"}
      - {от: "внешний:копии", что: "находки"}
    выходы:
      - {кому: map, что: "находка"}
      - {кому: channel, что: "весть о копии"}
      - {кому: "внешний:копии", что: "версия"}
    элементы:
      - {id: network.exchange, имя: Находки и письма, что: "находки и письма, ключи обмена"}
      - {id: network.messaging, имя: Моментальные сообщения, что: "моментальные сообщения между серверами"}
      - {id: network.contribution, имя: Журнал вклада, что: "журнал вклада"}
