# Префиксы объектов docker: что принадлежит среде, а что — чужое.
#
# ДАННЫЕ, а не код. Читает проба среды (scripts/test_environment.sh), критерий
# П-3 спеки «изолированная среда»: множество чужих объектов ДО подъёма обязано
# входить в множество ПОСЛЕ — то есть чужое не задето.
#
# Зачем список исключений. Между двумя снимками работают свои же механизмы
# харнеса: проба восстановления (пн 05:00) и проба установки (06:00) создают
# и убирают контейнеры и тома со своими префиксами. Без исключения они
# выглядели бы то появлением, то пропажей чужого объекта — ложный красный
# и ложный зелёный (находка контракта задачи 28.09.2026).

# Среда судится по МЕТКЕ compose, а не по имени: docker --filter name=
# сравнивает подстрокой, и фильтр по имени проекта совпал бы и с его томом
# `<проект>_dbdata`, и с любым чужим именем, содержащим эти буквы.
#
# Имя проекта — не литерал, а подстановка `{продукт}`: её раскрывает читатель
# значением PRODUCT_DIR из harness.conf. Вписанное имя было бы следом нашей
# установки в общем инструменте (его слово 13.10.2026) и поломкой у того, чей
# продукт зовётся иначе. Ключ пуст — проба отказывает словами «данные неполны».
среда:
  метка: com.docker.compose.project
  проект: "{продукт}"
  # Маркер в теле ответа web: им проба доказывает, что по порту отвечает СРЕДА,
  # а не чужой сервер. ДАННЫЕ, а не строка внутри пробы: сейчас на порту
  # заглушка Ф1 со своим маркером, а когда на него встанет приложение, маркер
  # сменится ОДНОЙ правкой здесь. Пусто = судить только кодом ответа — иначе
  # приезд приложения покраснил бы разом --подъём, --архив и --снятие словами «по порту
  # отвечает не среда» и увёл бы разбор не туда (ревью кода 28.09.2026, I-9).
  маркер: "sreda-{продукт}-ф1"
  # Потолок суммы лимитов памяти постоянных служб среды, МБ. Тоже данные:
  # третья служба (redis, воркер) поднимает потолок правкой строки, а не
  # правкой пробы (там же, I-9).
  потолок_мб: 1536

# Объекты своих проб: появляются и исчезают между снимками законно.
исключить_префиксы:
  - harness-restore-proba-
  - harness-install-proba-
  - proverka-klona-

# Окно, в которое снимки не берутся: ночные механизмы меняют состав docker.
# 03:00 — disk-cleanup.sh (container prune, image prune), 05:00 — проба
# восстановления, 06:00 — проба установки.
окно_без_снимков:
  с: "03:00"
  по: "06:30"

# Окно, в которое среду НЕЛЬЗЯ останавливать. Сбор архива (--архив) гасит службы
# на время снятия тома: пока по порту заглушка, останавливать нечего, а с живым
# приложением это простой прода, вызванный запуском пробы (ревью кода
# 28.09.2026, I-8). Пусто с обеих сторон = ограничения нет; заполнено — режим
# --архив внутри окна отказывается от замера кодом 2, как в ночном окне.
# Решение смены 29.09.2026: пока по порту заглушка и пользователей у среды нет,
# окно пустое — запрет на простой защищал бы несуществующий сайт. Часы
# появляются здесь в тот же шаг, в который на порт встанет живое приложение.
окно_без_остановки:
  с: ""
  по: ""
