# Реестр переключателей: что владелец вправе менять сам.
#
# Владелец 11.09.2026: «нам нужно будет сейчас сделать веб панель для управления
# харнесом, куда надо будет вывести как раз таки все переключатели -
# автоматический вывод в гит или запрашивать например и так далее».
#
# Это ДАННЫЕ. Панель рисует то, что здесь описано, и ничего сверх того: добавить
# ручку — добавить строку, а не править панель. Гейт scripts/check-pereklyuchateli.py
# сверяет каждую строку с живым кодом и конфигом.
#
# Поля:
#   ключ            — имя в конфиге, латиницей
#   файл            — install.conf | harness.conf
#   имя             — подпись на экране
#   вид             — выбор | число
#   значения        — для вида «выбор»: что можно поставить и как это подписано
#   от / до         — для вида «число»: границы, за которые панель не пустит
#   простыми словами — пояснение для человека без подготовки (требование владельца
#                     «чтобы бабушка поняла»); термин — только с расшифровкой
#   опасный         — переключение подтверждается одноразовым кодом в боте
#   читатель        — файл, который ИСПОЛНЯЕТ этот ключ
#   способ_чтения   — при_вызове | cron_10мин | служба
#   применяется     — сразу | в ближайшую проверку | после перезапуска службы
#
# `применяется` обязано соответствовать `способ_чтения`: ключ, который читают раз
# в десять минут, не смеет обещать «сразу».

переключатели:
  - ключ: PUSH_NEEDS_OWNER
    файл: harness.conf
    имя: "Отправка в хранилище кода"
    вид: выбор
    значения:
      - { значение: "0", подпись: "сама", по_умолчанию: true }
      - { значение: "1", подпись: "спросить меня" }
    простыми словами: >
      Когда работа закончена и все проверки прошли, готовый код сам уезжает в
      хранилище (GitHub). «Спросить меня» — сначала напишу в бот и подожду ответа.
    опасный: true
    читатель: scripts/deploy_guard.py
    способ_чтения: при_вызове
    применяется: сразу

  - ключ: DEPLOY_NEEDS_OWNER
    файл: harness.conf
    имя: "Выкат на рабочий сервер"
    вид: выбор
    значения:
      - { значение: "1", подпись: "спросить меня", по_умолчанию: true }
      - { значение: "0", подпись: "сам" }
    простыми словами: >
      Выкат — это когда новая версия программы заменяет работающую, и её сразу
      видят люди. Пока стоит «спросить меня», я не сделаю этого без твоего слова.
    опасный: true
    читатель: scripts/deploy_guard.py
    способ_чтения: при_вызове
    применяется: сразу

  - ключ: PUBLISH_NEEDS_OWNER
    файл: harness.conf
    имя: "Публикация харнеса для всех"
    вид: выбор
    значения:
      - { значение: "1", подпись: "спросить меня", по_умолчанию: true }
      - { значение: "0", подпись: "сам" }
    простыми словами: >
      Выкладывание проверенной версии харнеса в открытый доступ, где её увидят
      посторонние люди.
    опасный: true
    читатель: scripts/deploy_guard.py
    способ_чтения: при_вызове
    применяется: сразу

  - ключ: ROTATE_NEEDS_OWNER
    файл: harness.conf
    имя: "Смена рабочего окна"
    вид: выбор
    значения:
      - { значение: "0", подпись: "сама", по_умолчанию: true }
      - { значение: "1", подпись: "спросить меня" }
    простыми словами: >
      У меня есть предел того, сколько я держу в голове за раз. Когда он близок,
      я передаю дела сам себе и начинаю заново — ничего не теряя. Это происходит
      само; «спросить меня» заставит меня сначала написать тебе.
    опасный: false
    читатель: harness/demons/session-warden.sh
    способ_чтения: cron_10мин
    применяется: в ближайшую проверку

  - ключ: CTX_ROTATE_PCT
    файл: harness.conf
    имя: "Когда менять рабочее окно"
    вид: число
    от: 50
    до: 95
    единица: "%"
    простыми словами: >
      На каком заполнении памяти я передаю дела сам себе. Меньше — чаще смены,
      но спокойнее; больше — реже, но ближе к пределу.
    опасный: false
    читатель: harness/demons/session-warden.sh
    способ_чтения: cron_10мин
    применяется: в ближайшую проверку

  - ключ: SILENCE_MAX_MIN
    файл: harness.conf
    имя: "Сколько молчания терпеть"
    вид: число
    от: 10
    до: 180
    единица: "мин"
    простыми словами: >
      Если я работаю и долго ничего тебе не пишу, сторож толкает меня в бок —
      через столько минут.
    опасный: false
    читатель: harness/demons/session-warden.sh
    способ_чтения: cron_10мин
    применяется: в ближайшую проверку

  - ключ: HANDOVER_MAX_AGE_MIN
    файл: harness.conf
    имя: "Свежесть записей для преемника"
    вид: число
    от: 60
    до: 480
    единица: "мин"
    простыми словами: >
      Перед сменой окна я оставляю записи «что сделано и что дальше». Если они
      старше этого срока, меня заставляют их обновить.
    опасный: false
    читатель: scripts/handover-check.sh
    способ_чтения: при_вызове
    применяется: сразу

  - ключ: UPDATE_MODE
    файл: harness.conf
    имя: "Обновление харнеса"
    вид: выбор
    значения:
      - { значение: "manual", подпись: "только сказать мне", по_умолчанию: true }
      - { значение: "ask", подпись: "спросить меня" }
      - { значение: "auto", подпись: "ставить само" }
    простыми словами: >
      Раз в сутки харнес смотрит, не вышла ли новая версия его самого. «Только
      сказать мне» — просто напишет об этом. «Спросить меня» — спросит кодом в
      боте. «Ставить само» — поставит и отчитается; если новая версия окажется
      сломанной, он сам вернётся на прежнюю.
    опасный: true
    читатель: harness/demons/obnovlenie-watch.sh
    способ_чтения: cron_сутки
    применяется: в ближайшую проверку

  - ключ: REVIZIA_ENABLED
    файл: harness.conf
    имя: "Ежемесячная ревизия проекта"
    вид: выбор
    значения:
      - { значение: "1", подпись: "включена", по_умолчанию: true }
      - { значение: "0", подпись: "выключена" }
    простыми словами: >
      Раз в месяц я перечитываю свой код свежим взглядом и записываю в список
      дел, что стоит улучшить. Сам код при этом не меняется — только
      предложения.
    опасный: false
    читатель: harness/demons/revizia-proekta.sh
    способ_чтения: cron_месяц
    применяется: в ближайшую проверку

  - ключ: REVIZIA_MODEL
    файл: harness.conf
    имя: "Кто делает ревизию"
    вид: выбор
    значения:
      - { значение: "opus", подпись: "опус (точный)", по_умолчанию: true }
      - { значение: "fable", подпись: "фейбл (широкий взгляд)" }
    простыми словами: >
      Какая из моих моделей читает код при ревизии. Опус точнее на длинном
      коде, фейбл шире смотрит на замысел.
    опасный: false
    читатель: harness/demons/revizia-proekta.sh
    способ_чтения: cron_месяц
    применяется: в ближайшую проверку

  - ключ: LANG_LEVEL
    файл: harness.conf
    имя: "Каким языком тебе писать"
    вид: выбор
    значения:
      # Значения ЛАТИНИЦЕЙ: вход единственного писателя настроек узкий нарочно
      # (буквы, цифры и «_ . % -»), чтобы в него нечего было подставить.
      - { значение: "auto", подпись: "подстраиваться под меня", по_умолчанию: true }
      - { значение: "simple", подпись: "на пальцах, без терминов" }
      - { значение: "normal", подпись: "термин с пояснением" }
      - { значение: "technical", подпись: "термины как есть" }
    простыми словами: >
      Обычно я смотрю, какими словами пишешь ты, и подстраиваюсь. Здесь можно
      выбрать раз и навсегда: «на пальцах» — совсем без особых слов,
      «технический» — как инженеру, без пояснений.
    опасный: false
    читатель: scripts/uroven-yazyka.py
    способ_чтения: при_вызове
    применяется: сразу

# ── Чего в реестре быть не может ──────────────────────────────────────────────
# Не «неудобно вынести», а НЕЛЬЗЯ: это носители инвариантов. Ключ отсюда в
# переключателях = красный гейт.
чёрный_список:
  - ключ: AUTONOMY
    причина: >
      Снимает согласие владельца сразу с четырёх действий, включая УДАЛЕНИЕ БАЗЫ:
      проверка режима стоит до разбора действия. Веб-выключатель инварианта И-1.
  - ключ: DROPDB_NEEDS_OWNER
    причина: >
      Удаление данных необратимо (И-1). Согласие спрашивается всегда, ручки нет.
  - ключ: BACKUP_*
    причина: >
      Копии — то, чем И-1 держится. Выключаемая копия равна её отсутствию.
  - ключ: SECRETS_DIR
    причина: >
      Путь к секретам (И-3). Смена пути через веб = увод ключей.
  - ключ: PUBLIC_REPO
    причина: >
      Адрес, откуда приезжает КОД харнеса. Сменить его через веб — подменить
      источник кода целиком: у агента на машине права без пароля (находка I3
      разбора спеки обновления).
  - ключ: CONFIRM_MAX_AGE_MIN
    причина: >
      Срок жизни согласия владельца. Растянув его, можно сделать «да» вечным —
      это отмена правила «одно да — одно действие», а не настройка.
