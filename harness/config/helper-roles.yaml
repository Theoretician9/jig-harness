# Роли помощников. Данные для scripts/hooks/lead_role_guard.py и подсказка
# «ситуация → какая роль» для смены, которая решает, кого запускать.
#
# Два вида запуска (владелец 29.10.2026): исполнитель получил одну конкретную
# задачу, делает её сам и никого не запускает; управляющий берёт задачу, идёт
# по трубе, запускает исполнителей и сам ничего не пишет — как основная смена.

роли:
  harness-worker:
    # Исполнитель руками работает, помощников не запускает: пустой список.
    запускает: []
  harness-lead:
    # Только эти типы и только с явной моделью.
    запускает: [harness-worker]
    требует_модель: да
    # Одновременно живых исполнителей не больше; всего на задачу держит
    # agent_budget_guard (pipeline.yaml → помощники.<уровень>.всего).
    параллельно_максимум: 5
    # Файл, который управляющий пишет сам: журнал решений. Остальное — исполнителям.
    пишет_только: ["журнал.md"]
    # Bash управляющего: первое слово каждой команды — из списка; git — только
    # перечисленные подкоманды; перенаправление — только в пишет_только.
    команды: [ls, cat, head, tail, grep, rg, wc, date, sleep, test, echo, printf, stat, find, sort, uniq, cut, true, pwd]
    # Запись «путь --флаг …» пускает скрипт только с перечисленными флагами (любой другой в argv —
    # отказ): launch-plan.py читает план, который требует launch_plan_guard, а --прижить,
    # --закрепить, --отметить пишут в карту; spec_approval.py --состояние читает, --отправить пишет
    # владельцу. Запись без флагов пускает любые.
    скрипты: ["scripts/who-writes.py", "scripts/gates-snapshot.sh", "scripts/model-for.sh",
             "scripts/launch-plan.py --json --строка --нужен-план --проверить-план --метрики --сутки --карта --планы",
             "scripts/spec_approval.py --состояние",
             "scripts/merge-queue.py", "scripts/commit-friction.py"]
    git: [status, log, diff, show, branch, rev-parse, ls-files]

# Вывод роли и потолка исполнителей кодом (launch-plan.py). Первая подошедшая
# строка правил; смена читает как таблицу. Значения старта, правятся по обкатке.
вывод_роли:
  # В правилах пороги стоят именами («<=порог_мелочи.файлов», «>=порог_нагрузки»):
  # смена правит число здесь, правило не трогает.
  # Простая задача до этого числа файлов и одной группы: контроль молчит.
  порог_мелочи: {файлов: 3}
  # От скольких независимых групп имеет смысл управляющий.
  параллель_от_групп: 3
  # Под нагрузкой режем задачу, только если цена() >= цена или, пока файлов нет,
  # volume.complexity >= complexity.
  порог_резки_сложности: {цена: 6, complexity: 4}
  # Обкатка: жёлтый — предупреждение, красный — отказ хука.
  строгость: жёлтый
  # Границы volume.complexity; цена() судится порогами pipeline.yaml.
  сложность:
    complexity: {простая: "<=2", средняя: 3, высокая: ">=4"}
  правила:
    - {имя: мелочь,    если: {сложность: простая, групп: "<=1", файлов: "<=порог_мелочи.файлов"}, роль: harness-worker, исполнителей: 1,       глубина: 1}
    - {имя: простая,   если: {сложность: простая},                              роль: harness-worker, исполнителей: 1,       глубина: 1}
    - {имя: резка_под_нагрузкой_лид, если: {задач_в_работе: ">=порог_нагрузки", сложность_режет: да, групп: ">=параллель_от_групп", ёмкость: ">=2"}, роль: harness-lead,   исполнителей: "min(групп, ёмкость)", глубина: 2}
    - {имя: резка_под_нагрузкой,     если: {задач_в_работе: ">=порог_нагрузки", сложность_режет: да, групп: ">=2", ёмкость: ">=2"}, роль: harness-worker, исполнителей: "min(групп, ёмкость)", глубина: 1}
    - {имя: нагрузка,  если: {задач_в_работе: ">=порог_нагрузки"},              роль: harness-worker, исполнителей: 1,       глубина: 1}
    - {имя: параллель, если: {групп: ">=параллель_от_групп", ёмкость: ">=параллель_от_групп"}, роль: harness-lead,   исполнителей: ёмкость, глубина: 2}
    - {имя: крупная,   если: {сложность: высокая, шагов: ">=5", ёмкость: ">=2"}, роль: harness-lead,  исполнителей: ёмкость, глубина: 2}
    - {имя: две,       если: {групп: ">=2", ёмкость: ">=2"},                    роль: harness-worker, исполнителей: 2,       глубина: 1}
    - {имя: прочее,    если: {},                                                роль: harness-worker, исполнителей: 1,       глубина: 1}
  # Когда задаче нужен свой план: шагов или независимых групп не меньше.
  план_нужен: {шагов: 5, групп: 2}
  # Предел вызова launch-plan.py из хука, секунд: меньше timeout хука в
  # .claude/settings.json (15 с), чтобы сбой был виден как «таймаут», а не как обрыв.
  таймаут_плана_с: 8
  # Потолок живых помощников на всю смену: защита от бегства, не правило.
  предохранитель:
    жёсткий_верх: 5       # общий потолок живых исполнителей и управляющих
    # Запасные 5 и 3 действуют, пока судья режима скорости не ответил (состояние
    # нечитаемо или старше 10 мин); при свежем состоянии потолок даёт судья
    # (speed-modes.yaml → живых_потолок), порог_нагрузки = эффективный + порог_сверх_режима.
    порог_нагрузки: 3     # столько задач в работе — одна задача получает одного исполнителя
    порог_сверх_режима: 1 # правило «нагрузка» включается только при задачах сверх режима
    окно_живых: 15        # минут: помощник с заявкой или ролью за это окно считается живым
  # Глубже плана/главы/подглавы/подподглавы — отказ.
  верх_вложенности: 3
  # Доля пересечения файлов с охватом главы, с которой новая задача прижимается к ней.
  порог_приживления: 0.5
  # Критерий перехода жёлтого в красный по итогам обкатки.
  обкатка:
    суток: 3
    решений_мин: 20       # решений вне «мелкая» за срок
    ложных_макс: 10       # % отмеченных предупреждений
    неотмеченных_макс: 20 # % предупреждений без отметки
    метка_мин: 80         # % запусков с меткой «Часть:»
    сбоев_за_сутки: 0
    дверей_макс: 10       # % решений, обойдённых дверью
