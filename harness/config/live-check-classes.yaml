# механизм СУЩЕСТВУЕТ, чтобы отказывать («судит», «не пропускает», «краснеет» в
# его роли). У этих одиннадцати роль говорит «отвечает на один вопрос»,
# «считает», «показывает», «переводит», «запускает чужие проверки», «уносит
# цитату» — это инструменты, и предикат судьи («больной случай плюс здоровый»)
# к ним неприменим: ломать в копии дерева нечего, а отказ у них не цель, а край.
# Носитель класса C2 заведён той же сменой: scripts/live-check-tool.py.
# ПОПРАВКА КЛАССА 17.10.2026, признак написан, а не подразумевается.
# В Task 0 класс раздавался по полю «вид» реестра, и «вид: гейт» достался и
# приборам. Признак судьи (C1): механизм СУЩЕСТВУЕТ, чтобы отказывать —
# его роль в реестре говорит «судит», «не пропускает», «краснеет». Прибор и
# сборщик (C2) существуют, чтобы показывать и собирать; предикат судьи
# («больной случай плюс здоровый») к ним неприменим, и спека §3.1 называет
# это прямо: среди «158 гейтов» 11 библиотек и 4 сборщика.
# ПОПРАВКА ВТОРАЯ 17.10.2026, пять механизмов. Живая проверка дошла до хуков и
# встала: у хука оболочки при РАЗРЕШЕНИИ нет вывода вовсе — он пропускает
# молча, — и предикат C1 («больной случай краснеет, затем здоровый зеленеет»)
# доказывался бы моим собственным эхом. Так и вышло в тот же час: запись
# guard_bash.py была снята, потому что её цитатой служило эхо «[страж] команда
# разрешена», которого страж не печатал. Хуки оболочки — это класс B1 («совершено
# перехватываемое действие и увидено решение»), и спека так и говорит.
# Переведены: guard_bash.py, agent_skill_guard.py, skill_log.sh → B1;
# map-from-message.py (превращает ВХОДЯЩЕЕ сообщение в карточку) → B2;
# model-for.sh (отвечает моделью по таблице, отказывать ему нечего) → C2.
# Остаток той же беды назван карточкой hr.klassy-zhivoj-proverki-razduty: из 62
# непроверенных C1 роль в реестре называет судьёй 24.
# Поправлены четыре: осмотр смены (показывает экран), очередь работы (считает
# и расставляет), прибор одобрения спек (держит развилку владельца), сборщик
# скилов (собирает из глав). Ни один из них не затем, чтобы отказывать.

