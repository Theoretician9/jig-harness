# Класс живой проверки механизма — ДАННЫЕ, не код.
#
# Спека docs/specs/2026-10-15-живая-проверка-механизмов.md §3.1: предикат
# «проверено живьём» у каждого класса свой, и класс берётся отсюда, а не из
# головы проверяющего. До этого файла «проверено» значило «я посмотрел»:
# ревью спеки 15.10 измерило цену — «повод = крон» покрывает 15 демонов из 19,
# а 158 «гейтов» включают библиотеки scripts/lib, сборщики и семь опасных
# инструментов, к которым предикат судьи неприменим.
#
# Здесь ТОЛЬКО класс и, где нужно, причина. Дублировать реестр
# (harness/config/mechanisms.yaml) запрещено: вид, тема и команда проверки
# живут там, и два списка одного факта разъезжаются молча.
#
# Классы (закрытый список, читает scripts/build-live-check-list.py):
#   A1 — демон по расписанию: прочитан журнал ПОСЛЕДНЕГО кронового прогона
#        (путь из crontab -l, не из реестра) либо вызов в среде крона (env -i)
#   A2 — демон или служба без расписания: вызов тем способом, которым его
#        зовут (команда владельца, сторож, другой демон) + чтение следа
#   B1 — хук оболочки: совершено перехватываемое действие и увидено решение
#   B2 — обработчик входящих: прогон на ЗАПИСАННОМ живом сообщении владельца
#        из inbox/обработано/ (подделать входящее нельзя — проверяемый написал
#        бы себе улику)
#   C1 — гейт-судья: больной случай в КОПИИ дерева краснеет с названной
#        причиной, затем здоровый зеленеет; одного зелёного мало
#   C2 — инструмент или библиотека: вызван с настоящим входом, вывод прочитан
#   C3 — опасный: только на стенде со своим префиксом и портом либо
#        «не-проверяемо» с причиной. Причина обязательна, её требует прибор
#   D  — файл пробы: мутация в судимом механизме краснит пробу; зелёная
#        мутация — находка о ПРОБЕ, а не допуск
#   E  — скил: вызов в ЭТОЙ задаче (запись журнала с ts позже начала задачи,
#        судится разбором JSON) и артефакт, который скил обязан оставить
#
# Как заполнен первый раз (16.10.2026) и чем это НЕ является доказательством:
# класс проставлен по явным правилам — скилы E, три хука оболочки B1, пять
# обработчиков входящих B2, семь опасных поимённо C3, файлы проб D (имя
# начинается с test_ либо кончается -probe.sh), демоны A1/A2 по наличию имени
# в живом crontab -l, библиотеки и сборщики C2, остальные судьи C1. Правило —
# это предположение о механизме, а не проверка его; живая проверка класс
# подтверждает или опровергает, и тогда строка правится здесь.
#
# Числа при заполнении: A1 22, A2 8, B1 3, B2 5, C1 115, C2 18, C3 7, D 53,
# E 18 — сумма 249, столько же механизмов в реестре.

