# Префиксы создателей из кода харнеса, которые сознательно НЕ отходы. T-R требует для
# каждого создателя запись в отходы_проб, защищено или здесь (ровно префикс), и создателя
# для каждой записи здесь. Уборщик этот список не читает: всё вне отходов — «неизвестное».
"не_отходы":
  # Создаются не в /tmp, а внутри своего стенда (dir=): уборка их имён не видит.
