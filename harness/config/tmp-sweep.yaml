  - ".diff"
# Классы описи диска (scripts/disk-report.py). Общие места харнеса, без имён установки;
# всё прочее опись называет путём и «ждёт слова». `$КЛЮЧ` в пути — из install.conf/harness.conf,
# класс с пустым ключом пропускается.
"опись":
  - {"путь": "/tmp", "класс": "/tmp", "чьё": "пробы и сессии", "решение": "убираю"}
  - {"путь": "/var/cache/apt/archives", "класс": "кеш apt", "чьё": "система", "решение": "убираю"}
  - {"путь": "/var/lib/docker", "класс": "образы и тома docker", "чьё": "docker", "решение": "хозяин disk-cleanup"}
  - {"путь": "/var/log/journal", "класс": "системный журнал", "чьё": "система", "решение": "ждёт слова"}
  - {"путь": "$LOG_DIR", "класс": "журналы харнеса", "чьё": "харнес", "решение": "хозяин disk-cleanup"}
  - {"путь": "$BACKUP_DIR", "класс": "ночные копии", "чьё": "харнес", "решение": "хозяин backup.sh"}
