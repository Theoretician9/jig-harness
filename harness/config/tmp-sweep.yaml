# Данные уборки /tmp (scripts/tmp-sweep.py). Код ничего из этого не держит в себе.
# Префиксы отходов — ровно как в mkdtemp проб, С дефисом, и только такие, чей создатель
# есть в коде харнеса: обычное слово («след-», «класс-») съело бы чужую копию данных.
# Реестр сверяет проба T-R. Всё вне реестра — «неизвестное»: не удаляется и не переносится.
"сроки_ч":
  "отходы_ночь": 6
  "отходы_давление": 2
  "неизвестное_ночь": 72
  "неизвестное_давление": 24
  "карантин": 24
"отходы_проб":
  - "обновление-стенд-"
  - "живая-c2-"
  - "демон-живьём-"
# Чужое и живое: уборщик этих имён не судит вовсе.
"защищено":
  - "claude-"
  - "tmux-"
  - "cc-socks"
  - "systemd-private-"
  - "snap-private-tmp"
  - "ssh-"
  - "pulse-"
  - ".s.PGSQL"
  - "org.chromium."
  - ".X11-unix"
  - ".ICE-unix"
  - ".font-unix"
  - ".XIM-unix"
  - ".Test-unix"
  - ".уборка-карантин"
# Суффиксы, по которым запись уходит в карантин, а не под нож.
"похоже_на_данные":
  - ".sql"
  - ".dump"
  - ".db"
  - ".bak"
  - ".gz"
  - ".diff"
# Классы описи диска (scripts/disk-report.py). Общие места харнеса, без имён установки;
# всё прочее опись называет путём и «ждёт слова». `$КЛЮЧ` в пути — из install.conf/harness.conf,
# класс с пустым ключом пропускается.
"опись":
  - {"путь": "/tmp", "класс": "/tmp", "чьё": "пробы и сессии", "решение": "убираю"}
  - {"путь": "/var/cache/apt/archives", "класс": "кеш apt", "чьё": "система", "решение": "убираю"}
  - {"путь": "/var/lib/docker", "класс": "образы и тома docker", "чьё": "docker", "решение": "хозяин disk-cleanup"}
  - {"путь": "/var/log/journal", "класс": "системный журнал", "чьё": "система", "решение": "ждёт слова"}
  - {"путь": "$LOG_DIR", "класс": "журналы харнеса", "чьё": "харнес", "решение": "хозяин disk-cleanup"}
  - {"путь": "$BACKUP_DIR", "класс": "ночные копии", "чьё": "харнес", "решение": "хозяин backup.sh"}
