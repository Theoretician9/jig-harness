  - "logs-"
  - "disk-"
  - "g3-"
  - "g4-"
  - "дисп-"
  - ".прогон-"
  - ".board."
  - "shift-port-probe."
  - "warden-speed."
  - "pd-isolated-"
  # Слово или точка в конце: префикс реестра отходов — имя пробы с дефисом, слово съело бы чужое.
