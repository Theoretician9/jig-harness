# Главные проверки обновления (scripts/update.py, главные_проверки): откатывает обновление
# только новая красная из этого списка; прочие новые красные ставятся с карантином копии
# на 7 дней, карточкой и находкой в сеть. Имя = `проверка "<имя>"` в scripts/gates.sh.
# Файла нет (копия старше) — откатывает любая новая красная, как раньше.
# Состав — только проверки обычного прогона gates.sh (без --всё): откат судит ту же
# красную, которую увидел прогон «после». Резервные копии (И-1) в обычном прогоне не
# судятся — их пробы идут только в --всё, поэтому здесь их нет.
# Не сюда: «секреты», «права секретов», «секрет в логах» — они судят код, права и журналы
# самой копии, откат пакета их не исправит.
главные:
  - имя: "сторож команд"
    почему: "И-1/И-2: сторож разрушительных команд — без него любая команда уходит без суда"
  - имя: "ворота выката"
    почему: "И-2: выкат только через ворота; сломанные ворота пропускают выкат вслепую"
  - имя: "очередь канала"
    почему: "канал с владельцем: сломанная очередь теряет сообщения владельцу"
  - имя: "команды бота"
    почему: "канал с владельцем: команды бота — единственный разбор слов владельца"
  - имя: "дверь-сторожа"
    почему: "диспетчер: дверь сторожа — вход всех команд в систему"
  - имя: "маска секретов"
    почему: "И-3: маска прячет токены в выводе и журналах"
  - имя: "дверь данных"
    почему: "И-1: дверь удаления данных — без неё rm по данным уходит без «Да» кнопкой"
  - имя: "слово у двери удаления"
    почему: "И-1: текст не открывает дверь удаления, только «Да» кнопкой"
  - имя: "согласие"
    почему: "И-2: выкат идёт только с согласием владельца"
  - имя: "коды двери отправки"
    почему: "канал с владельцем: коды двери отправки отличают отказ от доставки"
  - имя: "сторож приёма"
    почему: "канал с владельцем: молчащий приём сообщений владельца должен быть замечен"
  - имя: "секреты под маской"
    почему: "И-3: находка секрета не печатает значение"
