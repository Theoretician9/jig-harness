# Пульт владельца: чему код заставляет модель следовать.
#
# Владелец 11.09.2026: «мне нужен какой то слой управления, где я могу
# управлять принципом работы модели, чему код ее заставляет следовать».
# И он же: «Зачем это мне решать? Это должно работать автоматически» —
# поэтому значения ниже работают из коробки, а файл существует как ПРАВО
# вмешаться, не как обязанность настраивать.
#
# Читает scripts/pipeline.py. Здесь ТОЛЬКО то, что трогает человек:
# вычисленное машиной живёт в $LOG_DIR/пайплайн-состояние.json, иначе каждый
# перерасчёт разводил бы проект и стартовый пакет (сверка с пакетом красит
# harness/config/).

# ── Цена ошибки: чем задача опаснее, тем больше шагов обязательно ──────────
# Признаки берутся ЗАМЕРОМ коммита (git diff --cached), а не из карты задач:
# поле volume.loc заполняю я сам и тем же коммитом — уровень строгости
# назначал бы себе тот, кому он добавляет работу (находка ревью C-6).
веса:
  миграция: 5            # необратимое изменение данных — И-1
  код_продукта: 3        # ошибка достанется живым людям
  сторож_или_гейт: 3     # ошибка снимает защиту с остального
  новый_файл: 1          # нет наработанного поведения
  за_100_строк: 1        # объём: добавленные строки
  за_100_строк_потолок: 3
  за_5_файлов: 1         # ширина захвата
  за_5_файлов_потолок: 2
  # Потолки подобраны так, чтобы ОДИН объём не дотягивал до П2: огромный, но
  # безрисковый коммит (данные, перенос) просит тесты, а не спеку с ревью.

# Пороги — ЧИСЛА, а не перцентили: иначе один и тот же коммит судился бы
# по-разному в разное время, а доля крупных задач была бы зафиксирована
# конструкцией (находка C-7). Пересчёт по истории существует отдельной
# командой «pipeline.py --пересчитать-пороги» и гейтом никогда не зовётся.
пороги:
  П1: 3                  # ниже — мелкая: ничего сверх существующих гейтов
  П2: 6                  # выше или равно — крупная: спека + ревью спеки + тесты до кода

# ── Какие бумаги требовать на каком уровне ────────────────────────────────
# Вопрос владельца 11.09: «По поводу договора о задаче, почему машина не может?»
# Может: у договора и плана есть ФАЙЛ (шаблоны — harness/шаблоны-задач/), а всё,
# у чего есть артефакт, проверяется так же, как спека. Первая редакция спеки
# сузила это зря.
#
# Имена шагов: спека · ревью_спеки · контракт · план · ревью_кода · тесты ·
# мутации. Последний заведён по слову владельца 28.09.2026: «их же у нас нет в
# пайплайне, соответственн это просто твой выбор, который не контролируется
# кодом. Надо в пайплайн добавить этот пункт с возможносттю включать выключать
# как остальные пункты». Место — ПОСЛЕ ревью кода: мутация проверяет пробы,
# которые к этому времени уже написаны и прочитаны.
# Где ищется файл: спека — поле spec: карточки; ревью_спеки — <спека>-REVIEW.md;
# ревью_кода — <спека>-CODE-REVIEW.md; контракт и план — .tasks/<id>/pretask.yaml
# и .tasks/<id>/план.md. Убрать шаг = убрать строку: это пульт, а не код.
шаги:
  мелкая: [тесты]
  обычная: [тесты, спека, ревью_спеки, контракт, ревью_кода, мутации]
  крупная: [спека, ревью_спеки, контракт, тесты, план, ревью_кода, мутации]

# ── Характер работы: чем задача является, а не сколько в ней строк ────────
# Владелец 13.09.2026: «надо чтобы пересмотр сразу ставил статус задаче».
# Замер журнала обходов (11 записей, 5 задач): ни один обход не был ленью —
# механическая правка в 22 файлах, задача-исследование, замысел разобранный в
# плане, аварийная починка живого отказа. Гейт судил цену диффа и вид работы
# не различал вовсе.
#
# Поле карточки: глубина: {уровень, характер, кем, когда}. Уровень — цена
# ошибки (мелкая/обычная/крупная), характер — чем работа является. Требуемые
# шаги = шаги уровня, СУЖЕННЫЕ характером.
#
# Имя «характер», а не «вид работы»: «вид работы» занят в модели.yaml и
# означает ШАГ пайплайна (спека, код, тесты) — омоним развёл бы два словаря.
характеры:
  разработка:
    смысл: новая механика или подсистема
    шаги: все                 # полный набор шагов уровня
  починка:
    смысл: аварийная правка живого отказа — сломанное уже вредит
    шаги: [тесты, ревью_кода]  # замысел задан отказом, спеке нечего описывать
  исследование:
    смысл: результат работы — документ, а не код
    шаги: [ревью_кода]         # сам документ и есть артефакт
  механическая:
    смысл: одна правка одного вида во многих файлах
    шаги: [тесты, ревью_кода]

# Чего характер НЕ закрывает: 4 обхода из 11 — другой класс («план вместо
# спеки» ×2, «ревью кода после коммита» ×2). Они остаются честной дверью
# HARNESS_PIPELINE_FORCE с записью причины; пятый характер здесь не нужен.

# Когда шаг включили. Правило судит задачи, начатые НЕ РАНЬШЕ этой даты:
# иначе включение шага краснит работу, которая уже почти закончена
# (вопрос владельца 11.09.2026). Пишет scripts/write-step.py.
шаги_включены:
  крупная: {мутации: "2026-09-28", план: "2026-09-11", ревью_кода: "2026-09-11"}
  мелкая: {тесты: "2026-09-11"}
  обычная: {контракт: "2026-09-11", мутации: "2026-09-28", ревью_кода: "2026-09-11", ревью_спеки: "2026-09-11", спека: "2026-09-11"}

# ── Строгость: новый гейт взрослеет сам ───────────────────────────────────
# Не «молчал N коммитов» (это доказывает молчание, а не правоту), а находки,
# признанные истинными при разборе (находка C-3).
строгость:
  подъём_после_истинных: 10
  подъём_после_тихих_коммитов: 20
  водораздел: "2026-09-11"   # задачи, начатые раньше, гейты пайплайна не судят
  # Свой водораздел у ночного режима --по-истории: он включён 27.09.2026 и
  # в первый же прогон назвал 10 долгов из 19 судимых. Все настоящие, но
  # ни один не «прошёл мимо ворот» этой ночью — это накопленный долг.
  # Красным режим красит работу, НАЧАТУЮ после своего включения; долг
  # прежних задач он печатает списком, и тот виден, а не спрятан.
  водораздел_истории: "2026-09-27"

# ── Тесты до кода: что гейт судит и насколько строго ──────────────────────
# Замер по всей истории (1192 коммита, 441 новый модуль продукта) показал, во
# что превращается правило «новый модуль — с тестом»: 135 коммитов с находками,
# и большинство ложные. Требовать тест на миграцию, shell-скрипт или React-
# компонент — тот самый «перекос в отладку», от которого предостерёг владелец.
# После сужения остаётся 75 коммитов (6 %) — это уже настоящие модули логики.
тесты_до_кода:
  расширения: [".py", ".ts"]        # где тест осмыслен; .tsx/.jsx/.sh не судим
  пропускать: ["__init__.py", "alembic/versions/"]
  строгость: жёлтый                 # обкатка: находки видны, коммит идёт

# ── Каких путей НЕ касается гейт «тесты до кода» ──────────────────────────
# Ревью спеки 23.09 (M-1): заголовок обещал «гейты» во множественном числе, а
# ключ читает РОВНО ОДИН потребитель — scripts/check-tests-first.py. Гейт цены
# (check-pipeline.py) его не смотрит вовсе, и по заголовку легко было решить,
# что перечисленные пути вообще выведены из пайплайна.
исключения_путей:
  - scripts/            # сам харнес: самотесты живут внутри скриптов
  - harness/
  - docs/
  - память/
  - .tasks/

# ── Канал: чем держится разговор с владельцем ─────────────────────────────
# Потолки — из замера 380 сообщений за смену 11.09 (медиана 724 знака,
# 31 % длиннее 1000, максимум 3215).
канал:
  мягкий_потолок: 900
  отказ_с: 1800
  пульс_минут: 30        # 21.08 владелец: «статус по ходу работы, а не только в конце»;
                         # 30 минут — вывод из передачи того же дня, не его слово
  окно_уровня_языка: 20  # по скольким последним сообщениям считается уровень
