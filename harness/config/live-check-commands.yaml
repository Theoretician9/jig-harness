# Команды ЖИВОГО вызова механизмов класса C2 — ДАННЫЕ для scripts/live-check-tool.py.
#
# Откуда взято: спека docs/specs/2026-10-15-живая-проверка-механизмов.md §3.1,
# класс C2 — «вызван с настоящим входом, вывод прочитан и записан», и слово
# владельца 15.10.2026: «проверить не просто тестами, а именно наживую, в
# практике».
#
# ПЕРЕСКАЗ ПАСПОРТНОГО САМОТЕСТА ЗАПРЕЩЁН И СУДИТСЯ КОДОМ. Первая редакция этих
# данных (17.10, 35 строк) побуквенно повторяла поле «проверяется» из реестра —
# то есть доказывала инструмент повтором его же теста. Ревью это замерило
# (35 из 35), записи сняты, а прибор теперь такую команду отказывается
# исполнять: функция «пересказ_самотеста» в scripts/live-check-tool.py.
#
# Что годится: вызов на НАСТОЯЩИХ данных этой машины (живой журнал, живая карта,
# живой гит, живое расписание) либо зов ЧУЖОГО живого потребителя, который эту
# библиотеку использует в работе. Вывод обязан содержать строку от 12 знаков:
# по ней берётся цитата, и она должна быть ЧУЖИМ текстом.
#
# ЖИВОЙ ВЫЗОВ scripts/lib/owner_word.py: `--проверить-носитель` строит носитель МАШИНЫ
# (паспорт установки, карта uid процесса) и печатает его папку. Боевую дверь удаления
# звать нельзя: её зелёный исход — РЕАЛЬНОЕ удаление файла. Ключа стенда у судьи нет:
# подменить папку слова окружением нельзя, поэтому прежняя проверка «разрешение на
# копии журнала» невозможна и заменена проверкой самого носителя.

