# ДАННЫЕ: признаки квитанции-обещания в исходящем смены.
#
# Исходящий iz_sessii=true ответом НЕ считается, если он КОРОТКИЙ (не длиннее
# promise_max_chars знаков) и совпал хоть с одной регуляркой: он обещает ответ,
# а не даёт его. Длинный текст со словом «проверяю» — настоящий ответ, поэтому
# обещанием считается только короткий.
#
# Читает scripts/lib/channel_reply.py (Stop-хук channel_reply_guard.py и
# метрика delivery-latency.py --без-ответа). Регистр не важен, поиск по всему
# тексту (re.search, IGNORECASE | DOTALL). Единственный источник: нет файла,
# он битый или значения неверны (promise_markers не непустой список строк-
# регулярок, promise_max_chars не целое > 0) — правило ВЫКЛЮЧЕНО, ответом
# считается любой исходящий смены.

promise_markers:
  - 'ответ\s+(коротко\s+)?следом'
  - '\b(скоро\s+)?отвечу\b'
  - '\bвернусь\s+с\s+ответом\b'
  - '^\s*принял\b.*\b(проверяю|смотрю)\b'

# Длиннее — уже содержательный ответ, даже если в нём есть маркер.
promise_max_chars: 200
