# Источники ТОЧНЫХ значений секретов для scripts/check-secrets.sh.
#
# Форму секрета гейт узнаёт по шаблонам, но обычный пароль без присвоения ни на
# что не похож (04.11.2026 пароль игрового сервера попал в STATE.md). Поэтому
# значения берутся из самих источников, и их точное вхождение в учтённые файлы
# красное. Маркер «не-секрет» эту проверку не гасит.
#
# Формат — список записей, каждая начинается со строки «- вид:». Разбирается
# на чистом awk, поэтому только такие строки; комментарий — целой строкой.
#   вид:        env     — файл KEY=value; берутся значения ключей, в имени
#                         которых есть PASSWORD, TOKEN, SECRET или KEY
#                         (регистр не важен), кавычки и \r снимаются;
#               каталог — все файлы каталога целиком (значение — строка файла
#                         от 16 знаков без пробелов и кавычек).
#   путь:       абсолютный путь; для вида «каталог» имя SECRETS_DIR значит
#               каталог секретов из паспорта установки.
#   обязателен: да|нет, по умолчанию нет. «нет» — отсутствие файла тихо (машина
#               без этого сервера); «да» — отсутствие даёт предупреждение.
#               Файл есть, но нечитаем или в нём нечего искать — предупреждение
#               при любом значении.
# Значения короче 6 знаков не ищутся (шум).

- вид: env
  путь: /srv/sample-18/.env
  обязателен: нет

- вид: каталог
  путь: SECRETS_DIR
  обязателен: нет
