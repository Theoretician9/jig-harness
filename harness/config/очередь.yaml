# Порядок работы: чем задача важнее, тем она выше. ДАННЫЕ, а не код.
#
# Владелец 12.09.2026: «когда я тебе накидываю задачи тебе надо сначала
# положить эту задачу в беклог, потом завершить свой пайплайн процесса, потом
# проверить план и понять куда в плане поставить эту задачу. это должно
# контролироваться кодом и быть безотказным. но при этом я могу своей волей
# направить твоё внимание на любую задачу в любой момент, если ясно об этом
# говорю».
#
# Читает scripts/ochered-raboty.py (--порядок) и scripts/zadachi-iz-kanala.py
# (списки слов). Файл ЖИВОЙ: раскладка его не затирает, как и пайплайн.yaml.

# ── Веса признаков. Место задачи = сумма весов + свежесть источника ────────
веса:
  внимание_владельца: 100   # прямое слово в канале; перебивает всё
  провал_проверки: 40       # сломано то, что считалось сделанным
  wip: 30                   # начатое дороже нового
  queue: 20                 # поставлено в очередь руками
  plan: 0                   # хвост
  # Доведение начатого дешевле начала нового — единственный признак
  # ЭФФЕКТИВНОСТИ, который сегодня считается из карты честно. Поля
  # зависимостей («что разблокирует другие») в карте нет ни у одной из 147
  # задач, и вес по нему был бы счётом по пустоте.
  почти_закончена: 10

# Сколько суток живёт прямое слово владельца. Без срока пометка через неделю
# поднимает наверх то, что он давно забыл: у пометки обязан быть срок.
внимание_суток: 3

# С какой доли закрытых пунктов чеклиста задача считается «почти законченной».
почти_закончена_с_доли: 0.5

# Хвост plan разводится ВОЗРАСТОМ ИСТОЧНИКА: задача из более свежего сообщения
# владельца стоит выше. Иначе девять задач из десяти получают 0, и «порядок
# считает код» вырождается в «порядок строк в файле» (находка ревью C-5).
# Добавка — целое от 0 до значения ниже; задача без источника получает 0.
свежесть_максимум: 9

# Сколько строк печатать, когда направление не выбрано (ACTIVE_LINE пуст):
# на свежей установке иначе печатается вся карта.
потолок_строк: 10

# ── Слова владельца ────────────────────────────────────────────────────────
# ОДИН источник для гейта задач и для прибора очереди: два списка разъезжаются
# молча, и разошедшаяся половина молчит ровно тогда, когда нужна (так разошлись
# формы команд приёмки и цикл крутился впустую пять кругов).

# Слова, которыми владелец ДАЁТ РАБОТУ. Список узкий нарочно: ложная тревога
# стоит одной команды «--не-задача», а потерянная задача — повтора от владельца.
слова_работы:
  - надо
  - нужно
  - сделай
  - добавь
  - почини
  - исправь
  - переделай
  - реализуй
  - хочу чтобы
  - не работает
  - сломал
  - должно быть
  - должен быть
  - займись
  - давай сделаем

# Слова, которыми владелец НАПРАВЛЯЕТ ВНИМАНИЕ — «если ясно об этом говорю».
# Проверены замером всего архива (971 сообщение, 12.09.2026): голое «сейчас»
# встретилось 69 раз и почти всегда означало обстоятельство времени («я сейчас
# добавил памяти»), «сначала» — 19 раз и то же самое. Их в списке НЕТ.
# Оставшиеся дают 8 срабатываний на архив, из них 2 ложных (владелец цитировал
# моё же сообщение).
слова_внимания:
  - прямо сейчас
  - первым делом
  - в первую очередь
  - в приоритете
  - займись
  - срочно
  - брось
  - отложи
  - переключись
  - бросай

# ── Срочность входящего: прервать шаг или скопить до рубежа ───────────────
# Владелец 12.09.2026: «когда идет активная разработка у агента, накидывать ему
# задач в разных направлениях не самая лучшая идея, это сбивает процесс <…> llm
# видит мои сообщения как факт входящего и первые слова, но не читает
# содержание целиком <…> пока не закончится текущая задача или если её пнёт хук
# по ключевому слову».
#
# Правило одно, без частных случаев: ШАГ ПРЕРЫВАЕТ ТО, ЧТО НЕ РАБОТА. Вопрос,
# ответ, реакция, согласие — короткие, их ждут, и они доезжают сразу, как
# раньше. Сообщение, НЕСУЩЕЕ РАБОТУ (слова_работы выше), копится и подаётся
# одним сортированным списком на рубеже — если в нём нет слова срочности.
#
# Замер архива 12.09.2026 (964 сообщения с текстом, scripts/srochnost.py --замер):
# копилось бы 142 (14,7 %), доезжало бы сразу 822 (85,3 %). Слова срочности
# встретились в 35 сообщениях (3,6 %) — список узкий нарочно.
срочность:
  # Слова, которыми владелец говорит «это не ждёт». Прерывают шаг даже в
  # сообщении с работой. Замер каждого по архиву — в комментарии справа.
  слова:
    - срочно        # 0 за архив: слово впрок, владелец им ещё не пользовался
    - останови      # 5
    - стоп          # 4
    - сломал        # 0
    - не работает   # 4
    - упал          # 4
    - авария        # 0
    - не грузится   # 0
    - отвалил       # 0
    - горит         # 0
    - умер          # 1
    - молчит        # 1
    - завис         # 12
  # Прямой вопрос ждёт ответа, а не рубежа (память/ТОН.md: «Вопросы — на них
  # ждёт ответ, не молчание»). Без этого ключа копилось бы 181 сообщение
  # (18,8 %) вместо 142: разница — 39 сообщений, где работа названа вместе с
  # вопросом. Ключ ДАННЫЕ: владелец переключает его одной строкой.
  вопрос_срочен: true
  # Прямое слово владельца (слова_внимания выше) — тоже «не ждёт»: он сказал
  # «брось», «прямо сейчас». Отдельного списка нет нарочно — два списка в двух
  # местах расходятся молча.
  внимание_срочно: true

# «займись» — приказ, кроме случая «после того как закончишь … займись»: это
# ровно обратное, отложенная работа. Форма проверяется отдельно.
# Слова, после которых «срочно» и «займись» — рассуждение, а не приказ.
# Улика 13.09.2026: в сообщении «если это не чтото срочное, ты точно сначала
# пересматриваешь карту» прибор нашёл приказ «срочно» и поднял задачу из этого
# же сообщения на первое место — обогнав идущую работу. То есть просьба не
# дёргаться за свежим сама сработала как «дёрнись».
внимание_не_приказ: ["не", "если", "когда", "пока", "чтото", "что-то", "какое-то", "какой-то"]

внимание_отменяется:
  - после того как
  - как закончишь
  - как всё доделаешь
  - когда закончишь
