механизмы:
- файл: harness/demons/nightly-gates.sh
  вид: демон
  тема: проверки и ворота
  имя: Ночной полный прогон ворот
  роль: 'Раз в сутки гонит ПОЛНЫЙ прогон ворот (флаг «--всё»), который включает
    самотесты демонов (без мутационной пробы: она идёт отдельным недельным
    запуском), и говорит владельцу только о красном.

    '
  когда: по расписанию
  без_него: 'Часть проверок — те, что проверяют сами сторожа, — запускается
    только по отдельному флагу, и вспоминать о нём приходится человеку.
    21.09.2026 такая проверка была красной восемь суток подряд, и этого не
    увидел никто.

    '
  проверяется: bash harness/demons/nightly-gates.sh --selftest
  пишет: журнал прогона /var/log/harness/nightly-gates-<дата>.log, метку свежести,
    сообщение владельцу при красном прогоне
  повод:
    метки:
    - имя: nightly-gates
      молчание_считать_поломкой: 1440
    источник: крон
- файл: harness/demons/nightly-mutations.sh
  вид: демон
  тема: проверки и ворота
  имя: Недельный полный прогон мутационной пробы
  роль: 'Раз в неделю (вторник 09:00) гонит мутационную пробу отдельно от ночных ворот,
    со своим пределом NIGHTLY_MUTATIONS_MAX_MIN, и говорит владельцу о дырах и об
    обрыве по пределу — не чаще раза в NIGHTLY_MUTATIONS_ALERT_GAP_H часов.
    Если замок занят (лёгкая фоновая программа по правкам), ставит флаг .want и ждёт замок
    NIGHTLY_MUTATIONS_LOCK_WAIT_MIN минут; не дождался — весть «не стартовал».
    Зелёный итог гасит красное лёгкой фоновой программы по правкам.
    Вердикт берёт из строки итога прибора, а не из кода выхода.

    '
  когда: по расписанию
  без_него: 'Мутационная проба съедала 86-94 % ночного прогона ворот, и остальные
    проверки «--всё» не судились три ночи подряд; на отдельном запуске ей
    нужен свой предел и свой сторож.

    '
  проверяется: bash harness/demons/nightly-mutations.sh --selftest (12 путей, 7 больных) и bash scripts/test_nightly_mutations_lock.sh
  пишет: журнал прогона /var/log/harness/nightly-mutations-<дата>.log, метку свежести,
    сообщение владельцу при дырах или обрыве
  повод:
    метки:
    - имя: nightly-mutations
      молчание_считать_поломкой: 5760
    источник: крон
- файл: harness/demons/backup.sh
  вид: демон
  тема: данные и сервер
  имя: Ночные копии данных
  роль: 'Каждую ночь снимает копию того, что нельзя восстановить переустановкой: базы
    данных, секретных ключей и настроек сервера.

    '
  когда: по расписанию
  без_него: 'Потерянную базу или испорченный файл настроек будет неоткуда вернуть, а правило
    «не терять данные» перестанет опираться на свежую копию.

    '
  проверяется: bash harness/demons/backup.sh --selftest (18 путей, из них 10 на ротацию — 5 на функцию, 2 на ручные копии файлами и 3 прогоном демона; от root эти 10 пропускаются вслух); мутации в инвариантах.yaml — 4; возраст копии видит heartbeat-watch
  пишет: копии в /var/backups/harness, метку свежести и строку в /var/log/harness/backup.log
  повод:
    метки:
    - имя: backup
      молчание_считать_поломкой: 1440
    источник: крон
- файл: harness/demons/devmap-selfheal.sh
  вид: демон
  тема: карта работы
  имя: Починка карты разработки
  роль: 'Ищет работу, которая была сделана, но не отмечена в карте задач, и дописывает
    пропущенную отметку сам.

    '
  когда: по расписанию
  без_него: 'Карта задач начнёт врать: работа сделана, а в списке её нет — и владелец
    видит состояние хуже настоящего.

    '
  проверяется: bash harness/demons/devmap-selfheal.sh --selftest
  пишет: правки в dev-map.yaml, водораздел в $LOG_DIR/devmap/audit.cursor
  повод:
    метки:
    - имя: devmap-selfheal
      молчание_считать_поломкой: 1440
    источник: крон
- файл: harness/demons/disk-cleanup.sh
  вид: демон
  тема: данные и сервер
  имя: Уборка диска
  роль: 'Убирает старые журналы, временные файлы и образы, пока свободное место не кончилось.

    '
  когда: ночной проход и проход по тесноте диска (порог DISK_TRIGGER_PCT, ключ --по-давлению)
  без_него: 'Диск заполняется незаметно, и сервер встаёт целиком: не пишутся ни записи
    работы, ни копии данных.

    '
  проверяется: bash harness/demons/disk-cleanup.sh --dry-run; df -h / (сухой прогон ничего не удаляет и метку не трогает)
  пишет: $LOG_DIR/disk-cleanup.log, метку свежести и метку вести о диске disk-alert (через scripts/disk-report.py)
  повод:
    метки:
    - имя: disk-cleanup
      молчание_считать_поломкой: 1440
    - имя: disk-pressure
      молчание_считать_поломкой: 120
    источник: крон
- файл: scripts/disk-report.py
  вид: гейт
  тема: данные и сервер
  имя: Весть «диск занят» и опись места
  роль: 'Решает, слать ли владельцу весть о диске: одна на пересечение порога, повтор
    через сутки или при росте на 3 %, при спаде тревога взводится снова. В тексте
    вести — где лежит место и что ждёт его слова. Сам ничего не удаляет.

    '
  когда: в конце каждой уборки диска, ключ --опись — по просьбе
  без_него: 'Либо весть о диске идёт каждый час и владелец её перестаёт читать, либо
    не приходит вовсе, а в вести нет главного — где место.

    '
  доказательство: scripts/test_disk_report.py
  проверяется: python3 scripts/test_disk_report.py
  пишет: метку $HEARTBEAT_DIR/disk-alert (процент и время вести), только после доставки
  заведён: '2026-10-24'
- файл: scripts/test_disk_report.py
  вид: гейт
  тема: данные и сервер
  имя: Проба вести о диске и описи места
  роль: 'Прогоняет решение вести о диске на своём стенде: одна весть на пересечение
    порога, повтор, спад и новая весть, недоставка, лимит, текст вести и опись.

    '
  когда: в воротах
  без_него: 'Весть о диске снова пошла бы каждый час или пропала бы молча, и никто
    бы этого не заметил до заполненного диска.

    '
  доказательство: scripts/disk-report.py, harness/demons/disk-cleanup.sh
  проверяется: python3 scripts/test_disk_report.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-10-24'
- файл: scripts/tmp-sweep.py
  вид: гейт
  тема: данные и сервер
  имя: Уборка /tmp
  роль: 'Убирает из /tmp отходы проб и забытые каталоги: защищённое (сессии, сокеты,
    системное) не судит вовсе, занятое живым процессом не трогает, остальное сперва
    переносит в карантин на сутки и только потом удаляет. Каждое решение пишет в
    журнал; вернуть можно по хешу.

    '
  когда: шаг 10 уборки диска (ночью и по давлению), ключ --dry-run — только показать
  без_него: 'Каталоги проб копятся в /tmp тысячами, а диск заполняется там, куда
    прежняя уборка не заглядывала.

    '
  доказательство: scripts/test_tmp_sweep.py
  проверяется: python3 scripts/tmp-sweep.py --selftest
  инвариант: И-1
  пишет: $LOG_DIR/уборка-tmp.jsonl, /tmp/.уборка-карантин
  заведён: '2026-10-24'
- файл: scripts/test_tmp_sweep.py
  вид: гейт
  тема: данные и сервер
  имя: Проба уборки /tmp
  роль: 'Прогоняет уборку на своём стенде в /tmp: каждая защита — свой случай со
    своей причиной, удаление, карантин, возврат и журнал.

    '
  когда: в воротах
  без_него: 'Уборка, которая удаляет файлы, осталась бы без проверки, что она не
    заденет чужое или живое.

    '
  доказательство: scripts/tmp-sweep.py
  проверяется: python3 scripts/test_tmp_sweep.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-10-24'
- файл: scripts/test_gates_run_temp_dir.py
  вид: гейт
  тема: данные и сервер
  имя: Проба каталога проб ворот
  роль: 'Гоняет самотест ворот со своим TMPDIR и подставным mktemp: каждый голый
    mktemp проб обязан попасть в каталог ворот с префиксом harness-run-, а после
    прогона этого каталога быть не должно. Пустой список голых вызовов — провал.

    '
  когда: в воротах
  без_него: 'Голый mktemp проб снова кладёт tmp.XXXX прямо в /tmp, уборка /tmp его
    не опознаёт, и гигабайты отходов держатся неделями.

    '
  доказательство: scripts/gates.sh
  проверяется: python3 scripts/test_gates_run_temp_dir.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-10'
- файл: scripts/test_gates_run_dir_reach.sh
  вид: гейт
  тема: данные и сервер
  имя: Проба проб второго пользователя и tmux под каталогом ворот
  роль: 'Зовёт настоящие ворота (gates.sh --только) на три пробы — запись и разбор
    событий, уборка не гасит окно — со своим LOG_DIR и без TMPDIR, как ночью.
    Каталог прогона ворот обязан пускать harness-panel, а путь сокета tmux стенда
    под ним — влезать в предел 107 знаков. Не все три проверки прогнаны — провал.

    '
  когда: вручную (в ворота scripts/gates.sh ещё не включена)
  без_него: 'Пробы снова краснеют только под воротами и зеленеют соло: перепрогон
    мимо ворот называет поломку флейком (так было 10.11 и 11.11).

    '
  доказательство: scripts/gates.sh
  проверяется: bash scripts/test_gates_run_dir_reach.sh
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_layout_selftest_cleanup.py
  вид: гейт
  тема: данные и сервер
  имя: Проба уборки стенда самотеста раскладчика
  роль: 'Обрывает самотест раскладчика пакета по timeout (SIGTERM) в своём TMPDIR и
    требует, чтобы стенда proba-razlozhit-* после обрыва не осталось. Прогон, не
    дошедший до обрыва, — провал: обрыв не проверен.

    '
  когда: в воротах
  без_него: 'Каждый оборванный самотест раскладки оставлял в /tmp стенд на 0,7–1,7 ГБ
    до срока уборки.

    '
  доказательство: razlozhit-harnes.sh
  проверяется: python3 scripts/test_layout_selftest_cleanup.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-10'
- файл: scripts/test_layout_selftest_exit_code.py
  вид: гейт
  тема: данные и сервер
  имя: Проба кода выхода самотеста раскладчика
  роль: 'Разбором раскладчика достаёт EXIT-ловушки и хвост блока --selftest и исполняет их под set -euo pipefail: зелёный самотест обязан выходить кодом 0, а провал — 1, уборка уже убранного стенда кода не меняет.

    '
  когда: в воротах
  без_него: 'Самотест печатал «SELFTEST: зелёный» и выходил кодом 1, и установка с нуля вставала на шаге 7-а (Д-16, 0.9.3).

    '
  доказательство: razlozhit-harnes.sh
  проверяется: python3 scripts/test_layout_selftest_exit_code.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_unified_fresh.py
  вид: гейт
  тема: данные и сервер
  имя: Проба свежести выгрузки UNIFIED
  роль: 'Собирает UNIFIED его же BUILD.py во временном каталоге и побайтно сравнивает с выгрузкой ХАРНЕС-ОДНИМ-ФАЙЛОМ.md; отказ сборщика или пустая сборка — провал.

    '
  когда: в воротах
  без_него: 'Правка семени без пересборки выгрузки уезжала в выпуск, и гейт «семена» рвал первый коммит установки у пользователя (Д-17, 0.9.3).

    '
  доказательство: UNIFIED/BUILD.py
  проверяется: python3 scripts/test_unified_fresh.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_installer_first_commit.py
  вид: гейт
  тема: данные и сервер
  имя: Проба кода установщика при отказе первого коммита
  роль: 'Собирает из USTANOVIT.sh малый установщик (функции, ловушка ERR, хвост прогона) и подставным гейтом отвергает первый коммит каркаса: код установщика обязан быть ≠ 0, а при пропуске — 0.

    '
  когда: в воротах
  без_него: 'Гейт отверг первый коммит каркаса, проект остался без коммитов, а установщик вышел кодом 0 (Д-17, 0.9.3).

    '
  доказательство: USTANOVIT.sh
  проверяется: python3 scripts/test_installer_first_commit.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_layout_self_seal.py
  вид: гейт
  тема: данные и сервер
  имя: Проба печати эталона личности при раскладке
  роль: 'Раскладывает пакет на стенде без самотеста с подставным sudo и настоящим self-seal.sh: довод печати — каталог с манифестом, эталон ложится; отказ печати — код раскладки ≠ 0; нет правила sudo — предупреждение и код 0.

    '
  когда: в воротах
  без_него: 'Раскладка давала self-seal каталог проекта без манифеста, отказ глотался, и эталона личности на установке не было (Д-18, 0.9.3).

    '
  доказательство: razlozhit-harnes.sh
  проверяется: python3 scripts/test_layout_self_seal.py
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_installer_resume_seal.sh
  вид: гейт
  тема: данные и сервер
  имя: Проба эталона личности на обновлении установщиком
  роль: 'Гонит настоящий установщик в --dry-run --resume со штампами всех шагов: правило sudo на self-seal и сам self-seal обязаны ставиться и ставиться до раскладки; предупреждение раскладки «эталон не напечатан» обязано дойти до сводки. Краснеет на любом из двух.

    '
  когда: в воротах
  без_него: 'На машине, обновлённой с 0.9.2, шаг 1 пропускался по штампу, правило sudo и self-seal не приезжали, и эталона личности не было — молча (Д-23, 0.9.3).

    '
  доказательство: USTANOVIT.sh
  проверяется: bash scripts/test_installer_resume_seal.sh
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_installer_demon_probe.sh
  вид: гейт
  тема: данные и сервер
  имя: Проба шага 13 установщика до входа владельца
  роль: 'Гонит настоящий шаг 13 в env -i на стенде с настоящими ночными демонами (фоновыми службами): проверка запускаемости не выходит кодом 1, не шлёт тревогу :broken и не гасит тревоги ночи; check-login-expiry до входа — пункт «руками», не отказ. Краснеет на любом из них.

    '
  когда: в воротах
  без_него: 'Каждая установка выходила кодом 1 и слала владельцу «ночной прогон оборвался»: подмена команды прогона на true не давала итога, а ожидание входа считалось отказом (Д-20, Д-21, 0.9.3).

    '
  доказательство: USTANOVIT.sh
  проверяется: bash scripts/test_installer_demon_probe.sh
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_devmap_selfheal_installer_commit.sh
  вид: гейт
  тема: данные и сервер
  имя: Проба первого коммита установщика у починки карты
  роль: 'Делает первый коммит (запись правки в git) каркаса настоящей функцией установщика и гонит devmap-selfheal с конфигом пакета: коммит установщика — не «мимо карты», модель не звана; обычный коммит без трейлера поверх — пропуск найден. Краснеет на любом из двух.

    '
  когда: в воротах
  без_него: 'Починка карты считала коммит установщика пропуском и звала модель: до входа — выход 1 на шаге 13, после входа — оплаченный вызов впустую (Д-22, 0.9.3).

    '
  доказательство: harness/demons/devmap-selfheal.sh
  проверяется: bash scripts/test_devmap_selfheal_installer_commit.sh
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/test_claude_demon_session_id.sh
  вид: гейт
  тема: данные и сервер
  имя: Проба id сессии обёртки демона без uuidgen
  роль: 'Гонит claude-demon.sh с PATH без uuidgen и подставным claude: --session-id обязан быть настоящим UUID, обёртка — выйти кодом 0. Краснеет на пустом или не-UUID id.

    '
  когда: в воротах
  без_него: 'На образе без uuid-runtime claude получал пустой --session-id, и разрешитель токенов терял, чей это вызов (Д-22, 0.9.3).

    '
  доказательство: scripts/claude-demon.sh
  проверяется: bash scripts/test_claude_demon_session_id.sh
  пишет: 'ничего: работает во временном каталоге'
  заведён: '2026-11-11'
- файл: scripts/docker-sweep.py
  вид: гейт
  тема: данные и сервер
  имя: Уборка docker
  роль: 'Убирает из docker старые неиспользуемые образы, остановленные контейнеры
    старше суток, безымянные тома без ссылок (отдельным выключателем, после выдержки
    между двумя пометками) и слои прошлых сборок сверх оставленного объёма. Образы latest,
    previous, теги отката и защищённое не трогает; prune-всего, -f и -v не зовёт.
    Каждое удаление пишет в журнал.

