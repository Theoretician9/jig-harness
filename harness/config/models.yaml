# Какой моделью делается какая работа. ДАННЫЕ, а не код.
#
# Владелец 12.09.2026: «создать правила работы с агентами, моделями,
# автоматическое изменение моделей в зависимости от задач, например можно
# переключать на фейбл чтобы писать спеки для сложных задач или для каких то
# исследований <…> Сессия это расходный материал. Главное максимальная
# эффективность по правилам харнеса».
#
# Читает scripts/model-for.sh — его зовут демоны вместо общего DEMON_MODEL и
# скилы шагов, когда запускают субагента. Файл ЖИВОЙ: раскладка не затирает.
#
# Имена видов работы — это шаги пайплайна (harness/config/pipeline.yaml, ключ
# «шаги») плюс дежурные виды, которых в пайплайне нет. Неизвестный вид получает
# умолчание и строку в лог: молчаливая пустота уронила бы вызов claude.

модели:
  # Замысел и его разбор. Владелец 16.10.2026 согласовал раскладку, где замысел
  # идёт на opus, а не на fable: fable стоит 10/50 долларов за миллион токенов
  # против 4/20 у opus, и на замысле эта разница не окупается. Исследование
  # осталось на fable — его слово 12.09 называет отдельно, и новая
  # раскладка такого шага не содержит.
  спека: opus
  ревью_спеки: opus
  исследование: fable
  план: opus

  # Код и его разбор. Правило раскладки (владелец 16.10.2026): СУДЬИ на сильной
  # модели, РАБОТНИК на средней. Платим за того, кто ловит ошибку, а не за
  # того, кто её делает: код пишет sonnet, а тесты, мутации и ревью кода —
  # opus, и втрое дешевле стоит не пропустить дыру, чем её переписывать.
  код: sonnet
  ревью_кода: opus
  разбор_аварии: opus
  контракт: opus
  тесты: opus
  # Мутационный прогон (шаг с 28.09.2026): портит копию механизма и судит,
  # заметила ли это проверка. Разбор дыры — работа по коду, не дежурная.
  мутации: opus

  # Дежурное: сверка тем коммитов, разбор трёх файлов передачи, ночные
  # проверки. Дорогой моделью это делать незачем — работа механическая.
  #
  # ВАЖНО: пока в harness.conf задан DEMON_MODEL, он старше этих трёх строк —
  # так команда владельца «model.sh --демоны <имя>» продолжает работать. Значит
  # правка строк ниже даёт эффект только при пустом DEMON_MODEL. Ревью кода
  # 12.09.2026 назвало это «данными-обманкой»; оставлены они потому, что на
  # свежей установке ключ пуст и решает именно таблица.
  дежурный: haiku
  поиск: haiku
  замер_речи: haiku

# Вид, которого нет в таблице, получает это. Haiku, а не opus: неизвестное
# лучше сделать дёшево и заметить, чем дорого и молча.
умолчание: haiku

# Ключ убран: его никто не читал, а печать таблицы показывала «всё дежурное на
# X» — прибор врал с видом истины (ревью кода 12.09.2026). Ручка владельца
# живёт там, где и была: DEMON_MODEL в harness.conf, команда «model.sh --демоны».

# ── Переключение на границе шага ───────────────────────────────────────────
# ВКЛЮЧЕНО. Три находки ревью кода 12.09.2026, из-за которых ключ стоял нулём,
# в коде закрыты, и каждую держит свой случай самотеста хука:
#  * «модель уже нужная» сверяется нормализованно (model_odna_i_ta_zhe), алиас
#    и полное имя больше не считаются разными моделями;
#  * переключение идёт `model.sh --только-сессия` — AGENT_START_CMD в
#    /etc/harness/harness.conf не трогается, выбор владельца цел;
#  * путь к таблице берётся из MODELS_CONF, поэтому проба судит стенд, а не
#    боевую установку.
# Ключ 0 возвращает прежнее поведение: хук только СЧИТАЕТ нужную модель и
# пишет её в model-po-shagu.jsonl, ничего не меняя.
переключать_на_границе_шага: 1
