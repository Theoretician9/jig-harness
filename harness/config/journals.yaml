  "тревоги-ждут":
    file: "тревоги-ждут.jsonl"
    writers: none
    why: очередь переписывается целиком (tmp + os.replace) в scripts/alert-task.py, дозаписи нет — обход её не видит
    time_field: ts
    time_kind: tz
    event_from: alert.waiting
    outcome_default: held
  env-teardown:
    file: env-teardown.jsonl
    writers: none
    why: пишет teardown.sh проекта вне дерева харнеса (/var/www/<проект>/scripts/); проба test_environment.sh только читает
    time_field: ts
    time_kind: tz
    event_from: env.teardown
