# Схема паспорта механизма — ДАННЫЕ, а не код.
#
# Откуда взята. Задание владельца 13.09.2026 (РАЗБОР-УСТРОЙСТВА-2026-09-12,
# файл 02) и спека `docs/specs/2026-09-13-реестр-устройства-v2.md` §2. До этого
# схема жила кортежами `ОБЯЗАТЕЛЬНЫЕ`/`ВИДЫ` внутри `scripts/check-ustrojstvo.py`:
# добавить поле было нельзя без правки гейта, а гейт — сторож, и правка сторожа
# ради нового поля мешает две разные причины изменения в одном файле.
#
# Схема v2 ДОПОЛНЯЕТ поля v1, а не заменяет их: документ устройства печатается
# из человеческих фраз (`когда`, `проверяется`, `пишет`), и из структуры они
# обратно не восстанавливаются. Поле `тема` осталось по прямому слову владельца
# 12.09.2026 — «сгруппируй его по темам, код и скилы вообще отдельно».
#
# Читает: scripts/check-ustrojstvo.py (на КАЖДЫЙ вызов, без кэша при импорте —
# иначе правка данных не действует до перезапуска). Путь подставляется
# переменной окружения HARNESS_PASPORT — так же, как HARNESS_USTROJSTVO
# подставляет реестр в harness/panel/sostoyanie.py.

# Без этих полей паспорт не паспорт: по ним печатается документ устройства.
обязательные:
  - файл
  - вид
  - тема
  - имя
  - роль
  - когда
  - без_него
  - проверяется
  - пишет

# Необязательное поле «приезжает_с»: имя возможности, вместе с которой
# механизм появляется на машине (harness/vozmozhnosti/<имя>). Пока возможность
# не установлена, файла механизма НЕТ — и это норма, а не дыра реестра.
# Улика: ворота внутри свежей установки 13.09.2026 были красными из-за трёх
# скилов мобильной разработки, которых в базовом пакете нет и быть не должно.

# Вид — то, по чему панель строит группы на экране владельца
# (harness/panel/sostoyanie.py). Перечень узкий нарочно: механизм с видом вне
# него не попал бы ни в одну группу и исчез бы с экрана при верном счётчике.
виды:
  - демон
  - хук
  - гейт
  - скил

# Носитель — чем механизм является физически. Список шире видов: задание
# различает восемь носителей там, где экран владельца знает четыре группы.
носители:
  - демон
  - хук
  - гейт
  - прогон
  - скрипт
  - библиотека
  - служба
  - сборщик
  - витрина

# Мост между ними. Без него механизм с носителем «служба» или «сборщик» попал
# бы в счётчик, но не попал бы ни в одну группу — то есть пропал бы с экрана
# молча. Каждое значение справа обязано быть из перечня видов.
носитель_в_вид:
  демон: демон
  хук: хук
  гейт: гейт
  прогон: гейт
  скрипт: гейт
  библиотека: гейт
  служба: демон
  сборщик: гейт
  витрина: демон

# Поля, которых может не быть. `заведён` — дата появления паспорта; она же
# водораздел для `доказательство.больных`: у механизмов, заведённых ПОСЛЕ
# перехода, число больных путей обязательно и ноль красит, а у прежних 134 его
# взять неоткуда — требовать число, которого нет, значит приглашать выдумать
# его, а это удар по инварианту И-4 (честность отчёта).
# Как устроено поле `повод` — чем заводится прогон механизма и какие метки
# пульса он обязан обновлять. Метки ВСЕГДА списком, даже когда она одна:
# «одна — скаляр, две — список» это частный случай в данных, то есть лишний
# развилка в каждом читателе. Список нужен потому, что у одного файла бывает
# две метки: session-warden держит и свою, и метку подъёма смены.
#
#   повод:
#     источник: крон | таймер | служба | вручную
#     расписание: "*/10 * * * *"        # строка cron либо имя юнита systemd
#     метки:
#       - имя: session-warden           # имя ФАЙЛА метки, не имя скрипта
#         молчание_считать_поломкой: 10 # минут; сторож пульса красит при ×2
#
# Имя метки берётся ИЗ ДАННЫХ, а не выводится из пути: метка
# `check-srok-vhoda` принадлежит `scripts/check-srok-vhoda.py`, и вывод из
# имени файла дал бы `check-srok-vhoda.py` — не сошлось бы никогда. Ровно этот
# метод замера уже создал слепое пятно (спека реестра v2, §0).
# Отдельным ключом схемы эта форма НЕ заводится: читатель у неё один —
# сборщик сроков, и данные под один вызов были бы сущностью ради симметрии.
необязательные:
  - id
  - файлы
  - инвариант
  - доказательство
  - повод
  - заменяет
  - заменён
  - заведён
