# ДАННЫЕ: где коду харнеса ЗАКОННО читать текст своего же файла.
#
# Заведено 28.09.2026 (Ф4 ревизии, §6 класс 1). Случай: проба демона приёмки
# доказывала «падение судьи отличается от провалов» грепом по собственному
# исходнику — такая проба зеленеет от слова в комментарии и краснеет от переноса
# строки. Переписана на поведение; гейт scripts/check-own-text-probes.py стоит на
# регрессе.
#
# Законные случаи есть, и молчаливого «ну тут же понятно» им не положено: у
# каждого ПРИЧИНА, по которой чтение своего текста — не слепая проба. Поля:
# файл · образец (подстрока той самой строки, по ней место узнаётся после сдвига
# номеров) · причина. Полнота в обе стороны: место без записи — красный, запись
# без места — тоже красный.
#
# Правка кода в этих строках правит и запись — тем же коммитом.

законно:
  - файл: harness/demons/sentinel.sh
    образец: 'sed -n "s/^$1=\"\${$1:-\([0-9]*\)}\"/\1/p"'
    причина: >
      Самотест берёт БОЕВОЕ значение по умолчанию порога из своего же текста.
      Больной случай 10.09.2026: пороги приходили аргументами, поэтому подъём
      WARDEN_STUCK_MIN до 999999 самотест не покраснил — он боевого значения не
      видел вовсе. Читается не решение, а КОНСТАНТА, которую иначе не достать.

  - файл: harness/demons/session-warden.sh
    образец: "send_to_pane \"\\(Ты — новая сессия"
    причина: >
      Правило живёт в ПОРЯДКЕ СЛОВ текста пинка (владелец 13.09.2026: «после
      лимита запуск должен быть мягкий… а не хвататься за то что пишу»), и
      проверяется именно порядок: позиция «ПРОДОЛЖАЙ ТЕКУЩИЙ ШАГ» раньше
      позиции «inbox». Поведения тут нет — текст и есть предмет правила.

  - файл: harness/demons/session-warden.sh
    образец: "grep -qE 'срез'"
    причина: >
      Страж РЕГРЕССА: обрезки текста для канала в демоне быть не должно
      (владелец 13.08.2026 — «твои сообщения обрезаются, а они вообще не должны
      иметь лимита»). Ищется отсутствие кода, а отсутствие поведением не
      проверить. Шаблон склеен из кусков, чтобы не найти сам себя.

  - файл: harness/demons/session-warden.sh
    образец: "grep -F 'DIALOG_SCREEN='"
    причина: >
      Строка исходника с образцом экрана подаётся пробе как ВХОД — она обязана
      ответить «это не диалог выхода». Больной случай 10.09.2026: подстрочный
      признак считал диалогом вывод grep по этому файлу. Судится поведение
      распознавателя, свой текст здесь — данные стенда.

  - файл: harness/demons/session-warden.sh
    образец: "зелёный (\\([0-9]*\\) путей распознавания диалога выхода"
    причина: >
      Итоговая строка самотеста заявляет число путей — сверяется с числом
      строк-проб в файле, иначе отчёт «зелёный, 17 путей» переживёт удаление
      половины проб. Судится честность СВОЕГО ОТЧЁТА, а не поведение демона.

  - файл: harness/demons/session-warden.sh
    образец: "grep -cE '^[[:space:]]+диалог (да|нет) '"
    причина: "Вторая половина той же сверки: считает пробы распознавания диалога."

  - файл: harness/demons/session-warden.sh
    образец: "+ \\([0-9]*\\) пути живого диалога"
    причина: "То же для второй группы путей — заявленное число против файла."

  - файл: harness/demons/session-warden.sh
    образец: "grep -cE '^[[:space:]]+живой (да|нет) '"
    причина: "Вторая половина сверки по живому диалогу."

  - файл: scripts/capability.sh
    образец: "sed -n '/^# Команды:/,/^# Код возврата/p'"
    причина: >
      Печать своей справки: `--help` отдаёт шапку файла, чтобы описание команд
      жило в одном месте с кодом. Это вывод, а не проверка.

  - файл: scripts/pipeline.py
    образец: "свой_текст = Path(__file__).read_text"
    причина: >
      Намеренная проверка «имени продукта нет в коде харнеса»: пути обязаны быть
      данными. Предмет правила — текст, имя продукта собрано из частей, шапка
      файла из проверки исключена.

  - файл: scripts/product-power.sh
    образец: "sed 's/#.*//' \"$0\" | grep -qE 'docker"
    причина: >
      Главный запрет И-1: в скрипте нет КОМАНДЫ, удаляющей тома или образы.
      Отсутствие команды поведением не проверить; комментарии отброшены (первая
      редакция покраснела на собственном объяснении запрета), а неполнота
      проверки сказана вслух в комментарии рядом.

  - файл: scripts/publish.sh
    образец: "grep -c '^\\s*echo \"  ок    '"
    причина: >
      Подсчёт своих путей для итоговой строки самотеста: «N путей» берётся из
      файла, а не пишется рукой. Безвредно — на решение не влияет.

  - файл: scripts/tg_send.sh
    образец: 'source <(sed -n "/^отметить_отчёт()/,/^}/p"'
    причина: >
      Стенд вытаскивает ОДНУ функцию из файла, чтобы позвать её в отдельной
      оболочке с подставным LOG_DIR — иначе запустился бы весь скрипт и послал
      владельцу сообщение. Судится поведение функции, текст — способ её достать.

  - файл: scripts/check-map-keeps-tasks.py
    образец: "pathlib.Path(__file__).read_bytes()"
    причина: >
      Самотест копирует СЕБЯ в одноразовое дерево и гоняет копию отдельным
      процессом — судится поведение гейта на подставной карте, а свой файл здесь
      не текст под судом, а переносимый исполнитель.
