# Проверки ворот, которые и в прогоне по снимку (scripts/gates-snapshot.sh)
# судят ЖИВОЕ: машину, журналы, индекс или паспорт установки, а не коммит.
# Снимок их не заменяет и не портит; их итог относится к моменту прогона, а не
# к sha снимка. Прогон по снимку печатает их число и имена.
#
# Откуда список: замер .tasks/hr.ocenka-snimok-vorot/замер.md (метка «живое» и
# «да-условно»). Имя — ровно имя проверки в scripts/gates.sh: сверяет
# scripts/test_gates_snapshot.sh.
живое:
  - проверка: "права секретов"
    почему: права файлов в $SECRETS_DIR машины
  - проверка: "вызовы скилов"
    почему: журнал вызовов скилов в $LOG_DIR
  - проверка: "указания"
    почему: входящие владельца в $LOG_DIR/inbox
  - проверка: "задачи из канала"
    почему: журналы канала в $LOG_DIR
  - проверка: "свои процессы"
    почему: процессы машины
  - проверка: "сверка пакета"
    почему: индекс живого дерева (git diff --cached); в снимке он пуст — судит pre-commit
  - проверка: "секрет в логах"
    почему: $LOG_DIR целиком
  - проверка: "журналы: диск"
    почему: $LOG_DIR целиком
  - проверка: "журналы: потери"
    почему: журналы в $LOG_DIR
  - проверка: "имена файлов"
    почему: индекс живого дерева; в снимке он пуст — судит pre-commit
  - проверка: "внешняя поверхность"
    почему: порты и nginx машины
  - проверка: "внешние вызовы"
    почему: cron, юниты и sudoers машины зовут дерево из паспорта; файлы ищутся в снимке
  - проверка: "срок входа"
    почему: вход Claude Code на машине
  - проверка: "след доставки"
    почему: стенограммы сессии по PROJECT_DIR паспорта и $LOG_DIR
  - проверка: "рубеж панели"
    почему: живая служба панели
  - проверка: "права панели"
    почему: живая служба панели под своим пользователем на дереве паспорта
  - проверка: "удержание"
    почему: $LOG_DIR целиком
  - проверка: "предложения"
    почему: $LOG_DIR/предложения.jsonl; условия перемеряются по снимку
  - проверка: "остатки-проба"
    почему: проект из паспорта установки против пакета
