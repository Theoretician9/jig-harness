# Данные датчиков ядра (scripts/self-sensors.py; спека
# .tasks/hr.self-configuration-environment/spec.md, ред. 2). Код ничего из этого
# не держит в себе: маркер, добавленный сюда, работает без правки кода — это судит
# случай 1 пробы scripts/test_self_sensors.py.

# Текущее окно [t−W, t) сравнивается с прошлым [t−2W, t−W); оба считаются из сырья,
# поэтому сравнение работает с первого дня, без накопленной истории.
окно_суток: 7

# Оба окна кончаются на столько суток раньше момента замера: судится ЗАКРЫТОЕ
# окно. Закрытия задач датируются задним числом, а токены пишутся сразу, и
# недописанный край давал ложное «хуже» (13.11: в 00:05 закрыто 49, к 13:11 по
# тому же окну — 58). Судит случай 13 пробы scripts/test_self_sensors.py.
отставание_суток: 1

# Датчик хуже прошлого окна больше чем на эту долю в своём направлении → карточка.
порог_ухудшения: 0.2

# Знаменатель меньше этого числа → значение null, датчик не судится. Единственное
# правило про ноль и шум: отдельных исключений на датчик нет.
минимум_выборки: 5

# «Закрыта» = агент закончил работу. Дата агента идёт ПЕРВОЙ: она не сдвигается,
# когда владелец принимает задачу, и скорость приёмки не попадает в датчики
# (90 задач карты 07.11 стояли в test — без test знаменатель мерил владельца).
закрыта:
  статусы: [test, done, принято]
  дата_из: [tested_at, when.tested, when.done, принято_когда]

# Ключ — латиница: форма ключа тревоги patterns.КЛЮЧ_ТРЕВОГИ = [a-z0-9:._-],
# кириллица в ключе даёт alert-task код 2 и карточки нет никогда.
# «хорошо» — направление, в котором датчик лучше.
датчики:
  освобождение_внимания: {ключ: attention, хорошо: вниз}
  автономность: {ключ: autonomy, хорошо: вниз}
  эффективность: {ключ: efficiency, хорошо: вниз}
  созидательность: {ключ: creation, хорошо: вверх}

# Классификатор сообщения владельца: сначала снимаются цитаты наших сообщений,
# затем маркер напоминания → «напоминание», иначе маркер идеи → «идея», иначе
# «прочее». Маркер ищется целым словом или фразой без учёта регистра. Это
# эвристика по словам: годится для тренда, не для оценки одного сообщения.
маркеры:
  напоминание:
    - почему
    - где
    - работает ли
    - не работает
    - опять
    - снова
    - до сих пор
    - застрял
    - я же писал
    - уже говорил
    - сколько можно
    - что с
    - когда будет
    - ну что
    - что там
    - не вижу
    - так и не
    - всё ещё
    - ты где
    - не пришло
  # К этим словам добавляются слова_работы из queue.yaml (через
  # tasks-from-channel.МАРКЕРЫ); здесь они не повторяются.
  идея:
    - идея
    - предлагаю
    - давай
    - хочу
    - создай
    - придумай
    - а что если
