# Команды, которым приёмка верит ИМЕННО в этом написании.
#
# Зачем файл. Формы проверок судятся ФОРМОЙ, а не намерением автора: карточки
# пишет ночной агент, и «команда обещала ничего не менять» — это текст, а не
# носитель (scripts/acceptance.py, позволена()). Но у части законных проверок
# форма чуть за пределами шаблонов: гейт с читающим флагом, проба под
# scripts/hooks/, вариант самотеста. Замер 28.09.2026: из 34 карточек с полем
# «проверка» механизм отвергал 14 — и задача висела в очереди ВЛАДЕЛЬЦА, хотя
# закрыть её могла машина.
#
# Правило списка: здесь стоит ТОЧНАЯ строка команды и причина, по которой она
# ничего не портит. Не шаблон: шаблон «любой .py без доводов» однажды впустил
# build-public.py, а тот делает rsync --delete по боевой публичной сборке
# (ревью безопасности 27.09.2026, critical). Запись без причины не действует.
#
# Чем держится: scripts/acceptance.py читает этот файл, а его самотест требует
# больной случай «запись без причины не разрешает команду».

по_имени:
  - команда: "python3 scripts/hooks/test_guard_bash.py"
    причина: >
      Проба сторожа команд. Свои стенды строит во временных каталогах, боевое
      дерево не трогает; по имени это test_… — тот же класс, что разрешённые
      scripts/test_….py, только лежит в подкаталоге hooks.
  - команда: "python3 scripts/check-who-calls.py --население"
    причина: >
      Мера Ф2 ревизии: перечисляет файлы кода харнеса и их вызывающих. Пишет
      только внутри своего самотеста (проверено: все write_text — в стенде).
  - команда: "python3 scripts/check-pipeline.py --по-истории"
    причина: >
      Читает историю git и карту, печатает долг пайплайна. Пишет только доску
      долгов смены — её же пишет этот гейт в каждом прогоне ворот.
  - команда: "python3 scripts/work-queue.py dev-map.yaml --следующая"
    причина: >
      Прибор очереди: читает карту и печатает следующую работу. Мест записи в
      файлы в нём нет ни одного.
  - команда: "python3 scripts/work-queue.py dev-map.yaml --владельцу"
    причина: >
      Тот же прибор, ответ владельцу строками «ждут вашего слова» и «сделано,
      ждёт вашей проверки». Ничего не пишет.
  - команда: "python3 scripts/spec_approval.py --состояние hr.universalnyj-harnes"
    причина: >
      Читает журнал спек-владельцу и печатает состояние согласования названной
      задачи. Записи журнала делают другие режимы этого же файла.
  - команда: "bash scripts/pre-commit-gate.sh --selftest-yellow"
    причина: >
      Вариант самотеста ворот про жёлтое состояние гейта. Отличается от
      разрешённого «--selftest» только словом после дефиса.
  - команда: "python3 harness/BUILD-SKILLS.py --сверить"
    причина: >
      Режим сверки генератора скилов: рендер идёт в памяти и сравнивается с
      деревом, запись начинается ТОЛЬКО ниже ветки «--сверить» (проверено по
      коду: sys.exit/return до write_atomic). Это гейт для ворот и pre-commit.

# ── СЛЕДЫ чужого прогона ───────────────────────────────────────────────────
#
# Второй вид проверки: приёмка не запускает действие, а читает журнал того,
# кто его уже выполнил. Введён 28.09.2026 для четырёх карточек, чьи команды
# приёмке не по руке (полный прогон ворот, контейнерная проба, сборка
# публичного дерева с rsync --delete, платный вызов модели).
#
# Почему список, а не «любой абсолютный путь» (находка ревью H1, blocker):
# у команды есть «позволена» — что вообще можно исполнять; у следа такого
# ограничения не было, и агент, которому команда не по руке, мог написать
# нужную строку в /tmp прямо перед прогоном приёмки и закрыть задачу без
# единого настоящего прогона. Доказательство обязано принадлежать тому, кто
# его произвёл.
#
# У каждой записи сказано, КТО пишет файл: если писатель — не тот, кого
# проверяют, подделка перестаёт быть тихой.
следы:
  - путь: "/var/log/harness/ворота-итог.jsonl"
    пишет: "scripts/gates.sh — строкой в конце каждого прогона"
    причина: >
      Итог прогона ворот: режим, число зелёных и красных. Пишется самим
      прогоном, а не карточкой задачи; поле «режим» появилось 28.09.2026,
      без него полный прогон и обычный в следе неотличимы.
  - путь: "/var/log/harness/проба-установки.log"
    пишет: "scripts/install-probe.sh — строкой в конце прогона"
    причина: >
      Итог контейнерной пробы установки: сколько следов проверено и сколько
      провалов. Пишется самой пробой; приёмке поднимать контейнеры не по руке
      (28.09.2026 такая проба умерла от 15 своих же контейнеров).

# Журнала вызовов модели здесь НЕТ намеренно. Он пишет РЕШЕНИЕ звать модель
# («повод, уровень, зову: true»), а не факт её ответа, — доступ таким следом
# не доказывается ([[model-access-proven-by-a-call]]). Следа факта ответа
# сейчас не пишет никто; это работа строителя проверок, а не повод засчитать
# задачу по ложному признаку.
