# ДАННЫЕ: когда работу делает помощник (субагент), а когда я сам.
#
# Владелец 12.09.2026: «Надо сделать возможность выбирать уровень когда
# вызывается агенты а когда нет. И на максимальном мне бы не надо было писать
# тебе „запусти агента на эту задачу“ а сам бы просто запустил и все, а на
# минимальном только сам, кроме однозначно когда запускаются сабагенты,
# например на ревью и другие задачи которые у нас работают сейчас. Сейчас это
# как минимум».
#
# Читает scripts/uroven-agenta.py. Уровень — ключ AGENT_LEVEL в harness.conf,
# рядом с AUTONOMY: это выбор владельца, а не код.

# Уровни по возрастанию самостоятельности. Имя уровня — то, что владелец
# пишет в harness.conf.
уровни:
  - имя: минимум
    смысл: >
      Помощник запускается только там, где без него работа невозможна или
      запрещена правилом: ревьюер не может быть автором кода. Всё остальное
      делаю сам. Это состояние харнеса на 12.09.2026.
  - имя: средний
    смысл: >
      Плюс то, о чём владелец попросил словом, и долгий поиск, который иначе
      съест смену целиком.
  - имя: максимум
    смысл: >
      Плюс сам, без просьбы: независимые задачи очереди уходят помощникам,
      пока я веду свою. Просить «запусти агента» больше не нужно.

# Поводы: с какого уровня повод разрешён. Повод, которого здесь нет, запрещён
# на любом уровне — список закрытый: «можно всё, что не запрещено» превращает
# уровень в украшение.
поводы:
  - повод: ревью-кода
    с_уровня: минимум
    почему: >
      Ревьюер обязан быть не автором кода (скил «ревью-кода»). Свой же код я
      читаю глазами, которые уже привыкли к нему.
  - повод: ревью-спеки
    с_уровня: минимум
    почему: >
      Та же причина, что у ревью кода, и то же правило скила «ревью-спеки»:
      автор спеки не ревьюер собственной спеки. Повода здесь не было до
      13.09.2026 — данные написаны раньше, чем скил вошёл в обиход, и
      прибор честно отказывал на живой задаче hr.glubina-zadachi-do-koda.
  - повод: просьба-владельца
    с_уровня: минимум
    почему: >
      Прямое слово владельца перебивает всё — оно и есть решение.
  - повод: независимые-задачи
    с_уровня: максимум
    почему: >
      Две задачи, не пересекающиеся ни файлами, ни причиной отказа (скил
      «агенты-параллельно»). На минимуме их веду по очереди сам.
  - повод: долгий-поиск
    с_уровня: средний
    почему: >
      Разведка по всему дереву съедает контекст смены: помощник вернёт вывод,
      а не простыню файлов.
  - повод: разбор-падения
    с_уровня: средний
    почему: >
      Чужие глаза на упавшем тесте: автор правки видит ту причину, которую
      ожидал увидеть.

# Что НЕ делают помощники ни на каком уровне — их результат идёт через те же
# ворота, но эти действия остаются за основной сменой.
никогда:
  - выкат и публикация: "И-2: одна дверь, и она проходит через согласие владельца"
  - разговор с владельцем: "канал ведёт основная смена, иначе он получит два голоса"
  - правка живых демонов без пробы: "механизм в бою чинится с доказательством"
