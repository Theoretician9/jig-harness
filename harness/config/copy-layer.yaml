# Слой копии: места, куда копия харнеса пишет своё.
#
# Всё, что положила раскладка пакета (опись <проект>/.layout-manifest), у копии
# только для чтения: следующее обновление его затрёт, а улучшение харнеса идёт
# находкой строителю, а не правкой на месте. Своё копия держит здесь — раскладка
# этих мест не трогает (scripts/lib/layout_manifest.py: ярус 1 не входит в опись,
# instance.yaml — ярус 2, кладётся шаблоном, только если файла нет).
#
# Читают: scripts/hooks/harness_files_guard.py (маска снимает запрет с пути из
# описи) и текст его отказа (поле «место»). Новых ручек слой не вводит: каждое
# место уже было своим у копии.
#   место — как назвать в отказе;
#   маска — путь от корня проекта (fnmatch); нет маски — место вне проекта.
места:
  - место: память/
    маска: память/*
  - место: STATE.md
    маска: STATE.md
  - место: dev-map.yaml
    маска: dev-map.yaml
  - место: .tasks/
    маска: .tasks/*
  - место: harness/self/instance.yaml (дверь scripts/self-set.py)
    маска: harness/self/instance.yaml
  - место: harness.conf установки (/etc/harness/harness.conf)
  - место: файл ключа PROCESS_LIBRARY_LOCAL (свои процессы машины)
  - место: продукт, данные и журналы — всё вне описи .layout-manifest
