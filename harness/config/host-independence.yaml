# ДАННЫЕ: какие проверки ЗАКОННО зависят от хозяина машины и какие тяжелы.
#
# Заведено 28.09.2026 (Ф4 ревизии, §6 класс 2). Случай: проба витрины панели
# строила свой стенд и всё равно краснела под HARNESS_ACTIVE_LINE=«продукт» —
# прибор очереди искал задачи в другом направлении. Исход решало окружение, а не
# поведение витрины; направление теперь задаёт стенд.
#
# Читает scripts/check-host-independence.py. У каждой записи обязательна ПРИЧИНА:
# список без причин — глушилка, а не данные. Полнота в обе стороны: запись про
# проверку, которой в воротах нет, краснит прибор.

# Предмет проверки — САМА ЭТА МАШИНА: подменять ей окружение всё равно что
# спрашивать про другую машину.
судят_машину:
  - проверка: "срок входа"
    причина: >
      Судит вход в модель на ЭТОЙ машине: годен ли долгий ключ и подключают ли
      его профили оболочки хозяина (~/.profile, ~/.bashrc). Под подменённым HOME
      профилей нет — и это верный ответ про чужой дом, а не дефект пробы.

# Прогон идёт минутами, а прибору нужно три прогона на проверку.
тяжёлые:
  - проверка: "мутации"
    причина: >
      Мутационный прогон портит копию каждого механизма из инвариантов и гоняет
      его самотест — 51 мутация, около десяти минут. Трижды это полчаса; свою
      независимость от машины он доказывает тем, что работает на копиях в своём
      временном каталоге.
  - проверка: "приёмка-самотест"
    причина: >
      Самотест судьи приёмки — 91 путь и минуты работы, он поднимает подставных
      судей и свои журналы. В замере 28.09.2026 расхождений не дал.
  - проверка: "установка с нуля"
    причина: >
      Проба поднимает СВОЙ контейнер и ставит в него харнес с нуля — минуты
      работы. Под потолком 90 с её убивало SIGKILL на каждом из трёх прогонов,
      а по SIGKILL не исполняется её trap уборки: 28.09.2026 на машине нашлось
      15 живых контейнеров пробы, свободной памяти осталось 266 МБ — и
      следующий systemd уже не поднимался за 120 с. Независимость от машины
      проба доказывает тем, что строит чистую машину сама.
  - проверка: "установка-проба-самотест"
    причина: >
      Тот же стенд, что и у пробы установки: поднимает контейнер и судит по его
      следам. Времени требует столько же, а SIGKILL по потолку оставляет за
      собой контейнер.

# Сколько ждать один прогон. Данные, а не число в коде: на медленной машине
# потолок поднимают, не трогая прибор.
потолок_секунд: 90
