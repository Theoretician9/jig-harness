# Политика удержания путей записи — ДАННЫЕ для scripts/check-uderzhanie.py.
#
# Заведено 10.09.2026 по замечанию владельца П-3 к ревизии харнеса: в таблице
# мусора у КАЖДОЙ строки в графе «кто должен убирать» стояло «никто». Это не
# семь разных проблем, а одна: у пишущего пути не было объявленного хозяина и
# потолка. Разовая прополка вернула бы тот же список через месяц.
#
# Правило: у каждого пути записи есть хозяин (кто чистит), потолок (сколько
# мегабайт) и срок (после скольких дней файл лишний; 0 = не удалять никогда).
#
# Поле «уборщик» — КОМАНДА, которой превышение лечится, или честное «нет».
# Оно же решает, красит ли переполнение ворота: красный ставится только там,
# где его есть чем погасить, — иначе гейт требует того, чего агент не вправе
# сделать (вложения владельца не удаляют, И-1), и его выключат вместе с
# остальной защитой. Прежде рядом стояло отдельное поле «красит», и таблица
# могла обещать уборщика, которого нет: семь строк называли хозяина, а команды
# не было ни у одной (ревью 10.09.2026, q-08). Два поля, которые обязаны
# сходиться, — это одно поле и повод разойтись.
# Где уборщика нет, превышение — предупреждение владельцу, а не отказ.
# Путь без политики — тоже предупреждение с перечнем: случайный рабочий файл
# в каталоге не должен блокировать коммит чужой работы.
пути:
  # Копии перед обновлением харнеса: без хозяина они копятся вечно, а каждая —
  # целый пакет (находка I10 разбора спеки обновления 11.09.2026).
  - маска: "обновление-*"
    хозяин: "disk-cleanup (старше срока), последняя копия всегда остаётся"
    уборщик: "find /var/backups/harness -maxdepth 1 -name 'обновление-*' -mtime +30 -exec rm -rf {} +"
    потолок_мб: 2000
    срок_дней: 30
  # Хроники: их удаление стирает историю, а не мусор. guard_exceptions.log —
  # единственная запись о том, что сторож команд ПРОПУСТИЛ команду (fail-open);
  # install-*.log — протокол приёмки установки. Ревью 10.09.2026 поймало: шаг 8
  # снёс бы их первыми, а heartbeat-watch сторожит журнал исключений по
  # абсолютному смещению и после обнуления ослеп бы молча.
  - маска: "guard_exceptions.log|install-*.log|rotation-forced.log"
    хозяин: "никто и не должен: хроника, растёт медленно"
    уборщик: "нет"
    потолок_мб: 20
    срок_дней: 0
  - маска: "*.log"
    хозяин: "logrotate (крупные, daily 5M×7) + disk-cleanup (старше срока)"
    уборщик: "bash harness/demons/disk-cleanup.sh"
    потолок_мб: 150
    срок_дней: 30
  - маска: "*.log.*"
    хозяин: "logrotate: 7 копий, сжатие"
    уборщик: "logrotate -f /etc/logrotate.d/harness"
    потолок_мб: 100
    срок_дней: 14
  - маска: "*.jsonl"
    хозяин: "демоны и гейты: журналы событий, читаются целиком"
    уборщик: "нет"
    потолок_мб: 60
    срок_дней: 0
  - маска: "*.err"
    хозяин: "тот же прогон, что и .log рядом"
    уборщик: "нет"
    потолок_мб: 20
    срок_дней: 30
  - маска: "*.stamp|*.told|*.cursor|tg_offset|*.summary|*.report|*.txt|*.png"
    хозяин: "метки и сводки демонов: перезаписываются на месте"
    уборщик: "нет"
    потолок_мб: 10
    срок_дней: 0
  - маска: "inbox/*"
    хозяин: "агент: разобранное переносится в inbox/обработано/"
    уборщик: "нет"
    потолок_мб: 5
    срок_дней: 0
  - маска: "inbox/обработано/*"
    хозяин: "владелец решает срок; читает только человек"
    уборщик: "нет"
    потолок_мб: 20
    срок_дней: 0
  - маска: "inbox/файлы/*"
    хозяин: "ВЛАДЕЛЕЦ (вложения из канала) — потолок согласован 10.09.2026"
    уборщик: "нет"
    потолок_мб: 100
    срок_дней: 0
  # *.lock в корне журналов — локи flock у журналов-файлов (предложения.jsonl).
  - маска: "locks/*|locks/services/*|*.lock"
    хозяин: "сервисные локи демонов, размера не имеют"
    уборщик: "нет"
    потолок_мб: 1
    срок_дней: 0
  - маска: "evo/*|devmap/*|указания/*|mobile/*|revizia/*"
    хозяин: "механизмы харнеса: журналы и курсоры"
    уборщик: "нет"
    потолок_мб: 20
    срок_дней: 0
