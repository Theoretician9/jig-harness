# ДАННЫЕ расширений Claude Code. Читает scripts/rasshirenija.py.
#
# Здесь НЕТ команд: команда одна и живёт в коде (`claude plugin install`).
# Прежняя таблица жила текстом скила СЛЭШ-формами (`/plugin install …`) — их
# вводит человек в терминале, а владелец терминала не видит; за месяц
# установок 0 (замер 12.09.2026). Поэтому список стал данными, а установка —
# кодом.

# Маркетплейсы подключаются ДО установки. Источник — как его понимает
# `claude plugin marketplace add`: GitHub-репозиторий, URL или путь.
маркетплейсы:
  - имя: claude-plugins-official
    источник: anthropics/claude-plugins-official
    зачем: официальный каталог Anthropic, 292 плагина

# БАЗОВЫЙ НАБОР — ставится САМ при установке (шаг 8 USTANOVIT.sh) и на любой
# новой машине. Владелец 12.09.2026: «есть вещи которые сразу надо подключать
# по умолчанию. Суперпауер, контекст7, uiux скилл <…> что официальное там от
# антропик, тоесть у нас должен быть сразу набор установленный».
базовый_набор:
  - id: context7@claude-plugins-official
    зачем: назван владельцем; документация библиотек версия-в-версию (HTTP MCP, без npx и без ключа)
  - id: frontend-design@claude-plugins-official
    зачем: назван владельцем как «uiux скилл»; официальный фронт-дизайн Anthropic
  - id: skill-creator@claude-plugins-official
    зачем: создание и замер собственных скилов — нужен любому проекту на харнесе
  - id: claude-md-management@claude-plugins-official
    зачем: аудит и поддержание CLAUDE.md — файла, который грузится каждую сессию

# ПО УСЛОВИЮ — ставится, когда условие НАСТУПИЛО, по одному. Условие обязано
# быть наблюдаемым: «пригодится» условием не является.
по_условию:
  - id: playwright@claude-plugins-official
    условие: первая задача с UI или фронтом, где нужен живой браузер
    зачем: браузер ставится ОДНИМ механизмом — плагин ИЛИ MCP, не оба
  - id: example-skills@anthropic-agent-skills
    условие: владелец впервые просит документ (docx/xlsx/pptx/pdf)
    маркетплейс: anthropics/skills
    зачем: офисные документы
  - id: claude-mem
    условие: чек-лист приёмки закрыт И владелец подтвердил
    маркетплейс: thedotmack/claude-mem
    зачем: внешняя память; после установки задать потолок памяти службы в harness.conf
  - id: pr-review-toolkit@claude-plugins-official
    условие: появился первый pull request от человека, а не от сессии
    зачем: ревью PR ролями

# НЕ СТАВИТЬ — вердикты с причиной. Снимает вердикт только владелец; снятое
# называется вслух здесь же, иначе снятая работа неотличима от несделанной.
не_ставить:
  - id: superpowers
    причина: >-
      разобран построчно 12.09.2026 по прямому вопросу владельца («действительно
      ли нам нужны эти скилы, или наш харнес их заменяет»). Из 14 скилов 8
      дублируют наши (brainstorming=приём-задачи, writing-plans=пишу-план,
      test-driven-development=тдд-тесты-до-кода, systematic-debugging=падение-тестов,
      два code-review=ревью-кода, verification-before-completion=закрытие-задачи,
      executing-plans=пайплайн), 3 конфликтуют: finishing-a-development-branch
      учит `git push` ветки и PR мимо deploy.sh (инвариант И-2),
      using-superpowers требует звать свой скил перед ЛЮБЫМ ответом, включая
      уточняющий вопрос (против правила «ack ≤30 секунд»), writing-skills учит
      править скилы руками, а наши собираются генератором. Хук плагина
      впрыскивает 3108 знаков в КАЖДУЮ сессию. Два полезных скила
      (dispatching-parallel-agents, subagent-driven-development) перенесены к
      нам по лицензии MIT — см. harness/skills-src/.
    решил: владелец 12.09.2026, ответ «1» на развилку
  - id: devops-automation-pack
    причина: предлагает выкат мимо deploy.sh — конфликт с инвариантом И-2
  - id: engineering-workflow-skills
    причина: ниши закрыты скилами пакета (падение-тестов, формат коммита в гейте)
  - id: code-operations-skills
    причина: ниша закрыта записью feedback-data-via-scripts
  - id: dream-skill
    причина: фоновая правка памяти без подтверждения — против нормы ревизии UNIFIED/03
  - id: n8n-MCP
    причина: нет потребителя; пересмотр при первой интеграции продукта

# Снятые вердикты: были в «не ставить», сняты словом владельца.
снятые_вердикты:
  - id: superpowers
    был_вердикт: второй пайплайн рядом с нашим — конфликт с гейтами и скилами пакета
    снял: владелец
    когда: "2026-09-12"
    слова: «Суперпауер, контекст7, uiux скилл <…> должен быть сразу набор установленный»
    вернулся: >-
      в тот же день владелец потребовал проверку («действительно ли нам нужны эти
      скилы, или наш харнес их заменяет, допустим суперпауер»), разбор показал 8
      дублей и 3 конфликта — и владелец выбрал снять плагин, забрав два скила.
      Вердикт снова ДЕЙСТВУЕТ, теперь с уликами.
  - id: ui-ux-pro-max
    был_вердикт: подмножество frontend-design; два дизайн-гайда конфликтуют
    снял: владелец
    когда: "2026-09-12"
    слова: «uiux скилл» — вердикт снят выбором официального frontend-design
  - id: feature-dev
    был_вердикт: второй пайплайн рядом с нашим
    снял: нет
    когда: null
    слова: вердикт ДЕЙСТВУЕТ — владелец назвал superpowers, не feature-dev
