# ДАННЫЕ: у каждого наблюдаемого факта ОДИН источник истины.
#
# Владелец 12.09.2026 (ночь): «Реши системно все эти проблемы» — о череде
# отказов, у которых один корень. За ночь их было три:
#   • сторож сессий писал владельцу «с лимитом подписки это не связано», а его
#     же ветка в ту же минуту видела отказ 429 в журнале;
#   • напоминание конца хода требовало согласия владельца на отправку в гит,
#     а сторож выката отвечал «ручка PUSH_NEEDS_OWNER отпущена, не спрашивать»;
#   • автомат карточек заводил задачу из вопроса владельца, а прибор срочности
#     в тот же миг говорил «это не работа».
#
# Класс один: два механизма судят об одном факте, и каждый считает его САМ.
# Копия суждения расходится с оригиналом молча — и владелец получает два
# противоречащих сигнала.
#
# Читает scripts/check-priznaki.py. Правило гейта: файл, который судит о факте
# (в нём есть слово-маркер), обязан звать источник — или стоять в «знают_сами»
# с причиной.

признаки:
  - факт: "лимит подписки"
    источник: "limit-v-zhurnale.py"
    где: scripts/limit-v-zhurnale.py
    маркеры: ["лимитом подписки", "лимит подписки"]
    почему: >
      Признак машинный: запись rate_limit / 429 в журнале сессии. Экранный
      текст — догадка, я и сам печатаю слово «лимит» в отчётах.
      С 13.09.2026 разбор вынесен в отдельный прибор: тот же факт спрашивают
      ДВА сторожа — десятиминутный session-warden и ежеминутный limit-watch, —
      и копия разбора внутри одного из них разошлась бы с другой молча.
    знают_сами:
      - файл: scripts/check-priznaki.py
        причина: "сам реестр и его гейт — они о факте не судят, а следят за судьями"
      - файл: scripts/test_limit_watch.sh
        причина: "проба сторожа: она проверяет судью, а не судит сама"
      - файл: scripts/test_claude_demon.sh
        причина: "проба обёртки демонов: проверяет судью на подставном выводе"
      - файл: harness/demons/devmap-selfheal.sh
        причина: "пересказывает решение обёртки: сам судит только по коду возврата 77"
      - файл: harness/demons/stroitel-proverok.sh
        причина: "то же: слово в логе, решение принято обёрткой claude-demon.sh"
      - файл: harness/demons/ton-watch.sh
        причина: "то же: слово в логе, решение принято обёрткой claude-demon.sh"

  - факт: "файл принадлежит харнесу"
    источник: "sverit-s-paketom.py"
    где: scripts/sverit-s-paketom.py
    маркеры: ["принадлежит харнесу", "файл харнеса", "файлов харнеса"]
    почему: >
      Что относится к харнесу, а что к живым данным сервера, знает таблица
      СООТВЕТСТВИЯ (проектный путь в путь пакета) и список ЖИВЫЕ. Свой обход
      дерева внутри другого механизма — второй судья того же факта: он
      разойдётся с раскладкой молча, и файл либо потребует паспорта, не
      принадлежа харнесу, либо пропадёт из домена, принадлежа ему.
      Гейт устройства с 13.09.2026 держит ССЫЛКУ на модуль-судью, а не копию
      таблицы: копия неотличима от своего списка.
    знают_сами:
      - файл: scripts/check-priznaki.py
        причина: "сам гейт реестра"

  - факт: "согласие владельца на действие"
    источник: "deploy_guard.py"
    где: scripts/deploy_guard.py
    маркеры: ["согласия владельца", "согласие владельца"]
    почему: >
      Согласие — это ручки PUSH_NEEDS_OWNER / ROTATE_NEEDS_OWNER плюс запись в
      confirmations.jsonl со сроком годности. Своё суждение мимо сторожа
      выката либо просит лишнего, либо пропускает опасное.
    знают_сами:
      - файл: harness/demons/session-warden.sh
        причина: "пересказывает владельцу решение сторожа, своего суждения не выносит"
      - файл: scripts/publikaciya.sh
        причина: "зовёт deploy_guard.py напрямую как замок 2"
      - файл: scripts/check-priznaki.py
        причина: "сам гейт реестра"

  - факт: "какая задача идёт сейчас"
    источник: "ochered-raboty.py"
    где: scripts/ochered-raboty.py
    маркеры: ["задач в работе", "текущая задача", "задача идёт сейчас"]
    почему: >
      Порядок работы считает один прибор: веса признаков, свежесть источника и
      активное направление живут там. Улика 13.09.2026: панель считала работой
      только статус «wip» и показала владельцу «задач в работе нет», пока шла
      работа, — он прочёл это на экране и написал в канал.
    знают_сами:
      - файл: scripts/check-priznaki.py
        причина: "сам гейт реестра"

  - факт: "сообщение владельца несёт работу"
    источник: "рабочее"
    где: scripts/zadachi-iz-kanala.py
    маркеры: ["несёт работу", "признак работы"]
    почему: >
      Один список слов на всех: гейт исходов, автомат карточек и прибор
      срочности обязаны судить одинаково, иначе задача заводится там, где её
      нет, и не заводится там, где есть.
    знают_сами:
      - файл: scripts/check-priznaki.py
        причина: "сам гейт реестра"
