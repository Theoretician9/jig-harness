# Перечень проверок «поднялся» после перезагрузки и «машина занята».
# Читает scripts/boot_check.py; код знает только виды, а что проверять — здесь.
# Виды проверок: юнит | tmux | docker | http | команда | ядро | ответ_сессии.
# Виды занятости: замок | процесс | процесс_по_строке.
# Имена — слова владельца, они попадают в весть. После подъёма проверяются харнес
# и сайт; чужие соседи машины не проверяются (слово владельца 02.11).
# «необязательный: true» — служба не из харнеса, которую установка вправе не ставить:
# её отсутствие (not-found) — «не установлен»; отсутствие своего юнита — КРАСНЫЙ.
# Сумма пределов (ждать_сек + предел_сек + по 10 с на прочие) должна быть меньше
# REBOOT_CHECK_TIMEOUT_SEC минус 30 с: boot_check сам сверяет.
# «известный_отказ» — юниты хостинга, упавшие не по вине харнеса (cloud-init на bootcmd
# провайдера): смена видит их отдельной строкой, а не красным «упавшие юниты».
известный_отказ: [cloud-init.service]

проверки:
  - { имя: агент,               вид: юнит,  юнит: harness-agent,      дверь: "sudo systemctl restart harness-agent" }
  - { имя: канал,               вид: юнит,  юнит: harness-dispatcher, дверь: "sudo systemctl restart harness-dispatcher" }
  - { имя: панель,              вид: юнит,  юнит: harness-panel,      дверь: "sudo systemctl restart harness-panel" }
  - { имя: стена,               вид: юнит,  юнит: harness-firewall,   дверь: "sudo systemctl restart harness-firewall", необязательный: true }
  - { имя: присмотр,            вид: юнит,  юнит: harness-sentinel.timer }
  - { имя: расписание,          вид: юнит,  юнит: cron }
  - { имя: docker,              вид: юнит,  юнит: docker, необязательный: true }
  - { имя: nginx,               вид: юнит,  юнит: nginx, необязательный: true }
  - { имя: сессия агента,       вид: tmux }
  - { имя: ответ сессии,        вид: ответ_сессии, ждать_сек: 300 }
  - { имя: срок входа,          вид: команда, argv: [python3, scripts/check-login-expiry.py] }
  - { имя: панель по сети,      вид: http, ключ: PANEL_LOCAL, умолчание: "http://127.0.0.1:8787" }
  - { имя: продукт,             вид: http, ключ: PRODUCT_HEALTH_URL }
  - { имя: сайт,                вид: http, ключ: SITE_HEALTH_URL }
  - { имя: сайт — форма заявки,  вид: http, ключ: SITE_FORM_URL, коды: [405] }
  - { имя: ядро,                вид: ядро }

занято:
  - { имя: резервная копия,      вид: замок, файл: "${LOG_DIR}/locks/${SERVICE_LOCKS_SUBDIR}/backup.lock" }
  - { имя: проба восстановления, вид: процесс_по_строке, образец: "scripts/restore-probe.sh" }
  - { имя: установка пакетов,    вид: процесс, имена: [dpkg, apt, apt-get] }
  - { имя: автообновление,       вид: процесс_по_строке, образец: "bin/unattended-upgrade( |$)" }
  - { имя: снимок ворот,         вид: процесс_по_строке, образец: "scripts/gates-snapshot.sh" }
  - { имя: выкат,                вид: процесс_по_строке, образец: "scripts/deploy.sh" }
