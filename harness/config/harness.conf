# местах по отдельности, проверялась договорённость проверяющего с самим собой, а
# писатель, назвавший файл по ДОМЕНУ, оставил бы его на диске после снятия
# (ревью кода 28.09.2026, I-12). «<проект>» заменяется именем проекта compose.
ENV_NGINX_SITE="<проект>"

# ── Здоровье ПРОДУКТА: сторож product-health.sh ─────────────────────────────
# Адрес ручки, на которой служба продукта говорит о СЕБЕ: код 200 — всё хорошо,
# любой другой — беда, которую сторож перескажет владельцу его словами. Пусто —
# продукта с такой ручкой здесь нет: доустановка не ставит сторожу ни строки
# крона, ни срока метки (system-jobs.yaml, если_задан). Задан — ставит обе.
#
# ЗАЧЕМ КЛЮЧ ЕСТЬ. Улика 02.10.2026: сторож остатка данных у продукта отказывал каждые пять
# минут 11 часов 37 минут, витрина обещала покупателю вчерашние числа, а
# `health` отвечал «жив», потому что жива была СЛУЖБА. Нашёл это человек глазами
# в журнале — механизма, который нашёл бы сам, не было.
#
# Адрес внутренний (loopback): ручка здоровья не для интернета.
PRODUCT_HEALTH_URL=""

# ── Ключи, которые доносит доустановка (system-jobs.yaml «ключи:») ──────────
# Чистая установка получает те же значения, что обновлённая: иначе у двух
# одинаковых харнесов поведение расходится молча.
# Выключатель фоновых процессов: off гасит все задания крона и таймер sentinel
# (обёртка scripts/run-background.sh), кроме исключений process-library.yaml;
# любое иное значение тоже гасит. Процессы по действию (хуки, панель, помощники) не гасит.
BACKGROUND_PROCESSES="on"
# Потолок вызовов модели из кода на один «зачем» в сутки: без него зациклившийся
# демон сжигает лимит подписки.
MODEL_CALLS_PER_DAY="50"
# Панель наружу туннелем cloudflared без root; 0 — выключен.
PANEL_TUNNEL="1"
# Через сколько минут молчания смены сторож скажет о нём самому владельцу.
PULSE_OWNER_MIN="60"
# Свежесть ответа помощника, минут: мерка пульса «работа идёт» (работа_мин), а не
# признак «помощник идёт» — молчащий в длинном инструменте помощник всё ещё идёт.
HELPER_FRESH_MIN=20
# Через сколько минут без продвижения (ответ или результат инструмента; служебные
# строки не в счёт) идущий помощник считается зависшим. Время — главная мера:
# 13.11 сторож ждал помощников 119 мин. Цена — инструмент дольше 30 мин назовут
# зависшим; это только весть владельцу, помощника никто не обрывает.
HELPER_HUNG_MIN=30
# Сколько минут сторож ждёт идущих помощников перед сменой сессии: обычная задача
# помощника 10–40 мин; равно PULSE_OWNER_MIN, чтобы владелец узнал о стоянии не
# позже, чем о молчании.
ROTATE_HELPERS_WAIT_MAX_MIN=60
# Что делать, когда срок ожидания помощников вышел. «сообщить» — одно письмо
# владельцу простыми словами и ждать дальше (смена сессии обрывает помощников, их
# работа и токены пропадают); «ротировать» — менять сессию, для установки без
# владельца на связи. Опечатка в значении = «сообщить»: ошибка не рубит работу.
ROTATE_HELPERS_TIMEOUT_ACTION=сообщить
# Сколько секунд после смены аккаунта из бота дверь (account-switch.py --итог) ждёт,
# пока в панели появится процесс смены: подъём преемника занимает десятки секунд, а
# судить пустую панель значило бы откатить удачный переход.
ACCOUNT_VERIFY_WAIT_SEC=120
# Откат неудавшегося перехода без передачи дел, если смене меньше стольких минут и
# помощников нет: свежая смена работу не начинала, её контекст и есть передача, а
# под лимитом смена передачу написать не может. 15 минут — владелец 13.11: хватает
# на подъём и проверку входа, и не хватает, чтобы смена успела наработать то, что
# откат потерял бы. 0 — выключено, откат идёт обычным путём, с передачей.
ACCOUNT_ROLLBACK_FRESH_MIN=15
# Сколько неудачных автопереходов за 6 часов терпит дверь (account-switch.py --авто),
# прежде чем замолчать до решения владельца: без предела два аккаунта на пределе
# гоняли бы смену туда-сюда, и каждый прыжок ротирует сессию.
ACCOUNT_AUTO_FAILS_PER_6H=3
# Сколько проверок --итог подряд могут не суметь судить (нет процесса смены, ответа
# входа нет), прежде чем переход снимается как «не подтверждён»: одна неудача — часто
# просто подъём, а вечное «судить нечем» держало бы переход открытым навсегда.
ACCOUNT_VERIFY_PASSES=3
# Через сколько минут незавершённый переход считается застрявшим и дверь о нём
# говорит: сторож ждёт помощников, но не бесконечно, а владельцу нужно знать, что
# смена так и стоит на старом аккаунте.
ACCOUNT_SWITCH_STUCK_MIN=60
# Через сколько минут без обновления флаг ожидания ротации считается протухшим и
# хук очереди его не исполняет: три периода сторожа, два пропущенных прогона ещё
# не смерть, а мёртвый сторож не должен запирать запуски помощников навсегда.
ROTATE_FLAG_STALE_MIN=30
# Сколько минут ждать ответа смены на пинок, прежде чем объявить «Работа встала»
# или сказать владельцу, что статус не пришёл.
KICK_ANSWER_WAIT_MIN=5
# Не реже, чем раз в столько минут сторож просит у смены отчёт владельцу.
PULSE_MAX_MIN=30
# Шаг обхода сторожа, минут (равен шагу cron задания session-warden в
# system-jobs.yaml): пульс срабатывает, когда к следующему обходу отчёт станет
# старше PULSE_MAX_MIN, а не после того, как порог уже пройден.
WARDEN_PERIOD_MIN=10
# Путь, который пишет демон, — не работа смены: stop-хук не считает его
# «изменённым без коммита». Через пробел; «/» на конце — каталог целиком.
DAEMON_OWNED_PATHS="память/.tasks-triaged docs/приёмка/"
# Стоящее согласие владельца на выкат: 0 — каждый выкат просит согласие
# заново; 1 ставит только владелец.
DEPLOY_CONSENT_STANDING=0

# Чьё на этой машине задевает перезагрузка и общие части (docker, nginx): слова через пробел.
# В пакете пусто; значение — данные установки, их ставит смена, а не пакет.
STACK_NEIGHBOURS=""

# Адреса сайта установки для проверки подъёма (scripts/boot_check.py); пусто — «не проверено».
# Форма заявки на GET отвечает 405 — перечень принимает его как «жива».
SITE_HEALTH_URL=""
SITE_FORM_URL=""

# ── Перезагрузка сервера в окне ротации (слово владельца 27.10, подтверждение 10558) ──
# Включает только оркестратор, когда закрыт раздел 8 спеки перезагрузки: ошибка кода
# здесь — настоящая перезагрузка машины, у agent полный sudo.
AUTO_REBOOT_IN_ROTATION=0
# Единственная команда перезагрузки; в коде сторожа умолчания нет — пустая значит «не задана».
REBOOT_CMD="sudo -n systemctl reboot"
# Не чаще раза в сутки при любом сбое предиката: первая защита от петли перезагрузок.
REBOOT_MIN_GAP_HOURS=24
# Сколько минут обещаем владельцу в вести: подъём 09.09 занял 48 с плюс 3 мин до первого отчёта sentinel.
REBOOT_EXPECT_MIN=3
# Сторож, переживший столько секунд после команды, идёт обычным «/exit».
REBOOT_WAIT_SEC=180
# Срок метки перезагрузки, минут: «не состоялась» без загрузки и «--boot не доложил» после неё;
# плюс период таймера sentinel (5) даёт «20 минут» из вести владельцу.
REBOOT_LATE_MIN=15
# Предел live-check.sh для проверки подъёма, секунд: выше суммы пределов перечня, иначе обёртка
# убила бы красный случай (смена молчит 300 с) до записи итога.
REBOOT_CHECK_TIMEOUT_SEC=600
# Корень следов живой проверки: в след уходит весь вывод произвольной команды,
# поэтому он лежит вне репозитория. Пусто — "$LOG_DIR/живая-проверка".
LIVE_CHECK_TRACE_ROOT=""
# Стойкий след проверки подъёма. Пусто — "<корень следов>/hr.reboot-in-rotation-window/живьём".
BOOT_CHECK_TRACE_DIR=""

# ── Приём канала: предел tmux и сторож «приём встал» ────────────────────────
# Предел одного вызова tmux из общей двери scripts/lib/pane.sh, секунд: зависший
# send-keys 25.10.2026 держал цикл приёма 57 минут.
PANE_TMUX_TIMEOUT=10
# Слать ли толчок владельца модели СРАЗУ (Ctrl+X Ctrl+S после текста). 0 — сообщение
# ждёт конца хода модели; 1 — ход прерывается, сообщение читается немедленно (может
# оборвать правку или прогон посреди). Читается в момент каждого толчка.
PANE_SEND_NOW=0
# Предел виртуальной памяти расшифровки голоса (ulimit -v обработчика
# voice-worker.sh) считается от памяти машины: доля MemTotal, не ниже пола и не
# выше потолка. Пол, КБ: замер 28.10.2026 на 4 ядрах — 1 200 000 отказ, 1 500 000
# расшифровано; 2 500 000 даёт запас около 1,7. MKL берёт память по числу ядер,
# на машине с большим числом ядер поднимите пол.
VOICE_VM_LIMIT_KB="2500000"
# Доля MemTotal, процентов.
VOICE_VM_MEM_PERCENT="40"
# Потолок, КБ: расшифровка не отнимает у машины больше.
VOICE_VM_MAX_KB="8000000"
# Сторож harness/demons/dispatcher-stall-watch.sh. 0 — выключен (раскладчик его
# не включает; включает смена после живой проверки), 1 — включён.
DISPATCH_STALL_ENABLED=0
# Через сколько минут без признака круга (tg-dispatcher.alive) приём считается вставшим.
DISPATCH_STALL_MIN=5
# Не чаще раза в столько минут повторять весть о том же простое.
DISPATCH_STALL_TELL_MIN=60
# Самолечение (убрать висящих потомков, потом рестарт юнита): 0 — только весть.
DISPATCH_STALL_HEAL=0
# Страж ответа владельцу (третья работа dispatcher-stall-watch.sh): 1 — судит раз в
# минуту и говорит владельцу, 0 — молчит. Своё выключение, ключ круга ему не указ.
OWNER_REPLY_WATCH_ENABLED=1
# Через сколько минут сообщение владельца без ответа смены в канале просрочено:
# одна весть владельцу на эпизод. Замер 31.10–06.11: p95 первого ответа 4 мин,
# жалоба «почему нет ответа» — через 3,4–9,2 мин. Тот же срок читает метрика
# delivery-latency.py --без-ответа.
OWNER_REPLY_MAX_MIN=5
# 1 — install-new при обновлении включает шаг «безопасность» на трёх уровнях пульта.
# 0 — шаг не трогается: включение идёт отдельным решением после пробного прогона.
SECURITY_STEP_LIVE="0"

# Тревоги сторожей становятся задачами модели (scripts/alert-task.py).
# Открытых тревог одного сторожа не больше столько; повтор к открытой не режется.
ALERT_TASKS_PER_WATCHER=3
# Мёртвых демонов от этого числа heartbeat-watch сводит в одну карточку.
ALERT_MASS_MIN=3
# Сколько секунд писатель ждёт лок карты, потом откладывает намерение (код 4).
ALERT_LOCK_WAIT_SEC=5


# Группа журналов событий и каталога .events (scripts/lib/events.py): панель
# читает, агент пишет. Группы нет на машине — права остаются за своей группой.
EVENTS_GROUP="harness-panel"

# Заявка помощника на файл (scripts/hooks/file_claim_guard.py): заявка живёт
# столько минут от последней записи; запись другого помощника в живой путь —
# предупреждение с именем занявшего.
FILE_CLAIM_MIN=60
# Общие файлы — реестры вставкой по якорю, package_sync их не судит: хук только
# предупреждает; пути от корня дерева через пробел.
FILE_CLAIM_SHARED="dev-map.yaml docs/ИЗМЕНЕНИЯ-ПАКЕТА.md"
# Исключительные файлы: package_sync сверяет их целиком, и две задачи с ханками в
# одном не могут закоммитить его по отдельности. Запись чужой задачи в грязный
# файл — отказ (код 2); замок снимает коммит держателя в проекте и в пакете.
# Каждый путь есть и в проекте, и в пакете под тем же относительным путём.
FILE_CLAIM_EXCLUSIVE="harness/config/harness.conf harness/config/mechanisms.yaml harness/config/probe-mutations.yaml harness/config/journals.yaml"
# Своя копия кода у исполнителя (scripts/hooks/launch_plan_guard.py, compare-with-package.py):
# «1» — исполнитель запускается с isolation: "worktree" и коммитит у себя, его ветку
# вливает scripts/merge-queue.py; «0» или нет ключа — все правят общий каталог, как раньше.
HELPER_WORKTREE=0
# Очередь слияния (scripts/merge-queue.py): сколько раз заново подтянуть master, если он
# ушёл между проверками и слиянием; затем код 6 — повтор позже.
MERGE_QUEUE_RETRIES=3
# Очередь слияния: сколько минут ждать замок очереди, пока сливает другая; затем код 8.
MERGE_QUEUE_WAIT_MIN=30

# Режим «хакатон» (scripts/hackathon.py): конец срока в ISO 8601 с поясом.
# Пусто = режим выключен. Ставит `hackathon.py --включить [часы]`, не руками;
# срок 72 часа — решение владельца 29.10.2026.
HACKATHON_UNTIL=""

# Режим скорости (harness/demons/speed_mode.py): slow | medium | fast | ultra —
# сколько задач из карты вести одновременно. Ставит write-key.py (панель и бот).
SPEED_MODE="medium"

# ── Статус владельцу кодом (scripts/status-report.py, tg_send.sh --статус) ──
# Потолок всего отчёта, знаков: дверь `--статус` в стороже канала берёт его вместо
# жёсткого потолка TONE.md, но только для текста с тремя заголовками блоков.
# Ключа нет — сборщик и сторож берут один запасной потолок 1400.
STATUS_STRUCT_MAX_CHARS="1400"
# Подписи моделей в строках отчёта: «модель=подпись;…». Версия — данные, не код.
STATUS_MODEL_LABELS="opus=Opus 5.5;sonnet=Sonnet 5.5;haiku=Haiku 5.5"
# «1»: СДЕЛАНО показывает только законченное после прошлого доставленного статуса
# (метка $LOG_DIR/status-report.last); «0» или нет ключа — окно 12 часов.
STATUS_DONE_SINCE_LAST="1"

# ── Защищённые пути (сторож Bash-команд, scripts/hooks/guard_bash.py) ───────
# Пути, которые сессия не стирает, не переносит и не перезаписывает ЛЮБЫМ
# разрушающим глаголом (rm, mv, find -delete, shred, truncate, `>` в существующий
# файл, cp /dev/null, dd of=, rsync --delete, git clean, docker run -v с таким
# глаголом внутри). Список через пробел или запятую. SECRETS_DIR и BACKUP_DIR
# сторож добавляет сам из конфигов установки — здесь их повторять не надо.
# Чтение, ls, cp ИЗ защищённого и создание новых файлов свободны. Дверь одна, как
# у удаления данных: свежее слово владельца с названным путём + причина в
# команде (HARNESS_DATA_DELETE_WHY=…). Ключа нет — сторож защищает только
# SECRETS_DIR и BACKUP_DIR.
# Пример: ключи и чужие проекты — абсолютными путями (не ~: хук может идти с иным HOME),
# например "/home/user/sample-20 /home/user/.ssh /var/www/chuzhoj-proekt".
PROTECTED_PATHS="sample-21/sample-20"

# Потолки среза harness-checks.slice (служба потока проверок, пять id библиотеки
# с признаком запуск: служба-проверок). Потолок общий на все пять, не на каждый.
# Довод — замер 04-06.11 (спека hr.process-dispatcher §Г.1): машина 4 ядра, 7,3 ГБ;
# процессы харнеса в окне прогона мутаций в среднем 1,3 ядра, p95 2,1, пик 2,8,
# память пик 2,1 ГБ. 200% — половина машины: два ядра остаются оркестратору,
# агенту, панели и чужому серверу. MemoryMax выше пика харнеса с запасом под
# один лишний агент claude (~0,6 ГБ); MemoryHigh — мягкое торможение до
# OOM-убийства. Юниты строит `process_library.py checks-units` из этих ключей.
CHECKS_CPU_QUOTA=200%
CHECKS_MEMORY_HIGH=2G
CHECKS_MEMORY_MAX=2560M
# Дверь запуска под срез (scripts/run-in-checks-slice.sh). CHECKS_RUN_MAX_MIN —
# предел жизни юнита (RuntimeMaxSec): шаг мутаций задачи измерен в 6 минут, один
# механизм целиком — минуты, полный набор идёт ночной службой мимо двери; 120 —
# с запасом, зависший прогон не держит очередь вечно. MUTATION_LOCK_WAIT_MIN —
# сколько второй прогон ждёт очередь среза, потом отказ кодом 75 с именем держателя.
CHECKS_RUN_MAX_MIN=120
MUTATION_LOCK_WAIT_MIN=30
# Ночной агент тревог проверок: сколько тревог берёт за проход и предел его
# времени в минутах (проход обязан кончиться до 03:00).
CHECKS_NIGHT_MAX_ALERTS=3
CHECKS_NIGHT_TIMEOUT_MIN=90

# Проверка «хозяин машины» (прибор scripts/check-host-independence.py) нужна
# только нашей установке: она ловит пробы, чей исход зависит от машины. Копиям
# она незачем и занимает часы ворот, поэтому по умолчанию выключена.
HOST_INDEPENDENCE_CHECK=0
# Раз в сколько суток прибор гоняет ВСЕ проверки; между полными кругами — только
# изменённые с последнего чистого полного круга. Без срока база устарела бы
# и изменения вне прямых связей пробы копились бы незамеченными.
HOST_INDEPENDENCE_FULL_DAYS=7
# Сколько проверок прибор гоняет разом (три прогона одной — всегда по очереди,
# группы gates-serial.yaml — тоже). Ночью прибор — длинный хвост ворот: 14.11
# первые 30 мин рядом шли 5–6 гейтов, дальше он один; 4 на 8 ядрах — середина.
HOST_INDEPENDENCE_JOBS=4
