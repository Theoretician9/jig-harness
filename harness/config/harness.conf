SKILL_SILENT_MAX=1

# ── Изолированная среда разработки (scripts/test_environment.sh, среда
#    /var/www/<имя>/scripts/{export,teardown}.sh) ─────────────────────────────
# Предел возраста архива среды, часов: старше — условие 2 двери снятия не
# открывается (архив это перенос, а не прошлая копия, И-1). Возраст считается и
# по mtime, и по строке created= внутри архива — берётся БОЛЬШИЙ, иначе `touch`
