# /etc/harness/harness.conf — пороги механики харнеса. ДАННЫЕ, НЕ КОД.
#
# Отдельно от install.conf намеренно: install.conf — паспорт установки
# (кто, где, каким каналом), он заполняется один раз; здесь — пороги,
# которые крутятся при эксплуатации. Менять порог = править этот файл,
# не скрипты.
#
# Файл читается и bash (source), и python (мини-парсер в
# server_hygiene_check.py) — поэтому формат строго KEY="value" или
# KEY=число, без подстановок $VAR, без массивов, без логики.
#
# При установке копируется: sudo cp harness/config/harness.conf /etc/harness/
# Проверка: bash -n /etc/harness/harness.conf && source /etc/harness/harness.conf && echo OK

# ── Пакет-источник ──────────────────────────────────────────────────────────
# Каталог СТАРТОВОГО ПАКЕТА на этой машине. Его читает гейт
# scripts/сверить-с-пакетом.py: раскладка копирует ПАКЕТ → ПРОЕКТ, поэтому
# правка, сделанная только в $PROJECT_DIR, умирает при следующей раскладке.
# Пусто — гейт ищет /home/$AGENT_USER/starter/STARTER-PACKAGE; не нашёл —
# объявляет сверку невозможной с адресом и НЕ валит коммит (сверка, которую
# нельзя сделать, не повод остановить работу, но и молчать о ней нельзя).
STARTER_DIR=""

# ── Ротация сессий (session-warden) ─────────────────────────────────────────
# Порог заполнения окна, %: дальше качество падает и растёт риск авто-компакта.
CTX_ROTATE_PCT=75
# Эвристика «байты JSONL ≈ окно»: транскрипт сессии Claude Code растёт вместе
# с контекстом (история + выводы инструментов).
# КАК КАЛИБРОВАТЬ (замер, а не гадание): взять живой транскрипт
# ~/.claude/projects/<проект>/*.jsonl, поделить его размер на контекст
# ПОСЛЕДНЕГО сообщения с usage (input_tokens + cache_read + cache_creation) —
# получатся байты на токен; умножить на CLAUDE_CODE_AUTO_COMPACT_WINDOW.
# Замер 11.08.2026 на двух живых сессиях: 6,50 и 5,67 байт/токен. Берём нижнюю
# оценку 5,5 — она даёт МЕНЬШИЙ порог, то есть ротацию раньше, а не позже:
# лишняя ротация дешевле авто-компакта. 400 000 × 5,5 ≈ 2,2 МБ; при
# CTX_ROTATE_PCT=75 ротация объявляется на ~300 000 токенов.
# Прежнее значение 40 000 000 было завышено в 18 раз — порог не срабатывал бы
# никогда, и сессия доходила бы до компакта, ради избежания которого он стоит.
CTX_WINDOW_BYTES=2200000
# Окно автокомпакта в ТОКЕНАХ — делитель точного замера. Сторож берёт размер
# контекста из usage последнего ответа в транскрипте; байтовая эвристика выше
# осталась запасной на случай, если usage не нашёлся.
CTX_WINDOW_TOKENS=800000   # не-секрет: потолок окна в токенах, а не ключ
# Сколько авто-компактов сессия может пережить до принудительной ротации.
# Больше одного — контекст уже дважды пережат, доверять ему нельзя.
MAX_COMPACTS=1
# Максимальный возраст свежайшего docs/handover/* при живой работе, минуты.
HANDOVER_MAX_AGE_MIN=240
# Спрашивать ли владельца перед ротацией сессии. 0 — не спрашивать (норма):
# ротация это внутренняя механика харнеса, а не решение владельца. Развилки
# полуавтомата — выкат в прод и необратимые операции — этим ключом НЕ
# затрагиваются. Улика 11.08.2026: в semi владельцу пришло «скомандуйте агенту
# завершение», хотя он проектировал ротацию как происходящую под капотом.
ROTATE_NEEDS_OWNER=0

# Когда работу делает помощник (субагент), а когда я сам: минимум | средний |
# максимум. Владелец 12.09.2026: «на максимальном мне бы не надо было писать
# тебе „запусти агента на эту задачу“ а сам бы просто запустил и все, а на
# минимальном только сам, кроме однозначно когда запускаются сабагенты,
# например на ревью». Что разрешает каждый уровень — harness/config/агенты.yaml,
# спрашивает scripts/uroven-agenta.py. Незнакомое значение запрещает всё.
AGENT_LEVEL="минимум"

# Пауза перед пинком «подхвати работу» свежеподнятой сессии, секунды.
# TUI после запуска ещё рисуется и первые нажатия теряет; поднять процесс —
# не то же, что вернуть работу (улика владельца 11.08.2026).
AGENT_WAKE_DELAY=5
# Сколько ждать, пока агент отработает регламент ротации, секунды.
ROTATE_FINISH_TIMEOUT_SEC=900
# Панель молчит столько секунд — регламент отработан, сторож сам вводит «/exit».
# Агент выйти не может: «/exit» в его ответе это текст, а не команда TUI
# (улика 12.08.2026 — четыре ротации подряд встали именно здесь).
ROTATE_IDLE_SEC=120
# Сколько ждать закрытия сессии после того, как «/exit» введён в панель.
ROTATE_EXIT_WAIT_SEC=180
# Повторная КОМАНДА ротации той же сессии (режим full) — не раньше, чем через
# столько минут: команда уже подана в панель и исполняется, дублировать нечего.
ROTATE_COOLDOWN_MIN=120
# Повторный АНОНС ротации (режим semi) — своё окно, и оно короче. Анонс не
# исполняется сам: он ждёт ответа владельца, и пока ждёт, окно растёт. Улика
# 11.08.2026: анонс в 22:20 задавил ротацию до 00:20, за это время окно дошло
# до 114% и сессия ушла в автосжатие. Цена повтора — одно лишнее сообщение
# владельцу; цена молчания — потерянная сессия.
ROTATE_ANNOUNCE_GAP_MIN=30
# Тишина: в очереди есть РАБОТА, а транскрипт не растёт дольше этого — пинок,
# минуты. Задача с полем `blocked` в карте работой не считается: 12.08.2026
# в очереди стояла одна `pr.first`, чью формулировку даёт владелец, и пинки
# будили агента впустую до утра — он отвечал «блокер тот же» и жёг контекст.
SILENCE_MAX_MIN=45
# Пинок «подхвати работу» зовут три руки (пусковой скрипт, sentinel, сторож) —
# в пределах этого окна отдаётся один, секунды.
KICK_COOLDOWN_SEC=120
# Вся очередь ждёт владельца: агента будить нечем, но и молчать нельзя —
# напоминание владельцу не чаще раза в это окно, минуты (по умолчанию 12 ч).
BLOCKED_TELL_GAP_MIN=720
# Сколько минут в tmux-панели агента может быть НЕ claude, прежде чем сторож
# считает агента выпавшим в оболочку и поднимает его сам. Улика 11.08.2026:
# владелец вышел из claude (Ctrl+C) — юнит остался active, метки свежие, харнес
# выглядел живым, а работать было некому; замечалось это только когда владельцу
# требовалась доставка (непустой inbox или очередь). 15 минут: меньше — сторож
# будет мешать владельцу, который сам сидит в панели и что-то смотрит.
AGENT_DEAD_MIN=15
# Пока за подключённым клиентом кто-то РАБОТАЕТ, сторож в панель не лезет:
# команда испортила бы чужой ввод. Про агента при этом говорит в канал.
AGENT_DEAD_RESPECT_ATTACHED=1
# Сколько минут простоя панели снимают уважение к подключённому клиенту.
# Улика 11.08.2026: ssh-клиент владельца висел на сессии постоянно, и запрет
# «не лезь, там человек» держался вечно — вышедший агент не поднялся вовсе.
AGENT_ATTACHED_IDLE_MIN=10
# Повторный сигнал владельцу о выпавшем агенте — не чаще, минуты.
AGENT_DEAD_COOLDOWN_MIN=120
# Имя tmux-сессии, в которой живёт агент (01-SPEC §4).
TMUX_SESSION="agent"

# ── Брошенные задачи (task-closer) ──────────────────────────────────────────
# Задача в статусе wip без живого процесса агента старше этого — закрывается
# с причиной. 48 часов: даты в dev-map.yaml дневной точности, меньше суток
# порог не различит.
TASK_STALL_HOURS=48

# ── Гигиена машины (server-hygiene) ─────────────────────────────────────────
# Пороги ОТНОСИТЕЛЬНЫЕ (проценты и доли), поэтому от размера машины не зависят
# и менять их под тариф не нужно. Прежняя подпись «дефолты под 2 CPU / 4 ГБ /
# 60 ГБ» удалена как врущая: на этой машине 4 CPU, 3546 МБ, 48 ГБ (11.08.2026).
# Абсолютные требования живут не здесь, а в МАНИФЕСТ.conf наборов возможностей.
# Сверка чисел с фактическим тарифом — пункт чек-листа приёмки (00-ВВОДНЫЕ §5).
DISK_MAX_PCT=85
SWAP_MAX_PCT=85
# 20, не 60: серверу не нужен настольный аппетит к свопу (улика 08.08 в
# server_hygiene_check.py — своп 91% при живой памяти).
SWAPPINESS_MAX=20
# Границы потолков памяти сервисов: пик недели выше 80% потолка — тесно,
# ниже 20% — потолок ни от чего не защищает.
MEM_PEAK_TIGHT_RATIO="0.8"
MEM_PEAK_LOOSE_RATIO="0.2"
# Prometheus для пиков памяти; пустой — проверка границ молчит (продукта нет).
PROMETHEUS_URL=""

# ── Уборка диска (disk-cleanup) ─────────────────────────────────────────────
KEEP_ROLLBACK=2
LOG_TRUNCATE_MB=20
# 24 часа, не неделя: улика от 05.08 в шапке disk-cleanup.sh.
BUILD_CACHE_KEEP_H=24
# Осиротевший помощник старше суток при родителе-systemd — снимается.
ORPHAN_MIN_AGE_SEC=86400
# Шаблон имён вспомогательных процессов ВАШЕГО инструментария; дефолт —
# помощники плагина памяти claude-mem (улика 08.08: 722 МБ свопа, 34 дня).
ORPHAN_PATTERN="chroma-mcp|claude-mem/[^ ]*/scripts/(mcp-server|worker)"
# Отходы службы истории разговоров. Каталоги ПУСТЫЕ, пока служба не поставлена
# (08-таблица расширений: память — после приёмки базового харнеса); шаг уборки
# при пустом значении честно пишет «КАТАЛОГ НЕ ЗАДАН».
MEM_LOG_DIR=""
MEM_SESSION_DIR=""
MEM_LOGS_KEEP_D=14
MEM_SESSIONS_KEEP_D=7

# ── Стек продукта (deploy.sh) — ДАННЫЕ, появляются с первой задачей продукта ─
# Все ключи пустые = продукт не задан: deploy.sh честно говорит «выкатывать
# нечего» и выходит нулём. Заполнять ВМЕСТЕ: сборка без health — не выкат.
# Примеры для docker compose:
#   STACK_BUILD_CMD="docker compose up -d --build backend worker"
#   STACK_BUILD_NOCACHE_CMD="docker compose build --no-cache && docker compose up -d"
#   STACK_UP_CMD="docker compose up -d --no-build"       # подъём при откате
#   STACK_MIGRATE_CMD="docker compose exec -T backend alembic upgrade head"
#   STACK_HEALTH_URL="http://127.0.0.1:8010/api/v1/health"
#   STACK_IMAGES="myproject-backend myproject-worker"     # снимок :previous
#   STACK_PROXY_RELOAD_CMD="sudo nginx -t && sudo systemctl reload nginx"
STACK_BUILD_CMD=""
STACK_BUILD_NOCACHE_CMD=""
STACK_UP_CMD=""
STACK_MIGRATE_CMD=""
STACK_HEALTH_URL=""
STACK_IMAGES=""
STACK_PROXY_RELOAD_CMD=""
# Манифесты зависимостей: их смена с прошлого выката = сборка --no-cache (§9).
STACK_MANIFESTS="requirements.txt package.json package-lock.json Dockerfile docker-compose.yml"

# ── Гейты коммита (pre-commit-hook) ─────────────────────────────────────────
# Линтер кода продукта; пусто = язык не задан, хук говорит об этом в лог,
# не молча. Пример: PRODUCT_LINT_CMD="ruff check backend/"
# Каталог кода продукта относительно корня проекта. Пусто = продукта нет либо
# он лежит в корне. Нужен, чтобы линтер продукта не гонялся на правках харнеса:
# владелец 11.09.2026 — «разделим проект харнеса и продукт, чтобы продукт не мешал».
# Над каким направлением карты разработки работаем сейчас. Пусто = над всеми.
# Направления — это `lines` в dev-map.yaml: у продукта своё, у харнеса своё.
ACTIVE_LINE=""

# ── Ежемесячная ревизия проекта (harness/demons/revizia-proekta.sh) ──────────
# Выключатель и модель — ручки панели (harness/config/переключатели.yaml).
# Кнопка «сейчас» — файл $LOG_DIR/revizia/запуск, его подхватывает session-warden.
REVIZIA_ENABLED="1"
REVIZIA_MODEL="opus"

# Ручки панели, которых на НОВОЙ машине не было: панель рисовала их из реестра,
# а в конфиге ключа нет — владелец видел ручку, которой не существует (ворота
# внутри свежей установки, 13.09.2026).
# Как обновляться: manual — обновление только по слову владельца, auto — само.
UPDATE_MODE="manual"
# Язык ответов владельцу: auto (по замеру его речи) | simple | normal | technical.
LANG_LEVEL=auto

PRODUCT_DIR=""

PRODUCT_LINT_CMD=""

# ── Резервные копии (backup) ────────────────────────────────────────────────
BACKUP_DIR="/var/backups/harness"
BACKUP_KEEP_DAYS=14
# Пер-сервисные дампы баз. Разделитель записей — ПЕРЕВОД СТРОКИ (одна строка =
# один дамп «имя=команда»; решение Д-9): внутри команды дампа законны и «;», и
# «|» (pg_dump ... | gzip), поэтому никакой одиночный символ-разделитель не
# годится. Несколько баз — многострочное значение в кавычках:
# BACKUP_DBS="app=docker compose -f /opt/x/docker-compose.yml exec -T db pg_dump -U app app
# reports=docker compose -f /opt/x/docker-compose.yml exec -T db2 pg_dump -U r r | gzip"
# Пустой список — честная строка в лог «базы не заданы» (продукт ещё не начат).
BACKUP_DBS=""

# ── Самопочинка карты (devmap-selfheal) ─────────────────────────────────────
# Глубина сверки коммитов при отсутствии водораздела, дни.
DEVMAP_AUDIT_DAYS=14
# Потолок ожидания headless-агента починки (claude -p), секунды: зависший
# вызов без потолка держал бы cron-прогон вечно. 600 с хватает на десяток
# пропусков; по таймауту водораздел остаётся на месте — пропуски не теряются.
SELFHEAL_CLAUDE_TIMEOUT_SEC=600
# Потолок dev-map.yaml, символов (check-context-hygiene.py): карта — реестр
# живых задач, а не архив; раздутая едет в контекст дашборда и сессии.
# Лечение — архив закрытых направлений в docs/dev-map-archive.yaml.
# Потолок карты считает код от ЧИСЛА задач (check-context-hygiene.py):
# база + задачи × запас. Константу приходилось двигать руками при каждом
# росте реестра — это подгонка датчика под факт.
DEVMAP_BASE_CHARS=20000
DEVMAP_CHARS_PER_TASK=2500
# Потолок summary одной карточки: длиннее — подробности уезжают в
# docs/dev-map-подробности.yaml (scripts/propolka-karty.py). Замер 12.09.2026:
# 31 карточка сверх потолка держала 29 397 лишних знаков в файле, который
# едет в контекст каждой сессии.
DEVMAP_SUMMARY_MAX=1200

# ── Сбор сигналов эволюции (evo-collector) ──────────────────────────────────
# Журналы, которые собирает коллектор; пишут их гейты и хуки, не коллектор.
GATES_LOG_NAME="gates.jsonl"
SKILLS_LOG_NAME="skills.jsonl"
# Реестр установленных возможностей (крупных наборов): пишет vozmozhnost.sh,
# читают сводки и приёмка. Каждая строка — установка или снятие с суммой паспорта.
CAPABILITIES_LOG_NAME="возможности.jsonl"
# День недели для еженедельного счёта «спеки/планы vs коммиты» (1 = понедельник).
EVO_WEEKLY_DOW=1
# Потолок сводки evo/summary.jsonl, строк: старшие срезаются при прогоне (Д-8).
EVO_SUMMARY_MAX_LINES=2000

# ── Сторож меток (heartbeat-watch) ──────────────────────────────────────────
# Таблица «имя-демона:период-в-минутах», через пробел. Периоды = расписанию
# cron из 01-SPEC §9; сторож бьёт тревогу при возрасте метки > период ×2.
# memory-revision: месяц = 44640 мин (31 день — берём худший случай).
# session-warden.запуск, а НЕ session-warden: метка успеха законно отстаёт на
# всю ротацию (до 24 мин при пороге 20 = период×2), и утренняя сводка объявляла
# бы сторожа мёртвым посреди его работы. За «прогон доходит до конца» отвечает
# sentinel со своим порогом WARDEN_STUCK_MIN — два вопроса, два признака
# (ревизия и ревью 10.09.2026).
HEARTBEAT_PERIODS="sentinel:5 session-warden.запуск:10 task-closer:60 disk-cleanup:1440 server-hygiene:1440 backup:1440 devmap-selfheal:1440 evo-collector:60 heartbeat-watch:1440 memory-revision:44640 tokens-collector:60 pamyat-kommit:10 session-warden:10 obnovlenie-watch:1440 revizia-proekta:44640 rasshirenija-watch:1440 priyomka-watch:1440 stroitel-proverok:1440 ton-watch:1440 limit-watch:5 proba-vosstanovleniya:44640 check-srok-vhoda:30"

# ── Общие конвенции контуров (решения ревью 09.08.2026) ─────────────────────
# Долгоживущие сервисные локи (диспетчер и т.п.) — В ЭТОМ каталоге; ворота
# deploy_guard смотрят ТОЛЬКО операционные локи в $LOG_DIR/locks/ (Б-1).
SERVICE_LOCKS_SUBDIR="services"
# ── Вход агента: долгий токен ──────────────────────────────────────────────
# Подключается ЗДЕСЬ, потому что harness.conf source-ят все демоны: cron
# профиля оболочки не читает, и без этой строки ночные вызовы `claude -p`
# идут на входе из `/login` (улика 12.09.2026 — см. сам файл).
if [ -r /etc/harness/vhod.sh ]; then
    . /etc/harness/vhod.sh
fi

# Команда запуска агента в tmux — её использует rotate_full session-warden
# для перезапуска после ротации (Б-4). Вариант Б канала: без --channels.
AGENT_START_CMD="claude --dangerously-skip-permissions"
# Сколько ждать, пока команда запуска поднимет claude в панели, секунды (Б-4а).
AGENT_START_TIMEOUT_SEC=120
# Свежесть записи согласия владельца (confirmations.jsonl) для выката в semi:
# старше порога — согласие не считается (В-7).
# Кого спрашивать перед действием: своя ручка на каждое (спека панели §4).
# Владелец 11.09.2026: «вообще я хочу чтобы это автоматически происходило»
# — про отправку в репозиторий. Снос базы ручки не имеет вовсе (И-1).
# 0 — делать самому, 1 — спросить владельца в канале.
# Внешний адрес веб-панели (пусто — бот скажет, что панель не выведена наружу).
PANEL_URL=""
PUSH_NEEDS_OWNER=0
DEPLOY_NEEDS_OWNER=1
PUBLISH_NEEDS_OWNER=1
CONFIRM_MAX_AGE_MIN=60

# ── Ревизия памяти (memory-revision) ────────────────────────────────────────
# Каталог файловой памяти и её индекс (лежит ВНУТРИ каталога памяти —
# грузится в контекст @-include-ом из CLAUDE.md).
MEMORY_DIR_NAME="память"
MEMORY_INDEX_NAME="память/MEMORY.md"
# Каталог скилов относительно корня проекта.
SKILLS_DIR_NAME="harness/skills"

# ── Проба восстановления (проба-восстановления.sh) ──────────────────────────
# Где поднимать пробную базу из дампа. Своих умолчаний у скрипта нет: имя
# контейнера продукта, вшитое в механику харнеса, на чужом проекте увело бы
# пробу в несуществующий контейнер (разбор кода 11.09.2026).
PROBE_DB_CONTAINER=""
PROBE_DB_USER=""

# ── Имена файлов кода: латиницей ────────────────────────────────────────────
# Что на этой установке считается кодом (расширения через пробел). Имя файла
# кода становится именем модуля и целью импорта, а нелатинский путь git отдаёт
# экранированными байтами — проверки по путям слепнут. Текст ВНУТРИ файлов —
# на любом языке. Пусто = вшитый список (питон, скрипты, фронт, go, rust, java…).
CODE_NAME_EXTS=""

# ── Пути, по которым гейты пайплайна судят о цене ошибки ────────────────────
# Данные установки, не код: шаблон «*/migrations/*» из первой редакции спеки
# давал НОЛЬ совпадений на живом репозитории, а запасное «каталог продукта»
# вшивало продукт в харнес. Пустое значение = признак не применяется.
MIGRATIONS_GLOB=""
PROD_PATHS=""
GUARD_PATHS="scripts/hooks/ scripts/check-* harness/demons/ scripts/vorota.sh scripts/pre-commit-hook.sh scripts/deploy_guard.py"

# ── Что гейты НЕ обходят ────────────────────────────────────────────────────
# Каталоги продукта, куда гейтам ходить незачем: зависимости, сборки, кэши.
# Пути через пробел, каждый — как для `find -not -path`.
GATES_SKIP_PATHS="./.git/*"

# ── Лимит подписки (session-warden, ветка 6б) ───────────────────────────────
# Задача владельца 11.09.2026: «после их обновления работа сама не запустится».
# Сколько минут немоты транскрипта считать остановкой работы. Признак лимита на
# экране без немоты ничего не значит: слово «limit» печатаю и я сам в отчётах.
LIMIT_STALL_MIN=20
# Как часто пробовать разбудить смену, пока лимит держится. Пинок при
# исчерпанном лимите не проходит и ничего не стоит; как только лимит
# обновится, ближайший пинок оживит работу — это и есть автозапуск.
LIMIT_RETRY_MIN=10

# ── Две версии харнеса: публичная и рабочая (scripts/публикация.sh) ─────────
# Задача владельца 11.09.2026: «мне нужно чтобы было две версии гита — ту
# которая проверена и я ее публично публикую, и та, которую я доделываю».
# Пусты, пока владелец не выбрал схему: имена веток — его решение, не код.
PUBLIC_BRANCH=""

# Публикуется СБОРКА, а не рабочая ветка пакета: дерево собирается кодом по
# данным (harness/config/публичная-сборка.yaml) и коммитится своим автором —
# личность машины в публичной истории не нужна. Каталог сборки НЕ в логах:
# их чистят по mtime и сканируют с правкой, а там лежит git.
PUBLIC_BUILD_DIR="/var/lib/harness/публичная-сборка"
PUBLIC_COMMIT_NAME="jig-harness"
PUBLIC_COMMIT_EMAIL="jig-harness@users.noreply.github.com"

# Через сколько минут немоты СКАЗАТЬ владельцу о лимите, если он доказан
# машинным признаком (отказ 429 в журнале сессии свежее последнего ответа).
# Отдельно от LIMIT_STALL_MIN: тот порог для догадки по тексту экрана, а
# доказанный отказ ждать незачем. Улика 12.09.2026: владелец увидел лимит
# сам, сообщение от харнеса пришло через 20 минут.
LIMIT_SAY_MIN=3

# Сколько файлов харнеса пока живут без паспорта в реестре устройства.
# ХРАПОВИК: гейт check-ustrojstvo.py краснеет на ПРЕВЫШЕНИИ, поэтому новый файл
# без паспорта ловится сразу, а существующая дыра не держит ворота красными.
# Ставится по живому замеру 13.09.2026 и опускается до нуля тем коммитом,
# которым заводятся паспорта (Task 5 плана hr.reestr-v2). Поднимать нельзя.
USTROJSTVO_BEZ_PASPORTA_POTOLOK="0"

# Сколько имён механизмов называют ПРОВЕРКУ («Проверка X», «Проба X») вместо
# дела, которое механизм делает. У такого имени обязан быть хозяин в поле
# «доказательство» — иначе непонятно, что именно проверяется. ХРАПОВИК: гейт
# краснеет на превышении, значит новое такое имя ловится сразу. Замер 13.09.2026.
USTROJSTVO_IMEN_PROVEROK_POTOLOK="24"

# Где ещё лежат секреты, кроме SECRETS_DIR и путей из паспорта. Читает гейт
# check-sekret-v-logah.py. Учётка подписки живёт в доме АГЕНТА, и ни паспорт,
# ни каталог секретов о ней не знают — а утекает она тем же путём, что токен
# бота (трассировка оболочки в лог, находка 13.09.2026). «~» разворачивается
# в дом AGENT_USER из паспорта, а не того, кто запустил гейт.
SECRET_SCAN_PATHS="~/.claude/.credentials.json"   # не-секрет: это ПУТЬ, где искать, а не значение
