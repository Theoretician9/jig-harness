PUBLISH_NEEDS_OWNER=1
CONFIRM_MAX_AGE_MIN=60
# Потолок «момента попытки» для замка 2 публикации, минуты: ворота идут до 40 мин,
# поэтому «да» судится на начало попытки, но не старше этого потолка.
CONSENT_FRESHNESS_ANCHOR_MAX_MIN=60
# Срок кнопки согласия «Да / Нет» в Telegram, минуты: нажатие старше срока
