GATES_SKIP_PATHS="./.git/*"

# ── Лимит подписки (session-warden, ветка 6б) ───────────────────────────────
# Задача владельца 11.09.2026: «после их обновления работа сама не запустится».
# Сколько минут немоты транскрипта считать остановкой работы. Признак лимита на
