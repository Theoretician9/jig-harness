# обновится <…> Ну пусть там с задержкой в 10 секунд, на всякий случай, вдруг
# там рассинхрон будет небольшой». Ежеминутный limit-watch.sh досыпает до этой
# секунды, поэтому порог обязан быть ДАННЫМИ: у подписки на другой машине
# рассинхрон свой.
LIMIT_KICK_DELAY_SEC=10

# Часовой пояс ВЛАДЕЛЬЦА для часов в сообщениях (имя из базы поясов, например
# Asia/Qostanay). Пусто — пояс машины. Заведён 17.10.2026: час обновления
# лимита печатается владельцу, и на свежем сервере пояс обычно UTC — он прочёл
# бы час, которого у него нет (находка ревью).
OWNER_TZ=""

# Образ базы для пробы восстановления, когда контейнера продукта нет (он выключен
# или это чужая установка). Замер 28.09.2026: продукт погашен с 21.09, проба
# отказывала на первом шаге — то есть И-1 не был доказан ни разу с 10.09.
PROBE_DB_IMAGE="postgis/postgis:16-3.4"
# Образ под версию pg_dump из шапки дампа: «{major}» заменяется старшим числом
# версии. Замер 05.10–26.10.2026: дамп pg_dump 17 в образе 16 дал ошибки
# «transaction_timeout» и «\restrict» — проба четыре раза подряд ложно писала
# «НЕ восстановился». Шапки нет или ключ пуст — берётся PROBE_DB_IMAGE.
# Тег -3.6, а не -3.5: postgis 17-3.5 несёт сервер 17.5 и не знает команды
# \restrict из дампа pg_dump 17.11, а 17-3.6 несёт 17.11 (замер 02.11.2026);
# теги 15–18 для -3.6 существуют (docker manifest inspect).
PROBE_DB_IMAGE_TEMPLATE="postgis/postgis:{major}-3.6"

# Порты, которыми мы намеренно смотрим наружу: их называет прибор внешней
# поверхности (scripts/check-external-surface.py), но находкой не считает.
# Формат: «порт=зачем», через запятую. Пусто — значит наружу ничего нашего.
# Улика 28.09.2026: панель слушает 127.0.0.1:8787, а nginx отдаёт её в мир
# строкой proxy_pass — прежняя мера «кто слушает 0.0.0.0» этого не видела.
EXTERNAL_SURFACE_DECLARED="8787=панель харнеса через nginx harness-panel"
# Уборка порта прежней смены: слушатель наружу под нашим uid, вне проекта, не
# объявленный, трогается только если он старше порога (минуты) И осиротел
# (родитель init/systemd или мёртв). Моложе — идущая проба, в беды не идёт.
SHIFT_LEFTOVER_MIN_AGE_MIN="120"
# Метки командной строки через запятую: процесс с такой подстрокой не убираем
# никогда (идущие пробы, чужие долгие прогоны). Намеренный долгий стенд объявлять
# в EXTERNAL_SURFACE_DECLARED, а не метками.
SHIFT_LEFTOVER_KEEP="/дерево/,/tmp/proba-"

# Какие порты КОНТЕЙНЕРОВ docker законно видны из интернета. Формат: элементы
# через запятую, элемент — «порт» (tcp), «порт/tcp» или «порт/udp», например
# "8080,15637/udp". Другой протокол — отказ до постановки. Пусто — наружу не отдан ни один (наши контейнеры слушают
# 127.0.0.1, в мир их отдаёт nginx на хосте, а это другой путь пакета).
#
# Улика 03.10.2026: postgres (5433) и redis (6380) соседнего проекта были
# опубликованы на 0.0.0.0, redis отвечал PONG без пароля. ufw этого не видит:
# docker кладёт DNAT, и пакет идёт через FORWARD мимо INPUT. Правило ставит
# scripts/firewall-docker-ports.sh в цепочку DOCKER-USER, держит после
# перезагрузки юнит harness-firewall.service.
DOCKER_PORTS_ALLOWED=""

# Какие порты машины ЗАКОННО открыты из интернета. Всё остальное, что слушает
# не на 127.0.0.1, прибор scripts/check-ports-from-outside.py объявит находкой.
# Замер идёт с ЧУЖИХ адресов (узлы check-host.net): с этой же машины «открыт
# снаружи» проверить нельзя — пакет не выходит в интернет (улика 03.10.2026).
PORTS_EXPECTED_OPEN="22,80,443"

# Сколько процентов памяти машины обязано оставаться свободным и какая
# нагрузка на ядро считается бедой (пятиминутное среднее). Свопа на машине
# может не быть вовсе — тогда проверка свопа молчит, а память кончается тихо.
MEM_MIN_FREE_PCT="10"
LOAD_MAX_PER_CPU="2.0"

# Окно сообщений владельцу о смене режима скорости (минуты): смены внутри окна
# сливаются в одно сообщение с итоговым режимом. Читает harness/demons/speed_mode.py.
SPEED_MSG_WINDOW_MIN="30"

# Порог занятости CPU за интервал замера судьи скорости (доля процессорного времени
# между двумя чтениями /proc/stat; loadavg — очередь коротких процессов, не загрузка).
# Занято выше MAX — мощность режет; ниже QUIET — отпускает; ожидание диска выше IOWAIT_MAX
# режет при любой занятости. Читает harness/demons/speed_mode.py.
CPU_BUSY_MAX_PCT="90"
CPU_BUSY_QUIET_PCT="75"
CPU_IOWAIT_MAX_PCT="20"

# Имена сайтов, чей сертификат судится живым рукопожатием (не файлом на диске:
