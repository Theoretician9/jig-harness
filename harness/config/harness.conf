# без паспорта ловится сразу, а существующая дыра не держит ворота красными.
# Ставится по живому замеру 13.09.2026 и опускается до нуля тем коммитом,
# которым заводятся паспорта (Task 5 плана hr.reestr-v2). Поднимать нельзя.
USTROJSTVO_BEZ_PASPORTA_POTOLOK="0"

# Сколько имён механизмов называют ПРОВЕРКУ («Проверка X», «Проба X») вместо
# дела, которое механизм делает. У такого имени обязан быть хозяин в поле
# «доказательство» — иначе непонятно, что именно проверяется. ХРАПОВИК: гейт
# краснеет на превышении, значит новое такое имя ловится сразу. Замер 13.09.2026.
USTROJSTVO_IMEN_PROVEROK_POTOLOK="24"

# Где ещё лежат секреты, кроме SECRETS_DIR и путей из паспорта. Читает гейт
# check-secret-in-logs.py. Учётка подписки живёт в доме АГЕНТА, и ни паспорт,
# ни каталог секретов о ней не знают — а утекает она тем же путём, что токен
# бота (трассировка оболочки в лог, находка 13.09.2026). «~» разворачивается
# в дом AGENT_USER из паспорта, а не того, кто запустил гейт.
SECRET_SCAN_PATHS="~/.claude/.credentials.json"   # не-секрет: это ПУТЬ, где искать, а не значение

# Уровень автоматизации крупной работы: partial — спека уходит владельцу файлом
# и работа ждёт его «да»; full — работа по спеке идёт без одобрения. Ручка
# панели, читает scripts/spec_approval.py. Владелец 23.09.2026: «это уровень
# автоматизации - либо полный, либо частичный где скидывается сначала спека, и
# пока полтзователь не одобрит, работа не начинается».
AUTOMATION_LEVEL="partial"

# Сколько задач вправе стоять в очереди ЛИЧНОЙ проверки владельца. Его слово
# 21.09.2026: «потолок решений в сутки назначен владельцем»; 27.09.2026: «то что
# надо проверять мне должно быть довольно мало». Выше потолка приёмка называет
# это РАБОТОЙ строителя проверок, а не вопросом владельцу: очередь сокращает
# механизм, а не его внимание.
OWNER_QUEUE_MAX=5

# Сколько минут сторож вправе МОЛЧАТЬ, пока лимит подписки держится, а час
# сброса CLI не назвал. Предохранитель: без срока судья лимита не знает, когда
# будить, и вечная тишина оставила бы работу стоять до утра при снятом лимите.
# Когда срок назван, сторож молчит до подъёма (сброс + LIMIT_KICK_DELAY_SEC) —
# владелец 27.09.2026: «если известно когда лимит обновится, можно пнуть в то
# время».
LIMIT_KICK_MAX_MIN=60

# Задержка подъёма смены после секунды обновления лимита. Число назвал САМ
