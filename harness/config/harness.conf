# /etc/harness/harness.conf — пороги механики харнеса. ДАННЫЕ, НЕ КОД.
#
# Отдельно от install.conf намеренно: install.conf — паспорт установки
# (кто, где, каким каналом), он заполняется один раз; здесь — пороги,
# которые крутятся при эксплуатации. Менять порог = править этот файл,
# не скрипты.
#
# Файл читается и bash (source), и python (мини-парсер в
# server_hygiene_check.py) — поэтому формат строго KEY="value" или
# KEY=число, без подстановок $VAR, без массивов, без логики.
#
# При установке копируется: sudo cp harness/config/harness.conf /etc/harness/
# Проверка: bash -n /etc/harness/harness.conf && source /etc/harness/harness.conf && echo OK

# ── Пакет-источник ──────────────────────────────────────────────────────────
# Каталог СТАРТОВОГО ПАКЕТА на этой машине. Его читает гейт
# scripts/сверить-с-пакетом.py: раскладка копирует ПАКЕТ → ПРОЕКТ, поэтому
# правка, сделанная только в $PROJECT_DIR, умирает при следующей раскладке.
# Пусто — гейт ищет /home/$AGENT_USER/starter/STARTER-PACKAGE; не нашёл —
# объявляет сверку невозможной с адресом и НЕ валит коммит (сверка, которую
# нельзя сделать, не повод остановить работу, но и молчать о ней нельзя).
STARTER_DIR=""

# ── Слой установки библиотеки процессов ─────────────────────────────────────
# Записи process-library.json, принадлежащие ЭТОЙ машине (чужие контейнеры):
# в пакет им нельзя. Тот же JSON-вид; файла нет — реестр как в пакете.
PROCESS_LIBRARY_LOCAL="/etc/harness/agent/process-library.local.json"

# ── Ротация сессий (session-warden) ─────────────────────────────────────────
# Порог заполнения окна, %: дальше качество падает и растёт риск авто-компакта.
CTX_ROTATE_PCT=75
# Сколько байт с конца транскрипта читать в поисках замера usage. Берётся от
# самой длинной строки живого файла: снимок экрана в base64 весит до 1,29 МБ,
# и меньший хвост терял замер целиком — сторож ротировал здоровую сессию.
CTX_TAIL_BYTES=2000000
# Эвристика «байты JSONL ≈ окно»: транскрипт сессии Claude Code растёт вместе
# с контекстом (история + выводы инструментов).
# КАК КАЛИБРОВАТЬ (замер, а не гадание): взять живой транскрипт
# ~/.claude/projects/<проект>/*.jsonl, поделить его размер на контекст
# ПОСЛЕДНЕГО сообщения с usage (input_tokens + cache_read + cache_creation) —
# получатся байты на токен; умножить на CLAUDE_CODE_AUTO_COMPACT_WINDOW.
# Замер 11.08.2026 на двух живых сессиях: 6,50 и 5,67 байт/токен. Берём нижнюю
# оценку 5,5 — она даёт МЕНЬШИЙ порог, то есть ротацию раньше, а не позже:
# лишняя ротация дешевле авто-компакта. 400 000 × 5,5 ≈ 2,2 МБ; при
# CTX_ROTATE_PCT=75 ротация объявляется на ~300 000 токенов.
# Прежнее значение 40 000 000 было завышено в 18 раз — порог не срабатывал бы
# никогда, и сессия доходила бы до компакта, ради избежания которого он стоит.
CTX_WINDOW_BYTES=2200000
# Окно автокомпакта в ТОКЕНАХ — делитель точного замера. Сторож берёт размер
# контекста из usage последнего ответа в транскрипте; байтовая эвристика выше
# осталась запасной на случай, если usage не нашёлся.
CTX_WINDOW_TOKENS=800000   # не-секрет: потолок окна в токенах, а не ключ
# Сколько авто-компактов сессия может пережить до принудительной ротации.
# Больше одного — контекст уже дважды пережат, доверять ему нельзя.
MAX_COMPACTS=1
# Максимальный возраст свежайшего docs/handover/* при живой работе, минуты.
HANDOVER_MAX_AGE_MIN=240
# Stop-хук «ответь владельцу в канал» (channel_reply_guard.py). Жёлтый режим —
# YELLOW_DAYS дней от YELLOW_FROM: напоминание один раз на сообщение. После него
# STRICT=1 блокирует каждый Stop до ответа, но лишь для сообщений не старше
# MAX_AGE_MIN минут; STRICT=0 оставляет напоминание один раз.
CHANNEL_REPLY_YELLOW_FROM="2026-10-30"
CHANNEL_REPLY_YELLOW_DAYS=3
CHANNEL_REPLY_STRICT=1
CHANNEL_REPLY_MAX_AGE_MIN=120
# Спрашивать ли владельца перед ротацией сессии. 0 — не спрашивать (норма):
# ротация это внутренняя механика харнеса, а не решение владельца. Развилки
# полуавтомата — выкат в прод и необратимые операции — этим ключом НЕ
# затрагиваются. Улика 11.08.2026: в semi владельцу пришло «скомандуйте агенту
# завершение», хотя он проектировал ротацию как происходящую под капотом.
ROTATE_NEEDS_OWNER=0

# Когда работу делает помощник (субагент), а когда я сам: минимум | средний |
# максимум. Владелец 12.09.2026: «на максимальном мне бы не надо было писать
# тебе „запусти агента на эту задачу“ а сам бы просто запустил и все, а на
# минимальном только сам, кроме однозначно когда запускаются сабагенты,
# например на ревью». Что разрешает каждый уровень — harness/config/agents.yaml,
# спрашивает scripts/agent-level.py. Незнакомое значение запрещает всё.
AGENT_LEVEL="минимум"
# Сколько часов слово владельца в канале («запускай сабами») держит уровень
# «максимум»; в память/ORDERS.md слово бессрочно. Читает scripts/agent-level.py.
AGENT_LEVEL_OWNER_WORD_FRESH_H=48

# Пауза перед пинком «подхвати работу» свежеподнятой сессии, секунды.
# TUI после запуска ещё рисуется и первые нажатия теряет; поднять процесс —
# не то же, что вернуть работу (улика владельца 11.08.2026).
AGENT_WAKE_DELAY=5
# Сколько ждать, пока агент отработает регламент ротации, секунды.
ROTATE_FINISH_TIMEOUT_SEC=900
# Панель молчит столько секунд — регламент отработан, сторож сам вводит «/exit».
# Агент выйти не может: «/exit» в его ответе это текст, а не команда TUI
# (улика 12.08.2026 — четыре ротации подряд встали именно здесь).
ROTATE_IDLE_SEC=120
# Сколько ждать закрытия сессии после того, как «/exit» введён в панель.
ROTATE_EXIT_WAIT_SEC=180
# Сколько сторож досматривает смену ПОСЛЕ тревоги владельцу, секунды: «/exit»
# бывает медленнее срока, и без досмотра преемника не поднимет никто до
# следующего тика.
ROTATE_ALARM_WATCH_SEC=300
# Сколько дозор поздних выходов ждёт закрытия панели после поданного «/exit»,
# секунды: выход, случившийся позже тревоги, закрывает панель вместе с агентом.
LATE_EXIT_WATCH_SEC=1800
# Ротация без написанной передачи невозможна (владелец 18.10.2026 — беда с
# другого его сервера: лимит не дал модели написать передачу, а сторож прочёл
# её молчание как «регламент отработан» и сменил сессию). Два ключа ниже —
# данные этой двери.
#
# Миг начала сессии сторож берёт временем РОЖДЕНИЯ файла транскрипта. Если
# файловая система его не хранит (stat -c %W даёт 0), берётся это окно, минуты.
ROTATE_FORCE_HANDOVER_WINDOW_MIN=30
# Предохранитель от вечного отказа: после стольких отказов подряд дверь судит
# по передаче ЭТОЙ смены, а не по написанному после поручения, и говорит
# вслух, что потерян хвост работы. Автописателя передачи в харнесе нет.
ROTATE_REFUSED_FALLBACK=3
# Весть владельцу об ОТКАЗЕ ротации — не чаще, чем раз в столько минут: сторож
# ходит каждые 10 минут, и без кулдауна отказ стал бы залпом.
ROTATE_REFUSED_TELL_GAP_MIN=180
# Повторная КОМАНДА ротации той же сессии (режим full) — не раньше, чем через
# столько минут: команда уже подана в панель и исполняется, дублировать нечего.
ROTATE_COOLDOWN_MIN=120
# Ранний повтор команды ротации — только если журнал сам записал провал
# (clear_failed / clear_timeout / rotate_timeout) и с команды прошло не меньше
# стольких минут: ждать два часа команду, которая не применилась, незачем, а
# ждать её меньше срока регламента значит подать вторую поверх первой.
# Дефолт 30 стоит в коде ниже загрузчика конфига.
ROTATE_APPLY_WAIT_MIN=30
# Потолок ранних повторов: попытка + это число повторов на скользящее окно
# ROTATE_COOLDOWN_MIN, то есть до 3 подач в любые 120 минут (окно не сбрасывается
# на границе, а едет за временем). Без потолка смена, которой «/clear» не
# удаётся, получала бы поручение ротации каждые полчаса, а каждая подача на
# 15 минут закрывает пинки о сообщениях владельца.
ROTATE_EARLY_RETRY_MAX=2
# Повторный АНОНС ротации (режим semi) — своё окно, и оно короче. Анонс не
# исполняется сам: он ждёт ответа владельца, и пока ждёт, окно растёт. Улика
# 11.08.2026: анонс в 22:20 задавил ротацию до 00:20, за это время окно дошло
# до 114% и сессия ушла в автосжатие. Цена повтора — одно лишнее сообщение
# владельцу; цена молчания — потерянная сессия.
ROTATE_ANNOUNCE_GAP_MIN=30
# Тишина: в очереди есть РАБОТА, а транскрипт не растёт дольше этого — пинок,
# минуты. Задача с полем `blocked` в карте работой не считается: 12.08.2026
# в очереди стояла одна `pr.first`, чью формулировку даёт владелец, и пинки
# будили агента впустую до утра — он отвечал «блокер тот же» и жёг контекст.
SILENCE_MAX_MIN=45
# Пинок «подхвати работу» зовут три руки (пусковой скрипт, sentinel, сторож) —
# в пределах этого окна отдаётся один, секунды.
KICK_COOLDOWN_SEC=120
# Вся очередь ждёт владельца: агента будить нечем, но и молчать нельзя —
# напоминание владельцу не чаще раза в это окно, минуты (по умолчанию 12 ч).
BLOCKED_TELL_GAP_MIN=720
# Сколько минут в tmux-панели агента может быть НЕ claude, прежде чем сторож
# считает агента выпавшим в оболочку и поднимает его сам. Улика 11.08.2026:
# владелец вышел из claude (Ctrl+C) — юнит остался active, метки свежие, харнес
# выглядел живым, а работать было некому; замечалось это только когда владельцу
# требовалась доставка (непустой inbox или очередь). 15 минут: меньше — сторож
# будет мешать владельцу, который сам сидит в панели и что-то смотрит.
AGENT_DEAD_MIN=15
# Тревога сторожа «работают два агента»: 0 — молчит (ложные 30.10.2026), 1 — шлёт.
TWO_AGENTS_ALARM=1
# Пока за подключённым клиентом кто-то РАБОТАЕТ, сторож в панель не лезет:
# команда испортила бы чужой ввод. Про агента при этом говорит в канал.
AGENT_DEAD_RESPECT_ATTACHED=1
# Сколько минут простоя панели снимают уважение к подключённому клиенту.
# Улика 11.08.2026: ssh-клиент владельца висел на сессии постоянно, и запрет
# «не лезь, там человек» держался вечно — вышедший агент не поднялся вовсе.
AGENT_ATTACHED_IDLE_MIN=10
# Повторный сигнал владельцу о выпавшем агенте — не чаще, минуты.
AGENT_DEAD_COOLDOWN_MIN=120
# Имя tmux-сессии, в которой живёт агент (01-SPEC §4).
TMUX_SESSION="agent"

# ── Брошенные задачи (task-closer) ──────────────────────────────────────────
# Задача в статусе wip без живого процесса агента старше этого — закрывается
# с причиной. 48 часов: даты в dev-map.yaml дневной точности, меньше суток
# порог не различит.
TASK_STALL_HOURS=48

# Свежий след задачи в wip (коммит с трейлером Dev-Map: <id> или правка её журнала)
# моложе этого — работа идёт, stop_reminder не требует «доведи до test».
DEVMAP_TRACE_FRESH_MIN=120

# ── Гигиена машины (server-hygiene) ─────────────────────────────────────────
# Пороги ОТНОСИТЕЛЬНЫЕ (проценты и доли), поэтому от размера машины не зависят
# и менять их под тариф не нужно. Прежняя подпись «дефолты под 2 CPU / 4 ГБ /
# 60 ГБ» удалена как врущая: на этой машине 4 CPU, 3546 МБ, 48 ГБ (11.08.2026).
# Абсолютные требования живут не здесь, а в МАНИФЕСТ.conf наборов возможностей.
# Сверка чисел с фактическим тарифом — пункт чек-листа приёмки (00-ВВОДНЫЕ §5).
DISK_MAX_PCT=85
# Повтор вести «диск занят», пока диск не спал ниже порога: часы. Раньше повтора весть
# уходит только при росте на 3 п.п. (scripts/disk-report.py).
DISK_ALERT_REPEAT_H=24
SWAP_MAX_PCT=85
# 20, не 60: серверу не нужен настольный аппетит к свопу (улика 08.08 в
# server_hygiene_check.py — своп 91% при живой памяти).
SWAPPINESS_MAX=20
# Границы потолков памяти сервисов: пик недели выше 80% потолка — тесно,
# ниже 20% — потолок ни от чего не защищает.
MEM_PEAK_TIGHT_RATIO="0.8"
MEM_PEAK_LOOSE_RATIO="0.2"
# Prometheus для пиков памяти; пустой — проверка границ молчит (продукта нет).
PROMETHEUS_URL=""

# ── Суточная сводка ресурсов (harness/demons/resource-report.sh) ────────────
# Раз в сутки владельцу уходит одно сообщение: итог за сутки и срез сейчас —
# кто ест процессор, память, диск. Cron зовёт демона часто, а решает он сам по этому времени (ЧЧ:ММ, местное).
RESOURCE_REPORT_TIME="09:00"
# Сколько строк в топе каждой строки сообщения.
RESOURCE_REPORT_TOP=3
# Порог показа: ниже него потребитель в сводку не попадает (процессор — %,
# память и каталоги — МБ). Пусто в топе — «ничего заметного».
RESOURCE_REPORT_MIN_CPU_PCT=5
RESOURCE_REPORT_MIN_MEM_MB=200
RESOURCE_REPORT_MIN_DISK_MB=1000
# Откуда считать крупные каталоги (du, на глубину 2, без чужих файловых систем).
RESOURCE_REPORT_DU_ROOTS="/srv /var /home"
# Итог за сутки: выборки пишутся каждый проход (раз в 5 минут) и хранятся
# KEEP_HOURS часов; итог считается за WINDOW_HOURS. Файл выборок пусто = по
# умолчанию $LOG_DIR/resource-samples.jsonl.
RESOURCE_REPORT_KEEP_HOURS=48
RESOURCE_REPORT_WINDOW_HOURS=24
RESOURCE_REPORT_SAMPLES=""
# Ротация process-load.jsonl и process-runs.jsonl в .1, хранится не меньше 8 суток.
PROCESS_LOAD_MAX_MB="32"
# Порог тревоги диспетчера процессов: доля «не разобрано» за час, % ёмкости сервера.
# Выше порога при покрытии часа не меньше 0,9 ч заводится карточка process-dispatcher:не-разобрано.
PROCESS_UNPARSED_ALERT_PCT="15"
# Плановый запуск крон-задания, не состоявшийся дольше этих минут назад, — состояние «пропущен»:
# задание может стартовать с опозданием (замок, нагрузка).
MISSED_SLACK_MIN="15"

# ── Уборка диска (disk-cleanup) ─────────────────────────────────────────────
KEEP_ROLLBACK=2
LOG_TRUNCATE_MB=20
# Осиротевший помощник старше суток при родителе-systemd — снимается.
ORPHAN_MIN_AGE_SEC=86400
# Порог ПОЧАСОВОЙ уборки по давлению (disk-cleanup.sh --по-давлению). Ниже него
# почасовой прогон только пишет строку и уходит: ночной уборки достаточно.
# 80, а не DISK_MAX_PCT=85: 85 — порог ТРЕВОГИ владельцу, и убирать надо ДО
# него, иначе уборка и тревога срабатывают на одном числе.
# Улика 04.10.2026: в 03:00 диск 69% и висячих образов 0, к 10:10 сборки стенда
# поставки дали 33 висячих образа (17,5 ГБ) и диск 92% — следующая уборка была
# через 17 часов, и забитый диск нашёл ВЛАДЕЛЕЦ, а не харнес.
DISK_TRIGGER_PCT=80
# Шаг 10 уборки /tmp (scripts/tmp-sweep.py) УДАЛЯЕТ файлы. 0 — выключен, 1 — включён;
# включает только владелец после ревью кода уборки.
TMP_SWEEP_ENABLED=0
# Срок стендов по префиксу харнеса (tmp-sweep.yaml «стенды_харнеса»: /tmp/proba-*,
# /tmp/live-check-probe-*, /tmp/claude-<uid>/evo-*), часов; тот же в ночь и по давлению.
# 24: больше самого долгого законного прогона (ночное --всё ограничено 20 ч), так что
# идущий стенд не берётся по возрасту, даже если держатель не виден; а суточный хвост
# этих стендов — десятки МБ (замер 13.11: 64 МБ), сутки его не доводят диск до тревоги.
TMP_SWEEP_STALE_H=24
# Шаг 10б уборки docker (scripts/docker-sweep.py) УДАЛЯЕТ только свои образы и контейнеры (кэша сборки не трогает).
# 0 — выключен (сухой ход только по --dry-run), 1 — включён. Тома — отдельный выключатель:
# безымянный том без ссылок уходит после выдержки 24 ч и 14 суток возраста. Чужие проекты
# машины перечисляются регулярным выражением в живом harness.conf, не в пакете.
DOCKER_SWEEP_ENABLED=0
DOCKER_SWEEP_VOLUMES=0
DOCKER_SWEEP_PROTECT=""
# Свои объекты: регулярка по compose-проекту или имени контейнера; к образам применяется
# к репозиторию образа, поэтому пишется с якорем ^ (без него совпадёт и чужое имя).
# Пусто — боевой ход отказывает.
DOCKER_SWEEP_OWN=""
DOCKER_IMAGE_KEEP_H=168
DOCKER_IMAGE_PRESSURE_H=48
DOCKER_STOPPED_KEEP_H=24
DOCKER_VOLUME_KEEP_DAYS=14
# Шаблон имён вспомогательных процессов ВАШЕГО инструментария; дефолт —
# помощники плагина памяти claude-mem (улика 08.08: 722 МБ свопа, 34 дня).
ORPHAN_PATTERN="chroma-mcp|claude-mem/[^ ]*/scripts/(mcp-server|worker)"
# Отходы службы истории разговоров. Каталоги ПУСТЫЕ, пока служба не поставлена
# (08-таблица расширений: память — после приёмки базового харнеса); шаг уборки
# при пустом значении честно пишет «КАТАЛОГ НЕ ЗАДАН».
MEM_LOG_DIR=""
MEM_SESSION_DIR=""
MEM_LOGS_KEEP_D=14
MEM_SESSIONS_KEEP_D=7

# ── Стек продукта (deploy.sh) — ДАННЫЕ, появляются с первой задачей продукта ─
# Все ключи пустые = продукт не задан: deploy.sh честно говорит «выкатывать
# нечего» и выходит нулём. Заполнять ВМЕСТЕ: сборка без health — не выкат.
# Примеры для docker compose:
#   STACK_BUILD_CMD="docker compose build backend worker"  # только образы: службы поднимет RELEASE после миграций
#   STACK_BUILD_NOCACHE_CMD="docker compose build --no-cache && docker compose up -d"
#   STACK_UP_CMD="docker compose up -d --no-build"       # подъём при откате
#   STACK_HEALTH_CMD="curl -fs http://127.0.0.1:8010/ready"  # код 0 = живо; старше STACK_HEALTH_URL
#   STACK_DB_RESTORE_HINT="pg_restore -U app -d app --clean <дамп>"  # подсказка при откате; пусто = pg_restore по дампу
#   STACK_MIGRATE_CMD="docker compose exec -T backend alembic upgrade head"
#   STACK_RELEASE_CMD="docker compose up -d --force-recreate backend worker"  # идёт ПОСЛЕ миграций: пересоздание служб; пусто = службы поднимает сборка
#   STACK_HEALTH_URL="http://127.0.0.1:8010/api/v1/health"
#   STACK_IMAGES="myproject-backend myproject-worker"     # снимок :previous
#   STACK_PROXY_RELOAD_CMD="sudo nginx -t && sudo systemctl reload nginx"
STACK_BUILD_CMD=""
STACK_BUILD_NOCACHE_CMD=""
STACK_UP_CMD=""
STACK_MIGRATE_CMD=""
STACK_HEALTH_URL=""
STACK_IMAGES=""
STACK_PROXY_RELOAD_CMD=""
# Дамп базы ПЕРЕД миграциями — точка отката схемы (И-1): образы выкат откатить
# умеет, миграцию — нет. Пусто = дампа не будет, и выкат скажет это вслух.
STACK_DB_DUMP_CMD=""
# Откуда ставить cron-строки стека при выкате. Пусто — стек своего расписания
# не несёт.
STACK_CRON_SRC=""
# Манифесты зависимостей: их смена с прошлого выката = сборка --no-cache (§9).
STACK_MANIFESTS="requirements.txt package.json package-lock.json Dockerfile docker-compose.yml"

# ── Гейты коммита (pre-commit-hook) ─────────────────────────────────────────
# Линтер кода продукта; пусто = язык не задан, хук говорит об этом в лог,
# не молча. Пример: PRODUCT_LINT_CMD="ruff check backend/"
# Каталог кода продукта относительно корня проекта. Пусто = продукта нет либо
# он лежит в корне. Нужен, чтобы линтер продукта не гонялся на правках харнеса:
# владелец 11.09.2026 — «разделим проект харнеса и продукт, чтобы продукт не мешал».
# Над каким направлением карты разработки работаем сейчас. Пусто = над всеми.
# Направления — это `lines` в dev-map.yaml: у продукта своё, у харнеса своё.
ACTIVE_LINE=""

# ── Ежемесячная ревизия проекта (harness/demons/project-revision.sh) ──────────
# Выключатель и модель — ручки панели (harness/config/switches.yaml).
# Кнопка «сейчас» — файл $LOG_DIR/revizia/запуск, его подхватывает session-warden.
REVIZIA_ENABLED="1"
REVIZIA_MODEL="opus"

# Ручки панели, которых на НОВОЙ машине не было: панель рисовала их из реестра,
# а в конфиге ключа нет — владелец видел ручку, которой не существует (ворота
# внутри свежей установки, 13.09.2026).
# Как обновляться: manual — обновление только по слову владельца, auto — само.
UPDATE_MODE="manual"
# Язык ответов владельцу: auto (по замеру его речи) | simple | normal | technical.
LANG_LEVEL=auto

PRODUCT_DIR=""

# Абсолютный путь к репозиторию ПРОДУКТА на этой машине. Отдельно от
# PRODUCT_DIR (это ИМЯ: проект compose, префикс контейнеров): по имени нельзя
# вычислить путь, а вшитый путь в коде харнеса — след нашей установки и
# поломка у того, чей продукт лежит иначе. Пусто — механизм, которому нужен
# продукт, отказывает СЛОВАМИ, а не молча берёт чужой каталог.
PRODUCT_PATH=""

# Корень РЕПОЗИТОРИЯ продукта — где лежат его бумаги задач (.tasks) и документы
# (docs). Отдельно от PRODUCT_PATH: тот называет каталог продукта на машине (его
# compose и .env), а git-репозиторий у него может лежать вложенным. Пути бумаг
# в карточках задач считаются ОТ ЭТОГО корня. Пусто — гейт пайплайна отвечает
# «судить нечем» по задачам продукта, а не «долга нет».
PRODUCT_REPO=""

PRODUCT_LINT_CMD=""
# Прочие написания имени продукта (кириллица, сокращение, домен): их ищет гейт
# чистоты харнеса, потому что харнес отдают другим людям. Пусто — продукта нет.
PRODUCT_ALIASES=""
# Состояние приёмника тревог продукта: пока в нём открыто окно тишины на время
# выката, сторож здоровья молчит. Пусто — окна нет, шлём как прежде.
PRODUCT_QUIET_STATE=""

# ── Резервные копии (backup) ────────────────────────────────────────────────
BACKUP_DIR="/var/backups/harness"
BACKUP_KEEP_DAYS=14
# Порог снятия лишнего по описи раскладки, % строк прежней описи: пять из шести
# релизов убирают меньше, переезд каталога (52 %) должен остановиться и ждать
# человека. Не задан — порог не судится, и раскладка об этом говорит.
LAYOUT_REMOVE_MAX_PERCENT="25"
# Сколько секунд вторая раскладка ждёт, пока первая отпустит замок layout.lock.
# Ожидание плюс сама раскладка обязаны уложиться в таймаут update.py (900 с):
# иначе он убьёт ждущего, а не дождётся его отказа. Не задан или не число —
# без ожидания: отказ сразу, с названием ключа.
LAYOUT_LOCK_WAIT_SEC="300"
# Предел одного прогона ворот при постановке обновления, секунд (ворота идут
# дважды: до и после). Обычные ворота на свежей 4-ядерной машине шли 44–58 мин;
# не уложились — обновление отказывает словами и называет этот ключ.
UPDATE_GATES_TIMEOUT_SEC="5400"
# Пределы ворот. Прогоны висели часами (92 штуки до 13 ч, родитель — init) и жгли
# процессор; теперь у каждой проверки и у всего прогона есть предел, и просрочивший
# красный, а не висящий. GATES_CHECK_TIMEOUT_SEC — одна проверка, секунд (0 — без
# предела); GATES_CHECK_TIMEOUT_LONG — свой предел законно долгим, «имя=сек|имя=сек»
# (пусто — таких нет); GATES_RUN_TIMEOUT_SEC — обычный прогон (равен предыдущему
# ключу); GATES_RUN_TIMEOUT_ALL_SEC — прогон --всё: 71400 с = 1190 мин, раньше ночного
# предела NIGHTLY_GATES_MAX_MIN=1200 мин, чтобы ворота успели написать свою строку
# итога и .rc до того, как ночной сторож оборвёт их без следа.
GATES_CHECK_TIMEOUT_SEC="3600"
# «Хозяин машины» гоняет КАЖДУЮ проверку ворот трижды — законно долгий по
# устройству. Замер 14.11.2026: 425 лёгких проверок, ~20 200 с работы прибора
# (×1,27 под нагрузкой ночи — ~25 600 с), при HOST_INDEPENDENCE_JOBS=4 ~6 400 с;
# общий предел 3600 с обрывал его каждую ночь с 13.11 (код 124). 10 800 с — запас
# ~1,7× на рост числа проверок (261 → 430 за 12 суток).
GATES_CHECK_TIMEOUT_LONG="хозяин машины=10800"
GATES_RUN_TIMEOUT_SEC="5400"
GATES_RUN_TIMEOUT_ALL_SEC="71400"
# Пер-сервисные дампы баз. Разделитель записей — ПЕРЕВОД СТРОКИ (одна строка =
# один дамп «имя=команда»; решение Д-9): внутри команды дампа законны и «;», и
# «|» (pg_dump ... | gzip), поэтому никакой одиночный символ-разделитель не
# годится. Несколько баз — многострочное значение в кавычках:
# BACKUP_DBS="app=docker compose -f /opt/x/docker-compose.yml exec -T db pg_dump -U app app
# reports=docker compose -f /opt/x/docker-compose.yml exec -T db2 pg_dump -U r r | gzip"
# Пустой список — честная строка в лог «базы не заданы» (продукт ещё не начат).
BACKUP_DBS=""

# ── Самопочинка карты (devmap-selfheal) ─────────────────────────────────────
# Глубина сверки коммитов при отсутствии водораздела, дни.
DEVMAP_AUDIT_DAYS=14
# Потолок ожидания headless-агента починки (claude -p), секунды: зависший
# вызов без потолка держал бы cron-прогон вечно. 600 с хватает на десяток
# пропусков; по таймауту водораздел остаётся на месте — пропуски не теряются.
SELFHEAL_CLAUDE_TIMEOUT_SEC=600
# Модель headless-вызовов демонов: сверка тем коммитов не стоит цены сильной
# модели. Пусто или нет ключа = haiku (умолчание в коде).
DEMON_MODEL="haiku"
# Потолок сырого потока демона (demon-stream/<демон>.jsonl), КБ: сверх него
# файл урезается до хвоста по границе строки.
DEMON_STREAM_MAX_KB=4096
# Служебные префиксы тем коммитов, которым трейлер Dev-Map не положен по
# правилу: devmap-selfheal отсеивает их ДО вызова модели. Формат — regex через
# «|», регистр не важен; пустое значение отключает фильтр. «передача» без
# двоеточия: темы пишутся и «Передача смены 03.11 …».
DEVMAP_SERVICE_PREFIXES="передача|рубеж смены|состояние:|состояние и память:|devmap:|правка памяти с панели:|Первый коммит каркаса"
# Удаление пробных баз идёт только инструментом с воротами. Префикс — первые
# ворота: имя без него инструмент не тронет, поэтому боевую базу нельзя убрать
# опечаткой. Пустой префикс = инструмент выключен.
DROPPABLE_DB_PREFIX="proba_"
DB_ADMIN_EXEC=""
DB_ADMIN_USER=""
# Потолок dev-map.yaml, символов (check-context-hygiene.py): карта — реестр
# живых задач, а не архив; раздутая едет в контекст дашборда и сессии.
# Лечение — архив закрытых направлений в docs/dev-map-archive.yaml.
# Потолок карты считает код от ЧИСЛА задач (check-context-hygiene.py):
# база + задачи × запас. Константу приходилось двигать руками при каждом
# росте реестра — это подгонка датчика под факт.
DEVMAP_BASE_CHARS=20000
DEVMAP_CHARS_PER_TASK=2500
# Потолок summary одной карточки: длиннее — подробности уезжают в
# docs/dev-map-подробности.yaml (scripts/weed-the-map.py). Замер 12.09.2026:
# 31 карточка сверх потолка держала 29 397 лишних знаков в файле, который
# едет в контекст каждой сессии.
DEVMAP_SUMMARY_MAX=500

# ── Сбор сигналов эволюции (evolution-collector) ──────────────────────────────────
# Журналы, которые собирает коллектор; пишут их гейты и хуки, не коллектор.
GATES_LOG_NAME="gates.jsonl"
SKILLS_LOG_NAME="skills.jsonl"
# Реестр установленных возможностей (крупных наборов): пишет capability.sh,
# читают сводки и приёмка. Каждая строка — установка или снятие с суммой паспорта.
CAPABILITIES_LOG_NAME="возможности.jsonl"
# День недели для еженедельного счёта «спеки/планы vs коммиты» (1 = понедельник).
EVO_WEEKLY_DOW=1
# Потолок сводки evo/summary.jsonl, строк: старшие срезаются при прогоне (Д-8).
EVO_SUMMARY_MAX_LINES=2000

# ── Сеть серверов харнеса (scripts/evolution-net.py) ────────────────────────
# Клон общего репозитория и ключ входа и подписи (один ключ на сервер).
EVOLUTION_DIR="~/harness-evolution"
EVOLUTION_KEY="~/.ssh/github_evolution"
# Адрес репозитория — ТОЛЬКО в машинном конфиге: в образце пусто, иначе в
# публичную сборку уехало бы имя владельца на GitHub. Пусто — сеть выключена.
EVOLUTION_REMOTE_URL=""
# host — копия-хозяин (пишет всё, отвечает); copy — остальные. Образец — copy.
EVOLUTION_ROLE="copy"
EVOLUTION_MAX_ENTRY_BYTES=16384
EVOLUTION_MAX_COMMITS_PER_TICK=50
# Потолок файлов в одном коммите: больше — коммит отвергнут целиком.
EVOLUTION_MAX_FILES_PER_COMMIT=50
# Потолок карточек за тик: остаток ждёт следующего тика в состоянии читателя.
EVOLUTION_MAX_CARDS_PER_TICK=50
# Потолок путей дерева origin/main для --якорь --первый: больше — отказ (дерево
# до первого якоря пишут копии без подписи, суд каждого пути стоит процессов).
EVOLUTION_MAX_ANCHOR_PATHS=1000
# Подкаталог состояния сети под STATE_DIR (имя, без / и ..): STATE_DIR на живой
# машине принадлежит root, а agent пишет только в свой подкаталог, который
# создаёт установщик (шаг 1).
EVOLUTION_STATE_SUBDIR="evolution-net"
EVOLUTION_FETCH_TIMEOUT=60
# Потолок размера файла пака при fetch (RLIMIT_FSIZE), байт.
EVOLUTION_FETCH_MAX_BYTES=67108864
# Линия карты, куда встают карточки из сети.
EVOLUTION_MAP_LINE="harness"

# ── Сторож меток (heartbeat-watch) ──────────────────────────────────────────
# Таблица «имя-демона:период-в-минутах», через пробел. Периоды = расписанию
# cron из 01-SPEC §9; сторож бьёт тревогу при возрасте метки > период ×2.
# memory-revision: месяц = 44640 мин (31 день — берём худший случай).
# session-warden.запуск, а НЕ session-warden: метка успеха законно отстаёт на
# всю ротацию (до 24 мин при пороге 20 = период×2), и утренняя сводка объявляла
# бы сторожа мёртвым посреди его работы. За «прогон доходит до конца» отвечает
# sentinel со своим порогом WARDEN_STUCK_MIN — два вопроса, два признака
# (ревизия и ревью 10.09.2026).

# Предел ночного прогона ворот, минуты (дробные допустимы). 1200 = 20 ч: старт
# cron в 06:00, конец до следующего запуска; по пределу демон останавливает
# прогон и говорит владельцу, на каком гейте встал.
NIGHTLY_GATES_MAX_MIN=1200

# Предел недельного полного прогона мутаций, минуты. 2580 = 43 ч: старт cron
# во вторник в 09:00, конец до 04:00 четверга. Прогон идёт в срезе потока
# проверок под потолком ядер, и он станет длиннее: замер 04-05.11 — 1131 мин за
# 985 мутаций без потолка, полный прогон 2131 мутация ≈ 2447 мин; запас
# 1,009 × 1,2 даёт 2580. Предел отсчитывается от старта процесса, ожидание
# замка до 75 мин входит в него; по пределу демон останавливает прибор и
# говорит владельцу, на каком механизме встал.
NIGHTLY_MUTATIONS_MAX_MIN=2580
# Пауза между вестями полного прогона мутаций, часы: красное держится, одна и
# та же весть при каждом прогоне — шум.
NIGHTLY_MUTATIONS_ALERT_GAP_H=24

# Поток проверок (checks-stream.sh): сколько проходов подряд он уступает
# недельному прогону мутаций; после этого идёт, если нагрузка ниже порога.
CHECKS_STREAM_STARVE_PASSES="3"

# Сколько минут недельный полный прогон мутаций ждёт замок, занятый другим прогоном
# (на это время поток проверок уступает), прежде чем сообщить, что не стартовал.
NIGHTLY_MUTATIONS_LOCK_WAIT_MIN="75"

# Каталог снимков для прогона ворот по снимку (scripts/gates-snapshot.sh).
# Пусто — ~/gates-snapshots агента; создаётся самой командой (права 700). Не
# под $LOG_DIR и не под /tmp — там команда отказывает.
GATES_SNAPSHOT_DIR=""

# Кэш мутационной пробы (scripts/mutation-probe.sh), сутки. Полный прогон идёт
# раз в неделю, поэтому срок больше 7: иначе кэш протухает до следующего вторника. Мутация, у которой
# механизм, проба и текст те же, что в зелёном прогоне не старше этого срока,
# не гоняется заново; раз в столько суток каждая гоняется по-настоящему. 0 — без кэша.
MUT_CACHE_DAYS=14

# Предел одного запуска пробы мутации, секунды (scripts/mutation-probe.sh).
# Срабатывание — названная дыра «таймаут», а не «ок»: зависшая проба иначе
# съедает всю ночь.
MUTATION_RUN_TIMEOUT_S=180
# За сколько минут до NIGHTLY_MUTATIONS_MAX_MIN прибор сам прекращает новые
# прогоны и печатает «не прогнано K из N» (демон шлёт владельцу жёлтую весть;
# остальное добьёт следующий прогон через кэш).
MUTATION_SOFT_STOP_MIN_BEFORE=15

HEARTBEAT_PERIODS="sentinel:5 session-warden.запуск:10 task-closer:60 disk-cleanup:1440 disk-pressure:120 server-hygiene:1440 resource-report:60 backup:1440 devmap-selfheal:1440 evolution-collector:60 heartbeat-watch:1440 memory-revision:44640 tokens-collector:60 memory-commit:10 session-warden:10 update-watch:1440 project-revision:44640 extensions-watch:1440 stack-watch:1440 acceptance-watch:1440 check-builder:1440 ton-watch:1440 limit-watch:5 restore-probe:44640 check-login-expiry:30 nightly-gates:1440 build-board:5 panel-tunnel:5 dispatcher-stall-watch:5 nightly-mutations:5760 speed_mode:2 checks-stream:60 process-dispatcher:5"

# ── Общие конвенции контуров (решения ревью 09.08.2026) ─────────────────────
# Долгоживущие сервисные локи (диспетчер и т.п.) — В ЭТОМ каталоге; ворота
# deploy_guard смотрят ТОЛЬКО операционные локи в $LOG_DIR/locks/ (Б-1).
SERVICE_LOCKS_SUBDIR="services"
# Сколько секунд работы делают процесс «долгим» для ворот выката. Ниже порога
# claude --version и короткий прогон на три теста занятостью не считаются.
DEPLOY_BUSY_MIN_SEC=120
# ── Вход агента: носитель ОДИН ────────────────────────────────────────────
# Учётка берётся ТОЛЬКО из `/login` (~/.claude/.credentials.json). Второй
# носитель — переменная CLAUDE_CODE_OAUTH_TOKEN — стоит в порядке выбора ВЫШЕ
# подписки и 19 суток незаметно уводил работу на чужую организацию (замер
# 10.10.2026). Организацию живого входа судит check-login-expiry.py по этому
# ключу. Значение МАШИННОЕ: его ставит установка замером
# (`check-login-expiry.py --аккаунт-подписки`), в пакете оно пустое — пустое
# значит «сверять не с чем», и сторож говорит это словами, а не молчит.
LOGIN_EXPECTED_ORG=""

# Команда запуска агента в tmux — её использует rotate_full session-warden
# для перезапуска после ротации (Б-4). Вариант Б канала: без --channels.
AGENT_START_CMD="claude --dangerously-skip-permissions"
# Сколько ждать, пока команда запуска поднимет claude в панели, секунды (Б-4а).
AGENT_START_TIMEOUT_SEC=120
# Агент вышел раньше этого срока после ввода команды запуска — владельцу тревога
# с хвостом вывода панели (журнал панели: agent-pane.log в LOG_DIR), секунды.
AGENT_EARLY_EXIT_SEC=300
# Свежесть записи согласия владельца (confirmations.jsonl) для выката в semi:
# старше порога — согласие не считается (В-7).
