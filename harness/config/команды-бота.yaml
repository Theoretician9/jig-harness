# ДАННЫЕ: команды, которые владелец видит кнопками в меню бота.
#
# Владелец 13.09.2026: «надо сделать вызов панели кнопкой прям в меню бота».
# До этого меню было пустым (getMyCommands возвращал []), а команды надо было
# угадывать словом — и угадывать латиницей.
#
# Имя команды Telegram принимает только латиницей (a-z, 0-9, _), до 32 знаков;
# описание — до 256, и его владелец читает на своём языке. Ставит команды
# scripts/komandy-bota.py, он же сверяет, что стоит именно это.
#
# Слова — то, чем эта же команда вызывается ОБЫЧНЫМ сообщением: владелец пишет
# в чат по-русски, и «панель» обязано работать наравне с кнопкой.

команды:
  - имя: panel
    описание: "Открыть панель управления харнесом"
    слова: ["панель", "панел", "дай панель", "открой панель",
            "ссылка на панель", "ссылку на панель"]
  - имя: status
    описание: "Что делается прямо сейчас и что в очереди"
    слова: ["статус", "что делаешь", "что сейчас", "чем занят"]
  - имя: update
    описание: "Поставить обновление харнеса из публичного гита"
    слова: ["обновить", "обнови", "обнови харнес", "обновить харнес"]
  - имя: panel_out
    описание: "Вывести панель наружу (имя, сертификат и nginx — сам)"
    слова: ["панель наружу", "выведи панель", "вывести панель наружу",
            "панель наружу снять", "убрать панель наружу"]
    # Команда принимает ИМЯ: «панель наружу my.example.com». Форма аргумента —
    # данные, а не ветка в боте: по ней разбор узнаёт команду со своим именем
    # и по ней же выделяет само имя. Без неё сообщение сверялось точным
    # совпадением, и названное владельцем имя не распознавалось вовсе —
    # ветка разбора имени внутри panel-naruzhu.sh была недостижима (ревью
    # кода 13.09.2026, F-06).
    аргумент: "[a-z0-9][a-z0-9.-]*\\.[a-z]{2,}"
  - имя: logout
    описание: "Выйти из панели на всех устройствах"
    слова: ["панель выйти", "выйти из панели"]
