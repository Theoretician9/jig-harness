# Холодные пути: процесс claude читает их ПРИ СТАРТЕ и держит до выхода, поэтому
# обновление такого файла доезжает до живой сессии только ротацией (новый процесс,
# путь преемника: спека ротация-ждёт-помощников, раздел 14.16).
# Всё остальное — горячее и ротации не просит: хуки (settings.json запускает их
# новым процессом на каждый вызов), скрипты, библиотеки, harness/config/*.yaml и
# harness.conf (читаются при каждом запуске), демоны cron (новый процесс на прогон),
# службы (update.py перезапускает их сам).
# Читает scripts/lib/cold_paths.py. Маска — от корня проекта; `*` и `**` — через любую
# глубину. Правка списка — добавление строки; новая холодная вещь без строки здесь
# не заставит сессию обновиться.
холодные:
  - маска: CLAUDE.md
    почему: правила проекта грузятся в контекст при старте сессии
  - маска: harness/self/**
    почему: личность агента (ядро и роль) — часть стартового контекста
  - маска: .claude/settings.json
    почему: хуки и права читаются при старте; сам файл хука горячий, а перечень обработчиков — холодный
  - маска: .claude/settings.local.json
    почему: локальные права и хуки, то же чтение при старте
  - маска: .mcp.json
    почему: набор MCP-серверов поднимается при старте процесса
  - маска: .claude/agents/**
    почему: карточки помощников Claude Code берёт при старте
# Файлы, чьи строки `@путь` подтягивают другие файлы в контекст при старте: эти файлы
# тоже холодные, но список берётся разбором (новая строка `@` не требует правки здесь).
с_ат_строками:
  - CLAUDE.md
