# Проверки разработки самого харнеса: идут только там, где ключ HARNESS_DEV_GATES=1
# в harness.conf (установка, на которой харнес пишут). Читает scripts/lib/gates_check.sh.
#
# Зачем. Эти проверки судят реестр мутаций харнеса (harness/config/probe-mutations.yaml)
# против кода харнеса. Копия реестр не ведёт и не чинит: он приезжает сборкой. На копии
# их красная ничего не говорит о её работе, зато самопроверка обновления считает её
# «новой красной» и откатывает каждое обновление. Улика — копия bkb 14.11.2026:
# be4e002 привёз 29 мутаций с отставшим текстом и 12 проб без записи, обновление
# откатилось второй раз подряд.
#
# Пополнять только проверками, которые судят РАЗРАБОТКУ харнеса, а не работу установки:
# проба механизма, который работает и на копии, сюда не входит.
# Имена — как в scripts/gates.sh.
проверки:
  - имя: мутации стоят
    почему: сверяет тексты мутаций реестра с кодом харнеса — реестр ведёт разработка
  - имя: пробы без мутаций
    почему: ищет пробы харнеса без записи в реестре мутаций — реестр ведёт разработка
  - имя: население кода
    почему: ищет файлы кода харнеса, живые только через свою пробу, — состав кода ведёт разработка (стенд o-upd 14.11.2026, красная на копии)
