# Проверки ворот, которые нельзя гонять рядом с другими: общий ресурс.
# Читает scripts/lib/gates_check.sh через scripts/gates_cache.py serial.
# Обычная группа — взаимоисключение: проверки группы идут по одной, остальные рядом.
# Особая группа «одна» — проверка идёт ОДНА: пул ждёт её до и после.
# Имена проверок — как в scripts/gates.sh. Пополнять ДАННЫМИ прогона: проверка,
# красная только в пуле, попадает сюда с причиной, а не по догадке.
группы:
  стенд-раскладчика:
    почему: каждая строит стенд 0,7–1,7 ГБ в /tmp и гоняет razlozhit-harnes.sh --selftest пакета; трое сразу — диск и память
    проверки:
    - самотест раскладчика
    - "самотест раскладчика: уборка при обрыве"
    - "самотест раскладчика: код выхода"
  docker-установка:
    почему: install-probe.sh поднимает настоящий контейнер с --privileged — один контейнер за раз
    проверки:
    - установка с нуля
    - установка-проба-самотест
  одна:
    почему: проверок, которым нужен весь сервер, пока не доказано (кандидаты — «лок панели», «толчок-сразу», «приём-зависание» — меряют время реакции)
    проверки: []
