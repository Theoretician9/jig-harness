# Что харнес обязан иметь в системе: расписания и метки присмотра.
#
# Зачем данными. Обновление привозит НОВЫЙ демон — а он без строки cron и без
# периода метки мёртв и незаметен: сторож меток не знает, что его ждать
# (находка C7 разбора спеки обновления 11.09.2026). Раньше такие строки
# добавлялись руками, то есть «кто-то должен помнить».
#
# Читает scripts/install-new.py: он ДОБАВЛЯЕТ недостающее и никогда ничего
# не удаляет — чужие строки в расписании принадлежат машине, а не харнесу.
#
# Поля задания: имя (оно же ключ), расписание (пять полей cron), команда,
# журнал (куда писать вывод).
задания:
  - имя: session-warden
    расписание: "*/10 * * * *"
    команда: "harness/demons/session-warden.sh"
    журнал: session-warden.log
  - имя: task-closer
    расписание: "0 * * * *"
    команда: "harness/demons/task-closer.sh"
    журнал: task-closer.log
  - имя: disk-cleanup
    расписание: "0 3 * * *"
    команда: "harness/demons/disk-cleanup.sh"
    журнал: disk-cleanup.log
  - имя: server-hygiene
    расписание: "30 3 * * *"
    команда: "harness/demons/server-hygiene.sh"
    журнал: server-hygiene.log
  - имя: backup
    расписание: "0 4 * * *"
    команда: "harness/demons/backup.sh"
    журнал: backup.log
  - имя: devmap-selfheal
    расписание: "15 4 * * *"
    команда: "harness/demons/devmap-selfheal.sh"
    журнал: devmap-selfheal.log
  - имя: nightly-gates
    расписание: "0 6 * * *"
    команда: "harness/demons/nightly-gates.sh"
    журнал: nightly-gates.log
  - имя: check-builder
    расписание: "45 5 * * *"
    команда: "harness/demons/check-builder.sh"
    журнал: check-builder.log

  - имя: acceptance-watch
    расписание: "45 4 * * *"
    команда: "harness/demons/acceptance-watch.sh"
    журнал: acceptance-watch.log

  - имя: ton-watch
    расписание: "15 5 * * *"
    команда: "harness/demons/ton-watch.sh"
    журнал: ton-watch.log

  - имя: update-watch
    расписание: "45 4 * * *"
    команда: "harness/demons/update-watch.sh"
    журнал: update-watch.log
  - имя: extensions-watch
    расписание: "35 5 * * *"
    команда: "harness/demons/extensions-watch.sh"
    журнал: extensions-watch.log
  - имя: evolution-collector
    расписание: "5 * * * *"
    команда: "harness/demons/evolution-collector.sh"
    журнал: evolution-collector.log
  - имя: tokens-collector
    расписание: "10 * * * *"
    команда: "harness/demons/tokens-collector.sh"
    журнал: tokens-collector.log
  - имя: heartbeat-watch
    расписание: "0 8 * * *"
    команда: "harness/demons/heartbeat-watch.sh"
    журнал: heartbeat-watch.log
  - имя: memory-revision
    расписание: "0 9 1 * *"
    команда: "harness/demons/memory-revision.sh"
    журнал: memory-revision.log
  # Ревизия проекта идёт одновременно с ревизией памяти нарочно: та пишет
  # предложения и карту не трогает, столкновения нет. Утро первого числа —
  # после ночных демонов, до начала работы владельца.
  - имя: project-revision
    расписание: "0 9 1 * *"
    команда: "harness/demons/project-revision.sh"
    журнал: project-revision.log
  - имя: memory-revision-порог
    расписание: "30 9 * * *"
    команда: "harness/demons/memory-revision.sh --по-порогу"
    журнал: memory-revision.log
  - имя: memory-commit
    расписание: "*/10 * * * *"
    команда: "harness/demons/memory-commit.sh"
    журнал: memory-commit.log

# Период метки в минутах: через сколько молчание демона считается поломкой.
# Имя = имя файла метки в HEARTBEAT_DIR. Сторож меток heartbeat-watch читает
# их из HEARTBEAT_PERIODS в harness.conf — install-new.py дописывает туда
# недостающие, не трогая уже стоящие значения.
метки:
  nightly-gates: 1440
  sentinel: 5
  session-warden: 10
  session-warden.запуск: 10
  memory-commit: 10
  task-closer: 60
  evolution-collector: 60
  tokens-collector: 60
  disk-cleanup: 1440
  server-hygiene: 1440
  backup: 1440
  devmap-selfheal: 1440
  heartbeat-watch: 1440
  check-srok-vhoda: 30
  limit-watch: 5
  acceptance-watch: 1440
  proba-vosstanovleniya: 44640
  check-builder: 1440
  ton-watch: 1440
  update-watch: 1440
  extensions-watch: 1440
  memory-revision: 44640
  project-revision: 44640

# Метки, у которых НЕТ строки в расписании выше, — и почему это законно.
# Сверяет scripts/check-job-and-mark.py: без этой записи метка без задания
# неотличима от забытой, а задание без метки — мёртвый демон, которого никто
# не ждёт (ревизия архитектуры 12.09.2026).
метки_без_задания:
  sentinel: "поднимается таймером systemd harness-sentinel.timer, а не крон-строкой"
  limit-watch: "своя крон-строка ставится шагом установки: ежеминутный обход не входит в общий список"
  check-srok-vhoda: "ставится тем же шагом установки, что и limit-watch"
  proba-vosstanovleniya: "запускается раз в месяц строкой крона владельца; период метки нужен сторожу, задание — нет"
  session-warden.запуск: "вторая метка того же сторожа: её пишет подъём смены, а не отдельное задание"

# Ключи harness.conf с умолчаниями: install-new.py ДОПИСЫВАЕТ недостающие и
# никогда не меняет стоящие — значение владельца старше умолчания пакета.
#
# Зачем данными. Ручка панели требует, чтобы ключ СТОЯЛ в конфиге (гейт
# переключателей), а на чужой установке после обновления его туда не писал
# никто: обновление привозит новый механизм, а его ключ — нет.
ключи:
  REVIZIA_ENABLED: "1"      # ежемесячная ревизия проекта включена; ручка на панели
  REVIZIA_MODEL: "opus"     # модель ревизии: opus по умолчанию, fable — по выбору владельца
  MODEL_CALLS_PER_DAY: "50"  # потолок вызовов модели из кода на один «зачем» в сутки
  PULSE_OWNER_MIN: "60"     # через сколько минут молчания смены сторож скажет о нём САМОМУ владельцу
  PUBLIC_BUILD_DIR: "/var/lib/harness/публичная-сборка"   # дерево публичной сборки; НЕ в логах: их чистят по mtime и сканируют с правкой
  PUBLIC_COMMIT_NAME: "jig-harness"                       # автор публичных коммитов — имя харнеса, а не личность машины
  PUBLIC_COMMIT_EMAIL: "jig-harness@users.noreply.github.com"

# Ключи, которые харнес завёл сам и сам признал отработавшими. Чужих здесь не
# бывает: правило «только добавляем» — про строки и значения ВЛАДЕЛЬЦА, а
# собственный ключ, потерявший смысл, остаётся настройкой, которой ничто не
# управляет — в ней написано одно, а делается другое.
снять_ключи:
  - WORK_BRANCH             # публикуется СБОРКА, а не рабочая ветка пакета (спека §2.3)
