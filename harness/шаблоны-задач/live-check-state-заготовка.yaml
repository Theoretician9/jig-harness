# Состояние ЖИВОЙ проверки механизмов — ЗАГОТОВКА для новой установки.
#
# Этот файл уезжает в публичную сборку ВМЕСТО рабочего
# harness/config/live-check-state.yaml (данные сборки: заменить_шаблоном).
# Причина: рабочий файл — записи КОНКРЕТНОЙ установки, что на ней трогали
# руками и что увидели. С записями наружу уехали бы чужие пути и ложная
# зелень приёмки: новая машина получила бы «проверено живьём» про механизмы,
# которых на ней никто не касался.
#
# Формат записи (ключ — путь файла механизма, как в реестре механизмов):
#   живьём:   ЧТО сделали руками — действие в настоящей системе, не самотест.
#   увидели:  что ответила система. Числа, строки вывода, состояние файлов.
#   исход:    ок | косяк | не-проверяемо | ждёт
#   находка:  если исход «косяк» — в чём он и куда заведён (id задачи карты).
#   когда:    дата живой проверки.
#
# Документ docs/живая-проверка-механизмов.md СОБИРАЕТСЯ из реестра и этого
# файла прибором scripts/build-live-check-list.py — руками не править.
версия: 1

# Пусто НАРОЧНО: на новой установке живьём не проверено ничего, и приёмка
# обязана это видеть.
проверено: {}
